<style>
/* Layout: el lienzo 3D ocupa toda la pantalla, a oscuras; encima, una barra arriba (destinos o vida y nivel) y el panel de partida abajo. */
:root{
  --ink:#07060c;            /* negro de local cerrado */
  --panel:rgba(8,6,12,.82);
  --line:rgba(255,255,255,.16);
  --pink:#c2162a;           /* rojo sangre: acción principal */
  --cheese:#e8d48a;         /* amarillo enfermizo: rótulos */
  --kiss:#ff5fa2;           /* rosa de los besos de la jefa */
  --ketchup:#d61f26;        /* rojo kétchup: vida y botón de disparo */
  --paper:#ece6da;
  --mute:#9b948c;
  --font-display:'Creepster','Bangers','Impact','Haettenschweiler','Arial Narrow Bold',sans-serif;
  --font-ui:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--font-ui);font-size:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#c{display:block;width:100%;height:100%;outline:none}

.top{position:fixed;left:0;right:0;top:0;z-index:3;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.55)}
.brand h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:27px;line-height:1;letter-spacing:.04em;color:var(--pink);
  -webkit-text-stroke:1px rgba(14,13,36,.55)}
.brand h1 span{color:var(--paper)}
.brand p{margin:0;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--paper)}
.go{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.go::-webkit-scrollbar{display:none}
.go button{flex:0 0 auto;font:600 15px/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--paper);
  background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:9px 12px;cursor:pointer;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.go button:hover{border-color:var(--cheese)}
.go button:focus-visible{outline:2px solid var(--cheese);outline-offset:2px}
.go button:active{background:var(--pink);border-color:var(--pink)}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
#where{font:600 16px/1 var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--cheese);text-shadow:0 2px 0 rgba(0,0,0,.7)}
#hint{max-width:34em;text-align:center;font-size:15px;font-weight:500;line-height:1.3;color:var(--paper);background:var(--panel);
  border:1px solid var(--line);border-radius:3px;padding:8px 12px;transition:opacity .6s}
#hint.gone{opacity:0;visibility:hidden;transition:opacity .6s,visibility 0s .6s}
#load{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}

#cross{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;z-index:2;pointer-events:none;border:2px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
#cross::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--cheese)}
#fire{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:4;width:96px;height:96px;border-radius:50%;
  border:3px solid #fff;background:var(--ketchup);color:#fff;font:400 21px/1 var(--font-display);letter-spacing:.06em;touch-action:none;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.45)}
#fire.on{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
#stats{display:flex;align-items:center;gap:10px;pointer-events:none}
.hp{flex:0 1 170px;height:14px;border:2px solid #fff;border-radius:2px;background:rgba(14,13,36,.6);overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:var(--ketchup);transition:width .15s}
#st-txt{font:600 17px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.6);font-variant-numeric:tabular-nums;white-space:nowrap}
#btn-quit{margin-left:auto;pointer-events:auto;font:600 14px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--paper);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 10px;cursor:pointer}
#banner{position:fixed;left:16px;right:16px;top:28%;z-index:3;text-align:center;pointer-events:none;font:400 44px/1 var(--font-display);letter-spacing:.05em;color:var(--cheese);
  text-shadow:0 3px 0 rgba(0,0,0,.6);opacity:0;transition:opacity .4s;text-wrap:balance}
#banner.on{opacity:1}
#hurt{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,rgba(214,31,38,0) 42%,rgba(214,31,38,.78) 100%);opacity:0;transition:opacity .4s}
#panel{pointer-events:auto;width:100%;max-width:27em;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px 16px;text-align:center;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#panel h2{margin:0 0 6px;font:400 30px/1 var(--font-display);letter-spacing:.05em;color:var(--cheese)}
#panel p{margin:0 0 6px;font-size:16px;line-height:1.35}
#panel-keys{color:var(--mute);font-size:14px}
#panel .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btn{font:600 17px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;padding:12px 18px;border-radius:3px;border:1px solid var(--line);background:transparent;color:var(--paper);cursor:pointer}
.btn.main,.go button.play{background:var(--pink);border-color:var(--pink);color:#fff}
.btn:focus-visible,#btn-quit:focus-visible,#fire:focus-visible{outline:2px solid var(--cheese);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#banner,#hurt,.hp i{transition:none}}
#pick{pointer-events:auto;width:100%;max-width:27em;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px 16px;text-align:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#pick h2{margin:0 0 6px;font:400 30px/1 var(--font-display);letter-spacing:.05em;color:var(--cheese)}
#pick p{margin:0;font-size:16px;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;font:600 18px/1.15 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;padding:13px 14px;border-radius:3px;
  border:1px solid var(--line);background:rgba(194,22,42,.2);color:var(--paper);cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:var(--cheese);outline:none}
.opt small{flex:1;min-width:0;font:500 14px/1.2 var(--font-ui);letter-spacing:0;text-transform:none;color:var(--mute)}
.opt b{font-weight:600;color:var(--cheese);font-variant-numeric:tabular-nums;white-space:nowrap}
#bossbar{display:flex;align-items:center;gap:10px;pointer-events:none;font:600 15px/1 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--kiss);text-shadow:0 2px 0 rgba(0,0,0,.7)}
.hp.boss{flex:1 1 auto;max-width:260px;border-color:var(--kiss)}
.hp.boss i{background:var(--kiss)}
#goal{display:flex;align-items:center;gap:8px;pointer-events:none;font:600 15px/1.2 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--cheese);text-shadow:0 2px 0 rgba(0,0,0,.75)}
#goal-arrow{display:inline-block;font-style:normal;font-size:18px;line-height:1}
#talk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);z-index:4;font:400 26px/1 var(--font-display);letter-spacing:.06em;white-space:nowrap;
  padding:14px 28px;border-radius:4px;border:2px solid #fff;background:var(--cheese);color:#1a1408;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.5)}
#talk:focus-visible{outline:2px solid #fff;outline-offset:3px}
#hurt.kiss{background:radial-gradient(ellipse at center,rgba(255,61,143,0) 38%,rgba(255,61,143,.75) 100%)}
#coop{pointer-events:auto;width:100%;max-width:27em;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px 16px;text-align:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#coop h2{margin:0 0 6px;font:400 30px/1 var(--font-display);letter-spacing:.05em;color:var(--cheese)}
#coop p{margin:0 0 6px;font-size:16px;line-height:1.35}
#coop .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}

#coop-code-show b{font:600 44px/1 var(--font-ui);letter-spacing:.32em;padding-left:.32em;color:var(--cheese);font-variant-numeric:tabular-nums}
#matebar{display:flex;align-items:center;gap:10px;pointer-events:none;font:600 15px/1 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:#8fe0b0;text-shadow:0 2px 0 rgba(0,0,0,.7)}
.hp.mate{flex:0 1 120px;height:10px;border-color:#8fe0b0}
.hp.mate i{background:#3f9a6e}
.btn:disabled{opacity:.5;cursor:default}

#banner small{display:block;margin-top:10px;font:600 18px/1.25 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--paper)}
#stick{position:fixed;z-index:2;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(255,255,255,.5);
  background:rgba(14,13,36,.28);pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--pink);
  box-shadow:0 0 0 2px rgba(255,255,255,.75)}
#fail{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;text-align:center;background:var(--ink);font-size:18px;line-height:1.4}
@media (min-width:700px){.brand h1{font-size:38px}.go button{font-size:16px;padding:10px 14px}}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>

  let f=0,s=0; if(keys.KeyW||keys.ArrowUp) f+=1; if(keys.KeyS||keys.ArrowDown) f-=1; if(keys.KeyD) s+=1; if(keys.KeyA) s-=1;
  if(keys.ArrowLeft) pl.yaw+=1.9*dt; if(keys.ArrowRight) pl.yaw-=1.9*dt;
  f+=-mv.y; s+=mv.x; const l=Math.hypot(f,s); if(l>1){ f/=l; s/=l; }
  const sp=(keys.ShiftLeft||keys.ShiftRight?5.2:3.2)*G.speed/HS*dt, sn=Math.sin(pl.yaw), cs=Math.cos(pl.yaw);
  const dx=(-sn*f+cs*s)*sp, dz=(-cs*f-sn*s)*sp;
  if(dx||dz){ const stuck=!freeAt(pl.x,pl.z)&&!!zoneAt(pl.x+dx,pl.z+dz); if(stuck||freeAt(pl.x+dx,pl.z)) pl.x+=dx; if(stuck||freeAt(pl.x,pl.z+dz)) pl.z+=dz; }
  const zn=zoneAt(pl.x,pl.z); const ty=(zn?zn.y(pl.x,pl.z):0)*VS+EYE; pl.y+=(ty-pl.y)*Math.min(1,dt*12);

}
