plugins { id "com.android.application" }
// TODA UNA VIDA: life sim de texto. La app lleva el juego dentro y se baja sola la última versión de vida/index.html.
android {
    namespace "com.cimentacion.vida"
    compileSdk 36
    defaultConfig {
        applicationId "com.cimentacion.vida"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }
    signingConfigs {
        release {
            storeFile file("../../android-rivieracop/cartografo.jks")
            storePassword "cartografo"
            keyAlias "cartografo"
            keyPassword "cartografo"
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
