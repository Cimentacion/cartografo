plugins { id "com.android.application" }
android {
    namespace "com.cimentacion.kebabponiente"
    compileSdk 34
    defaultConfig {
        applicationId "com.cimentacion.kebabponiente"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }
    signingConfigs {
        release { storeFile file("../kebab.jks"); storePassword "kebabponiente"; keyAlias "kebab"; keyPassword "kebabponiente" }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
