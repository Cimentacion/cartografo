<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toda una Vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800&family=Metamorphous&display=swap" rel="stylesheet">
<style>
:root{
  /* Página de revista japonesa de 1998: papel crema, panel nocturno, cajas lila con capitular blanca, titulares caqui */
  --papel:#efe9d8; --noche:#131129; --noche2:#2b2560; --lila:#aaa6e0; --tinta:#1a1740;
  --caqui:#d2d291; --oro:#dbb84c; --blanco:#ffffff; --rojo:#e0605a;
  --f-titular:"Dela Gothic One","Hiragino Kaku Gothic ProN","Arial Black",sans-serif;
  --f-cuerpo:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Trebuchet MS",sans-serif;
  --f-logo:"Metamorphous","Palatino Linotype",Georgia,serif;
  --f-presenta:"Cormorant Garamond",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--papel);font-family:var(--f-cuerpo);font-weight:800;color:var(--blanco);padding:8px;overflow:hidden}
#pagina{height:100%;max-width:640px;margin:0 auto;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;
  background:
   radial-gradient(120% 60% at 85% 0%,rgba(120,105,200,.55),transparent 60%),
   linear-gradient(180deg,#3a3378 0%,var(--noche2) 22%,var(--noche) 70%,#0b0a1a 100%);}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--oro);outline-offset:2px}

/* Cabecera */
.cab{padding:10px 16px 8px;flex:none;position:relative}
.presenta{font-family:var(--f-presenta);font-style:italic;font-size:17px;letter-spacing:.5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.presenta b{font-family:var(--f-titular);font-style:normal;font-weight:400;font-size:11px;background:#5a4fb0;padding:2px 8px;white-space:nowrap}
.logo{font-family:var(--f-logo);font-size:34px;line-height:1.05;letter-spacing:1px;
  background:linear-gradient(180deg,#fff3b8 0%,var(--oro) 45%,#8a6a1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.kanji{font-family:var(--f-titular);color:var(--caqui);font-size:22px;letter-spacing:2px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kanji small{font-family:var(--f-cuerpo);font-size:10px;color:var(--blanco);letter-spacing:0}
.ficha{border-top:2px solid var(--blanco);border-bottom:2px solid var(--blanco);margin-top:6px;padding:3px 0;font-size:13px;display:flex;flex-wrap:wrap;gap:2px 14px}
.ficha span::before{content:"●"}
.compacta .logo,.compacta .kanji,.compacta .presenta{display:none}
.compacta .ficha{margin-top:0}
.logo{margin-top:6px}

/* Tabla de estadísticas, como la encuesta de la revista */
.stats{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--blanco);margin-top:6px;font-variant-numeric:tabular-nums}
.stats div{border-right:1px solid var(--blanco);text-align:center;padding:2px 0 3px;font-size:9.5px;position:relative;overflow:hidden}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--f-titular);font-weight:400;font-size:17px;color:var(--caqui);line-height:1.1}
.stats i{position:absolute;left:0;bottom:0;height:3px;background:var(--lila)}
.stats .mal b{color:var(--rojo)} .stats .mal i{background:var(--rojo)}

.tabs{display:flex;gap:6px;padding:0 16px;flex:none}
.tabs button{flex:1;font-family:var(--f-titular);font-size:12px;padding:6px 0;border:1px solid var(--blanco);border-bottom:0;border-radius:10px 10px 0 0;color:var(--blanco);opacity:.6}

.tabs button.mini{flex:none;width:42px;opacity:1;font-size:15px}
.tabs button.on{background:var(--lila);color:var(--tinta);opacity:1;border-color:var(--lila)}

#vista{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--lila);min-height:0}
.caja{background:var(--lila);color:var(--tinta);border-radius:16px;padding:10px 14px;font-size:14.5px;line-height:1.45;flex:none}
.caja p::first-letter{font-family:var(--f-titular);font-size:2.3em;float:left;line-height:.9;padding:2px 5px 0 0;color:var(--blanco);text-shadow:0 1px 0 rgba(26,23,64,.35)}
.caja em{font-style:normal;white-space:nowrap}
.caja.mala{background:#8f8ab8}
.caja.clave{background:#1b1840;color:var(--oro);border:1.5px solid var(--oro)}
.caja.clave p::first-letter{color:#fff3b8;text-shadow:none}
.vieja{filter:brightness(.7) saturate(.85)}
.tit.vieja{opacity:.75}
.caja.fin{background:var(--tinta);color:var(--blanco);border:2px solid var(--oro)}
.caja.fin p::first-letter{color:var(--oro)}
.tit{font-family:var(--f-titular);color:var(--caqui);font-size:19px;line-height:1.2;margin-top:6px;text-wrap:balance;flex:none;-webkit-text-stroke:.4px #000}
.tit small{display:block;font-family:var(--f-cuerpo);font-size:11px;color:var(--blanco);-webkit-text-stroke:0}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;flex:none}
th,td{border:1px solid var(--blanco);padding:4px 6px;text-align:left}
th{font-family:var(--f-titular);font-weight:400;color:var(--caqui);font-size:11px}
td.n{text-align:right;white-space:nowrap}
.muerto td{opacity:.5}
.nota{font-size:12px;line-height:1.4;font-weight:700}

/* Acciones */
#acc{flex:none;max-height:38%;overflow-y:auto;padding:8px 16px 12px;border-top:2px solid var(--blanco);background:rgba(8,7,22,.6);display:grid;grid-template-columns:1fr 1fr;gap:6px}
#acc button{background:var(--caqui);color:var(--tinta);border-radius:10px;padding:9px 8px;font-size:13px;line-height:1.15;min-height:40px}
#acc button:active{transform:translateY(1px);filter:brightness(.9)}
#acc button.sec{background:transparent;color:var(--blanco);border:1px solid var(--blanco)}
#acc button.riesgo{background:#b9605c;color:#fff}
#acc button.ancho{grid-column:1/-1}

/* Creación */
#crear{flex:1;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--blanco);border-radius:999px;padding:7px 12px;font-size:13px}
.chips button.on{background:var(--lila);color:var(--tinta);border-color:var(--lila)}
#nombre{font:inherit;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--blanco);background:rgba(255,255,255,.08);color:var(--blanco)}
.gordo{font-family:var(--f-titular);background:linear-gradient(180deg,#fff3b8,var(--oro));color:var(--tinta);border-radius:12px;padding:12px;font-size:18px;letter-spacing:2px}
.intro{font-size:13.5px;line-height:1.5}

/* Hoja de elección */
#hoja{position:fixed;inset:0;background:rgba(5,4,15,.72);display:none;align-items:flex-end;justify-content:center;padding:8px;z-index:5}
#hoja.on{display:flex}
#hoja>div{width:100%;max-width:624px;max-height:80%;overflow-y:auto;background:var(--noche2);border:2px solid var(--lila);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
#hoja h2{font-family:var(--f-titular);font-weight:400;color:var(--caqui);font-size:16px;margin-bottom:4px}
#hoja button{text-align:left;background:var(--lila);color:var(--tinta);border-radius:10px;padding:10px 12px;font-size:14px}
#hoja button small{display:block;font-size:11px;opacity:.8}
#hoja button.sec{background:transparent;color:var(--blanco);border:1px solid var(--blanco);text-align:center}
.copy{font-size:9px;font-weight:700;color:#5d5848;text-align:left;padding:2px 12px 0;flex:none;display:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none}}
</style>
</head>
<body>
<div id="pagina">
  <header class="cab" id="cab">
    <div class="presenta"><span>MES A MES SOFT Presents.</span><b>A todos los que nacen…</b></div>

  <nav class="tabs" id="tabs" hidden>

  <main id="crear"></main>
  <main id="vista" hidden></main>

</div>
<div id="hoja"><div id="hojaIn"></div></div>

<script>
"use strict";
/* ============ Utilidades ============ */
const R=Math.random, ri=(a,b)=>Math.floor(R()*(b-a+1))+a, pick=a=>a[Math.floor(R()*a.length)], ch=p=>R()<p;
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============ Datos ============ */
const ORI={

const CASAS=[

 ["una mansión","un ático de lujo","una finca con servicio"]];
const BARRIOS={
 aldea:["la parte alta","junto a la iglesia","el camino del río","las últimas casas antes del monte"],

 capital:["un barrio del extrarradio","el centro histórico","un barrio de bloques","una zona residencial"]};
const CURROS=[
 ["a jornales","limpiando casas","en lo que va saliendo"],
 ["en una fábrica","en un bar","en la obra","en un supermercado"],
 ["en una oficina","dando clase","en un banco","en un taller propio"],
 ["en un bufete","en una clínica privada","dirigiendo una empresa"],

const ROL={prog:["Padre","Madre"],herm:["Hermano","Hermana"],abu:["Abuelo","Abuela"],tio:["Tío","Tía"],primo:["Primo","Prima"],
 vec:["Vecino","Vecina"],comp:["Compañero","Compañera"],conoc:["Conocido","Conocida"],hijo:["Hijo","Hija"],nieto:["Nieto","Nieta"],sobr:["Sobrino","Sobrina"]};

/* ============ Estado ============ */
let G=null, TAB="diario";
const CLAVE="toda-una-vida-v1";
function guardar(){try{localStorage.setItem(CLAVE,JSON.stringify(G))}catch(e){}}
function cargar(){try{const s=localStorage.getItem(CLAVE);if(s)G=JSON.parse(s)}catch(e){G=null}
  if(G&&!G.v2){G.gente.forEach(p=>p.con=true);G.v2=1}
  if(G&&G.yo.aspecto==null)G.yo.aspecto=35;
  if(G&&G.yo.altAdulta==null)genCuerpo();
  if(G&&(G.titulo||G.uni)&&!G.carrera)G.carrera="economia"}
function borrar(){try{localStorage.removeItem(CLAVE)}catch(e){}}

const yo=()=>G.yo, anios=()=>Math.floor(G.yo.edad/12);
const g=(m,f)=>G.yo.sexo=="m"?m:f;
const gp=(p,m,f)=>p.sexo=="m"?m:f;
const P=id=>G.gente.find(p=>p.id==id);
const vivos=f=>G.gente.filter(p=>p.vivo&&(!f||f(p)));
/* ---- Altura y peso ---- */
const CREC=[[0,.29],[1,.43],[2,.5],[4,.585],[6,.66],[8,.73],[10,.79],[12,.86],[14,.93],[16,.98],[18,1]];
function genCuerpo(){
  const y=G.yo,pa=ri(162,190),ma=ri(150,175);
  y.altAdulta=Math.round((pa+ma+(y.sexo=="m"?13:-13))/2+ri(-6,6));y.altMod=0;y.imcD=ri(-10,20)/10;
  if(ch(.06)){y.altAdulta=y.sexo=="m"?ri(198,215):ri(185,200);y.genAlto=1} // genética de gigantes
}
function altura(){ // cm
  const y=G.yo,a=y.edad/12;let f=1;
  for(let i=1;i<CREC.length;i++)if(a<CREC[i][0]){const p=CREC[i-1],q=CREC[i];f=p[1]+(q[1]-p[1])*(a-p[0])/(q[0]-p[0]);break}
  return Math.min(215,y.altAdulta+y.altMod)*f;
}
function imcBase(){const a=G.yo.edad/12;return a<1?14+3*a:a<6?17-.3*(a-1):a<18?15.5+(a-6)*.5:a<50?21.5+(a-18)*.06:23.4}
function imc(){const h=altura()/100;return Math.min(imcBase()+G.yo.imcD,G.yo.edad>=216?200/(h*h):99)} // tope: 200 kg
function peso(){const h=altura()/100;return imc()*h*h}
function altTxt(){const h=altura();return h<100?Math.round(h)+" cm":(h/100).toFixed(2).replace(".",",")+" m"}
function pesoTxt(){const p=peso();return (p<10?p.toFixed(1).replace(".",","):Math.round(p))+" kg"}
function complexion(){const d=G.yo.imcD;return d<-3.5?"en los huesos":d<-1.5?g("delgado","delgada"):d<3?"peso normal":d<6?"algo de barriga":d<10?"sobrepeso":d<18?"obesidad":"obesidad mórbida"}
function mover(n){const y=G.yo;if(y.edad<216)y.altMod=Math.min(3,y.altMod+.03);y.imcD=Math.max(-4,y.imcD-(n||.06))}
function etapa(){const a=G.yo.edad/12;return a<2?"bebé":a<6?"infancia":a<12?"niñez":a<18?"adolescencia":a<65?"edad adulta":"vejez"}
function edadTxt(m){const a=Math.floor(m/12);return a<1?m+(m==1?" mes":" meses"):a+(a==1?" año":" años")}
function add(k,v){const y=G.yo;if(v>0)v*=multRasgo(k);y[k]=clamp(y[k]+v)}
function rel(p,v){if(p){p.rel=clamp(p.rel+v);if(v>0&&G.yo&&G.yo.edad<192&&p.edad<216&&["vec","comp","conoc"].includes(p.rol)&&Math.abs(p.edad-G.yo.edad)<=36)p.inf=(p.inf||0)+1}}
const deInfancia=p=>(p.inf||0)>=10;
const RE_CLAVE=/^Naces en|carruaje|Umbraluz no te|báculo|dice que es tu padre|besando a|primeros pasos|primera palabra|Nace |da a luz|^Muere |ha muerto|y ganas\.|Te ascienden|Te cogen\.|Terminas (la carrera|Med|Mag|Ing|Der|Eco|Per|Cie)|dice que sí|sois pareja|Empezáis a salir|está embarazada|test da positivo|Positivo\.|Os mudáis|Te ofrecen|Llega una oferta|Firmas\.|Es tu primera vez|Eres mayor de edad|Empiezas el colegio|Pasas al instituto|Te jubilas|Te vas de casa|centro de acogida|se separan|Es lo más alto|propia escuela|beca completa|Dejas de crecer|adopción ha salido|Abres un grupo|Te matriculas|Te quedas sin padres|se te ve el carácter|termina de cuajar|Firmas la hipoteca|a la quiebra|Te condenan|Sales de prisión|Te detienen|Firmas testamento|te hace abuel|usa una palabra nueva|Sigues la historia|última cuota|segundo local|Cita en el notario|ya no puedes vivir sin ayuda|se vuelve a casar|un infarto/;
function log(txt,cls){txt=txt.charAt(0).toUpperCase()+txt.slice(1);cls=(cls||"")+(RE_CLAVE.test(txt)?" clave":"");G.lid=(G.lid||0)+1;G.log.push({t:"caja",txt,cls,n:G.tn||0,i:G.lid,tag:edadTxt(G.yo.edad)+" · "+etapa()});if(G.log.length>160)G.log.splice(0,G.log.length-160)}
function titular(txt,sub){G.lid=(G.lid||0)+1;G.log.push({t:"tit",txt,sub:sub||"",n:G.tn||0,i:G.lid})}
function rolTxt(p){
  if(p.id==G.pareja)return G.casado?gp(p,"Marido","Mujer"):gp(p,"Novio","Novia");
  if(p.rol=="herm"&&p.medio)return gp(p,"Medio hermano","Media hermana");

function factorAltura(){const y=G.yo;return clamp(1+(Math.min(215,y.altAdulta+y.altMod)-(y.sexo=="m"?183:170))/45,.5,1.8)}
function nivel(k){const v=voc(k);return v.p*(.3+G.yo[AREAS[k].st]/100)*(k=="baloncesto"?factorAltura():1)}

function nuevaCiudad(){const o=ORI[G.origen],t=ch(.3)?"capital":"ciudad",l=o.lug[t].filter(n=>n!=G.lugar.nombre);return {tipo:t,nombre:l.length?pick(l):o.lug.ciudad[0]}}

    if(ch(clamp(.3+(n-UMBRAL[v.t])/80,0,.85))){v.t++;add("animo",8);add("carisma",2);const pm=v.t==2?ri(100,400):0;y.dinero+=pm;

function hacer(fn){

  else if(enMagia()){G.mg.h=!G.mg.h;if(!G.mg.h)tick()} // en Umbraluz cada mes da para dos acciones

function multRasgo(k){const m=MULT[k];return (m&&tiene(m[0])?m[1]:1)*(k=="cuerpo"&&tiene("disciplinado")?1.1:1)}

function ponRasgo(k){G.rasgos=G.rasgos||[];if(G.rasgos.includes(k))return false;const o=OPUESTO[k];if(o)G.rasgos=G.rasgos.filter(x=>x!=o);G.rasgos.push(k);if(G.rasgos.length>5)G.rasgos.shift();return true}

  n=n||1;G.mor=G.mor||{};G.mor[k]=(G.mor[k]||0)+n;const o=OPUESTO[k];if(o)G.mor[o]=(G.mor[o]||0)-n;
  if(G.mor[k]>=2&&ponRasgo(k))return ` Se te va quedando fama de ${trazoTxt(k)}.`;return "";
}
function rasgosInfancia(){
  const c=G.cn||{},n=k=>c[k]||0,am=vivos(p=>p.con&&["vec","comp","conoc"].includes(p.rol)&&p.rel>=50).length;

/* ---- Hijos y nietos ---- */
const CARH=[["aplicado","aplicada"],["rebelde","rebelde"],["sensible","sensible"],["independiente","independiente"]];
function hijoIni(h){if(h.rumbo==null){h.rumbo=ri(35,65);h.car=ri(0,3)}return h}
function eventosHijos(ev,a){
  const y=G.yo,hj=vivos(q=>q.rol=="hijo"&&!q.secreto&&q.con);if(!hj.length)return;
  const q=hijoIni(pick(hj)),e=q.edad/12,c=CARH[q.car][q.sexo=="m"?0:1];
  if(e>=3&&e<12&&q.casa)ev(3,"hijocrio",()=>{rel(q,ri(2,5));add("animo",3);log(vario("hijocrio",[`${q.nombre} te pide que mires debajo de la cama por si hay monstruos. Miras. No hay. Por si acaso, miras otra vez.`,`${q.nombre} te regala un dibujo en el que eres más alto que la casa.`,`A ${q.nombre} se le cae el primer diente. Negocias con el ratón una tarifa razonable.`,`${q.nombre} pasa la noche con fiebre. Tú la pasas con la mano en su frente.`,`${q.nombre} aprende a montar en bici. Sueltas el sillín sin avisar y funciona.`,`${q.nombre} pregunta de dónde vienen los niños en mitad del supermercado, a voces.`,`Función del colegio. ${q.nombre} hace de árbol y saluda todo el rato. El mejor árbol.`,`${q.nombre} te dice que eres la persona más fuerte del mundo. No le corriges.`]))});
  if(e>=7&&e<17&&q.casa)ev(2,"hijotutor",()=>{const b=q.rumbo>=55;add("animo",b?4:-4);log(b?vario("tutB",[`Tutoría de ${q.nombre}: «Ojalá tuviera treinta como ${gp(q,"él","ella")}.» Sales flotando.`,`${q.nombre} gana un premio en el colegio. Aplaudes hasta que te duelen las manos.`,`A ${q.nombre} le va bien sin que tengas que estar encima. Es ${c}, y se nota.`]):vario("tutM",[`Tutoría de ${q.nombre}: tres suspensos y «no es mal chaval, pero…».`,`Encuentras las notas de ${q.nombre} escondidas en el fondo de la mochila. Con razón.`,`${q.nombre} va a la deriva este curso. Hablas, hablas y no sabes si te oye.`]),b?"":"mala")});
  if(e>=13&&e<18&&q.casa)ev(2,"hijoadol",()=>{rel(q,ri(-4,3));log(vario("hijoadol",[`${q.nombre} te contesta con monosílabos durante un mes entero. Uno de ellos es «vale».`,`${q.nombre} te dice que no entiendes nada. Lo peor es que te acuerdas de haberlo dicho tú.`,`Descubres que ${q.nombre} tiene una vida entera de la que no sabes nada. Es lo normal. Duele igual.`,`${q.nombre} te pide que le dejes a dos calles del instituto, no en la puerta.`,`Una tarde, sin venir a cuento, ${q.nombre} se sienta a tu lado en el sofá y ve la tele contigo. No dices nada, por no romperlo.`]))});
  if(e>=18&&!q.salida)ev(4,"hijosalida"+q.id,()=>{q.salida=1;const r=q.rumbo;
    if(r>=65){add("animo",8);log(`${q.nombre} entra en la universidad. Le ayudas con la matrícula y con las cajas. Vuelves a casa presumiendo sin disimulo.`)}
    else if(r>=40){add("animo",3);log(`${q.nombre} encuentra su primer trabajo. Te enseña la nómina como si fuera un diploma.`)}
    else if(r>=25){add("animo",-4);log(`${q.nombre} deja los estudios y encadena trabajos de un mes. «Ya veré», dice a todo.`,"mala")}
    else{add("animo",-8);y.dinero-=Math.min(Math.max(0,y.dinero),600);log(`Te llaman de comisaría de madrugada: ${q.nombre}. Pagas lo que hay que pagar y volvéis a casa en un taxi, sin hablar.`,"mala")}},1);
  if(e>=24&&!q.conyuge&&q.rumbo>=30)ev(2,"hijoboda"+q.id,()=>{const sc=ch(.9)?(q.sexo=="m"?"f":"m"):q.sexo,c2=per("conoc",sc,e+ri(-4,5),pick(ORI[G.origen].ap),{con:true,rel:ri(30,50),de:q.id,crianza:true,oficio:gp({sexo:sc},"tu yerno","tu nuera")});q.conyuge=c2.id;q.casa=false;
    const n=Math.min(Math.max(0,y.dinero),ri(5,30)*100);y.dinero-=n;add("animo",8);log(`Se casa ${q.nombre}, con ${c2.nombre}. Lloras en el discurso, bailas fatal y pones ${n} para el banquete.`)},1);

function teclear(els,v){ // los mensajes nuevos se escriben solos; un toque los completa
  if(!els.length)return;
  let lento=true;try{lento=!matchMedia("(prefers-reduced-motion:reduce)").matches}catch(e){}
  if(!lento)return;
  const cola=els.map(el=>{const ns=[];const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())ns.push([n,n.nodeValue]);return {el,ns}});
  const total=cola.reduce((s,c)=>s+c.ns.reduce((q,x)=>q+x[1].length,0),0),paso=Math.max(2,Math.ceil(total/140));
  cola.forEach(c=>{c.el.style.display="none";c.ns.forEach(x=>x[0].nodeValue="")});
  let ci=0,ni=0,ch_=0;
  const abre=()=>{if(ci<cola.length){cola[ci].el.style.display="";if(cola[ci].el.classList.contains("tit")){cola[ci].ns.forEach(x=>x[0].nodeValue=x[1]);ci++;ni=0;ch_=0;abre()}}};
  const fin=()=>{cola.forEach(c=>{c.el.style.display="";c.ns.forEach(x=>x[0].nodeValue=x[1])});v.scrollTop=v.scrollHeight};
  abre();
  tecleo={fin,t:setInterval(()=>{
    if(ci>=cola.length){pararTecleo();return}
    const c=cola[ci];let q=paso;
    while(q>0&&ni<c.ns.length){const x=c.ns[ni],k=Math.min(q,x[1].length-ch_);ch_+=k;q-=k;x[0].nodeValue=x[1].slice(0,ch_);if(ch_>=x[1].length){ni++;ch_=0}}
    if(ni>=c.ns.length){ci++;ni=0;ch_=0;abre()}
    v.scrollTop=v.scrollHeight;
  },16)};
}

  const v=$("vista");
  if(TAB=="diario"){
    const tn=G.tn||0,at=e=>(e.cls!="fin"&&(e.n||0)<tn?" vieja":"")+'"'+(abajo&&e.i>visto?" data-new":"");
    v.innerHTML=G.log.slice(-70).map(e=>e.t=="tit"?`<div class="tit${at(e)}>${esc(e.txt)}${e.sub?"<small>"+esc(e.sub)+"</small>":""}</div>`:
      `<div class="caja ${e.cls}${at(e)}><p>${esc(e.txt)}${e.tag?" <em>("+esc(e.tag)+")</em>":""}</p></div>`).join("");
    visto=G.lid||0;
    if(abajo){v.scrollTop=v.scrollHeight;teclear([...v.querySelectorAll("[data-new]")],v)}
  }else if(TAB=="familia"){
    const viv=G.gente.filter(p=>p.vivo&&p.con),fam=["prog","herm","abu","tio","primo","hijo","nieto","sobr"];
    v.innerHTML=tablaGente("En casa contigo",viv.filter(p=>p.casa))+
      tablaGente("Familia",viv.filter(p=>!p.casa&&(fam.includes(p.rol)||p.id==G.pareja)))+
      tablaGente("Barrio y conocidos",viv.filter(p=>!p.casa&&!fam.includes(p.rol)&&p.id!=G.pareja&&!p.lejos))+
      tablaGente("Los que quedaron lejos",viv.filter(p=>p.lejos&&p.rel>=20))+
      tablaGente("En el recuerdo",G.gente.filter(p=>!p.vivo&&p.con&&(fam.includes(p.rol)||p.rel>=50)));
    v.scrollTop=0;
  }else{
    const d=G.casa.deQuien&&P(G.casa.deQuien);
    v.innerHTML=`<div class="tit">Informe ① ¿Dónde vives?</div>
     <table><tr><th>Lugar</th><td>${esc(G.lugar.nombre)}, ${LUGTXT[G.lugar.tipo]} de ${ORI[G.origen].pais}</td></tr>
     <tr><th>Casa</th><td>${esc(G.casa.tipo)}, en ${esc(G.casa.barrio)}${d?" (de "+esc(d.nombre)+")":""}</td></tr>
     <tr><th>${G.indep?"Nivel de vida":"Familia"}</th><td>${FAM[G.riqueza]}</td></tr>
     <tr><th>Origen</th><td>${ORI[G.origen].n}</td></tr></table>
     <div class="tit">Informe ② ¿Cómo te va?</div>
     <table><tr><th>Etapa</th><td>${etapa()}</td></tr>
     <tr><th>Cuerpo</th><td>${altTxt()}, ${pesoTxt()}${anios()>=14?" · "+complexion():""}</td></tr>
     <tr><th>Trabajo</th><td>${G.trabajo?"Trabajas "+esc(G.trabajo.n)+" · "+G.trabajo.s+" al mes":G.pension?"Jubilación · "+G.pension+" al mes":anios()<16?"Aún no te toca":"Sin trabajo"}</td></tr>
     <tr><th>Estudios</th><td>${G.titulo?"Carrera: "+(CARRERAS[G.carrera]||"terminada"):G.uni?"En la universidad ("+G.uni+"/36)":anios()<6?"Ninguno":anios()<16?"En la escuela":"Enseñanza obligatoria"}</td></tr>
     <tr><th>Pareja</th><td>${G.pareja&&P(G.pareja)?esc(P(G.pareja).nombre)+(G.casado?" (matrimonio)":""):G.crush&&P(G.crush)?"Te gusta "+esc(P(G.crush).nombre):"Nadie"}</td></tr>
     <tr><th>Cursos</th><td>${Object.keys(G.cursos||{}).map(k=>secDe(k).n).join(", ")||"Ninguno"}</td></tr>
     ${!G.indep?`<tr><th>Ambiente en casa</th><td>${ambiente()}</td></tr>`:""}
     ${G.mg?`<tr><th>Magia</th><td>${G.mago?g("Mago graduado","Maga graduada"):"Umbraluz"} · casa ${CASASM[G.mg.casa].n} · ${G.mg.anos} ${G.mg.anos==1?"curso":"cursos"}</td></tr>`:""}
     <tr><th>Costumbres</th><td>${[G.dieta=="basura"&&"comida basura",G.dieta=="dieta"&&"a dieta",G.fl.ropa>0&&"ropa cara",G.fe&&!G.indep&&"familia practicante",G.fl.fuma&&"fumas",G.fl.adicto&&"enganche a las drogas",G.fl.ets&&"algo sin tratar"].filter(Boolean).join(", ")||"Nada que señalar"}</td></tr>${filasExtra()}</table>
     ${G.logros&&G.logros.length?`<div class="tit">Informe ③ Logros</div><table>${G.logros.map(l=>"<tr><td>"+esc(l.charAt(0).toUpperCase()+l.slice(1))+"</td></tr>").join("")}</table>`:""}
     <p class="nota">La partida se guarda sola en este navegador. Si empiezas otra vida, esta se pierde.</p>`;
    const b=document.createElement("button");b.className="gordo";b.style.fontSize="13px";b.textContent="ABANDONAR ESTA VIDA";
    b.onclick=()=>abrirHoja("¿Abandonar esta vida?",[{t:"Sí, empezar de cero",fn:()=>{G=null;borrar();cerrarHoja();render()}}]);
    v.appendChild(b);v.scrollTop=0;
  }
  const acc=$("acc");acc.innerHTML="";
  if(G.muerto){herederos().forEach(h=>{const b=document.createElement("button");b.className="ancho";b.textContent=`Seguir como ${h.nombre} (${gp(h,"hijo","hija")}, ${edadTxt(h.edad)})`;b.onclick=()=>continuarComo(h.id);acc.appendChild(b)});
    const b=document.createElement("button");b.className="ancho";b.textContent="Nacer otra vez";b.onclick=()=>{G=null;borrar();render()};acc.appendChild(b);return}
  if(G.pend)abrirPend();
  acciones().forEach(o=>{const b=document.createElement("button");b.textContent=o.t;if(o.cls)b.className=o.cls;
    b.onclick=o.anio?pasarAnio:o.abre?o.abre:()=>{TAB="diario";hacer(o.fn)};acc.appendChild(b)});
}
document.querySelectorAll("#tabs button[data-t]").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render(TAB=="diario")});
// Pantalla completa (en el APK ya va a pantalla completa y el botón sobra)
if(window.AndroidApp)$("bFull").hidden=true;
$("bFull").onclick=()=>{
  const d=document,el=d.documentElement;
  try{
    if(d.fullscreenElement){d.exitFullscreen();return}
    const p=el.requestFullscreen?el.requestFullscreen():Promise.reject();
    p.catch(()=>abrirHoja("Aquí no se puede poner a pantalla completa. Instala el APK: ahí va siempre completa.",[]));
  }catch(e){abrirHoja("Aquí no se puede poner a pantalla completa. Instala el APK: ahí va siempre completa.",[])}
};
window.__atras=()=>{if($("hoja").classList.contains("on")){if(!(G&&G.pend))cerrarHoja();return 1}return 0};
$("vista").addEventListener("click",pararTecleo);
cargar();visto=G?(G.lid||0):0;render(true);
</script>
</body>
</html>
