function vampCrear(via){const y=G.yo,ap=pick(VPN.ap),sh=y.sexo=="m"?(ch(.9)?"f":"m"):(ch(.9)?"m":"f"),sm=ch(.65)?"f":"m",sc=sm=="f"?"m":"f";
  const mk=(sexo,ed,x)=>{const p=per("conoc",sexo,ed,ap,Object.assign({vamp:1,inm:1,vpArc:1,con:false,lejos:false,rel:10,casa:false,vpCasa:1},x));{const l=VPN[sexo].filter(n=>!G.gente.some(q=>q.vamp&&q.nombre==n));p.nombre=pick(l.length?l:VPN[sexo])}p.crianza=false;return p};
  const h=mk(sh,ri(20,23),{siglos:ri(900,2400),virgen:true,dif:2,pers:ri(0,4),triste:false,sitio:"de la noche"}),m=mk(sm,ri(30,36),{siglos:h.siglos+ri(800,3000),oficio:sm=="f"?"señora de la Casa":"señor de la Casa",casado:true}),c=mk(sc,ri(26,33),{siglos:ri(150,600),oficio:"consorte de la Casa",casado:true,dif:1,virgen:false});
  return {h:h.id,m:m.id,c:c.id,conf:0,via}}
function vampEmpezar(via){if(G.arc||G.arcH&&G.arcH.vamp||G.yo.edad<216||G.carcel||enMagia())return false;const d=vampCrear(via||pick(["noche","fiesta","bosque","rapto"]));return arcIni("vamp",d,"ini_"+d.via,0)}
const vFin=d=>{const m=vM(d),c=vC(d);if(m)m.lejos=true;if(c&&!c.amante)c.lejos=true};
const vConf=(d,n)=>{d.conf=clamp((d.conf||0)+n)};
const vSal=(d,txt)=>{[d.h,d.m,d.c].forEach(i=>{const p=P(i);if(p&&p.id!=G.pareja&&!p.amante){p.lejos=true;p.con=p.con&&p.rel>=30}});return {txt}};
const vPrueba=(st,extra)=>ch(clamp(.15+(st-45)/90+(extra||0),.04,.95));
const vConoce=(d,r,q)=>{const h=vH(d);h.con=true;h.rel=Math.max(h.rel,r);h.quim=Math.max(h.quim||0,q||0);return h};
ARC.vamp={
 ini_noche:{tit:d=>"La barra del fondo",txt:d=>`Sales una noche cualquiera. En la barra del fondo hay ${gp(vH(d),"un chico","una chica")} de veintipocos que no ha tocado su copa en dos horas. Nadie se le acerca, y eso que es lo más hermoso que ha entrado en ese bar. Te mira como se mira un escaparate.`,
  ops:d=>{const h=vH(d),y=G.yo;return [{t:"Sentarte a su lado",s:"Depende de tu carisma",fn:()=>{if(vPrueba(y.carisma)){vConoce(d,25,15);vConf(d,8);return {txt:`«Llevas dos horas sin beber», le dices. «Y tú dos horas mirándome», contesta. Se llama ${h.nombre}. Tiene las manos heladas y una forma de reírse que parece de otra época.`,sig:"citas",tras:ri(1,2)}}return {txt:`Te mira de arriba abajo, sonríe sin enseñar los dientes y dice: «Otra noche.» Cuando vuelves del baño ya no está, y el camarero jura que en ese taburete no había nadie.`,sig:"vuelve",tras:ri(2,5)}}},
   {t:"Sostenerle la mirada desde lejos",fn:()=>{vConf(d,4);return {txt:`No apartas los ojos. ${cap1(gp(h,"Él","Ella"))} tampoco. Al final levanta su copa intacta hacia ti, la deja en la barra y sale. En el posavasos ha escrito una hora y una calle.`,sig:"citas",tras:1}}},
   {t:"Irte a casa",fn:()=>({txt:"Algo en la nuca te dice que te vayas. Le haces caso. En el espejo de la entrada, al salir, su taburete está vacío.",sig:"vuelve",tras:ri(3,8)})}]}},
 ini_fiesta:{tit:d=>"El sobre negro",txt:d=>"Alguien desliza bajo tu puerta un sobre negro con lacre: una fiesta de máscaras en una villa de las afueras, esta noche, sin remitente. El papel huele a iglesia cerrada.",
  ops:d=>{const h=vH(d),y=G.yo;return [{t:"Ir",s:"Con lo mejor que tengas",fn:()=>{const bien=G.fl.ropa>0||y.aspecto>=70;vConoce(d,bien?28:18,bien?18:8);vConf(d,bien?10:4);return {txt:`Candelabros, un cuarteto de cuerda, cien invitados enmascarados. Nadie come. Nadie suda. ${bien?"Alguien":"Solo una persona"} te saca a bailar un vals que no sabías que sabías: ${gp(h,"un joven pálido","una joven pálida")} que huele a nieve. «Soy ${h.nombre}. Tú eres ${g("el único","la única")} aquí a quien le late algo.» Lo dice como un piropo.`,sig:"citas",tras:ri(1,2)}}},
   {t:"Quemar el sobre",fn:()=>({txt:"Lo quemas en el fregadero. El lacre tarda mucho en derretirse. Esa noche sueñas con violines.",sig:"vuelve",tras:ri(3,8)})}]}},
 ini_bosque:{tit:d=>"El claro",txt:d=>`Se te hace de noche en el monte y pierdes la senda. En un claro, ${gp(vH(d),"sentado","sentada")} en una piedra, hay ${gp(vH(d),"un joven descalzo","una joven descalza")}, sin abrigo, como si hiciera agosto. No hay ni un ruido: ni grillos, ni viento.`,
  ops:d=>{const h=vH(d),y=G.yo;return [{t:"Preguntarle si se ha perdido",fn:()=>{vConoce(d,22,10);vConf(d,8);return {txt:`«¿Yo?», se ríe. «Llevo ${h.siglos} inviernos viniendo a este claro.» Lo tomas por una broma. Te acompaña hasta la carretera sin tropezar una sola vez en lo oscuro. Se llama ${h.nombre}. No deja huellas en el barro.`,sig:"citas",tras:ri(1,3)}}},
   {t:"Ofrecerle tu chaqueta",s:"Hace un frío que pela",fn:()=>{vConoce(d,30,14);vConf(d,14);return {txt:`Se la pones por los hombros. Se queda mirando la chaqueta como si fuera un objeto extrañísimo. «Hace mucho que nadie me abriga», dice ${h.nombre}. Te guía hasta el camino. Te devuelve la chaqueta una semana después, colgada en tu puerta, oliendo a nieve.`+moral("generoso"),sig:"citas",tras:ri(1,2)}}},
   {t:"Dar media vuelta sin hacer ruido",fn:()=>({txt:"Retrocedes paso a paso. Cuando ya corres, oyes una risa clara, sin malicia, que te sigue un buen trecho.",sig:"vuelve",tras:ri(2,6)})}]}},
 ini_rapto:{mala:1,tit:d=>"La cripta",txt:d=>`Vuelves a casa de noche. Una mano fría en la boca, el suelo que se aleja, y luego nada. Despiertas sobre una losa, en una capilla en ruinas, a la luz de una sola vela. ${gp(vH(d),"Un joven pálido","Una joven pálida")} te observa con la cabeza ladeada. Tiene los colmillos fuera y hambre atrasada. «No grites. No hay nadie en diez leguas.»`,
  ops:d=>{const h=vH(d),y=G.yo,fin=(txt)=>{if(ch(.5)){G.muerteDirecta="una noche en una capilla en ruinas; te encontraron sin una gota de sangre";return {txt,mal:1}}add("salud",-35);add("animo",-15);return {txt:txt+" Despiertas en una cuneta al amanecer, blanco como el papel, con dos marcas en el cuello y una semana en blanco.".replace("blanco como",g("blanco como","blanca como")),mal:1,sig:"vuelve",tras:ri(4,9)}};
   const ops=[{t:"Hablarle sin miedo",s:"Depende de tu carisma",fn:()=>{if(vPrueba(y.carisma,.05)){vConoce(d,20,12);vConf(d,12);return {txt:`«Si vas a cenar, al menos pregúntame el nombre.» Se queda ${gp(h,"quieto","quieta")}. Nadie le había hablado así en ${h.siglos} años. Se sienta en la losa de al lado. Habláis hasta que la vela se consume. Antes del alba te deja en tu portal, ${g("entero","entera")}. «Me llamo ${h.nombre}. No se lo digas a mi madre.»`,sig:"citas",tras:ri(1,2)}}return fin("Las palabras no te salen como querías. Se aburre de escucharte.")}},
    {t:"Robarle un beso",s:"Todo o nada · depende de tu atractivo",fn:()=>{if(vPrueba(atr(),atr()>=70?.1:-.15)){vConoce(d,30,35);h.beso=true;h.besoE=anios();vConf(d,18);
       if(atr()>=82&&y.carisma>=75&&ch(.6)){h.amante=true;h.pas=25;gustos(h);vConf(d,10);return {txt:`Se inclina hacia tu cuello y giras la cara. El beso le pilla con los colmillos fuera. Da un paso atrás, se toca la boca. «Nadie… en ${h.siglos} años nadie se había atrevido.» El segundo beso lo da ${gp(h,"él","ella")}. La vela se apaga sola. Sobre el mantel podrido del altar, quien iba a ser la cena acaba siendo otra cosa.`+primeraVez(h)+` Al alba te lleva a casa en brazos, por encima de los tejados.`,sig:"citas",tras:1}}
       return {txt:`Se inclina hacia tu cuello y giras la cara. El beso le pilla con los colmillos fuera. Da un paso atrás, se toca los labios con dos dedos, ${gp(h,"desconcertado","desconcertada")}. «Nadie… en ${h.siglos} años.» Te devuelve a tu portal antes del alba, sin una marca. «Me llamo ${h.nombre}. Volveré. No sé todavía a qué.»`,sig:"citas",tras:ri(1,2)}}return fin("Giras la cara para besarle. Se aparta a tiempo, y ya no tiene ganas de jugar.")}},
    {t:"Pelear",s:"Depende de tu cuerpo · casi imposible",fn:()=>{if(y.cuerpo>=80&&ch(.4)){vConf(d,6);vConoce(d,10,5);return {txt:`Le rompes un candelabro de hierro en la cara. No le hace nada, pero le hace gracia. «Hacía un siglo que la cena no se defendía.» Te deja ir, por deporte. Sabes que te está siguiendo todo el camino.`+moral("valiente"),sig:"vuelve",tras:ri(1,3)}}return fin("Es como pegarle a una estatua. Te sujeta las dos muñecas con una mano.")}}];
   if(sabeMagia())ops.push({t:"Encender la capilla entera de golpe",s:"Magia",fn:()=>{vConoce(d,18,8);vConf(d,10);return {txt:`Chasqueas los dedos y arden a la vez las cien velas muertas. Retrocede tapándose los ojos, y luego se echa a reír. «${g("Un mago","Una maga")}. A mi madre le vas a encantar, o te va a matar. Quizá las dos cosas.» Se llama ${h.nombre}.`,sig:"citas",tras:ri(1,2)}}});
   return ops}},
 vuelve:{ok:d=>!!viv(d.h),tit:d=>"Golpes en el cristal",txt:d=>`Tres golpecitos en tu ventana, de madrugada. Vives en un piso alto. Fuera, de pie en la cornisa como en una acera, está ${gp(vH(d),"el joven","la joven")} de aquella noche. «No puedo entrar si no me invitas. Es una norma muy tonta, pero es la norma.»`,
  ops:d=>{const h=vH(d);return [{t:"«Pasa»",fn:()=>{vConoce(d,24,12);vConf(d,10);return {txt:`Entra con cuidado, mirándolo todo: los libros, la nevera, tus fotos. «Soy ${h.nombre}. Llevo semanas pensando en ti y no sé por qué, y a mi edad no saber algo es una novedad.» Se va antes de que amanezca. Vuelve a la noche siguiente.`,sig:"citas",tras:1}}},
   {t:"Preguntarle qué es",fn:()=>{vConoce(d,18,8);vConf(d,6);h.sabes=1;return {txt:`«Lo que estás pensando», dice a través del cristal, y sonríe enseñando por fin los dientes. «Tengo ${h.siglos} años y aparento veintiuno. No te voy a hacer daño. Si quisiera, ya estaría hecho.» Abres. No sabes muy bien por qué.`,sig:"citas",tras:1}}},
   {t:"Echar la persiana",fn:()=>vSal(d,`Bajas la persiana despacio. Al otro lado, un suspiro. «Como quieras.» No vuelve nunca. Durante años, algunas noches, te parece que alguien respeta tu ventana desde el tejado de enfrente.`)}]}},
 citas:{ok:d=>!!viv(d.h),tit:d=>"Las noches con "+vH(d).nombre,txt:d=>{const h=vH(d);d.n=(d.n||0)+1;return vario("vcita",[`${h.nombre} solo puede verte de noche. Te espera en la azotea, en el último banco del parque, en la puerta de un cine de madrugada.`,`${h.nombre} aparece cuando se pone el sol, puntual como una marea. Nunca come. Nunca tiene frío. Siempre quiere saber cómo ha sido tu día, «el de verdad, el de luz».`,`Otra noche con ${h.nombre}. Camináis por la ciudad vacía. Conoce cada calle por el nombre que tenía hace cuatro siglos.`])},
  ops:d=>{const h=vH(d),y=G.yo,sig=()=>d.n>=3||d.conf>=45?{sig:"invita",tras:ri(1,3)}:{sig:"citas",tras:1};return [
   {t:"Enseñarle tu mundo",s:"Un cine, una feria, un karaoke",fn:()=>{rel(h,8);sube(h,4);vConf(d,7);add("animo",5);return Object.assign({txt:vario("vc1",[`Llevas a ${h.nombre} a una feria. Gana todos los peluches del tiro porque ve en la oscuridad, y se monta nueve veces en los coches de choque, riéndose como si acabara de inventarse la risa.`,`Sesión golfa. ${h.nombre} no ha visto una película desde que eran mudas. Te aprieta la mano en las persecuciones.`,`Le enseñas a usar un móvil. Dos horas después te manda cuarenta fotos de la luna, todas iguales.`])},sig())}},
   {t:"Preguntarle por su vida",s:"Depende de tu cabeza",fn:()=>{h.sabes=1;if(vPrueba(y.mente,.1)){rel(h,6);vConf(d,10);add("mente",1);return Object.assign({txt:`Preguntas bien, y ${h.nombre} contesta: que nació así, de una madre que ya lo era; que tiene ${h.siglos} años y aparenta veintiuno desde antes de las catedrales; que ha visto arder tres veces esta ciudad; que nunca, en todo ese tiempo, ha estado con nadie, porque su madre mata a quien se le acerca. «Hasta ahora no me había importado.»`},sig())}vConf(d,2);return Object.assign({txt:`Preguntas demasiado y demasiado pronto. ${h.nombre} cambia de tema con elegancia medieval.`},sig())}},
   {t:h.beso?"Besarle otra vez":"Besarle",s:"Depende de lo que haya entre vosotros",fn:()=>{if(h.beso||ch(.25+(h.quim||0)/90+atr()/260)){const pr=!h.beso;h.beso=true;h.besoE=h.besoE||anios();sube(h,7);rel(h,8);vConf(d,8);return Object.assign({txt:pr?`Le besas en mitad de un puente. Tiene los labios fríos y se le calientan. Cuando os separáis respira, por costumbre antigua, aunque no le hace falta. «Así que era esto», dice ${h.nombre}.`:`Ya no pide permiso para besarte ni tú para besarle. Tiene cuidado con los colmillos. Casi siempre.`},sig())}return Object.assign({txt:`Te acercas y ${h.nombre} pone un dedo helado en tus labios. «Todavía no. Si empiezo, no sé si sabré parar, y me gustas ${g("entero","entera")}.»`,mal:1},sig())}},
   {t:"Dejar de verle",fn:()=>vSal(d,`Le dices que esto no puede ser. ${h.nombre} asiente muy despacio, como quien ya ha oído esa frase en otros siglos, aunque nunca dirigida a ${gp(h,"él","ella")}. Te besa la frente y se va por la ventana. No vuelve.`)}]}},
 invita:{ok:d=>!!viv(d.h)&&!!viv(d.m),tit:d=>"«"+(vM(d).sexo=="f"?"Mi madre":"Mi padre")+" quiere verte»",txt:d=>{const h=vH(d),m=vM(d);h.sabes=1;return `${h.nombre} llega una noche sin sonreír. «${m.sexo=="f"?"Mi madre":"Mi padre"} lo sabe. ${m.nombre} ${m.apellido}: ${m.siglos} años, y ningún humano ha salido de su mesa sin su permiso. Quiere que vengas al castillo. Si no vienes, vendrá a buscarte, y eso es peor.»`},
  ops:d=>{const h=vH(d),m=vM(d);return [{t:"Ir al castillo",fn:()=>({txt:`Un carruaje negro sin cochero, tres horas de monte y niebla, un castillo que no sale en ningún mapa. ${h.nombre} te aprieta la mano todo el camino. «Mírale a los ojos. No mientas: huele las mentiras. Y pase lo que pase, no sangres.»`,sig:"cena",tras:0})},
   {t:"Pedirle que huyáis juntos",s:"Depende de su confianza en ti",fn:()=>{if(d.conf>=55&&ch(.4)){h.lejos=false;h.vpCasa=0;h.amante=true;h.pas=Math.max(h.pas||0,20);gustos(h);rel(h,20);d.huida=1;return {txt:`${h.nombre} lo piensa una noche entera. Al alba siguiente está en tu puerta con una maleta de cuero de otro siglo. «Nos encontrará. Pero no hoy.» Empezáis a vivir con las persianas bajadas.`,sig:"caza",tras:ri(6,14)}}return {txt:`«No se huye de ${m.nombre}», dice. «Lo intentó mi hermano en 1348.» No te dice cómo acabó.`,sig:"invita",tras:1}}},
   {t:"Negarte",fn:()=>{if(ch(.5))return vSal(d,`Dices que no vas. ${h.nombre} te mira un rato largo. «Entonces no debo volver, o te matará por mi culpa.» Te deja su anillo en la mesilla. No vuelves a verle.`);return {txt:"Dices que no vas. Esa misma noche se apagan todas las farolas de tu calle a la vez. Cuando abres los ojos, estás en el carruaje.",sig:"cena",tras:0,mal:1}}}]}},
 caza:{ok:d=>!!viv(d.h)&&!!viv(d.m),mala:1,tit:d=>vM(d).nombre+" os ha encontrado",txt:d=>{const m=vM(d);return `Vuelves a casa y la puerta está abierta. En tu sillón, hojeando tu correo, hay ${gp(m,"un hombre","una mujer")} que no aparenta más de treinta y cinco y a cuyo alrededor el aire está más frío. ${vH(d).nombre} está de rodillas en la alfombra, sin atreverse a levantar la vista. «Así que tú eres el motivo.»`},
  ops:d=>{const m=vM(d),h=vH(d),y=G.yo;return [{t:"Ponerte entre los dos",fn:()=>{vConf(d,18);return {txt:`Das un paso y te pones delante de ${h.nombre}. ${m.nombre} levanta una ceja. Hace siglos que nadie le sorprende. «Valor, o estupidez. En el castillo veremos cuál.» Chasquea los dedos y el suelo desaparece.`+moral("valiente",2),sig:"cena",tras:0}}},
   {t:"Pedirle perdón y respeto",fn:()=>{vConf(d,8);return {txt:`Inclinas la cabeza y le llamas por su título. Sonríe apenas. «Al menos tiene modales.» Os lleva a los dos.`,sig:"cena",tras:0}}}]}},
 cena:{ok:d=>!!viv(d.m),tit:d=>"La cena en el castillo",txt:d=>{const m=vM(d),c=vC(d);return `Una mesa para cuarenta con cuatro cubiertos. A la cabecera, ${m.nombre} ${m.apellido}, ${m.oficio}: aparenta treinta y pocos y tiene ${m.siglos} años en la mirada. A su derecha, su consorte, ${c?c.nombre:"alguien callado"}, ${c?gp(c,"padrastro","madrastra"):"sombra"} de ${vH(d).nombre}, que te estudia por encima de la copa con algo que no es hambre, o no solo. Solo hay comida en tu plato. «Dime, mortal: ¿qué quieres de ${gp(vH(d),"mi hijo","mi hija")}?»`},
  ops:d=>{const m=vM(d),h=vH(d),c=vC(d),y=G.yo;
   const fin=()=>{if(d.conf<22){if(vPrueba(y.cuerpo,-.15)){return vSal(d,`${m.nombre} deja la copa. «No me sirve.» ${h.nombre} grita. Corres: pasillos, una vidriera, un foso, el bosque. No sabes cómo llegas a un pueblo al amanecer. Nunca encontrarás otra vez aquel camino.`)}G.muerteDirecta="una cena en un castillo que no sale en los mapas";return {txt:`${m.nombre} deja la copa. «No me sirve.» Es lo último que oyes.`,mal:1}}
     const meses=ri(8,14);encierro("castillo",meses,{tipo:"una alcoba en la torre este",barrio:"el castillo de los "+m.apellido,deQuien:null},{vp:1});m.con=true;m.rel=Math.max(m.rel,15);if(c){c.con=true;c.rel=Math.max(c.rel,20)}h.con=true;
     return {txt:`${m.nombre} te mira un minuto entero. «Te quedarás aquí hasta que yo decida qué eres: un capricho, una amenaza o familia. ${cap1(g("Invitado","Invitada"))} o ${g("prisionero","prisionera")}, llámalo como te ayude a dormir.» Te dan una alcoba en la torre este. La puerta no tiene cerrojo por dentro.`,sig:"veredicto",tras:meses}};
   const ops=[{t:"«Quiero estar con "+gp(h,"él","ella")+". Nada más»",s:"La verdad, mirándole a los ojos",fn:()=>{vConf(d,h.rel>=45?16:6);return fin()}},
    {t:"Halagarle con buenas palabras",s:"Depende de tu carisma · huele las mentiras",fn:()=>{vConf(d,vPrueba(y.carisma)?12:-12);return fin()}},
    {t:"Ofrecerle tu cuello como prueba",s:"Valor, o locura",fn:()=>{add("salud",-10);vConf(d,d.conf>=25?22:10);return Object.assign(fin(),{})}}];
   if(sabeMagia())ops.push({t:"Mostrarle lo que sabes hacer",s:"Magia",fn:()=>{vConf(d,18);return fin()}});
   return ops}},
 veredicto:{ok:d=>!!viv(d.m)&&!!viv(d.h),tit:d=>"El veredicto de "+vM(d).nombre,txt:d=>{const m=vM(d);return `${m.nombre} te manda llamar al salón del trono. Están todos: ${vH(d).nombre}, muy ${gp(vH(d),"quieto","quieta")}; ${vC(d)?vC(d).nombre+", que evita mirarte":"los criados"}; y dos docenas de retratos de gente que no envejeció. «He decidido.»`},
  ops:d=>{const m=vM(d),h=vH(d),c=vC(d),y=G.yo;
   if(d.conf<32)return [{t:"Escuchar",fn:()=>{h.lejos=true;return vSal(d,`«No te mato porque ${gp(h,"mi hijo","mi hija")} no me lo perdonaría en mil años, y mil años son muchos para verle la cara larga.» Te ponen en el carruaje con los ojos vendados. Despiertas en tu cama. Durante meses buscas el camino del castillo. No existe. Lo que sí existe es una carta sin sello, cada invierno, con letra antigua.`)}}];
   if(d.conf<62)return [{t:"Escuchar",fn:()=>{vFin(d);h.vpCasa=0;h.amante=h.amante||h.beso;rel(h,10);return {txt:`«Puedes irte. Y ${gp(h,"él","ella")} puede ir a verte, de noche, cuando quiera. No eres familia. Pero tampoco eres comida.» Viniendo de ${m.nombre}, es casi un abrazo. ${h.nombre} te acompaña a casa y ya no se esconde para ir a verte.`}}}];
   return [{t:"Aceptar su mano",s:"Boda a medianoche",fn:()=>{vFin(d);const ant=G.pareja&&P(G.pareja);if(ant&&ant.id!=h.id){ant.ex=1;ant.casa=false;rel(ant,-40)}G.pareja=h.id;G.casado=true;h.vpCasa=0;h.casa=G.indep;h.amante=false;h.rel=Math.max(h.rel,80);h.beso=true;h.besoE=h.besoE||anios();gustos(h);h.pas=Math.max(h.pas||0,40);add("animo",15);logro("te casas con "+h.nombre+" "+h.apellido+", de la Casa de la noche");

   {t:"Mirar por tu cuenta",fn:()=>({txt:"Una noche, en vez de rezar, buscas el nombre del grupo en los juzgados y en los periódicos de otras provincias.",sig:"sospecha"})},
   {t:"Salirte",fn:()=>({txt:"Dices que lo dejas. Nadie grita. Te miran con una pena ensayada.",sig:"salir"})}]}},
 dentro2:{b:d=>"Subir en el grupo",intro:d=>`Llevas meses dentro. ${Fg(d).nombre} te propone «servir más»: llevar tu propio círculo y traer gente nueva. «Tú sabes escuchar. Eso vale mucho aquí.»`,
  ops:d=>{const y=G.yo;return [{t:"Aceptar: llevar tu propio círculo",fn:()=>{G.fl.sectaGuia=1;add("carisma",4);logro("te haces guía de los Hijos de la Luz");return {txt:"Aprendes las frases, las pausas, el abrazo en el momento justo. Funciona. Te quedas una parte de los donativos y duermes peor que nunca."+moral("tramposo",3),mal:1}}},
   {t:"Abrir los ojos",fn:()=>({txt:"Te oyes repetir una frase que no es tuya y te da frío. Empiezas a preparar la salida.",sig:"salir"})}]}},
 sospecha:{b:d=>"Tirar del hilo",intro:d=>`Encuentras lo que nadie enseña: cuentas a nombre de ${Fg(d).nombre}, tres familias arruinadas en otra ciudad y una chica a la que no dejan llamar a casa.`,
  ops:d=>{const f=Fg(d),y=G.yo;return [{t:"Llevarlo a la prensa y al juzgado",fn:()=>{f.lejos=true;f.rel=0;sit("fe").fig=null;G.fl.secta=0;add("carisma",4);logro("destapas la secta de los Hijos de la Luz");vivos(p=>p.sitio==sitioTxt("fe")&&p.con).forEach(p=>rel(p,ch(.5)?10:-15));return `Sale en portada. Registran el piso de los jueves; a ${f.nombre} se lo llevan con una chaqueta sobre las manos. La chica vuelve a su casa. Media parroquia te da las gracias y la otra media te retira el saludo.`+moral("valiente",3)}},
   {t:"Plantarle cara a solas",fn:()=>{if(ch(.5)){f.lejos=true;sit("fe").fig=null;G.fl.secta=0;return `Le pones los papeles delante. ${f.nombre} no niega nada: calcula. A la mañana siguiente el piso está vacío y la cuenta también.`}add("salud",-ri(8,18));return {txt:`Le pones los papeles delante. Sonríe. Esa noche dos «hermanos» te esperan en el portal para explicarte lo que le pasa a quien calumnia.`,sig:"salir",mal:1}}},
   {t:"Irte sin hacer ruido",fn:()=>({txt:"Guardas una copia de todo en un cajón y dejas de ir. Que lo arregle otro.",sig:"salir"})}]}},
 salir:{b:d=>"Salir del grupo",intro:d=>"Salir no es tan sencillo como entrar: llaman a todas horas, esperan en tu portal, le cuentan a tu familia cosas tuyas que dijiste en confianza.",
  ops:d=>[{t:"Aguantar hasta que se cansen",fn:()=>{add("animo",-10);G.fl.secta=0;return {txt:"Cambias de número y de ruta. Tardan cinco meses en dejarte en paz. La pulsera blanca acaba en la basura.",mal:1}}},
   {t:"Contárselo todo a tu familia",fn:()=>{G.fl.secta=0;vivos(p=>SANGRE.includes(p.rol)&&p.con).forEach(p=>rel(p,10));add("animo",5);return "Se lo cuentas todo en la cocina, con vergüenza. Nadie te riñe. Durante un mes no te dejan volver a casa sin compañía, y cuando llaman al timbre abre tu padre."}}]}}};
TR.afecto={ok:a=>a>=20,pasos:{
 ini:{ok:d=>Fg(d)&&Fg(d).vivo,b:d=>"Quedarte a recoger con "+Fg(d).nombre,intro:d=>`Os quedáis los últimos apagando luces. A solas, ${Fg(d).nombre} habla como no habla delante de la gente: ${gp(Fg(d),"cansado, gracioso, humano","cansada, graciosa, humana")}. Se os hace de noche.`,
  ops:d=>{const f=Fg(d);return [{t:"Quedarte más a menudo",fn:()=>{rel(f,10);sube(f,6);return {txt:`Ya es costumbre: recogéis, habláis, cerráis juntos. ${f.nombre} guarda dos tazas en la sacristía.`,sig:"cerca",tras:2}}},
   {t:"Mantener las distancias",fn:()=>{rel(f,4);return `Le ayudas y te vas a tu hora. ${f.nombre} lo entiende, o hace como que lo entiende.`}}]}},
 cerca:{ok:d=>Fg(d)&&Fg(d).vivo,b:d=>"Otra tarde con "+Fg(d).nombre,intro:d=>`Un día, al pasarte las llaves, ${Fg(d).nombre} te sujeta la mano un segundo de más y la suelta como si quemara. «Perdona.»`,
  ops:d=>{const f=Fg(d);return [{t:"«No hay nada que perdonar»",fn:()=>{sube(f,12);rel(f,8);return {txt:`Lo dices mirándole. ${f.nombre} se pone ${gp(f,"rojo","roja")} hasta las orejas y se le caen las llaves.`,sig:"duda",tras:2}}},
   {t:"Hacer como que no ha pasado",fn:()=>{rel(f,6);return `Cambias de tema. ${f.nombre} respira. Seguís siendo amigos, de los buenos, de los que no preguntan.`}},
   {t:"Decirle que mejor no veros a solas",fn:()=>{rel(f,-10);return `Se lo dices con cuidado. Asiente tres veces. Desde entonces te da la paz con dos dedos.`}}]}},
 duda:{ok:d=>Fg(d)&&Fg(d).vivo,b:d=>"Lo que no se dice en voz alta",intro:d=>`${Fg(d).nombre} te lo suelta en la sacristía, de pie, con la puerta abierta por decoro: «Llevo meses pidiendo que se me pase y no se me pasa. No sé qué hacer contigo. No sé qué hacer conmigo.»`,
  ops:d=>{const f=Fg(d),lib=!G.pareja;return [{t:"Besarle",fn:()=>{f.beso=true;f.besoE=anios();f.amante=true;f.pas=20;gustos(f);virgenIni(f);rel(f,12);return {txt:`Cierras tú la puerta. El beso dura lo que tarda en apagarse una vela. «Esto no puede saberse», dice, sin soltarte.`,sig:"secreto",tras:3}}},
   {t:"Pedirle que elija",fn:()=>{if(ch(.25+f.rel/200)){f.oficio=gp(f,"antiguo","antigua")+" "+f.oficio.replace(/^(el|la) /,"");sit("fe").fig=null;if(lib){G.pareja=f.id;f.beso=true;f.besoE=anios();gustos(f)}else{f.amante=true;f.pas=20;gustos(f)}rel(f,25);logro(f.nombre+" lo deja todo por ti");vivos(p=>p.sitio==sitioTxt("fe")&&p.con&&p.id!=f.id).forEach(p=>rel(p,-12));
       return `Tarda una semana. El domingo no hay oficio: hay una nota en la puerta. Esa tarde llama a tu timbre con ropa de calle que le queda rara y una maleta pequeña. «Ya he elegido.» El barrio tiene tema para un año.`}
     f.lejos=true;sit("fe").fig=null;return {txt:`Tarda una semana. Elige lo que ya había elegido hace muchos años. Pide el traslado. Te deja una carta de tres líneas y un libro subrayado.`,mal:1}}},
   {t:"Parar aquí",fn:()=>{rel(f,5);return `«Ni tú ni yo», le dices. ${f.nombre} cierra los ojos, agradecido y roto a la vez. Seguís viéndoos cada semana, a tres metros, con medio barrio delante.`.replace("agradecido y roto",gp(f,"agradecido y roto","agradecida y rota"))}}]}},
 secreto:{ok:d=>Fg(d)&&Fg(d).vivo&&Fg(d).amante,b:d=>"Os han visto",intro:d=>`Lleváis meses viéndoos a escondidas. Una feligresa os ha visto salir juntos de la sacristía a deshoras, y en este barrio las noticias no necesitan periódico.`,
  ops:d=>{const f=Fg(d),y=G.yo;return [{t:"Negarlo todo",s:"Depende de tu carisma",fn:()=>ch(.3+y.carisma/170)?`Lo negáis con tanta calma que la que queda mal es ella. Seguís igual, con más cuidado y peor conciencia.`:(vivos(p=>p.sitio==sitioTxt("fe")&&p.con&&p.id!=f.id).forEach(p=>rel(p,-20)),f.lejos=true,f.amante=false,sit("fe").fig=null,{txt:`Nadie os cree. A ${f.nombre} le trasladan en quince días, lejos. En la puerta de tu casa alguien pinta una palabra.`,mal:1})},
   {t:"Dar la cara los dos",fn:()=>{f.oficio=gp(f,"antiguo","antigua")+" "+f.oficio.replace(/^(el|la) /,"");sit("fe").fig=null;f.amante=!!G.pareja;if(!G.pareja){G.pareja=f.id}rel(f,25);logro(f.nombre+" lo deja todo por ti");return `Lo decís el domingo, desde el primer banco, antes de que lo diga otro. Hay un silencio de catedral. ${f.nombre} deja las llaves en el altar y sale de tu mano por el pasillo central.`+moral("valiente",2)}},
   {t:"Cortar por lo sano",fn:()=>{f.amante=false;rel(f,-20);f.lejos=true;sit("fe").fig=null;return {txt:`Lo dejáis esa misma noche. Pide el traslado antes de que se lo impongan. No os despedís.`,mal:1}}}]}}}};
// --- El bar ---
TR.traspaso={ok:a=>a>=18,pasos:{
 ini:{b:d=>"El cartel de «Se traspasa»",intro:d=>`En la puerta del bar hay un cartel escrito a boli: SE TRASPASA. ${Fg(d).nombre} lleva treinta años detrás de esa barra y debe seis meses al proveedor.`,
  ops:d=>{const f=Fg(d),y=G.yo;return [{t:"Organizar una cena para salvarlo",s:"Depende de tu carisma",fn:()=>{if(ch(.35+y.carisma/150)){rel(f,35);add("carisma",3);sit("bar").gratis=1;logro("salvas el bar del barrio");return `Corres la voz. La noche de la cena no cabe un alfiler: vienen hasta los que se mudaron. Sale lo de los seis meses y sobra para pintar. ${f.nombre} descuelga el cartel y te dice que aquí no vuelves a pagar una caña.`}return {txt:"Vienen treinta personas y mucho cariño. No llega. El cartel sigue en la puerta.",sig:"socio",mal:1}}},
   {t:"Proponerle entrar de socio",s:y.dinero>=4000?"4000":"Te faltan 4000",fn:()=>{if(y.dinero<4000)return {txt:"Echas cuentas en una servilleta. No te sale.",mal:1};y.dinero-=4000;G.fl.barSocio=1;rel(f,25);logro("te haces socio del bar del barrio".replace("socio",g("socio","socia")));return {txt:`Firmáis en una servilleta primero y en el notario después. El bar es medio tuyo. ${f.nombre} te enseña dónde se guarda la llave de la persiana.`,sig:"cuentas",tras:8}}},
   {t:"No meterte",fn:()=>{const f2=Fg(d);f2.lejos=true;sit("bar").fig=null;sit("bar").v=Math.min(sit("bar").v,4);return {txt:`En un mes hay dueño nuevo, carta plastificada y música de ascensor. ${f.nombre} se jubila en el pueblo. El bar ya no te conoce.`,mal:1}}}]}},
 socio:{b:d=>"Última oportunidad para el bar",intro:d=>`${Fg(d).nombre} ha recibido una oferta de una franquicia. Te lo dice antes de firmar, por si acaso.`,
  ops:d=>{const f=Fg(d),y=G.yo;return [{t:"Entrar de socio",s:y.dinero>=4000?"4000":"Te faltan 4000",fn:()=>{if(y.dinero<4000){f.lejos=true;sit("bar").fig=null;return {txt:"No tienes el dinero. Firma con la franquicia.",mal:1}}y.dinero-=4000;G.fl.barSocio=1;rel(f,25);return {txt:"Pones el dinero. El bar se queda como está, que es justo lo que queríais.",sig:"cuentas",tras:8}}},
   {t:"Dejarle firmar",fn:()=>{f.lejos=true;sit("bar").fig=null;return {txt:"Firma. Quitan el futbolín la primera semana.",mal:1}}}]}},
 cuentas:{ok:d=>G.fl.barSocio,b:d=>"Las cuentas del bar",intro:d=>"Ya eres de dentro, y desde dentro se ve lo que no se veía: cada semana faltan botellas del almacén. Solo tenéis llave tres personas.",
  ops:d=>{const f=Fg(d);return [{t:"Vigilar el almacén una noche",fn:()=>({txt:`Es el cocinero, que revende las botellas para pagar el tratamiento de su hijo. Le pilláis con la caja en los brazos.`+(ch(.5)?` ${f.nombre} le sube el sueldo en vez de echarle. Tú pones la mitad.`:" Lo despedís. La cocina no vuelve a ser la misma."),sig:null})},
   {t:"Cambiar la cerradura y no preguntar",fn:()=>({txt:"Cerradura nueva, dos llaves. Dejan de faltar botellas y el ambiente en la cocina se enfría un grado."})}]}}}};
TR.timba={ok:a=>a>=18,pasos:{
 ini:{b:d=>"La puerta de la trastienda",intro:d=>"Hoy te dejan pasar la cortina del fondo. Detrás hay una mesa con tapete verde, humo, y la partida de los jueves, que se juega con dinero de verdad.",
  ops:d=>{const y=G.yo;return [{t:"Sentarte",s:y.dinero>=200?"200 de entrada":"Te faltan 200",fn:()=>{if(y.dinero<200)return {txt:"Sin doscientos no hay silla. Miras un rato de pie."};const g=ch(.3+y.mente/220);y.dinero+=g?ri(200,600):-200;return {txt:g?"Juegas despacio y lees bien las caras. Te levantas con más de lo que trajiste y con respeto.":"Te despluman en cuarenta minutos, con educación.",sig:"sube",tras:2,mal:!g}}},
   {t:"Mirar y aprender",fn:()=>{add("mente",1);return {txt:"Te quedas de pie, detrás, callado. Aprendes quién farolea y quién no sabe.".replace("callado",g("callado","callada")),sig:"sube",tras:2}}},
   {t:"Volver a la barra",fn:()=>({txt:"Eso no es para ti. La cortina se cierra y no vuelve a abrirse."})}]}},
 sube:{b:d=>"La partida grande",intro:d=>"Esta noche viene gente de fuera y el bote es serio. A media partida te das cuenta de que el del anillo marca las cartas con la uña.",
  ops:d=>{const y=G.yo;return [{t:"Señalarle delante de todos",fn:()=>{if(ch(.6)){add("carisma",3);y.dinero+=300;return "Le coges la muñeca y pones la carta a la luz. Silencio. Lo sacan entre dos. Te dan su parte del bote y un sitio fijo en la mesa."+moral("valiente")}add("salud",-ri(8,18));return {txt:"Lo niega, y tiene amigos en la mesa. Te esperan fuera.",mal:1}}},
   {t:"Aprovechar que lo sabes",s:"Jugar contra sus marcas",fn:()=>{if(ch(.35+y.mente/200)){const n=ri(800,2500);y.dinero+=n;return `Sabes qué lleva en cada mano. Le dejas ganar dos y le limpias la tercera: ${n}. No entiende qué ha pasado.`+moral("tramposo")}y.dinero-=Math.min(y.dinero,600);return {txt:"Crees que le lees y es él quien te lee a ti. Pierdes 600 y la cara.",mal:1}}},
   {t:"Levantarte ganando",fn:()=>{if(ch(.12))return encarcelar(ri(1,3));return "Dices que mañana madrugas. Diez minutos después de irte entra la policía. Lo lees en el periódico."+moral("prudente")}}]}}}};
TR.capitan={ok:a=>a>=12,pasos:{
 ini:{b:d=>"El Capitán",intro:d=>"En la mesa de la ventana se sienta cada tarde un viejo al que llaman el Capitán. Cuenta que dio la vuelta al mundo en un mercante. Nadie le cree ni le escucha ya.",
  ops:d=>[{t:"Sentarte a escucharle",fn:()=>{add("mente",2);return {txt:"Le escuchas tres tardes. Las historias no se contradicen nunca, y sabe nombres de puertos que no vienen en los mapas del colegio.",sig:"carta",tras:3}}},
   {t:"Dejarle con sus cuentos",fn:()=>({txt:"Pasas de largo, como todos."})}]},
 carta:{b:d=>"Lo que te pide el Capitán",intro:d=>"El Capitán saca del bolsillo de dentro un sobre gastado. Es para su hija, a la que no ve desde hace treinta años. «Yo no tengo valor. Tú tienes piernas.»",
  ops:d=>{const y=G.yo;return [{t:"Llevar la carta",fn:()=>{add("animo",5);if(ch(.6)){const n=ri(600,3000);eco("capitan",ri(8,30),{n});logro("reúnes al Capitán con su hija");return "Das con ella en un barrio del otro extremo. Lee la carta de pie, en el portal, dos veces. El domingo siguiente hay una mujer sentada en la mesa de la ventana, cogiéndole la mano a un viejo que no para de hablar."+moral("generoso",2)}
       return {txt:"Das con ella. Lee la carta, te la devuelve doblada y cierra la puerta con suavidad. Al Capitán le dices que no la has encontrado. Te mira y sabe que mientes, y te lo agradece.",mal:1}}},
   {t:"Decirle que eso tiene que hacerlo él",fn:()=>({txt:ch(.4)?"Se lo dices. Tarda un mes. Un día no viene al bar, y al siguiente vuelve con los zapatos lustrados y cara de haber llorado bien.":"Se lo dices. Guarda el sobre. Sigue viniendo cada tarde, con el sobre en el bolsillo de dentro."})}]}}}};
ECO.capitan=d=>{G.yo.dinero+=d.n;return `Muere el Capitán. En el bar ponen su foto junto a la cafetera. Su hija te trae una caja: un sextante de latón, un cuaderno de bitácora y ${d.n} «para quien tuvo piernas».`};
// --- El gimnasio ---
TR.combate={ok:a=>a>=17&&a<45,pasos:{
 ini:{b:d=>"Lo que te propone "+Fg(d).nombre,intro:d=>`${Fg(d).nombre} lleva semanas mirándote entrenar. Hoy te para: hay una velada amateur dentro de tres meses y cree que puedes estar.`,
  ops:d=>[{t:"Aceptar",fn:()=>({txt:"Te apunta en una hoja pegada con celo junto a la báscula. Ya no hay vuelta atrás: está tu nombre.",sig:"prep",tras:1})},{t:"No es lo tuyo",fn:()=>({txt:"Le das las gracias. Vienes a sudar, no a que te partan la cara."})}]},
 prep:{b:d=>"Preparar la velada",intro:d=>"Madrugones, saco, comba, dieta de pollo hervido. En el vestuario, uno de los veteranos te ofrece «una ayudita» en un bote sin etiqueta.",
  ops:d=>[{t:"Entrenar limpio",fn:()=>{mover(.2);add("cuerpo",5);add("salud",2);d.limpio=1;return {txt:"Dos meses de monje. Te miras al espejo y hay alguien nuevo.",sig:"pelea",tras:2}}},
   {t:"Aceptar el bote",fn:()=>{add("cuerpo",10);add("salud",-7);add("animo",-3);return {txt:"Creces a ojos vista. También el mal genio, y unos latidos raros por la noche."+moral("tramposo"),sig:"pelea",tras:2,mal:1}}}]},
 pelea:{b:d=>"La velada",intro:d=>"Un polideportivo de barrio, doscientas sillas plegables, tu nombre mal escrito en el cartel. Suena la campana.",
  ops:d=>{const f=Fg(d),y=G.yo;const res=(plus)=>{if(ch(clamp((y.cuerpo-40)/70+plus,.1,.9))){y.dinero+=500;add("carisma",4);rel(f,20);logro("ganas tu primera velada");return `Tercer asalto. Ves el hueco y entras. Cuando levantan tu brazo, ${f.nombre} está ${gp(f,"subido","subida")} a las cuerdas gritando más que nadie.`}add("salud",-ri(8,16));rel(f,10);add("carisma",1);return {txt:`Aguantas los tres asaltos de pie y pierdes a los puntos. ${f.nombre} te pone hielo y te dice que así se empieza.`,mal:1}};
   return [{t:"Salir a por todas",fn:()=>res(.05)},{t:"Aguantar y contragolpear",s:"Depende también de tu cabeza",fn:()=>res((y.mente-50)/250)}]}}}};
TR.taquillas={ok:a=>a>=16,pasos:{
 ini:{b:d=>"Los robos de las taquillas",intro:d=>"Llevan un mes desapareciendo cosas de las taquillas: carteras no, comida y ropa de abrigo. Una noche que cierras tarde ves luz en el cuarto de calderas.",
  ops:d=>{const f=Fg(d);return [{t:"Mirar quién hay",fn:()=>({txt:"Es el chaval que limpia por las mañanas. Duerme ahí, entre toallas, desde que le echaron de casa. Tiene tu bufanda puesta.",sig:"chaval"})},{t:"Avisar en recepción",fn:()=>({txt:"Avisas. Al día siguiente hay candados nuevos y limpiador nuevo. No preguntas por el anterior."+moral("prudente")})}]}},
 chaval:{b:d=>"El chaval de las calderas",intro:d=>"Te pide que no digas nada. Tiene diecinueve años, una mochila y un turno de cuatro horas que no da para un alquiler.",
  ops:d=>{const f=Fg(d),y=G.yo;return [{t:"Hablar con "+f.nombre+" para que le dé más horas",fn:()=>{rel(f,10);add("carisma",1);logro("le consigues techo y trabajo a un chaval");const p=per("conoc","m",19,pick(ORI[G.origen].ap),{con:true,rel:55,sitio:"del gimnasio",oficio:"monitor en prácticas"});return `${f.nombre} gruñe, echa cuentas y le hace contrato de jornada completa. Un año después ${p.nombre} da clases de sala y te guarda siempre la mejor taquilla.`+moral("generoso",2)}},
   {t:"Dejarle la bufanda y callar",fn:()=>({txt:"Le dejas la bufanda y un bocadillo. Sigues encontrando la luz encendida algunas noches. En primavera ya no está."})},
   {t:"Contarlo",fn:()=>({txt:"Lo cuentas. Le despiden esa misma mañana. Te devuelve la bufanda doblada, sin mirarte."+moral("chivato")+"",mal:1})}]}}}};
// --- La biblioteca ---
TR.cartas={ok:a=>a>=12,pasos:{
 ini:{b:d=>"El libro que nadie pide",intro:d=>"En la última balda hay un libro que no se presta desde hace décadas. Dentro, entre las páginas, encuentras siete cartas de amor escritas a mano, atadas con un hilo. La última no llegó a enviarse.",
  ops:d=>{const f=Fg(d);return [{t:"Buscar a quien las escribió",fn:()=>{add("mente",2);rel(f,6);return {txt:`Se las enseñas a ${f.nombre}, que se pone las gafas de leer con manos de cirujano. Las fichas de préstamo de entonces dan un nombre y un año.`,sig:"busca",tras:2}}},
   {t:"Dejarlas donde estaban",fn:()=>({txt:"Las vuelves a atar y cierras el libro. Hay cosas que llevan tanto tiempo esperando que ya son de ese sitio."})}]}},
 busca:{b:d=>"Seguir el rastro de las cartas",intro:d=>`Entre ${Fg(d).nombre} y tú dais con ella: tiene más de ochenta años y vive en una residencia, a cuarenta kilómetros. Él murió hace mucho. Nunca supo que la última carta era un sí.`,
  ops:d=>{const f=Fg(d);return [{t:"Llevárselas en persona",fn:()=>{add("animo",8);add("carisma",1);rel(f,10);logro("entregas una carta de amor con sesenta años de retraso");return "Las lee despacio, con una lupa, moviendo los labios. Al llegar a la última se tapa la boca. «Entonces quiso venir.» Te coge las dos manos. Te quedas a merendar."}},
   {t:"Mandarlas por correo",fn:()=>({txt:"Las mandas con una nota. Semanas después llega a la biblioteca una caja de bombones y una tarjeta con letra temblorosa que dice solo: «Gracias por el final.»"})}]}}}};
TR.cierre={ok:a=>a>=14,pasos:{
 ini:{b:d=>"El rumor del cierre",intro:d=>`${Fg(d).nombre} te lo dice en voz baja, aunque no hay nadie: el ayuntamiento quiere cerrar la biblioteca y alquilar el local a un banco.`,
  ops:d=>{const f=Fg(d),y=G.yo;const fin=ok=>{if(ok){rel(f,25);add("carisma",3);logro("salvas la biblioteca del barrio");return `El pleno retira la propuesta por un voto. ${f.nombre} pega tu carné en el tablón con una chincheta dorada: socio de honor.`.replace("socio",g("socio","socia"))}sit("biblio").v=Math.min(sit("biblio").v,6);return {txt:"No basta. La biblioteca se queda en una sala, tres mañanas por semana. Algo es.",mal:1}};

/* ---------- Mascotas ---------- */
const MASCN={perro:["Trasto","Canela","Rayo","Luna","Pirata","Chispa","Bruno","Nube"],gato:["Misha","Sombra","Garbanzo","Tigre","Nata","Bigotes","Lola","Humo"]};
function mascotaNueva(tipo,edad){G.masc={tipo,n:pick(MASCN[tipo]),e:edad||ri(2,8),v:20,fin:(tipo=="perro"?ri(11,16):ri(13,19))*12}}
function menuMascota(){const y=G.yo,m=G.masc,ops=[],H=(t,s,fn)=>ops.push({t,s,fn:()=>hacer(fn)});
  if(!m){[["perro","Un perro de la protectora","Paseos, compañía y pelos"],["gato","Un gato de la calle","Va a su aire y elige él"]].forEach(([k,t,s])=>H(t,s,()=>{if(y.edad<216&&!ch(.4+G.riqueza*.1))return {txt:"Lo pides en casa con tu mejor cara. «Cuando seas mayor y lo cuides tú.»",mal:1};mascotaNueva(k);add("animo",8);return k=="perro"?`Vuelves de la protectora con un perro que tiembla en el asiento de atrás. Le pones ${G.masc.n}. Esa noche duerme pegado a tu puerta.`:`Un gato flaco se cuela en casa y decide que vive ahí. Le pones ${G.masc.n}. No contesta, pero se queda.`}));abrirHoja("¿Un animal en casa?",ops);return}
  if(m.tipo=="perro")H("Sacarle a pasear","Te mueve a ti también",()=>{mover(.06);add("animo",4);add("cuerpo",1);m.v=clamp(m.v+5);return vario("mascP",[`Paseo largo con ${m.n}. Huele cada farola como si fuera un periódico.`,`${m.n} tira de la correa hacia el parque. Acabáis yendo al parque.`,`Le tiras un palo a ${m.n}. Te trae otro distinto, mejor.`,`${m.n} se hace amigo de un perro enorme. Tú, de su dueño, a la fuerza.`])+(y.edad>=24&&ch(.3)?encuentroSitio("parque"):"")});
  H("Jugar con "+m.n,"",()=>{add("animo",5);m.v=clamp(m.v+6);return m.tipo=="perro"?vario("mascJ",[`${m.n} te recibe como si volvieras de la guerra. Has bajado la basura.`,`Enseñas a ${m.n} a dar la pata. Aprende en diez minutos y lo usa para pedir comida siempre.`,`${m.n} y tú os peleáis por el sofá. Gana.`]):vario("mascG",[`${m.n} persigue un punto de luz por la pared durante una hora. Tú también, a tu manera.`,`${m.n} se te duerme encima y pierdes la tarde entera sin moverte. Tarde ganada.`,`${m.n} tira un vaso de la mesa mirándote a los ojos.`])});
  H("Llevarle al veterinario","80 · revisión",()=>{y.dinero-=80;m.fin+=4;m.v=clamp(m.v+2);return `Revisión de ${m.n}: vacunas al día y una mirada de traición que te dura hasta la cena.`});
  abrirHoja(m.n+" · "+m.tipo+" · "+Math.floor(m.e/12)+" años",ops)}
function tickMascota(){const y=G.yo,m=G.masc;if(!m||G.carcel)return;m.e++;m.v=clamp(m.v-.4);add("animo",.4);
  if(m.e>=m.fin){G.masc=null;G.mascM=G.mascM||[];G.mascM.push(m.n);add("animo",-Math.round(8+m.v/6));log(vario("mascF",[`${m.n} ya casi no se levantaba. Una mañana no se levanta. Tenía ${Math.floor(m.e/12)} años, y los pasó casi todos esperándote detrás de la puerta.`,`${m.n} se duerme a tus pies y ya no despierta. ${Math.floor(m.e/12)} años. La casa suena distinta sin sus uñas en el suelo.`,`Llevas a ${m.n} al veterinario por última vez y le sujetas la cabeza hasta el final. Guardas su collar en el cajón de las cosas que no se tiran.`]),"mala");return}
  if(m.e>=m.fin-18&&ch(.08))log(vario("mascV",[`${m.n} tiene el hocico blanco y ya no sube al sofá de un salto. Le pones un cojín en el suelo.`,`${m.n} duerme casi todo el día. Cuando llegas mueve la cola sin levantarse.`,`A ${m.n} le cuestan las escaleras. Subís juntos, peldaño a peldaño.`]));
  else if(ch(.05))log(vario("mascE",m.tipo=="perro"?[`${m.n} se ha comido una zapatilla. Solo una, para fastidiar.`,`${m.n} ladra al cartero como cada mañana. Es su único enemigo y lo cuida.`,`${m.n} se escapa y vuelve tres horas después, embarrado y feliz.`,`${m.n} se sienta a tu lado cuando estás mal, sin que nadie le avise.`]:[`${m.n} te deja un regalo en la alfombra: medio ratón.`,`${m.n} lleva dos días ofendido porque moviste su caja.`,`${m.n} se cuela en casa de la vecina y vuelve oliendo a su colonia.`,`${m.n} duerme encima de tu ropa limpia, exactamente encima.`]))}

 mundo:["Ver mundo","No morirte donde naciste",()=>!!G.exo||(G.fl.mudanzas||0)>=3||(G.logros||[]).some(t=>/isla|extranjero|mudas a|vives en/i.test(t))],
 huella:["Dejar el barrio mejor","Que te echen de menos",()=>((G.mor||{}).generoso||0)>=6||vivos(p=>p.rel>=60).length>=10],

DEC.sueno={man:1,tit:d=>"¿Qué quieres de la vida?",txt:d=>"",ops:d=>Object.keys(SUENOS).map(k=>({t:SUENOS[k][0],s:SUENOS[k][1],fn:()=>{G.sueno=k;return `Lo decides una noche, mirando el techo: ${SUENOS[k][0].toLowerCase()}. No se lo cuentas a nadie. Al final de todo, la vida te dirá si lo conseguiste.`}}))};
function suenoTxt(){if(!G.sueno||!SUENOS[G.sueno])return "";const S=SUENOS[G.sueno];let ok=false;try{ok=!!S[2]()}catch(e){}

function eventos10(ev,a){const y=G.yo;
  const m=muertosCerca(70).filter(d=>!d.paz&&d.anoM>0&&ano()>d.anoM);

    else log(vario("aparS",[`Hueles de pronto la colonia de ${d.nombre} en mitad del pasillo. No hay nadie. Te quedas un rato sin moverte.`,`Sueñas con ${tu(d)}. Te dice algo importante. Al despertar solo recuerdas que era importante.`,`La radio se enciende sola en la emisora de ${d.nombre}. La dejas puesta.`,`Juras haber oído a ${tu(d)} llamarte desde la cocina, con tu nombre de cuando eras ${g("pequeño","pequeña")}.`,`Encuentras las gafas de ${d.nombre} encima de la mesa. Llevaban años en un cajón.`]))})}

function altP(p){const f=fis(p),a=p.edad/12;let k=1;for(let i=1;i<CREC.length;i++)if(a<CREC[i][0]){const x=CREC[i-1],q=CREC[i];k=x[1]+(q[1]-x[1])*(a-x[0])/(q[0]-x[0]);break}return Math.round(f.alt*k-(a>=72?2:0))}

    let s=vario("tomoD",["Pasas las noches con el tomo y un diccionario de tres lenguas muertas. Avanzas una página. La página avanza contigo.","Copias un diagrama a lápiz. Cuando levantas la mano, el lápiz ha seguido dibujando solo un trazo más.","Lees en voz baja un párrafo y se apagan las farolas de tu calle. Vuelven al rato.","El tomo huele distinto cada noche: a tierra mojada, a incienso, a quemado.","Descifras una frase entera. Te sangra la nariz sobre el margen, y la mancha desaparece, absorbida.","Sueñas con la página siguiente antes de pasarla. Cuando la pasas, es exactamente esa.","Encuentras anotaciones de dueños anteriores en los márgenes. Las últimas de cada uno están escritas con prisa."]);
    const n=RIT.find(r=>d0<r[0]&&T.d>=r[0]);if(n)s+=` Entiendes por fin un ritual entero: «${n[1]}».`;return s});
  const adultos=()=>vivos(p=>p.con&&!p.lejos&&p.edad>=216&&y.edad>=216&&!p.casa||p.con&&!p.lejos&&p.edad>=216&&y.edad>=216);
  const elige=(tit,l,fn)=>abrirHoja(tit,l.slice(0,40).map(p=>({t:p.nombre+" "+p.apellido,s:rolTxt(p),fn:()=>hacer(()=>fn(p))})));
  if(T.d>=15)H("Ver lo oculto","Ritual · una vela negra y un espejo boca abajo",()=>{T.osc+=1;add("salud",-2);const q=G.pareja&&viv(G.pareja),cr=vivos(p=>(p.lobo||p.vamp)&&p.con&&!p.sabes&&!p.vpArc);
    if(q&&q.lio)return {txt:`En el espejo no sales tú: sale ${q.nombre}, y no está ${gp(q,"solo","sola")}. Ves la cara de ${lioN(q)} con toda claridad. Das la vuelta al espejo antes de ver más.`,mal:1};
    if(cr.length){const p=pick(cr);p.sabes=1;return `El espejo te enseña a ${p.nombre} tal como es de verdad. No es del todo una persona: es ${gp(p,"un","una")} ${criaturaTxt(p)}. Lleva años a dos metros de ti.`}
    const x=y.edad>=168?secretoFamilia(null,"tomo"):"";return x?"El espejo se empaña y alguien escribe desde el otro lado. "+x.replace(/^Preguntas después y acaban contándotelo: /,"Lo que lees no lo sabía nadie vivo: "):"El espejo no enseña nada. A veces no hay nada escondido, y eso también es una respuesta."});
  if(T.d>=30&&y.edad>=216)ops.push({t:"Atar una voluntad",s:"Ritual · un mechón, un nudo y un nombre",fn:()=>elige("¿A quién atas?",vivos(p=>p.con&&!p.lejos&&p.edad>=216),p=>{T.osc+=3;add("salud",-3);rel(p,25);pers(p);p.quim=clamp((p.quim||0)+25);p.atado=1;return `Haces siete nudos diciendo siete veces el nombre de ${p.nombre}. Al día siguiente te busca sin saber por qué, y te mira como si acabara de verte por primera vez. Algo en sus ojos va medio segundo por detrás.`+moral("tramposo",2)})});
  if(T.d>=45&&muertosCerca(30).length)ops.push({t:"Llamar a un muerto",s:"Ritual · sal, una foto y la puerta abierta",fn:()=>abrirHoja("¿A quién llamas?",muertosCerca(30).slice(0,30).map(d=>({t:d.nombre+" "+d.apellido,s:rolTxt(d),fn:()=>hacer(()=>{T.osc+=2;add("salud",-3);d.paz=0;decidir("aparicion",{id:d.id});return `Trazas el círculo de sal y pones su foto en el centro. La llama se tumba hacia un lado, como si alguien pasara. ${cap1(tu(d))} está ${gp(d,"sentado","sentada")} en tu silla, con la ropa de los domingos.`})})))});
  if(T.d>=60)ops.push({t:"Maldecir",s:"Ritual · se paga caro",fn:()=>elige("¿A quién maldices?",vivos(p=>p.con&&p.edad>=216),p=>{T.osc+=6;add("salud",-6);add("animo",-4);rel(p,-20);const f=fis(p);f.dc=(f.dc||0)-1;if(ch(.3))eco("maldito",ri(4,14),{id:p.id});return {txt:`Clavas su nombre en una vela y la dejas arder hasta el final. A ${p.nombre} empieza a torcérsele todo: el trabajo, la salud, el sueño. Tú no duermes mucho mejor.`+moral("egoista",3),mal:1}})});
  if(T.d>=75)H("Robar años","Ritual · alguien cerca los pierde",()=>{const l=vivos(p=>p.con&&!p.inm&&p.edad>=216&&p.rel<50);if(!l.length)return {txt:"El ritual pide a alguien a quien no quieras demasiado. No tienes a nadie así cerca. El tomo se cierra solo.",mal:1};const p=pick(l);p.edad+=120;T.osc+=9;y.salud=100;add("aspecto",6);add("cuerpo",5);G.yo.altMod=G.yo.altMod||0;
    return {txt:`Dices las palabras de madrugada. Por la mañana te has quitado diez años de la cara y de las rodillas. Esa misma semana te cruzas con ${p.nombre} ${p.apellido}: tiene el pelo blanco y anda agarrándose a las paredes. Te mira como si supiera.`+moral("egoista",3),mal:1}});
  if(T.d>=95&&!T.usado){const hs=SNAPS.filter(h=>h.uid==G.uid);ops.push({t:"Desandar el tiempo",s:hs.length?"Ritual · una sola vez en la vida":"No hay ningún momento al que volver, todavía",fn:hs.length?()=>abrirHoja("¿A qué momento vuelves? (no hay vuelta de la vuelta)",SNAPS.map((h,i)=>({t:"Antes de "+h.txt,s:cap1(h.cuando),fn:()=>abrirHoja("Volver a "+h.cuando+": perderás todo lo vivido desde entonces",[{t:"Decir la última palabra",s:"Antes de "+h.txt,fn:()=>viajar(i)}])})).reverse()):()=>{}})}
  else if(T.usado)ops.push({t:"Desandar el tiempo",s:"La página está quemada. Ya lo hiciste",fn:()=>{}});
  RIT.filter(r=>T.d<r[0]).slice(0,1).forEach(r=>ops.push({t:"🔒 "+r[1],s:"Dominio "+r[0]+" · "+r[2],fn:()=>{}}));
  abrirHoja("El tomo prohibido · dominio "+Math.floor(T.d)+(T.osc>=25?" · te buscan":T.osc>=10?" · te está cambiando":""),ops)}
ECO.maldito=d=>{const p=viv(d.id);if(!p)return null;morir(p);return {txt:`Muere ${p.nombre} ${p.apellido}, de algo que los médicos no saben nombrar. Tú sí.`,mal:1}};
DEC.duenos={man:1,tit:d=>"Vienen a por el tomo",txt:d=>"",ops:d=>{const y=G.yo,T=G.tomo;return [
  {t:"Entregarlo",fn:()=>{G.tomo=null;add("animo",-6);return "Lo pones sobre la mesa. El más viejo lo envuelve en un paño sin tocarlo con la piel. «Has durado más que la mayoría.» Se van. Durante semanas te descubres pasando páginas en el aire."}},
  {t:"Plantarles cara con lo que has aprendido",s:"Depende de tu dominio",fn:()=>{if(ch(clamp(T.d/130,.05,.8))){T.osc=8;add("mente",3);logro("te quedas el tomo frente a sus dueños");return "Dices tres palabras del capítulo que ellos no se atreven a abrir. Se les apagan las linternas. Retroceden sin darte la espalda. «Ya vendrá a buscarte él solo», dice el viejo. No aclara quién."}G.muerteDirecta="unos hombres con abrigo largo que vinieron a recuperar un libro";return {txt:"Empiezas a decir las palabras. Ellos las terminan antes.",mal:1}}},
  {t:"Huir con el tomo",fn:()=>{T.osc=14;add("animo",-8);if(G.indep&&!G.prop){genCasa();G.casa.deQuien=null;genVecinos()}return {txt:"Sales por el patio con el tomo contra el pecho. Cambias de casa esa misma semana y de costumbres para siempre. Saben esperar.",mal:1}}}]}};

/* ---------- La plataforma petrolífera ---------- */
const RIGN=["Perforador","Gruísta","Buzo","Cocinero","Mecánico","Jefe de turno","Médico de a bordo","Soldador"];
function embarcar(primera){const y=G.yo,R_=G.rig;encierro("plataforma",6,{tipo:"un camarote de dos literas",barrio:"la plataforma Aurora-7, a doscientas millas de la costa",deQuien:null},{rig:1});
  if(primera){R_.ids=[];for(let i=0;i<3;i++){const sx_=ch(.8)?"m":"f",p=per("conoc",sx_,ri(24,56),pick(ORI[G.origen].ap),{con:true,rel:ri(15,28),sitio:"de la plataforma",oficio:RIGN[ri(0,RIGN.length-1)].toLowerCase()+(sx_=="f"?"":""),rasgo:ri(0,4)});R_.ids.push(p.id)}}
  R_.n=(R_.n||0)+1;return primera?`El helicóptero te deja en una isla de hierro en mitad del mar. Seis meses aquí, seis en casa. Compartes camarote con ${P(R_.ids[0]).nombre}; ${P(R_.ids[1]).nombre} te enseña dónde no hay que pisar; ${P(R_.ids[2]).nombre} te dice que la primera semana no duerme nadie.`:`Otra vez el helicóptero, el casco, el olor a gasoil y a mar. Seis meses más en la Aurora-7. Ya te sabes el ruido de cada bomba.`}
const tripu=()=>((G.rig||{}).ids||[]).map(viv).filter(Boolean);
function accionesRig(){const y=G.yo,c=G.carcel,L=[],A=(t,fn,cls)=>L.push({t,fn,cls});
  A("Turno doble",()=>{y.dinero+=800;add("cuerpo",1);add("salud",-2);add("animo",-2);return vario("rigT",["Doce horas más con la llave de cadena. Cobras 800 extra y no sientes los brazos.","Doblas turno en la torre. Desde arriba el mar es una chapa negra sin orillas.","Cubres al del turno de noche. Ves amanecer dos veces sin dormir entre medias."])});
  A("Gimnasio de la plataforma",()=>{mover(.08);add("cuerpo",2);add("salud",1);return vario("rigG",["Un contenedor con cuatro máquinas y un saco. Suficiente.","Entrenas con el suelo moviéndose. Aprendes un equilibrio nuevo."])});
  A("Timba en el comedor",()=>{const g=ch(.4+y.mente/300),n=ri(100,500);y.dinero+=g?n:-n;add("animo",g?4:-2);tripu().forEach(p=>rel(p,2));return g?`Póquer con la tripulación. Te levantas con ${n} más y dos enemigos cordiales.`:{txt:`Póquer con la tripulación. Pierdes ${n} y aprendes quién farolea.`,mal:1}});
  A("Llamar a casa por satélite",()=>{y.dinero-=60;const q=G.pareja&&viv(G.pareja);add("animo",4);vivos(p=>p.encasa).forEach(p=>rel(p,3));if(q){q.aten=y.edad-3;rel(q,3);return vario("rigL",[`Veinte minutos de satélite con ${q.nombre}, con dos segundos de retraso en cada frase. Os pisáis, os reís, se corta.`,`${q.nombre} te cuenta el día entero con detalle. No pasa nada en ese día y es lo mejor que has oído en un mes.`,`Llamas a ${q.nombre}. De fondo se oye tu casa: la lavadora, la tele, la vida que sigue sin ti.`])}return "Llamas a casa. Te preguntan si comes bien. Dices que sí y miras la bandeja."});
  A("Pescar desde la pasarela",()=>{add("animo",5);return vario("rigP",["Sacas un atún que casi te saca a ti. El cocinero te hace la ola.","Tres horas con el sedal a sesenta metros. No pica nada. Vuelves descansado.","Un tiburón se lleva el anzuelo, el cebo y medio carrete. Lo cuentas en la cena con los brazos muy abiertos."])});
  A("Curso a distancia",()=>{add("mente",2);pr("estudio",1.5);return vario("rigC",["Estudias en la litera con los tapones puestos. Aquí sobra tiempo si sabes usarlo.","Haces el examen por satélite. Se corta dos veces. Apruebas igual."])});
  tripu().forEach(p=>A("Pasar el rato con "+p.nombre,()=>{rel(p,ri(4,8));add("animo",3);if(p.edad>=216&&y.edad>=216)sube(p,2);return vario("rigX",[`${p.nombre} te enseña a hacer nudos que no se deshacen ni queriendo.`,`Guardia de noche con ${p.nombre}. Os contáis la vida entera entre alarma y alarma.`,`${p.nombre} te enseña fotos de su casa. Lleva once años así, medio año cada vez.`,`${p.nombre} y tú veis la misma película por cuarta vez, porque solo hay seis.`,`${p.nombre} te cuenta la vez que el mar entró hasta la cubierta dos. Luego te dice que duermas tranquilo.`])}));
  A("Dejar pasar el mes",()=>vario("rigN",["Turno, rancho, litera. Turno, rancho, litera.","El mar no cambia y tú tampoco.","Tachas otro mes en el calendario de la taquilla."]),"sec");return L}
function eventoRig(){const y=G.yo,c=G.carcel,l=tripu(),p=l.length?pick(l):null;
  const E=[()=>{add("animo",-3);log("Temporal de tres días. Las olas pasan por encima de la cubierta baja y la plataforma entera canta como un órgano.","mala")},
   ()=>{c.m++;c.tot++;add("animo",-5);log("El helicóptero de relevo no puede despegar por la niebla. Un mes más aquí, y los que iban a salir no hablan con nadie.","mala")},
   ()=>{add("animo",6);log("Una manada de ballenas pasa tan cerca que se para el trabajo. Sesenta tíos con casco apoyados en la barandilla, callados.")},
   ()=>{add("animo",4);log("El cocinero hace una tarta con lo que hay para el cumpleaños de alguien. Sabe a gloria y a gasoil.")},
   ()=>{y.dinero+=600;log("Prima por récord de extracción: 600 por cabeza y una cena con mantel.")},
   ()=>{if(!G.pend){decidir("rigGas",{id:p?p.id:null});log("Suena la alarma de gas en la cubierta tres. No es simulacro: se nota en los ojos.","mala")}},
   ()=>{if(!G.pend&&p){decidir("rigAgua",{id:p.id});log(`¡Hombre al agua! Es ${p.nombre}. Ha resbalado de la pasarela con la mar picada y sin el arnés enganchado.`,"mala")}},
   ()=>{if(!G.pend){decidir("rigCaja",{});log("En el contenedor de suministros hay una caja que no figura en ningún albarán. El de almacén te mira y luego mira la caja.")}}];
  if(p)E.push(()=>{rel(p,6);log(`Novatada: te mandan a por «la llave de apretar olas». ${p.nombre} te avisa a tiempo y os reís de los demás.`)});
  pick(E)()}
DEC.rigGas={man:1,tit:d=>"Fuga de gas en cubierta tres",txt:d=>"",ops:d=>{const y=G.yo,p=d.id&&viv(d.id);return [
  {t:"Ir al punto de reunión, como manda el protocolo",fn:()=>"Chaleco, casco, lista. Los de seguridad cierran la válvula en once minutos. Nadie habla hasta que suena el fin de alarma."+moral("prudente")},
  {t:"Bajar a cerrar la válvula tú",s:"Depende de tu cuerpo y tu cabeza",fn:()=>{if(ch(.3+y.cuerpo/250+y.mente/250)){y.dinero+=1500;add("carisma",3);logro("cierras una fuga de gas en alta mar");tripu().forEach(q=>rel(q,10));return "Bajas aguantando la respiración y giras la rueda con todo el cuerpo. Se para el silbido. Arriba te abrazan sesenta personas que te deben la noche. Hay prima: 1500."+moral("valiente",2)}
    if(ch(.25)){G.muerteDirecta="una fuga de gas en una plataforma, a doscientas millas de cualquier parte";return {txt:"Bajas. La nube es más grande de lo que parecía desde arriba.",mal:1}}add("salud",-20);return {txt:"Bajas y no llegas a la válvula. Te sacan a rastras, con los pulmones ardiendo. Dos semanas de enfermería.",mal:1}}}]}};
DEC.rigAgua={man:1,tit:d=>"Hombre al agua",txt:d=>"",ops:d=>{const y=G.yo,p=viv(d.id);if(!p)return [{t:"Seguir",fn:()=>"Ya lo han sacado."}];return [
  {t:"Tirarle el aro y dar la voz",fn:()=>{if(ch(.75)){rel(p,25);return `El aro cae a un metro. ${p.nombre} se agarra. Lo sube la grúa, azul de frío y vivo. Desde ese día te guarda el mejor sitio del comedor.`}morir(p);return {txt:`El aro cae lejos. La corriente es más rápida que la grúa. Buscáis hasta que anochece.`,mal:1}}},
  {t:"Tirarte detrás",s:"Depende de tu cuerpo",fn:()=>{if(ch(.2+y.cuerpo/140)){rel(p,45);add("carisma",3);logro("le salvas la vida a "+p.nombre+" en mar abierto");return `Saltas con el arnés a medio poner. El agua corta. Llegas, le agarras del mono y no sueltas. Os suben a los dos. ${p.nombre} no dice gracias: te pone su manta.`+moral("valiente",3)}
    if(ch(.3)){G.muerteDirecta="el mar, intentando sacar a un compañero";return {txt:"Saltas. El mar tiene otros planes para los dos.",mal:1}}add("salud",-15);if(ch(.5))morir(p);return {txt:`Saltas y el oleaje te estampa contra un pilar. Te sacan con dos costillas rotas.`+(p.vivo?` A ${p.nombre} lo recoge la lancha.`:` A ${p.nombre} no lo encuentran.`),mal:1}}}]}};
DEC.rigCaja={man:1,tit:d=>"La caja sin albarán",txt:d=>"",ops:d=>{const y=G.yo;return [
  {t:"No has visto nada",fn:()=>"Firmas el albarán de las otras cajas y te vas a cenar. El de almacén te invita al postre durante un mes."},
  {t:"Pedir tu parte",fn:()=>{if(ch(.75)){y.dinero+=2000;return "Dos mil por mirar a otro lado en cada relevo. Dentro de la caja hay cosas que en tierra valen diez veces más."+moral("tramposo",2)}return encarcelar(ri(8,20))}},
  {t:"Dar parte al jefe de plataforma",fn:()=>{tripu().forEach(q=>rel(q,-12));y.dinero+=500;return "Lo cuentas. Bajan a tres en el siguiente helicóptero, esposados. Te dan una gratificación de 500 y nadie se sienta contigo en el comedor."+moral("chivato",2)}}]}};
function finRig(){const y=G.yo,R_=G.rig;finEncierro();R_.vuelve=y.edad+6;const q=G.pareja&&viv(G.pareja);add("animo",12);
  log(`Fin del turno: el helicóptero, la costa, tu calle. Seis meses de tierra firme por delante. ${q?(q.lio?`${q.nombre} te recibe con un abrazo que llega un segundo tarde.`:`${q.nombre} te espera en la puerta. Tardáis en soltaros.`):"La casa huele a cerrado. Abres todas las ventanas."} El suelo se te mueve durante tres días.`)}

/* ---------- La presa ---------- */
function eventosPresa(ev,a){const y=G.yo,T=G.trabajo;G.presa=G.presa||{};const H=G.presa;
  ev(5,"presaA",()=>log(vario("presaA",["Turno de noche en la presa. Recorres las galerías con una linterna y oyes al agua empujar al otro lado del muro.","Con la sequía, el embalse baja y asoma el campanario del pueblo que quedó debajo. Hay quien viene a mirarlo con prismáticos.","Mides filtraciones en la galería cuatro: gota a gota, en un vaso graduado, como hace cincuenta años.","Desde la coronación de la presa se ve el valle entero. En el pueblo de abajo duermen tranquilos porque tú no duermes.","Abren el aliviadero por mantenimiento. El ruido se te queda en el pecho hasta el día siguiente.","Un viejo viene cada domingo a sentarse frente al embalse. Su casa está ahí abajo, dice, a cuarenta metros.","Niebla en el valle. La presa parece flotar. El compañero de turno jura que oye campanas.","Baja el nivel y aparece un camino de piedra que entra recto en el agua. Lo seguís con la vista hasta donde se pierde."])));
  if(!H.grieta&&T.m>=6&&!G.pend)ev(4,"presaG",()=>{H.grieta=1;decidir("presaGrieta",{});log("En la galería baja hay una fisura que no estaba el mes pasado. Cabe una moneda de canto. El ingeniero jefe dice que es «asiento normal» y que no lo apuntes así en el parte.","mala")});
  if(!H.crecida&&T.m>=10&&!G.pend)ev(3,"presaC",()=>{H.crecida=1;decidir("presaCrecida",{});log("Tres días lloviendo río arriba. El embalse sube un palmo por hora. La central ordena aguantar sin abrir: aguas abajo hay un festival con diez mil personas en la ribera.","mala")});
  if(!H.pueblo&&T.m>=4&&!G.pend)ev(3,"presaP",()=>{H.pueblo=1;decidir("presaPueblo",{});log("Sequía histórica. El pueblo viejo ha salido entero del agua: calles, la plaza, la iglesia sin tejado. Se puede bajar andando por el barro.")})}
DEC.presaGrieta={man:1,tit:d=>"La fisura de la galería baja",txt:d=>"",ops:d=>{const y=G.yo;return [
  {t:"Apuntarlo tal cual en el parte",fn:()=>{if(ch(.5)){add("carisma",2);logro("tu parte obliga a reparar la presa a tiempo");return "Lo escribes con medidas y fotos. Llega una inspección de fuera. Vacían medio embalse y sellan la galería. El ingeniero jefe pide el traslado sin despedirse."+moral("valiente",2)}G.trabajo=null;eco("presaRompe",ri(10,30),{yo:0});return {txt:"Lo escribes tal cual. A los quince días te despiden «por reestructuración». El parte desaparece del archivador.",mal:1}}},
  {t:"Apuntar «asiento normal», como te han dicho",fn:()=>{eco("presaRompe",ri(8,30),{yo:1});G.yo.dinero+=400;return "Escribes lo que te dictan. Ese mes hay un plus en la nómina que nadie explica. Cada vez que pasas por la galería baja, miras al suelo."+moral("tramposo",2)}},
  {t:"Mandar una copia anónima a la confederación",fn:()=>{if(ch(.6))return "Metes las fotos en un sobre sin remite. Tres meses después aparecen unos técnicos que no conoce nadie. Reparan en silencio. Nunca se sabrá quién avisó.";eco("presaRompe",ri(12,30),{yo:0});return "Mandas el sobre. No pasa nada. Quizá se perdió, quizá alguien lo abrió y lo guardó."}}]}};
ECO.presaRompe=d=>{if(ch(.45))return null;const y=G.yo,v=vivos(p=>p.con&&!p.lejos&&(p.rol=="vec"||p.rol=="conoc")).slice(0,ri(1,3));v.forEach(p=>{p.vivo=false;p.casa=false;p.anoM=ano();p.mesM=mes()});add("animo",-20);titular("La presa","El valle, una mañana");
  if(G.trabajo&&G.trabajo.presa)G.trabajo=null;let s="A las seis de la mañana cede la galería baja. El agua tarda nueve minutos en llegar al pueblo. "+(v.length?"Entre los que no salen a tiempo: "+v.map(p=>p.nombre+" "+p.apellido).join(", ")+". ":"");
  if(d.yo&&ch(.6)){const x=encarcelar(ri(24,72));return {txt:s+"En el último parte de inspección, donde pone «asiento normal», está tu firma. "+x.txt,mal:1}}return {txt:s+(d.yo?"Tu firma está en el parte, pero cargan con todo los de arriba. Tú cargas con lo otro.":"Tú avisaste. Nadie lo recordará así."),mal:1}};
DEC.presaCrecida={man:1,tit:d=>"El embalse al límite",txt:d=>"",ops:d=>{const y=G.yo;return [

/* ================= AMPLIACIÓN 13: temporadas en una comunidad del campo — la comuna del Valle Alto o la Hermandad de la Luna Negra (solo adultos; todo lo íntimo es aceptado y se da a entender) ================= */
const CULTOS={sol:{n:"la comuna del Valle Alto",casa:"una cabaña de adobe compartida",guia:["el Abuelo","la Abuela"],d:"Huerta, cantos al amanecer, hogueras y pocas preguntas"},
 luna:{n:"la Hermandad de la Luna Negra",casa:"una casa de piedra en una aldea abandonada",guia:["el Maestre","la Maestra"],d:"Una aldea sin luz, máscaras de cuerno y gente que de noche no es del todo gente"}};

function cultoEntrar(k,conPareja){const y=G.yo,C=CULTOS[k],q=conPareja&&G.pareja&&viv(G.pareja),m=ri(4,7),ids=[];

  G.carcel.cu.ids=ids;if(q)q.cuAqui=1;G.fl.cultos=(G.fl.cultos||0)+1;logro("pasas una temporada en "+C.n);
  const X=P(ids[0]);return k=="sol"?`Un camino de tierra, una verja sin candado y un cartel pintado a mano: «Aquí no hay relojes». ${C.n[0].toUpperCase()+C.n.slice(1)}: cuarenta adultos, ninguna criatura —es norma de la casa—, una huerta enorme y ${g.nombre}, ${g.oficio.split(" de ")[0]}, que te abraza antes de saber tu nombre. ${q?`${q.nombre} y tú dejáis las mochilas en una cabaña de adobe.`:"Te dan un jergón en una cabaña de adobe."} ${X.nombre}, ${fisCorto(X)}, te enseña dónde está el agua y se queda un rato de más.`
   :`La carretera se acaba y hay que seguir a pie hasta una aldea que no sale en los mapas. No hay luz eléctrica. Todos son adultos y todos han venido por su pie. ${q?"Os":"Te"} recibe ${g.nombre}, ${g.oficio.split(" de ")[0]}, con una máscara de cuerno colgada del cinto. «Aquí se entra libre. De salir ya hablaremos.» ${q?`${q.nombre} te aprieta la mano.`:""} ${X.nombre}, ${fisCorto(X)}, te mira desde un portal como quien huele algo.`}
function cultoSalir(como){const c=finEncierro(),K=c.cu,C=CULTOS[K.k],y=G.yo,q=K.par&&viv(K.par);if(q)q.cuAqui=0;const l=(K.ids||[]).map(viv).filter(Boolean);l.forEach(p=>{if(!p.amante&&p.id!=G.pareja&&p.rel<50)p.lejos=true});const g=viv(K.g);if(g)g.lejos=true;

function accionesCulto(){const y=G.yo,c=G.carcel,K=c.cu,C=CULTOS[K.k],L=[],A=(t,fn,cls)=>L.push({t,fn,cls}),sol=K.k=="sol",q=K.par&&viv(K.par),g=viv(K.g);

  if(g)A("Hablar con "+g.nombre,()=>{rel(g,5);K.conf+=4;add("mente",1);return sol?vario("cuG",[`${g.nombre} te pregunta de qué huyes. No vale decir que de nada.`,`${g.nombre} te cuenta cómo empezó esto, con seis amigos y una furgoneta. Faltan dos, y no dice por qué.`,`${g.nombre} te pide un «donativo consciente». Lo dice con tanta paz que cuesta notar que es dinero.`]):vario("cuG2",[`${g.nombre} te explica qué se celebra en la luna negra: lo que el pueblo de abajo quemó hace tres siglos y no acabó de arder.`,`${g.nombre} te enseña las máscaras. Cada una tiene dueño, y la tuya todavía está sin tallar.`,`«Aquí hay hermanos que cambian con la luna», dice ${g.nombre}. «No preguntes cuáles. Lo sabrás por el olor.»`])});
  cuGente().forEach(p=>{const ad=p.edad>=216&&y.edad>=216;A((p.amante?"Pasar la noche con ":"Acercarte a ")+p.nombre,()=>{rel(p,ri(4,8));add("animo",3);if(p.amante)return encuentro(p,"tranquilo",true);sube(p,5);

      return sol?vario("cuX",[`${p.nombre} te enseña a trenzar mimbre. Tiene las manos seguras y tarda en soltar las tuyas.`,`Os bañáis en la poza ${p.nombre} y tú, con media comuna alrededor. Te mira por encima del agua.`,`${p.nombre} te cuenta la vida que dejó: un despacho, una hipoteca, un nombre que ya no usa.`,`Compartís guardia de hoguera. ${p.nombre} te tapa con su manta sin preguntar.`]):vario("cuX2",[`${p.nombre} te enseña a andar por el monte sin hacer ruido. Lo hace demasiado bien.`,`${p.nombre} te huele el pelo al pasar, sin disimulo, y sonríe con todos los dientes.`,`${p.nombre} te cuenta que llegó hace siete inviernos «por una noche». Se ríe de su propia frase.`,`Tallas tu máscara con ${p.nombre} al lado, corrigiéndote el pulso.`])})});
  if(q)A("Pasar la noche con "+q.nombre,()=>{rel(q,5);q.aten=y.edad;return encuentro(q,"tranquilo",true)});

  A("Dejar pasar el mes",()=>vario("cuN",sol?["Un mes sin espejo. Te lo notas en la cara al tocarla.","Lluvia, sopa de verdura y partidas de damas con chapas.","Pierdes la cuenta de los días a propósito."]:["Niebla en la aldea durante semanas. De noche se oyen carreras por los tejados.","Aprendes los nombres de dentro de todos. Los de fuera ya no importan.","Un mes sin ver un coche ni oír una radio."]),"sec");return L}
function menuRito(){const y=G.yo,c=G.carcel,K=c.cu,sol=K.k=="sol",q=K.par&&viv(K.par),gu=viv(K.g),virgen=G.fl.virgen!==false,mujer=y.sexo=="f",ops=[],H=(t,s,fn)=>ops.push({t,s,fn:()=>hacer(()=>{K.rito=c.m-1;return fn()})});

      logro(sol?"presides la noche de las hogueras":"presides la luna negra");
      return (sol?(mujer&&virgen?`Te visten de blanco y te coronan de flores entre todas. Cuarenta personas cantan en círculo, de espaldas, alrededor de una tienda de lino donde solo entráis ${p.nombre} y tú. Nadie mira y todos saben. Es tu noche: se hace lo que tú quieres, al ritmo que tú quieres.`:`Te ponen la corona de espigas y abres el baile. A medianoche la comuna entera os acompaña hasta la tienda de lino, cantando, y se da la vuelta. Dentro solo estáis ${p.nombre} y tú, y fuera el canto dura hasta el alba.`)
        :(mujer&&virgen?`Te ponen un manto negro y una diadema de plata vieja. El círculo de máscaras se abre para ti y se cierra detrás, de espaldas. En el centro, junto al fuego, solo ${p.nombre}, sin máscara, esperando a que seas tú quien dé el paso. ${gu?gu.nombre:"Alguien"} pronuncia tu nombre de dentro por primera vez. La noche es tuya; lo que pasa en ella lo decides tú.`:`Te calan la máscara grande, la de cuernos, que pesa como una promesa. El círculo canta de espaldas mientras ${p.nombre} y tú cumplís el rito junto al fuego. Cuando acaba, la Hermandad entera se arrodilla. Te notas distinto: más fuerte, más despierto, un poco menos tuyo.`.replace("distinto",g("distinto","distinta")).replace("despierto",g("despierto","despierta"))))+primeraVez(p)+(q&&p.id!=q.id?` ${q.nombre} lo ha visto todo desde el círculo.`:"")})})))});
  H(sol?"Entrar en el círculo":"Ponerte la máscara y entrar",sol?"Lo que pasa en el prado no tiene nombres ni dueños":"Nadie sabe quién es quién, y de eso se trata",()=>{K.conf+=5;add("animo",7);G.fl.rito=(G.fl.rito||0)+1;const era=G.fl.virgen!==false;G.fl.virgen=false;if(q)rel(q,q.cuAqui&&infidelidad(q)>=1?4:-12);if(!sol&&G.tomo)G.tomo.osc+=1;
    return (sol?vario("ritoS",["Tambores, vino con hierbas y cuarenta cuerpos al calor de las hogueras. Dejas la ropa en la linde y los apellidos también. No sabrías decir con cuántos ni con quién. Amaneces en la hierba, tapado con una manta que no es tuya.".replace("tapado",g("tapado","tapada")),"Empieza como un baile y a medianoche ya no lo es. Nadie te pide nada que no ofrezcas. Hay manos, risas, silencios. Cuando sale el sol, alguien reparte café como si nada."]):vario("ritoL",["Máscaras, antorchas y un canto que no se corta en toda la noche. Dentro del círculo nadie tiene cara ni nombre. Sales al alba con arañazos que no duelen y un vacío en la memoria de varias horas.","La hoguera se apaga y sigue todo a oscuras. Hay más cuerpos que máscaras, y algunos no tienen tacto de persona. No preguntas. Amaneces en el pajar, envuelto en una piel de animal.".replace("envuelto",g("envuelto","envuelta"))]))+(era?" Así ha sido tu primera vez: sin un nombre que recordar.":"")+(q?(q.cuAqui&&infidelidad(q)>=1?` ${q.nombre} también entró. Os buscáis por la mañana y os reís, un poco avergonzados.`:` ${q.nombre} se quedó fuera del círculo. Por la mañana no te mira.`):"")});
  if(q)H(sol?"El rito de los lazos, en pareja":"El juramento de sangre, en pareja",sol?"Os atan las muñecas con una cinta hasta el alba":"Os atan con una cuerda negra y os dejan solos en el círculo",()=>{K.conf+=6;rel(q,12);q.pas=clamp((q.pas||0)+18);q.aten=y.edad;q.deriva=0;add("animo",8);gustos(q);
