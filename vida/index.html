<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toda una Vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800&family=Metamorphous&display=swap" rel="stylesheet">
<style>
:root{
  /* Página de revista japonesa de 1998: papel crema, panel nocturno, cajas lila con capitular blanca, titulares caqui */
  --papel:#efe9d8; --noche:#131129; --noche2:#2b2560; --lila:#aaa6e0; --tinta:#1a1740;
  --caqui:#d2d291; --oro:#dbb84c; --blanco:#ffffff; --rojo:#e0605a;
  --f-titular:"Dela Gothic One","Hiragino Kaku Gothic ProN","Arial Black",sans-serif;
  --f-cuerpo:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Trebuchet MS",sans-serif;
  --f-logo:"Metamorphous","Palatino Linotype",Georgia,serif;
  --f-presenta:"Cormorant Garamond",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--papel);font-family:var(--f-cuerpo);font-weight:800;color:var(--blanco);padding:8px;overflow:hidden}
#pagina{height:100%;max-width:640px;margin:0 auto;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;
  background:
   radial-gradient(120% 60% at 85% 0%,rgba(120,105,200,.55),transparent 60%),
   linear-gradient(180deg,#3a3378 0%,var(--noche2) 22%,var(--noche) 70%,#0b0a1a 100%);}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--oro);outline-offset:2px}

/* Cabecera */
.cab{padding:10px 16px 8px;flex:none;position:relative}
.presenta{font-family:var(--f-presenta);font-style:italic;font-size:17px;letter-spacing:.5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.presenta b{font-family:var(--f-titular);font-style:normal;font-weight:400;font-size:11px;background:#5a4fb0;padding:2px 8px;white-space:nowrap}
.logo{font-family:var(--f-logo);font-size:34px;line-height:1.05;letter-spacing:1px;
  background:linear-gradient(180deg,#fff3b8 0%,var(--oro) 45%,#8a6a1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.kanji{font-family:var(--f-titular);color:var(--caqui);font-size:22px;letter-spacing:2px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kanji small{font-family:var(--f-cuerpo);font-size:10px;color:var(--blanco);letter-spacing:0}
.ficha{border-top:2px solid var(--blanco);border-bottom:2px solid var(--blanco);margin-top:6px;padding:3px 0;font-size:13px;display:flex;flex-wrap:wrap;gap:2px 14px}
.ficha span::before{content:"●"}
.compacta .logo,.compacta .kanji,.compacta .presenta{display:none}
.compacta .ficha{margin-top:0}
.logo{margin-top:6px}

/* Tabla de estadísticas, como la encuesta de la revista */
.stats{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--blanco);margin-top:6px;font-variant-numeric:tabular-nums}
.stats div{border-right:1px solid var(--blanco);text-align:center;padding:2px 0 3px;font-size:9.5px;position:relative;overflow:hidden}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--f-titular);font-weight:400;font-size:17px;color:var(--caqui);line-height:1.1}
.stats i{position:absolute;left:0;bottom:0;height:3px;background:var(--lila)}
.stats .mal b{color:var(--rojo)} .stats .mal i{background:var(--rojo)}

.tabs{display:flex;gap:6px;padding:0 16px;flex:none}
.tabs button{flex:1;font-family:var(--f-titular);font-size:12px;padding:6px 0;border:1px solid var(--blanco);border-bottom:0;border-radius:10px 10px 0 0;color:var(--blanco);opacity:.6}

.tabs button.mini{flex:none;width:42px;opacity:1;font-size:15px}
.tabs button.on{background:var(--lila);color:var(--tinta);opacity:1;border-color:var(--lila)}

#vista{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--lila);min-height:0}
.caja{background:var(--lila);color:var(--tinta);border-radius:16px;padding:10px 14px;font-size:14.5px;line-height:1.45;flex:none}
.caja p::first-letter{font-family:var(--f-titular);font-size:2.3em;float:left;line-height:.9;padding:2px 5px 0 0;color:var(--blanco);text-shadow:0 1px 0 rgba(26,23,64,.35)}
.caja em{font-style:normal;white-space:nowrap}
.caja.mala{background:#8f8ab8}
.caja.clave{background:#1b1840;color:var(--oro);border:1.5px solid var(--oro)}
.caja.clave p::first-letter{color:#fff3b8;text-shadow:none}
.vieja{filter:brightness(.7) saturate(.85)}
.tit.vieja{opacity:.75}
.caja.fin{background:var(--tinta);color:var(--blanco);border:2px solid var(--oro)}
.caja.fin p::first-letter{color:var(--oro)}
.tit{font-family:var(--f-titular);color:var(--caqui);font-size:19px;line-height:1.2;margin-top:6px;text-wrap:balance;flex:none;-webkit-text-stroke:.4px #000}
.tit small{display:block;font-family:var(--f-cuerpo);font-size:11px;color:var(--blanco);-webkit-text-stroke:0}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;flex:none}
th,td{border:1px solid var(--blanco);padding:4px 6px;text-align:left}
th{font-family:var(--f-titular);font-weight:400;color:var(--caqui);font-size:11px}
td.n{text-align:right;white-space:nowrap}
.ficha{margin-bottom:10px;font-size:13px}.ficha td{padding:5px 6px;border-bottom:1px solid rgba(128,128,128,.25);vertical-align:top;text-align:left}.ficha td:first-child{opacity:.7;width:36%}
.ficha td.fsec{opacity:1;font-weight:700;color:var(--oro);padding-top:12px;border-bottom:1px solid var(--oro)}.ficha td.fno{opacity:.6;font-style:italic}
.muerto td{opacity:.5}
.nota{font-size:12px;line-height:1.4;font-weight:700}

/* Acciones */
#acc{flex:none;max-height:38%;overflow-y:auto;padding:8px 16px 12px;border-top:2px solid var(--blanco);background:rgba(8,7,22,.6);display:grid;grid-template-columns:1fr 1fr;gap:6px}
#acc button{background:var(--caqui);color:var(--tinta);border-radius:10px;padding:9px 8px;font-size:13px;line-height:1.15;min-height:40px}
#acc button:active{transform:translateY(1px);filter:brightness(.9)}
#acc button.sec{background:transparent;color:var(--blanco);border:1px solid var(--blanco)}
#acc button.riesgo{background:#b9605c;color:#fff}
#acc button.ancho{grid-column:1/-1}

/* Creación */
#crear{flex:1;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--blanco);border-radius:999px;padding:7px 12px;font-size:13px;max-width:100%;text-align:left}
.chips button.on{background:var(--lila);color:var(--tinta);border-color:var(--lila)}
#nombre{font:inherit;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--blanco);background:rgba(255,255,255,.08);color:var(--blanco)}
.gordo{font-family:var(--f-titular);background:linear-gradient(180deg,#fff3b8,var(--oro));color:var(--tinta);border-radius:12px;padding:12px;font-size:18px;letter-spacing:2px}
.intro{font-size:13.5px;line-height:1.5}

/* Hoja de elección */
#hoja{position:fixed;inset:0;background:rgba(5,4,15,.72);display:none;align-items:flex-end;justify-content:center;padding:8px;z-index:5}
#hoja.on{display:flex}
#hoja>div{width:100%;max-width:624px;max-height:80%;overflow-y:auto;background:var(--noche2);border:2px solid var(--lila);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
#hoja h2{font-family:var(--f-titular);font-weight:400;color:var(--caqui);font-size:16px;margin-bottom:4px}
#hoja button{text-align:left;background:var(--lila);color:var(--tinta);border-radius:10px;padding:10px 12px;font-size:14px}
#hoja button small{display:block;font-size:11px;opacity:.8}
#hoja h2.conF{display:flex;align-items:flex-start;gap:8px}#hoja h2.conF span{flex:1}
#hoja button.fic{flex:none;display:flex;align-items:center;gap:5px;background:var(--caqui);color:var(--tinta);border-radius:999px;padding:6px 11px;font-size:11px;font-family:inherit}
#hoja button.fic svg{width:16px;height:16px;display:block}
.arbol{font-size:13px;line-height:1.35}.arbol .gen{color:var(--oro);font-weight:700;border-bottom:1px solid var(--oro);margin:12px 0 4px;padding-bottom:2px}.arbol .gen:first-child{margin-top:0}
.arbol .sub{opacity:.7;font-size:11px;margin:6px 0 2px;text-transform:uppercase;letter-spacing:1px}
.arbol .nodo{padding:6px 4px;border-bottom:1px solid rgba(128,128,128,.22);cursor:pointer}.arbol .nodo.m{opacity:.55}.arbol .nodo.nc{font-style:italic;cursor:default}.arbol .nodo.yo{color:var(--oro);cursor:default}
.arbolB{display:block;width:100%;background:var(--caqui);color:var(--tinta);border-radius:10px;padding:9px 8px;font-size:13px;margin-bottom:8px}
#hoja button.sec{background:transparent;color:var(--blanco);border:1px solid var(--blanco);text-align:center}
.copy{font-size:9px;font-weight:700;color:#5d5848;text-align:left;padding:2px 12px 0;flex:none;display:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none}}
</style>
</head>
<body>
<div id="pagina">
  <header class="cab" id="cab">

</div>

<script>
"use strict";
/* ============ Utilidades ============ */

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============ Datos ============ */

/* ============ Estado ============ */
let G=null, TAB="diario";
const CLAVE="toda-una-vida-v1";
function guardar(){try{localStorage.setItem(CLAVE,JSON.stringify(G))}catch(e){}}
function cargar(){try{const s=localStorage.getItem(CLAVE);if(s)G=JSON.parse(s);if(G&&G.yo&&G.gente)G.gente.forEach(p=>{
  if(p.vivo&&p.edad>=216&&p.edad<27*12&&(p.inf||0)>=10&&p.rel>=55&&!p.casado&&!p.ex&&!p.pv&&p.virgen===false){if(p.cama){p.pv=1;if(G.amor)G.amor.pv=(G.amor.pv||0)+1}else p.virgen=null}if(p.crianza&&!p.astra&&Math.abs(G.yo.edad-p.edad)<=60)p.crianza=false})}catch(e){G=null}
  if(G&&!G.v2){G.gente.forEach(p=>p.con=true);G.v2=1}
  if(G&&G.yo.aspecto==null)G.yo.aspecto=35;
  if(G&&G.yo.altAdulta==null)genCuerpo();
  if(G&&(G.titulo||G.uni)&&!G.carrera)G.carrera="economia"}
function borrar(){try{localStorage.removeItem(CLAVE)}catch(e){}}

const yo=()=>G.yo, anios=()=>Math.floor(G.yo.edad/12);
const g=(m,f)=>G.yo.sexo=="m"?m:f;
const gp=(p,m,f)=>p.sexo=="m"?m:f;
const P=id=>G.gente.find(p=>p.id==id);
const vivos=f=>G.gente.filter(p=>p.vivo&&(!f||f(p)));
/* ---- Altura y peso ---- */
const CREC=[[0,.29],[1,.43],[2,.5],[4,.585],[6,.66],[8,.73],[10,.79],[12,.86],[14,.93],[16,.98],[18,1]];
function genCuerpo(){
  const y=G.yo,pa=ri(162,190),ma=ri(150,175);
  y.altAdulta=Math.round((pa+ma+(y.sexo=="m"?13:-13))/2+ri(-6,6));y.altMod=0;y.imcD=ri(-10,20)/10;
  if(ch(.06)){y.altAdulta=y.sexo=="m"?ri(198,215):ri(185,200);y.genAlto=1} // genética de gigantes
}
function altura(){ // cm
  const y=G.yo,a=y.edad/12;let f=1;
  for(let i=1;i<CREC.length;i++)if(a<CREC[i][0]){const p=CREC[i-1],q=CREC[i];f=p[1]+(q[1]-p[1])*(a-p[0])/(q[0]-p[0]);break}
  return Math.min(215,y.altAdulta+y.altMod)*f;
}
function imcBase(){const a=G.yo.edad/12;return a<1?14+3*a:a<6?17-.3*(a-1):a<18?15.5+(a-6)*.5:a<50?21.5+(a-18)*.06:23.4}
function imc(){const h=altura()/100;return Math.min(imcBase()+G.yo.imcD,G.yo.edad>=216?200/(h*h):99)} // tope: 200 kg
function peso(){const h=altura()/100;return imc()*h*h}
function altTxt(){const h=altura();return h<100?Math.round(h)+" cm":(h/100).toFixed(2).replace(".",",")+" m"}
function pesoTxt(){const p=peso();return (p<10?p.toFixed(1).replace(".",","):Math.round(p))+" kg"}
function complexion(){const d=G.yo.imcD;return d<-3.5?"en los huesos":d<-1.5?g("delgado","delgada"):d<3?"peso normal":d<6?"algo de barriga":d<10?"sobrepeso":d<18?"obesidad":"obesidad mórbida"}
function mover(n){const y=G.yo;if(y.edad<216)y.altMod=Math.min(3,y.altMod+.03);y.imcD=Math.max(-4,y.imcD-(n||.06))}
function etapa(){const a=G.yo.edad/12;return a<2?"bebé":a<6?"infancia":a<12?"niñez":a<18?"adolescencia":a<65?"edad adulta":"vejez"}
function edadTxt(m){const a=Math.floor(m/12);return a<1?m+(m==1?" mes":" meses"):a+(a==1?" año":" años")}
function add(k,v){const y=G.yo;if(v>0)v*=multRasgo(k);y[k]=clamp(y[k]+v)}

function mort(m){const a=m/12;return a<1?.004:a<40?.001:a<60?.005:a<70?.015:a<80?.045:a<90?.12:.3}

function morir(p){

function multRasgo(k){const m=MULT[k];return (m&&tiene(m[0])?m[1]:1)*(k=="cuerpo"&&tiene("disciplinado")?1.1:1)}
function trazoTxt(k){return TRAZOS[k][G.yo.sexo=="m"?0:1]}
function rasgosTxt(){return (G.rasgos||[]).map(trazoTxt).join(", ")}
function cuenta(t){G.cn=G.cn||{};G.cn[t]=(G.cn[t]||0)+1}
function ponRasgo(k){G.rasgos=G.rasgos||[];if(G.rasgos.includes(k))return false;const o=OPUESTO[k];if(o)G.rasgos=G.rasgos.filter(x=>x!=o);G.rasgos.push(k);if(G.rasgos.length>5)G.rasgos.shift();return true}
function moral(k,n){ // las decisiones van dejando fama
  n=n||1;G.mor=G.mor||{};G.mor[k]=(G.mor[k]||0)+n;const o=OPUESTO[k];if(o)G.mor[o]=(G.mor[o]||0)-n;
  if(G.mor[k]>=2&&ponRasgo(k))return ` Se te va quedando fama de ${trazoTxt(k)}.`;return "";
}
function rasgosInfancia(){
  const c=G.cn||{},n=k=>c[k]||0,am=vivos(p=>p.con&&["vec","comp","conoc"].includes(p.rol)&&p.rel>=50).length;
  const s={travieso:n("Hacer una trastada")*1.5,estudioso:n("Estudiar")+n("Leer y curiosear")*.7,inquieto:n("Hacer deporte")+n("Correr y trepar"),sociable:n("Jugar en la calle")+am*3,
    responsable:n("Ayudar en casa")*1.5,sonador:n("Jugar a tu aire")+n("Dibujar")+n("Preguntar por qué")*.5,solitario:am==0?9:0};
  let l=Object.keys(s).filter(k=>s[k]>=6).sort((p,q)=>s[q]-s[p]).slice(0,2);
  if(l.includes("solitario")&&l.includes("sociable"))l=l.filter(k=>k!="solitario");
  if(!l.length)l=[G.yo.mente>=G.yo.cuerpo?"sonador":"inquieto"];
  l.forEach(ponRasgo);G.cn12=Object.assign({},c);
  log(`Con doce años ya se te ve el carácter: eres ${l.map(trazoTxt).join(" y ")}. Eso abre unas puertas y entorna otras.`);
}
function rasgosJuventud(){
  const c=G.cn||{},b=G.cn12||{},n=k=>(c[k]||0)-(b[k]||0);
  const s={rebelde:n("Saltarte clases")*1.5+n("Beber en el parque")*.7+(G.fl.fuma?3:0),disciplinado:n("Estudiar")*.5+n("Hacer deporte")*.5,presumido:n("Cuidar tu aspecto"),trabajador:n("Trabajillo de verano")*3};
  if(s.rebelde>=9)s.disciplinado=0;
  const k=Object.keys(s).filter(x=>s[x]>=(x=="rebelde"?9:5)).sort((p,q)=>s[q]-s[p])[0];
  if(k&&ponRasgo(k))log(`A los dieciocho el carácter termina de cuajar: además, ${trazoTxt(k)}.`);
}

function tickEcos(){
  if(!G.ecos||!G.ecos.length)return;const y=G.yo,due=G.ecos.filter(e=>e.en<=y.edad);if(!due.length)return;
  G.ecos=G.ecos.filter(e=>e.en>y.edad);
  due.forEach(e=>{const f=ECO[e.k];if(!f)return;const r=f(e.d);if(typeof r=="string")log(r);else if(r&&r.txt)log(r.txt,r.mal?"mala":"")});
}

/* ---- Hijos y nietos ---- */
const CARH=[["aplicado","aplicada"],["rebelde","rebelde"],["sensible","sensible"],["independiente","independiente"]];
function hijoIni(h){if(h.rumbo==null){h.rumbo=ri(35,65);h.car=ri(0,3)}return h}

  if(e>=13&&e<18&&q.casa)ev(2,"hijoadol",()=>{rel(q,ri(-4,3));log(vario("hijoadol",[`${q.nombre} te contesta con monosílabos durante un mes entero. Uno de ellos es «vale».`,`${q.nombre} te dice que no entiendes nada. Lo peor es que te acuerdas de haberlo dicho tú.`,`Descubres que ${q.nombre} tiene una vida entera de la que no sabes nada. Es lo normal. Duele igual.`,`${q.nombre} te pide que le dejes a dos calles del instituto, no en la puerta.`,`Una tarde, sin venir a cuento, ${q.nombre} se sienta a tu lado en el sofá y ve la tele contigo. No dices nada, por no romperlo.`]))});
  if(e>=18&&!q.salida)ev(4,"hijosalida"+q.id,()=>{q.salida=1;const r=q.rumbo;
    if(r>=65){add("animo",8);log(`${q.nombre} entra en la universidad. Le ayudas con la matrícula y con las cajas. Vuelves a casa presumiendo sin disimulo.`)}
    else if(r>=40){add("animo",3);log(`${q.nombre} encuentra su primer trabajo. Te enseña la nómina como si fuera un diploma.`)}
    else if(r>=25){add("animo",-4);log(`${q.nombre} deja los estudios y encadena trabajos de un mes. «Ya veré», dice a todo.`,"mala")}
    else{add("animo",-8);y.dinero-=Math.min(Math.max(0,y.dinero),600);log(`Te llaman de comisaría de madrugada: ${q.nombre}. Pagas lo que hay que pagar y volvéis a casa en un taxi, sin hablar.`,"mala")}},1);
  if(e>=24&&!q.conyuge&&q.rumbo>=30)ev(2,"hijoboda"+q.id,()=>{const sc=ch(.9)?(q.sexo=="m"?"f":"m"):q.sexo,c2=per("conoc",sc,e+ri(-4,5),pick(ORI[G.origen].ap),{con:true,rel:ri(30,50),de:q.id,casado:true,oficio:gp({sexo:sc},"tu yerno","tu nuera")});q.conyuge=c2.id;q.casa=false;
    const n=Math.min(Math.max(0,y.dinero),ri(5,30)*100);y.dinero-=n;add("animo",8);log(`Se casa ${q.nombre}, con ${c2.nombre}. Lloras en el discurso, bailas fatal y pones ${n} para el banquete.`)},1);

    if(!G.fl.abu){G.fl.abu=1;logro("nace tu primer nieto, "+n.nombre)}log(`${q.nombre} te hace ${g("abuelo","abuela")}: nace ${n.nombre}. Cabe en un antebrazo y ya manda en toda la familia.`)});

  const nt=vivos(p=>p.rol=="nieto"&&p.edad>=24&&p.edad<14*12);

}

/* ---- Dinero: casa, coche, negocio, ruina ---- */
const PRECIO=[45000,70000,110000,180000,350000];
const NEGOCIOS=[["un bar",15000,"carisma"],["una tienda de barrio",12000,"carisma"],["un taller",20000,"cuerpo"],["una academia",10000,"mente"],["una tienda por internet",6000,"mente"],["un restaurante",40000,"carisma"]];
function patrimonio(){const y=G.yo;return Math.round(y.dinero+(G.prop?G.prop.v-G.prop.deuda:0)+(G.neg?G.neg.inv*G.neg.sal/60:0)+(G.coche?G.coche.v:0))}

  if(G.indep&&!G.prop){const v=PRECIO[G.riqueza],en=Math.round(v*.2),cu=Math.round(v*.8*1.35/300);
    H("Comprar una casa",y.dinero>=en?`Entrada de ${en} · hipoteca de ${cu} al mes, 25 años`:`Te falta para la entrada: ${en}`,()=>{y.dinero-=en;G.prop={v,deuda:Math.round(v*.8*1.35),cuota:cu};add("animo",8);logro("compras tu casa");
      return `Firmas la hipoteca con un bolígrafo atado a una cadenita. ${G.casa.tipo.charAt(0).toUpperCase()+G.casa.tipo.slice(1)} es tuya, y del banco, durante veinticinco años.`},y.dinero>=en)}
  if(G.prop)H("Vender la casa",`Vale ${G.prop.v}`+(G.prop.deuda>0?` · debes ${Math.round(G.prop.deuda)}`:" · pagada"),()=>{const n=Math.round(G.prop.v-G.prop.deuda);y.dinero+=n;G.prop=null;return `Vendes la casa. Después de cancelar con el banco te quedan ${n}. Vuelves a pagar alquiler.`});
  if(!G.coche){H("Comprar un coche de segunda mano",y.dinero>=3000?"3000 · 50 al mes de gastos":"Te faltan 3000",()=>{y.dinero-=3000;G.coche={n:"un coche con muchos kilómetros",v:2500};add("animo",4);return "Compras un coche con muchos kilómetros y un ambientador de pino. Arranca a la segunda. Es tuyo."},y.dinero>=3000);
    H("Comprar un coche nuevo",y.dinero>=18000?"18000 · se nota al llegar":"Te faltan 18000",()=>{y.dinero-=18000;G.coche={n:"un coche nuevo",v:15000,bueno:1};add("animo",8);add("aspecto",3);return "Sales del concesionario oliendo a nuevo. Das una vuelta de más por el barrio, despacio, con la ventanilla bajada."},y.dinero>=18000)}
  else H("Vender el coche","Te dan "+Math.round(G.coche.v*.8),()=>{y.dinero+=Math.round(G.coche.v*.8);if(G.coche.bueno)add("aspecto",-3);G.coche=null;return "Vendes el coche. Redescubres el autobús y sus horarios."});
  if(!G.neg&&a>=22)ops.push({t:"Montar un negocio",s:"Puede hacerte rico o hundirte",fn:()=>abrirHoja("¿Qué montas?",NEGOCIOS.map(n=>({t:n[0].charAt(0).toUpperCase()+n[0].slice(1),s:y.dinero>=n[1]?`${n[1]} de inversión · cuenta: ${n[2]}`:`Te faltan ${n[1]}`,fn:y.dinero>=n[1]?()=>hacer(()=>{y.dinero-=n[1];G.neg={n:n[0],inv:n[1],st:n[2],sal:50,m:0,ac:0,ded:3};add("animo",8);logro("abres "+n[0]);return `Abres ${n[0]}. El primer día vienen tus conocidos, y al segundo, nadie. Así empieza todo.`}):()=>{}})))});
  if(G.neg){H("Volcarte en el negocio","Tres meses de empujón · agota",()=>{G.neg.ded=3;add("animo",-3);add("salud",-1);return vario("negded",["Abres antes, cierras después y haces tú las cuentas de madrugada.","Cambias la carta, el rótulo y hasta la música. Algo se mueve.","Te pateas la zona repartiendo tarjetas. Dos clientes nuevos, que ya es algo.","Un mes sin un solo día libre. El negocio lo nota. Tú también."])});
    H("Vender el negocio","Te ofrecen "+Math.round(G.neg.inv*G.neg.sal/60),()=>{const n=Math.round(G.neg.inv*G.neg.sal/60);y.dinero+=n;const nn=G.neg.n;G.neg=null;return `Traspasas ${nn} por ${n}. El último día echas tú la persiana.`})}
  if(G.indep)ops.push({t:G.exo?"Cambiar de país o volver":"Irte a vivir al extranjero",s:"Egipto, Tailandia, Indonesia…",fn:menuExo});

  abrirHoja(`Dinero y bienes · ${Math.round(y.dinero)} en mano · patrimonio ${patrimonio()}`,ops);

function tickDinero(){
  const y=G.yo,a=y.edad/12;if(!G.indep&&!G.carcel)G.riqF=G.riqueza;
  if(G.prop&&G.indep){y.dinero+=550;if(G.prop.deuda>0){y.dinero-=G.prop.cuota;G.prop.deuda-=G.prop.cuota;if(G.prop.deuda<=0){G.prop.deuda=0;add("animo",10);logro("terminas de pagar la casa");log("Pagas la última cuota de la hipoteca. La casa es tuya del todo. Te sientas en el suelo del salón un rato largo.")}}

function cadSig(sig,tras){if(sig==null){G.cad=null}else if(G.cad){G.cad.dicho=0;G.cad.p=sig;G.cad.en=G.yo.edad+(tras||ri(2,5))}}
function tickCadena(){
  const c=G.cad;if(!c||G.pend||G.carcel||enMagia()||G.yo.edad<c.en)return;const S=CAD[c.k]&&CAD[c.k].pasos[c.p];
  if(!S||(S.ok&&!S.ok(c.d))){G.cad=null;return}
  if(!c.dicho)log(S.txt(c.d));if(S.ops){c.dicho=1;G.pend={k:"cad"}}else G.cad=null;
}
function abrirCadena(){
  const c=G.cad,S=c&&CAD[c.k]&&CAD[c.k].pasos[c.p];if(!S||!S.ops||(S.ok&&!S.ok(c.d))){G.pend=null;G.cad=null;return}
  abrirHoja(S.tit(c.d),S.ops(c.d).map(o=>({t:o.t,s:o.s,fn:()=>resolver(()=>{const r=o.fn();cadSig(r.sig,r.tras);return r.mal?{txt:r.txt,mal:1}:r.txt})})),true);
}

/* ---- Dejar pasar un año: un solo párrafo ---- */
function pasarAnio(){

  const y=G.yo,l0=G.lid||0,d0=y.dinero,s0=y.salud,a0=y.edad,n0=vivos(p=>p.con).length;
  for(let i=0;i<12&&!G.muerto&&!G.pend;i++)tick();
  const nuevas=G.log.filter(e=>e.i>l0),clave=e=>e.t=="tit"||/clave|mala|fin/.test(e.cls||"");
  const resto=nuevas.filter(e=>!clave(e));
  if(resto.length>3){
    G.log=G.log.filter(e=>!(e.i>l0)||clave(e));
    const m=y.edad-a0,dd=Math.round(y.dinero-d0),ds=Math.round(y.salud-s0),frases=resto.map(e=>e.txt).sort(()=>R()-.5).slice(0,3);
    let s=`Dejas correr ${m>=12?"un año entero":m+" meses"}. `+frases.join(" ")+" "+(resto.length>3?`Y ${resto.length-3} cosas más que no cambian nada. `:"");
    if(anios()>=16&&Math.abs(dd)>=100)s+=dd>0?`Acabas con ${dd} más en el bolsillo. `:`Se te van ${-dd}. `;
    if(Math.abs(ds)>=4)s+=ds>0?"Te encuentras mejor que hace un año.":"El cuerpo te lo va notando.";
    const k=G.log.findIndex(e=>e.i>l0),ent={t:"caja",txt:s.trim(),cls:"",n:G.tn,i:l0+.5,tag:edadTxt(a0)+" → "+edadTxt(y.edad)};
    if(k<0)G.log.push(ent);else G.log.splice(k,0,ent);
  }else{const m=y.edad-a0,k=G.log.findIndex(e=>e.i>l0),ent={t:"caja",txt:`Dejas correr ${m>=12?"un año entero":m+(m==1?" mes":" meses")}.`,cls:"",n:G.tn,i:l0+.5,tag:edadTxt(a0)+" → "+edadTxt(y.edad)};
    if(k<0)G.log.push(ent);else G.log.splice(k,0,ent)}
  guardar();render(true);
}

function explorarM(s){

function cursoEtapa(s){const T=Math.max(7,18-(G.mg.ini||11));return Math.ceil(s*T/7)}
function tickMagia(){
  if(G.mg&&G.mg.intro<5&&!G.mg.en&&!G.pend)G.pend={k:"mintro"}; // la llegada no se pierde aunque otra cosa la tape
  if(!enMagia())return;const m=mgIni();m.m++;
  const toca=s=>anios()-m.ini+1>=cursoEtapa(s);
  if(m.vil<7&&!G.pend&&toca(m.vil+1)&&((!m.vilC&&m.m>=2+(m.vil%3))||(m.vilC==1&&m.m>=6))){m.vilC=(m.vilC||0)+1;etapaVillano(m.vil+1)}
}
function etapaVillano(s){

  if(s==3){const sx2=sx(),x=per("conoc",sx2,ri(35,50),pick(o.ap),{con:true,umb:1,rel:25,sosp:1,oficio:sx2=="m"?"maestro de artes antiguas":"maestra de artes antiguas"});m.inf=x.id;

  if(s==6){const x=viv(m.inf);if(m.sab<4||!x){m.pts-=5;if(x){x.vivo=true;x.lejos=true;x.con=false}m.vil=6;log(`Una mañana la Llave de Invierno no está en su vitrina, y ${x?x.nombre+", de artes antiguas,":"alguien del claustro"} tampoco está en su cuarto. Nadie lo vio venir. En la vitrina vacía hay una S y una M dibujadas con el dedo en el polvo.`,"mala");return}
    log(`Atas cabos de golpe, en mitad de una clase: ${x.nombre} lleva un anillo con una S y una M, y siempre está cerca cuando pasa algo. ${gp(x,"El profesor","La profesora")} de artes antiguas trabaja para ${VIL}.`)}
  if(s==7)log(`La noche del solsticio el agua del Pozo empieza a subir. Rebosa el brocal, corre por el patio, y de ella sale andando un hombre joven con ojos muy viejos, como quien vuelve a casa. ${VIL}, de carne y hueso. Las campanas tocan solas. Los pequeños lloran. La directora baja las escaleras con el báculo en la mano, y no va a bastar.`,"mala");
  G.pend={k:"mvil",s};
}

    O("Tocarla","Está fría",()=>{magia(3);m.cor++;return {txt:"Pones el dedo en la marca. Un frío te sube por el brazo hasta el hombro, y con él, clarísimo, un pensamiento que no es tuyo: «ven». Durante una semana tus conjuros salen más fuertes de lo normal.",mal:1}})];
  if(s==3){const x=viv(m.inf);if(!x){G.pend=null;return}ops=[O("Ganarte su confianza","Sabe cosas que nadie enseña",()=>{rel(x,15);magia(4);m.cor++;return `Te quedas después de clase. ${x.nombre} te enseña un par de cosas que no vienen en ningún temario y te pide que no las comentes. Te trata como a un adulto. Gusta.`}),
    O("Vigilarle con tus amigos",null,()=>{m.sab+=2;am.forEach(p=>rel(p,5));return `Os turnáis para seguirle. ${x.nombre} baja cada jueves a las mazmorras con una jarra y sube con la jarra vacía. Apuntáis las horas en un cuaderno.`}),
    O("No fiarte y mantenerte lejos",null,()=>{m.sab+=.5;return "Te sientas al fondo y no levantas la mano. Hay sonrisas que no llegan a los ojos."+moral("prudente")})]}

    O("No meterte",null,()=>{add("animo",-3);return {txt:"Cierras las cortinas de la cama y te dices que no es cosa tuya. Tardas en dormirte.",mal:1}})];
  if(s==5)ops=[O("Aceptar una lección","Solo una",()=>{magia(10);m.cor+=2;return {txt:`Dices que sí. ${VIL} te enseña, desde el otro lado del cristal, a tirar del hilo con las dos manos. Sales del ala norte haciendo cosas que no hace nadie de tu curso, y con las yemas de los dedos un poco grises.`,mal:1}}),
    O("Negarte y romper el espejo",null,()=>{add("salud",-5);m.sab++;return "Coges un candelabro y lo estampas contra el cristal. Grita él y gritas tú. Te cortas la mano y sales corriendo. Desde ese día oyes tu nombre en los desagües."+moral("valiente")}),
    O("Fingir que aceptas, para sonsacarle","Depende de tu carisma",()=>{if(ch(.3+y.carisma/160)){m.sab+=3;return `Le sigues la corriente y le dejas hablar. Le encanta hablar. Te enteras de que necesita la Llave de Invierno para volver, y de que alguien del claustro se la va a traer.`}m.cor++;return {txt:`Finges mal. ${VIL} sonríe. «Mientes peor que yo a tu edad. Aun así, te has llevado algo mío sin darte cuenta.»`,mal:1}})];
  if(s==6){const x=viv(m.inf);if(!x){G.pend=null;return}ops=[O("Desenmascararle delante de todos","Te juegas el tipo",()=>{if(ch(.3+(y.magia||0)/140+am.length*.05)){m.pts+=10;m.ali=1;x.lejos=true;x.con=false;logro("desenmascaras al infiltrado de Umbraluz");add("animo",10);return `Te levantas en mitad del comedor y lo dices. ${x.nombre} saca la varita; tú también. Aguantas lo justo para que lleguen los demás profesores. Se lo llevan atado con su propia sombra. Diez puntos, y el comedor en pie.`+moral("valiente")}

  if(s==7){ops=[O("Plantarle cara junto a tus amigos","Todo lo aprendido, esta noche",()=>batallaM(1)),O("Poner a salvo a los pequeños",null,()=>batallaM(0))];
    if(m.cor>=3)ops.push(O("Ponerte a su lado","Te está mirando a ti",()=>{m.en=false;m.exp=1;m.f=0;G.fl.oscuro=1;magia(20);am.forEach(p=>rel(p,-45));vivos(q=>q.rol=="prog").forEach(q=>rel(q,-25));logro("traicionas a Umbraluz");
      return {txt:`Cruzas el patio y te pones a su lado. Oyes cómo alguien grita tu nombre a tu espalda; no te giras. ${VIL} te pone una mano en el hombro. Esa noche se lleva del Pozo lo que vino a buscar, y a ti con él. Umbraluz borra tu nombre de la piedra. Aprendes más en un mes que en todos estos años, y ya no tienes a quién contárselo. Al llegar el verano te deja en la puerta de tu casa, sin despedirse.`,mal:1}}))}
  if(!ops.length){G.pend=null;return}
  abrirHoja(["","","La marca en el Pozo","El profesor nuevo","Algo le pasa a los alumnos","El espejo del ala norte","El anillo","La noche del solsticio"][s],ops,true);
}
function batallaM(lucha){

  const pt=(y.magia||0)/25+fuertes*.5+m.sab*.3+(m.ali?1:0)+m.obj.length*.3-m.cor*.3+R()*2+(lucha?0:-.5);

    return (g2?`Sacas a los de primero por el pasadizo de las cocinas, de dos en dos, contándolos. Cuando vuelves al patio todo ha terminado: el agua ha bajado y ${VIL} con ella. No peleaste, pero no falta ninguno de los pequeños, y eso también es ganar.`:`Sacas a los de primero por el pasadizo de las cocinas, contándolos. Cuando vuelves, el patio está en silencio y el brocal, roto. ${VIL} se ha ido con lo que vino a buscar. Seguís todos vivos. Algo es.`)+moral("prudente")}
  if(pt>=5){magia(8);m.pts+=20;m.vil=8;am.forEach(p=>rel(p,10));add("animo",15);logro("salvas Umbraluz de "+VIL);

  if(pt>=3){magia(5);m.pts+=10;m.vil=8;add("animo",-5);const v=am.sort((p,q)=>p.rel-q.rel)[0];if(v){v.vaciado=1;v.umb=0;v.lejos=true}logro("sobrevives a la noche del Pozo");
    return {txt:`Aguantáis hasta el amanecer, y con el amanecer el Pozo se lo lleva. Pero ha costado: `+(v?`${v.nombre} se puso delante de ti en el último momento. Respira, y sonríe, y no volverá a hacer magia. Se vuelve a su casa en el primer carruaje.`:"media ala este es ya un montón de piedras, y hay camas vacías en la enfermería.")+" Habéis ganado. No lo parece."+moral("valiente"),mal:1}}
  add("salud",-20);add("animo",-15);G.fl.morcLibre=1;m.pts-=5;

}

/* ================= AMPLIACIÓN 4: amor y vida íntima (siempre entre adultos), listas con fijado y gente de todas las edades ================= */
const SANGRE=["prog","herm","abu","tio","primo","hijo","nieto","sobr"];

function deSuQuinta(p){return ["herm","primo"].includes(p.rol)&&!p.astra&&p.edad>=216&&G.yo.edad>=216}

function fijarArriba(l){if(!G.fijo)return l;const i=l.findIndex(p=>p.id==G.fijo);if(i>0){const p=l.splice(i,1)[0];l.unshift(p)}return l}

const turSospTxt=()=>{const s=tur().sosp;return s<15?"nadie te mira":s<40?"algún cabo suelto":s<70?"te están buscando":"tienen tu nombre"};
const porque=()=>` Piensas en ${agravio()}. El mundo empezó primero.`;
function menuTurbio(){

  A("Estudiar venenos",`Meses de biblioteca y paciencia (${t.ven}/4)`,()=>{t.ven++;add("mente",1);return ["Libros de toxicología sacados con el carné de otra persona. Tomas apuntes en clave.","Aprendes que casi todo depende de la cantidad. Lo apuntas y quemas el papel.","Lees sentencias antiguas: en todas, al envenenador lo pilló la prisa. Tú no tienes prisa.","Ya distingues lo que se nota de lo que no. Cierras el último libro."][Math.min(3,t.ven-1)]},y.mente<60?"Te falta mente (60)":t.ven>=4?"Ya sabes lo que hay que saber":"");
  A("Soltar lastre","120 · hablar con alguien antes de que sea tarde",()=>{y.dinero-=120;rencor(-8);add("animo",3);return vario("lastre",["Una consulta con una caja de pañuelos en la mesa. Dices cosas que nunca habías dicho en voz alta. Pesan menos fuera.","Hablas una hora entera sin que nadie te interrumpa. Sales con la mandíbula menos apretada.","«¿Y qué habría tenido que pasar para que no te sintieras así?» No lo sabes. Pero te lo llevas a casa."])});
  abrirHoja("Lo que el mundo te debe · rencor "+r+" · "+turSospTxt(),ops);

function extorsion(){const y=G.yo,t=tur();
  if(ch(.1+(G.fl.antec?.03:0)))return detener("extorsión",2);
  const n=ri(400,1500);y.dinero+=n;t.calle++;turSube(2);
  return vario("extor",[`Entras en tres bares a explicar lo fácil que es que se rompa un escaparate. Pagan los tres: ${n}.`,`El del taller no quería entender. Ahora entiende. ${n} al mes, «por la tranquilidad».`,`Recoges los sobres sin contar delante de ellos. Luego cuentas: ${n}. Nadie te mira a la cara.`])+(t.calle==1?porque():"");
}
function incendio(){const t=tur();
  if(ch(.12))return detener("un incendio provocado",2);
  add("animo",6);rencor(-10);turSube(8);
  return vario("incend",["Arde de madrugada el sitio donde más veces te hicieron sentir poca cosa. Lo ves desde lejos, con las manos en los bolsillos. No hay nadie dentro; eso lo comprobaste.","Un coche que conocías muy bien amanece negro y sin cristales. Su dueño mira a todos lados en la acera. A ti no.","Las llamas se ven desde tu ventana. Duermes de un tirón por primera vez en meses."])+porque();
}
function encargo(){const y=G.yo,t=tur();

    if(ch(.5)){if(t.mu)t.preso=1;return {txt:"El encargo sale mal: había alguien más, hay gritos, hay luces azules antes de que llegues a la esquina. "+encarcelar(ri(200,300)).txt,mal:1}}
    add("salud",-30);turSube(25);return {txt:"El encargo sale mal y eres tú quien vuelve sangrando. No cobras. Coses lo que puedes en el baño, con la radio alta.",mal:1}}
  const n=ri(8,25)*1000;y.dinero+=n;t.mu++;t.enc++;turSube(15-y.mente/10);add("animo",-8);
  return {txt:vario("encargo",[`Un nombre, una foto y una dirección. No sabes qué hizo ni te lo dicen. Dos semanas después hay ${n} en una consigna de la estación.`,`No le conocías de nada. Eso lo hace más fácil y bastante peor. Cobras ${n} en billetes usados.`,`Haces el trabajo y vuelves en autobús, como cualquiera. ${n}. En el asiento de al lado, alguien te pregunta la hora.`])+(t.enc==1?" Ya eres de los que cobran por esto.":""),mal:1};
}

function atraco(){const y=G.yo,t=tur(),b=t.banco||{plan:0,banda:0};t.banco=null;
  if(ch(clamp(.2+b.plan*.1+b.banda*.07+y.mente/400+(t.arma?.05:0),.08,.88))){
    const n=Math.round((ri(40,110)*1000+b.plan*6000)*(1+b.banda*.5)/(1+b.banda));y.dinero+=n;t.atr++;turSube(38-b.plan*5);add("animo",10);logro("atracas un banco");
    return `Cuatro minutos. Nadie se hace el héroe y nadie sale herido. `+(b.banda?`Repartís en un garaje, sin miraros mucho: te tocan ${n}.`:`Lo has hecho a solas: ${n}, en una bolsa que no te atreves a abrir hasta el día siguiente.`)+` Esa noche tu banco sale en el telediario y tú cenas delante, despacio.`+porque()}
  const r=R();
  if(r<.1){G.muerteDirecta="un disparo en la puerta de un banco";return {txt:"La alarma salta antes de tiempo. Sales corriendo hacia una calle que ya está cortada. Oyes la voz de alto. No paras.",mal:1}}
  if(r<.25){t.mu++;t.preso=1;return {txt:"Todo se tuerce en diez segundos: un guardia que no debía estar, un forcejeo, un disparo que no estaba en el plan. El guardia no se levanta. "+encarcelar(ri(280,400)).txt,mal:1}}
  if(r<.5){add("salud",-35);turSube(40);return {txt:"Sales sin un billete y con una bala en el costado. Te cose alguien que no hace preguntas y cobra como si las hiciera.",mal:1}}
  return {txt:"Hay un botón debajo de un mostrador que no viste. Cuando sales, la calle ya es azul. "+encarcelar(ri(96,180)).txt,mal:1};
}

function matar(p,met){const y=G.yo,t=tur(),o=t.obj||{plan:0},pl=o.plan,joven=p.edad<50*12;
  const ok=clamp(met=="ven"?.4+y.mente/250+pl*.06:met=="tiro"?.6+pl*.06+y.mente/500:.25+y.cuerpo/200+pl*.05-(joven?.1:0),.05,.95);
  if(!ch(ok)){
    if(met=="ven"){o.plan=Math.max(0,pl-1);if(ch(.3)){turSube(20);return {txt:`${p.nombre} pasa tres días en el hospital y sale. Le hacen análisis. Alguien, en algún despacho, levanta una ceja.`,mal:1}}return {txt:`${p.nombre} se queja del estómago una tarde y al día siguiente está como siempre. Te has quedado ${g("corto","corta")}. Nadie sospecha nada, tú tampoco duermes.`,mal:1}}
    p.rel=0;t.obj=null;
    if(met=="tiro"){if(ch(.35))return {txt:`Fallas. ${p.nombre} corre, grita y te ha visto la cara. `+encarcelar(ri(96,150)).txt,mal:1};turSube(35);return {txt:`Te tiembla el pulso y fallas. ${p.nombre} se tira al suelo; tú corres hasta que te arden los pulmones. No te ha visto la cara. Crees.`,mal:1}}
    add("salud",-ri(15,35));if(ch(.5))return {txt:`${p.nombre} es más fuerte de lo que calculabas. Forcejeáis, grita, se encienden ventanas. `+encarcelar(ri(96,150)).txt,mal:1};
    turSube(40);return {txt:`${p.nombre} se defiende mejor de lo que esperabas. Sales de allí con un corte en el brazo y sin haber terminado nada. Ahora sabe que alguien le quiere muerto.`.replace("muerto",gp(p,"muerto","muerta")),mal:1}}
  p.vivo=false;p.casa=false;p.asesinado=1;if(p.id==G.crush)G.crush=null;t.mu++;rencor(-25);add("animo",tiene("tramposo")?-4:-12);
  decidir("cuerpo",{id:p.id,met,pl});
  const s=met=="ven"?`Lo haces sin tocarle. Un café que no preparó ${gp(p,"él","ella")}, una tarde cualquiera. ${p.nombre} se encuentra mal, se sienta, y ya no se levanta.`:met=="tiro"?`Un solo ruido, más seco de lo que suena en las películas. ${p.nombre} cae sin enterarse. El eco tarda más que ${gp(p,"él","ella")}.`:`Es rápido y no se parece a nada que hubieras imaginado. ${p.nombre} te mira un segundo, sin entender, y luego ya no mira.`;
  return {txt:s+porque()+" Ahora queda lo difícil.",mal:1};
}

 {t:"Huir del país esta misma noche",fn:()=>{t.sosp=Math.max(t.mu*3,t.sosp-22);if(G.prop){y.dinero+=Math.round((G.prop.v-G.prop.deuda)*.4);G.prop=null}G.neg=null;return {txt:mudarExo(pick(EXO),true)+" Dejas la nevera llena y las llaves puestas.",mal:1}}},

function tickTurbio(){

const VIVENCIAS=["pasó un año entero fuera y volvió con otro acento","perdió a alguien muy cercano y no habla de ello","estuvo a punto de casarse con otra persona","dejó unos estudios a medias","ganó un premio del que presume poco","tuvo un accidente del que le queda una cicatriz","se arruinó una vez y volvió a levantarse","no se habla con un hermano desde hace años","quiso dedicarse a la música","salvó a alguien de ahogarse en una playa","repitió un curso y lo cuenta riéndose","trabajó una temporada en un barco","le dejaron por carta","tiene un miedo absurdo a los pájaros","guarda todas las entradas de cine desde los quince años","estuvo un mes sin hablar con nadie por una apuesta"];
function fichaGen(p){const e=p.edad/12,o=ORI[G.origen];let f=p.fi;

  A("Que el banco se olvide un poco de ti","Dinero cuando estás "+g("ahogado","ahogada"),()=>{vigSube(12);const n=ri(2000,6000);y.dinero+=n;return `Le hablas al director del banco mirándole a los ojos, despacio. Firma algo. Cuando sales, hay ${n} más en tu cuenta y él no sabría decir por qué.`},m<50?"Te falta magia (50)":"");
  A("Borrar un recuerdo","Que alguien deje de saber lo que sabe de ti",()=>{vigSube(15);let s="";if(G.tur&&G.tur.sosp>0){G.tur.sosp=Math.max(0,G.tur.sosp-30);s=" La inspectora repasa su carpeta y no entiende por qué había subrayado tu nombre."}if(G.osc&&G.osc.sosp>0){G.osc.sosp=Math.max(0,G.osc.sosp-30);s+=" Un testigo ya no está seguro de lo que vio."}
    return "Un gesto corto delante de su cara, como quien aparta una mosca."+(s||" Alguien del barrio olvida un rumor sobre ti a mitad de frase.")},m<60?"Te falta magia (60)":"");
  A("Reconciliarte por las bravas","Arregla un vínculo roto sin pedir perdón",()=>{const p=pick(vivos(q=>q.con&&!q.lejos&&q.rel<35&&q.edad>=216));if(!p)return "No hay nadie con quien te lleves tan mal.";vigSube(6);rel(p,ri(20,30));return `Un nudo deshecho en una cuerda con el nombre de ${p.nombre}. Al día siguiente te saluda como si aquello no hubiera pasado. Tú sabes que pasó.`},m<45?"Te falta magia (45)":"");
  A("Trabajar la mitad","Que las cosas se hagan solas",()=>{if(!G.trabajo)return "No tienes trabajo que aligerar.";vigSube(5);G.trabajo.s=Math.round(G.trabajo.s*1.05);add("animo",4);return `Las escobas barren, los informes se escriben y tú llegas a casa a las cuatro. Tu jefe cree que eres un prodigio: te suben a ${G.trabajo.s}.`});

}
function menuZonas(){

  for(const k in ZONAS){const Z=ZONAS[k];if(x.zona==k)continue;const no=!G.indep?"Antes tienes que vivir por tu cuenta":m<Z.min?"Te falta magia ("+Z.min+")":y.dinero<Z.coste?"Te faltan "+Z.coste:"";
    ops.push({t:"Mudarte a "+Z.n,s:no||Z.coste+" · "+Z.casa,fn:no?()=>{}:()=>hacer(()=>{y.dinero-=Z.coste;x.zona=k;G.casa={tipo:Z.casa,barrio:Z.n,deQuien:null};genVecinos();vivos(p=>p.rol=="vec"&&!p.lejos).forEach(p=>{p.umb=1;p.con=true});add("animo",8);logro("te mudas a "+Z.n);return Z.tx})})}
  if(x.zona)ops.push({t:"Volver al mundo corriente",s:"800",fn:()=>hacer(()=>{y.dinero-=800;x.zona=null;genCasa();G.casa.deQuien=null;genVecinos();return "Cierras la puerta, que se cierra sola detrás de ti. Vuelves a un sitio con farolas, contenedores y vecinos que no vuelan. Se hace raro."})});

}
function menuArtes(){

  A("Estudiar lo prohibido","Más poder, a cambio de algo cada vez",()=>{x.osc=clamp(x.osc+ri(6,10));magia(2);add("salud",-2);add("aspecto",-1);vigSube(4);if(x.osc>=60&&!x.sin){x.sin=1;logro(g("te conviertes en un brujo siniestro","te conviertes en una bruja siniestra"));vivos(p=>p.rol=="vec"&&p.con).forEach(p=>rel(p,-10));return {txt:"Ya no proyectas la sombra que te toca. Los perros cruzan de acera, las plantas de tu casa crecen hacia la pared. En el barrio bajan la voz cuando pasas, y a ti empieza a gustarte.",mal:1}}
    return vario("mprohib",["Un libro encuadernado en algo que no es piel de animal. Lo lees con guantes. Aun así se te quedan las yemas frías.","Aprendes una palabra que no se puede escribir. Te sangra la nariz al decirla. Funciona.","Bajas a donde no llega la luz de las velas, y allí alguien te enseña a cambio de un recuerdo. No sabes cuál te ha quitado.","Lo que Umbraluz prohíbe resulta ser más fácil que lo que enseña. Eso debería haberte asustado."])});

    abrirHoja("¿A quién?",l.length?l.map(p=>({t:p.nombre+" "+p.apellido,s:rolTxt(p)+" · vínculo "+Math.round(p.rel),fn:()=>hacer(()=>maldecir(p))})):[{t:"No odias a nadie lo bastante",fn:()=>cerrarHoja()}])};
  A("Un pacto","Mucho dinero ahora. Lo pagas en años",()=>{const n=ri(20,60)*1000;y.dinero+=n;add("salud",-15);y.pacto=(y.pacto||0)+1;x.osc=clamp(x.osc+10);return {txt:`Firmas con algo que no es tinta. A la mañana siguiente hay ${n} donde no había nada, y tú tienes más canas y menos aliento. No te han dicho cuántos años eran. Nunca lo dicen.`,mal:1}},x.osc<40?"Te falta oscuridad (40)":"");
  A("Soltar una plaga sobre la ciudad","Lo que hace un enemigo del mundo",plagaMagica,x.osc<70?"Te falta oscuridad (70)":m<70?"Te falta magia (70)":"");

  abrirHoja("Artes prohibidas · oscuridad "+Math.round(x.osc),ops);
}
function maldecir(p){const y=G.yo,x=mgx();vigSube(18);x.osc=clamp(x.osc+4);
  if(!ch(clamp(.3+(y.magia||0)/200+x.osc/250,.1,.92))){add("salud",-12);return {txt:`La maldición no encuentra a ${p.nombre} y vuelve a casa. Pasas dos semanas con fiebre y con un sabor a ceniza que no se va.`,mal:1}}
  x.mald++;rencor(-12);
  if(x.osc>=60&&ch(.4)){p.vivo=false;p.casa=false;p.asesinado=1;if(p.id==G.crush)G.crush=null;tur().mu++;try{trasMuerte(p)}catch(e){}return {txt:`Dices su nombre tres veces delante de un espejo tapado. ${p.nombre} muere esa semana, mientras duerme, sin una marca. El médico escribe «causas naturales» y cambia de hoja. Ningún juez de este mundo podría tocarte. Los del otro, sí.`,mal:1}}
  p.triste=true;p.rel=clamp(p.rel-10);if(p.jefe&&G.trabajo&&ch(.5)){p.jefe=false;p.oficio=null;p.sitio="de tu antiguo trabajo";return {txt:`A ${p.nombre} se le empieza a torcer todo: pierde papeles, olvida nombres, grita en una reunión donde no debía. En un mes ya no es ${gp(p,"tu jefe","tu jefa")}. Recoge su despacho en una caja de cartón.`,mal:1}}
  return {txt:vario("maldic",[`A ${p.nombre} se le rompe el coche, se le inunda la casa y se le va la pareja, por ese orden y en el mismo mes. No sabe a quién mirar.`,`${p.nombre} deja de dormir. Se le ve por la calle con la cara gris, mirando hacia atrás.`,`Todo lo que ${p.nombre} toca se estropea un poco. Nada grave, cada día. Así durante años.`]),mal:1};
}
function plagaMagica(){const y=G.yo,x=mgx(),o=G.osc=G.osc||{n:0,vic:0,sosp:0,plan:0};
  const v=ri(3,14);o.n++;o.vic+=v;o.ult=y.edad;vigSube(45);x.osc=clamp(x.osc+8);add("animo",-12);if(!tiene("tramposo"))ponRasgo("tramposo");
  return {txt:`Abres algo que llevaba siglos cerrado y lo dejas ir calle abajo. No hay explosión ni humo: solo una niebla baja, una noche, y por la mañana ${v} personas que no despiertan. Los periódicos hablan de un escape de gas. La policía corriente nunca sabrá adónde mirar. Los Vigilantes de Umbraluz ya están mirando.`,mal:1};
}
function tickMagAd(){const y=G.yo,x=G.mgx;
  G.gente.forEach(p=>{if(p.filtro>0&&p.vivo){p.filtro--;if(p.filtro<=0){p.filtro=0;
    if(p.id==G.pareja||p.rel>=70||p.cama){p.quim=clamp(Math.max(p.quimF||0,(p.quim||0)-12));log(`A ${p.nombre} se le pasa el efecto del filtro. Se queda un momento ${gp(p,"callado","callada")}, como despertando. Luego te mira, y sigue ahí: lo que habéis construido estos meses era de verdad.`)}
    else if(ch(.35)){p.quim=0;rel(p,-40);p.beso=false;log(`A ${p.nombre} se le pasa el efecto, y ata cabos. «Me echaste algo. Todo este tiempo.» No vuelve a mirarte a la cara, y lo cuenta.`,"mala");vivos(q=>q.rol=="vec"&&q.con).forEach(q=>rel(q,-5))}
    else{p.quim=clamp((p.quimF||0)-5);rel(p,-8);log(`A ${p.nombre} se le pasa el efecto del filtro. Te trata con una educación rara, como a alguien con quien soñó algo que no recuerda.`,"mala")}}}});
  if(!x||G.carcel)return;
  if(x.veto>0)x.veto--;if(x.vig>0)x.vig=Math.max(0,x.vig-.4);
  if(x.zona&&G.indep)magia(x.zona=="bosque"?.25:.12);else if(x.zona&&!G.indep)x.zona=null;
  if(x.vig>=70&&ch(.12)){x.vig=15;
    if(x.osc>=60||x.mald>=2||(G.osc&&G.osc.n)){log("Tres figuras con capa gris aparecen en tu cocina sin abrir la puerta. Los Vigilantes de Umbraluz no leen derechos: leen una lista. Hay una celda sin ventanas bajo el lago, y lleva tu nombre. "+encarcelar(ri(120,300)).txt,"mala")}
    else{const n=ri(500,2500);y.dinero-=n;x.veto=24;log(`Llega una lechuza con un sobre lacrado en gris: el Consejo te sanciona por usar magia sobre gente corriente. Multa de ${n} y dos años sin báculo.`,"mala")}}
}

  if(x&&x.zona=="aldea")ev(3,"zaldea",()=>{add("animo",3);log(vario("zaldea",["En el Barrio de las Lechuzas el cartero llega volando y siempre trae una carta de más.","Mercado de los jueves: tarros que susurran, semillas que hay que plantar de noche y una señora que vende tiempo, a granel.","La niña de al lado ha vuelto a encoger al gato. Vas a ayudar.","Fiesta del barrio. Los fuegos artificiales los pone un dragón pequeño, bajo supervisión."])+(ch(.25)?conocerEn("del Barrio de las Lechuzas","par"):""))});
  if(x&&x.zona=="bosque")ev(3,"zbosque",()=>{const r=ri(0,3);if(r==0){add("salud",-8);log("Algo te sigue entre los árboles hasta la puerta de casa. No entra. Deja marcas en la madera, a la altura de tu cara.","mala")}else if(r==1){magia(2);log("Encuentras un claro donde crece lo que en las boticas se vende por gramos. Vuelves con los bolsillos llenos.")}else if(r==2){add("animo",4);log("Un ciervo blanco te mira desde la niebla durante un minuto entero. Nadie te va a creer.")}else log("Por la noche el bosque dice tu nombre, bajito y bien pronunciado. No contestas. Nunca hay que contestar.","mala")});
  if(x&&x.osc>=30)ev(2,"osctienta",()=>{add("animo",-3);log(vario("osct",["Los espejos de casa tardan un instante de más en devolverte la cara.","Alguien llama a tu puerta de madrugada para pedirte lo que ningún otro mago le haría. Trae dinero.","Sueñas con el fondo del Pozo. Te despiertas con barro en los pies."]),"mala")});
  if(G.mago)ev(1,"magcarta",()=>{add("animo",3);log(vario("magcarta",["Carta de Umbraluz: reunión de antiguos alumnos. Va menos gente cada año, y los que van hablan más bajo.","Un antiguo compañero de casa te escribe: ha abierto una botica y necesita a alguien de fiar.","Te cruzas con un mago por la calle. Os reconocéis sin deciros nada, por cómo esquiváis los charcos."]))});
}

    log(vario("hijotrae",[`${q.nombre} trae a dormir a casa a ${p.nombre}, de su clase. Montan una tienda de campaña con sábanas en el salón y se ríen hasta las tantas.`,`${q.nombre} aparece con ${p.nombre}, «que se queda a cenar». Nadie te había avisado. Pones otro plato.`,`Fiesta de pijamas: ${p.nombre}, de la pandilla de ${q.nombre}, descubre dónde guardas las galletas.`]))});

}

 arte:{tx:["Te pasas una tarde entera con un solo color, a ver hasta dónde llega.","Dibujas en el autobús a un señor dormido. Se despierta a media nariz.","Rompes un dibujo que no salía. El siguiente sale.","Alguien te pide que le hagas un retrato. Te pones más nervioso que él.","Copias a un maestro antiguo, línea a línea, para robarle el truco."],

  est:{n:"un año en una residencia de artistas, con exposición al final",sit:"de la residencia de artistas",tx:["Te dan un estudio con luz del norte y una llave. Nadie te dice qué pintar. Eso es lo difícil.","Los demás residentes discuten de arte hasta las tres. Tú escuchas y te lo llevas todo al lienzo.","Una galerista pasa por los estudios sin decir nada. En el tuyo se queda cuatro minutos. Los cuentas.","Semana en blanco. Miras la pared. La pared gana.","Montáis la exposición colectiva. Tus cuadros, vistos colgados, parecen de otra persona con más talento.","Un crítico escribe dos líneas sobre ti. Te las aprendes de memoria."],ok:"La exposición cierra con tres puntos rojos junto a tus cuadros: vendidos. Te vas con una carpeta de contactos y un nombre que alguien, en algún despacho, ya recuerda.",ko:"La exposición pasa sin ruido. Nadie compra. Pero en un año has pintado más que en los diez anteriores, y eso no te lo quita nadie.",logro:"expones tras un año de residencia artística"},
  op:{tit:"Un encargo",txt:"El dueño de un bar quiere un mural en la pared del fondo. Paga, pero quiere «algo alegre, con palmeras».",a:["Pintar las palmeras","Pintas las palmeras más dignas que se han pintado. Cobras y la gente se hace fotos delante."],b:["Pintar lo que tú quieras","Pintas lo tuyo. Al dueño le cuesta una semana acostumbrarse. A los clientes, un día."]}},

  est:{n:"una temporada cedido en un club de otro país",sit:"del club extranjero",tx:["No entiendes el idioma del vestuario, pero el del balón es el mismo.","Aquí se entrena el doble y se habla la mitad.","Te sientan en el banquillo cuatro partidos seguidos. Aprendes a tragar.","Sales en el minuto setenta y cambias el partido. El entrenador no dice nada: te pone de titular.","La grada canta tu nombre mal pronunciado. Te suena a gloria.","Echas de menos la comida de casa con una intensidad que no esperabas."],ok:"Acabas la temporada como titular. Vuelves con otro fútbol en las piernas y dos clubes preguntando por ti.",ko:"Una lesión a mitad de temporada te deja viendo los partidos desde la grada. Vuelves más duro, que también cuenta.",logro:"juegas una temporada en el extranjero"},

  est:{n:"un año en una academia de baloncesto en el extranjero",sit:"de la academia",tx:["Aquí todos son tan altos como tú o más. Se acabó ganar por centímetros.","Seis horas de pista al día y dos de vídeo.","Te ponen a defender al mejor en cada entrenamiento. Acabas odiándole y debiéndole media carrera.","Un partido contra un equipo profesional. Pierdes por treinta y aprendes por cien.","El entrenador te cambia la mecánica de tiro. Durante un mes no metes ni una.","La mecánica nueva empieza a entrar. Mucho."],ok:"Sales de la academia con una oferta encima de la mesa y un tiro que no tenías.",ko:"No destacas entre tantos buenos. Vuelves sabiendo exactamente lo que te falta.",logro:"te formas un año en una academia de baloncesto"},

  est:{n:"un año viviendo y trabajando en el extranjero como traductor",sit:"de tu año en el extranjero",tx:["Los primeros días pides siempre lo mismo en el bar, porque es lo que sabes pronunciar.","Te ríes de un chiste a tiempo. Nadie se da cuenta de lo que eso significa.","Te enfadas en otro idioma y te sale bien. Ya vives aquí.","Traduces un contrato de noche, con tres diccionarios y un café frío.","Alguien te corrige el acento con cariño. Lo arreglas en una semana.","Llamas a casa y te falta una palabra en tu propia lengua."],ok:"Vuelves con el idioma metido en los huesos y un contrato de una agencia internacional.",ko:"Te quedas en un círculo de compatriotas y hablas lo de siempre. Vuelves con buenas fotos y un idioma a medias.",logro:"vives un año en otro idioma"},

function teclear(els,v){ // los mensajes nuevos se escriben solos; un toque los completa
  if(!els.length)return;
  let lento=true;try{lento=!matchMedia("(prefers-reduced-motion:reduce)").matches}catch(e){}
  if(!lento)return;
  const cola=els.map(el=>{const ns=[];const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())ns.push([n,n.nodeValue]);return {el,ns}});
  const total=cola.reduce((s,c)=>s+c.ns.reduce((q,x)=>q+x[1].length,0),0),paso=Math.max(2,Math.ceil(total/140));
  cola.forEach(c=>{c.el.style.display="none";c.ns.forEach(x=>x[0].nodeValue="")});
  let ci=0,ni=0,ch_=0;
  const abre=()=>{if(ci<cola.length){cola[ci].el.style.display="";if(cola[ci].el.classList.contains("tit")){cola[ci].ns.forEach(x=>x[0].nodeValue=x[1]);ci++;ni=0;ch_=0;abre()}}};
  const fin=()=>{cola.forEach(c=>{c.el.style.display="";c.ns.forEach(x=>x[0].nodeValue=x[1])});v.scrollTop=v.scrollHeight};
  abre();
  tecleo={fin,t:setInterval(()=>{
    if(ci>=cola.length){pararTecleo();return}
    const c=cola[ci];let q=paso;
    while(q>0&&ni<c.ns.length){const x=c.ns[ni],k=Math.min(q,x[1].length-ch_);ch_+=k;q-=k;x[0].nodeValue=x[1].slice(0,ch_);if(ch_>=x[1].length){ni++;ch_=0}}
    if(ni>=c.ns.length){ci++;ni=0;ch_=0;abre()}
    v.scrollTop=v.scrollHeight;
  },16)};
}

     <tr><th>Pareja</th><td>${G.pareja&&P(G.pareja)?esc(P(G.pareja).nombre)+(G.casado?" (matrimonio)":""):G.crush&&P(G.crush)?"Te gusta "+esc(P(G.crush).nombre):"Nadie"}</td></tr>
     <tr><th>Cursos</th><td>${Object.keys(G.cursos||{}).map(k=>secDe(k).n).join(", ")||"Ninguno"}</td></tr>
     ${!G.indep?`<tr><th>Ambiente en casa</th><td>${ambiente()}</td></tr>`:""}
     ${G.mg?`<tr><th>Magia</th><td>${G.mago?g("Mago graduado","Maga graduada"):"Umbraluz"} · casa ${CASASM[G.mg.casa].n} · ${G.mg.anos} ${G.mg.anos==1?"curso":"cursos"}</td></tr>`:""}
     <tr><th>Costumbres</th><td>${[G.dieta=="basura"&&"comida basura",G.dieta=="dieta"&&"a dieta",G.fl.ropa>0&&"ropa cara",G.fe&&!G.indep&&"familia practicante",G.fl.fuma&&"fumas",G.fl.adicto&&"enganche a las drogas",G.fl.adsex&&"compulsión sexual",G.fl.ludo&&"apuestas",G.fl.ets&&"algo sin tratar"].filter(Boolean).join(", ")||"Nada que señalar"}</td></tr>${filasExtra()}${filasAmor()}</table>
     ${G.logros&&G.logros.length?`<div class="tit">Informe ③ Logros</div><table>${G.logros.map(l=>"<tr><td>"+esc(l.charAt(0).toUpperCase()+l.slice(1))+"</td></tr>").join("")}</table>`:""}
     <p class="nota">La partida se guarda sola en este navegador. Si empiezas otra vida, esta se pierde.</p>`;
    const b=document.createElement("button");b.className="gordo";b.style.fontSize="13px";b.textContent="ABANDONAR ESTA VIDA";
    b.onclick=()=>abrirHoja("¿Abandonar esta vida?",[{t:"Sí, empezar de cero",fn:()=>{G=null;borrar();cerrarHoja();render()}}]);
    v.appendChild(b);v.scrollTop=0;
  }
  const acc=$("acc");acc.innerHTML="";
  if(G.muerto){herederos().forEach(h=>{const b=document.createElement("button");b.className="ancho";b.textContent=`Seguir como ${h.nombre} (${gp(h,"hijo","hija")}, ${edadTxt(h.edad)})`;b.onclick=()=>continuarComo(h.id);acc.appendChild(b)});
    const b=document.createElement("button");b.className="ancho";b.textContent="Nacer otra vez";b.onclick=()=>{G=null;borrar();render()};acc.appendChild(b);return}
  if(G.pend)abrirPend();
  acciones().forEach(o=>{const b=document.createElement("button");b.textContent=o.t;if(o.cls)b.className=o.cls;
    b.onclick=o.anio?pasarAnio:o.abre?o.abre:()=>{TAB="diario";hacer(o.fn)};acc.appendChild(b)});
}
document.querySelectorAll("#tabs button[data-t]").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render(TAB=="diario")});
// Pantalla completa (en el APK ya va a pantalla completa y el botón sobra)
if(window.AndroidApp)$("bFull").hidden=true;
$("bFull").onclick=()=>{
  const d=document,el=d.documentElement;
  try{
    if(d.fullscreenElement){d.exitFullscreen();return}
    const p=el.requestFullscreen?el.requestFullscreen():Promise.reject();
    p.catch(()=>abrirHoja("Aquí no se puede poner a pantalla completa. Instala el APK: ahí va siempre completa.",[]));
  }catch(e){abrirHoja("Aquí no se puede poner a pantalla completa. Instala el APK: ahí va siempre completa.",[])}
};
window.__atras=()=>{if($("hoja").classList.contains("on")){if(!(G&&G.pend))cerrarHoja();return 1}return 0};
$("vista").addEventListener("click",pararTecleo);
cargar();visto=G?(G.lid||0):0;render(true);
</script>
