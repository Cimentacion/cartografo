<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toda una Vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800&family=Metamorphous&display=swap" rel="stylesheet">
<style>
:root{
  /* Página de revista japonesa de 1998: papel crema, panel nocturno, cajas lila con capitular blanca, titulares caqui */
  --papel:#efe9d8; --noche:#131129; --noche2:#2b2560; --lila:#aaa6e0; --tinta:#1a1740;
  --caqui:#d2d291; --oro:#dbb84c; --blanco:#ffffff; --rojo:#e0605a;
  --f-titular:"Dela Gothic One","Hiragino Kaku Gothic ProN","Arial Black",sans-serif;
  --f-cuerpo:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Trebuchet MS",sans-serif;
  --f-logo:"Metamorphous","Palatino Linotype",Georgia,serif;
  --f-presenta:"Cormorant Garamond",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--papel);font-family:var(--f-cuerpo);font-weight:800;color:var(--blanco);padding:8px;overflow:hidden}
#pagina{height:100%;max-width:640px;margin:0 auto;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;
  background:
   radial-gradient(120% 60% at 85% 0%,rgba(120,105,200,.55),transparent 60%),
   linear-gradient(180deg,#3a3378 0%,var(--noche2) 22%,var(--noche) 70%,#0b0a1a 100%);}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--oro);outline-offset:2px}

/* Cabecera */
.cab{padding:10px 16px 8px;flex:none;position:relative}
.presenta{font-family:var(--f-presenta);font-style:italic;font-size:17px;letter-spacing:.5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.presenta b{font-family:var(--f-titular);font-style:normal;font-weight:400;font-size:11px;background:#5a4fb0;padding:2px 8px;white-space:nowrap}
.logo{font-family:var(--f-logo);font-size:34px;line-height:1.05;letter-spacing:1px;
  background:linear-gradient(180deg,#fff3b8 0%,var(--oro) 45%,#8a6a1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.kanji{font-family:var(--f-titular);color:var(--caqui);font-size:22px;letter-spacing:2px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kanji small{font-family:var(--f-cuerpo);font-size:10px;color:var(--blanco);letter-spacing:0}
.ficha{border-top:2px solid var(--blanco);border-bottom:2px solid var(--blanco);margin-top:6px;padding:3px 0;font-size:13px;display:flex;flex-wrap:wrap;gap:2px 14px}
.ficha span::before{content:"●"}
.compacta .logo,.compacta .kanji,.compacta .presenta{display:none}
.compacta .ficha{margin-top:0}
.logo{margin-top:6px}

/* Tabla de estadísticas, como la encuesta de la revista */
.stats{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--blanco);margin-top:6px;font-variant-numeric:tabular-nums}
.stats div{border-right:1px solid var(--blanco);text-align:center;padding:2px 0 3px;font-size:9.5px;position:relative;overflow:hidden}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--f-titular);font-weight:400;font-size:17px;color:var(--caqui);line-height:1.1}
.stats i{position:absolute;left:0;bottom:0;height:3px;background:var(--lila)}
.stats .mal b{color:var(--rojo)} .stats .mal i{background:var(--rojo)}

.tabs{display:flex;gap:6px;padding:0 16px;flex:none}
.tabs button{flex:1;font-family:var(--f-titular);font-size:12px;padding:6px 0;border:1px solid var(--blanco);border-bottom:0;border-radius:10px 10px 0 0;color:var(--blanco);opacity:.6}

.tabs button.mini{flex:none;width:42px;opacity:1;font-size:15px}
.tabs button.on{background:var(--lila);color:var(--tinta);opacity:1;border-color:var(--lila)}

#vista{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--lila);min-height:0}
.caja{background:var(--lila);color:var(--tinta);border-radius:16px;padding:10px 14px;font-size:14.5px;line-height:1.45;flex:none}
.caja p::first-letter{font-family:var(--f-titular);font-size:2.3em;float:left;line-height:.9;padding:2px 5px 0 0;color:var(--blanco);text-shadow:0 1px 0 rgba(26,23,64,.35)}
.caja em{font-style:normal;white-space:nowrap}
.caja.mala{background:#8f8ab8}
.caja.clave{background:#1b1840;color:var(--oro);border:1.5px solid var(--oro)}
.caja.clave p::first-letter{color:#fff3b8;text-shadow:none}
.vieja{filter:brightness(.7) saturate(.85)}
.tit.vieja{opacity:.75}
.caja.fin{background:var(--tinta);color:var(--blanco);border:2px solid var(--oro)}
.caja.fin p::first-letter{color:var(--oro)}
.tit{font-family:var(--f-titular);color:var(--caqui);font-size:19px;line-height:1.2;margin-top:6px;text-wrap:balance;flex:none;-webkit-text-stroke:.4px #000}
.tit small{display:block;font-family:var(--f-cuerpo);font-size:11px;color:var(--blanco);-webkit-text-stroke:0}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;flex:none}
th,td{border:1px solid var(--blanco);padding:4px 6px;text-align:left}
th{font-family:var(--f-titular);font-weight:400;color:var(--caqui);font-size:11px}
td.n{text-align:right;white-space:nowrap}
.ficha{margin-bottom:10px;font-size:13px}.ficha td{padding:5px 6px;border-bottom:1px solid rgba(128,128,128,.25);vertical-align:top;text-align:left}.ficha td:first-child{opacity:.7;width:36%}
.ficha td.fsec{opacity:1;font-weight:700;color:var(--oro);padding-top:12px;border-bottom:1px solid var(--oro)}.ficha td.fno{opacity:.6;font-style:italic}
.muerto td{opacity:.5}
.nota{font-size:12px;line-height:1.4;font-weight:700}

/* Acciones */
#acc{flex:none;max-height:38%;overflow-y:auto;padding:8px 16px 12px;border-top:2px solid var(--blanco);background:rgba(8,7,22,.6);display:grid;grid-template-columns:1fr 1fr;gap:6px}
#acc button{background:var(--caqui);color:var(--tinta);border-radius:10px;padding:9px 8px;font-size:13px;line-height:1.15;min-height:40px}
#acc button:active{transform:translateY(1px);filter:brightness(.9)}
#acc button.sec{background:transparent;color:var(--blanco);border:1px solid var(--blanco)}
#acc button.riesgo{background:#b9605c;color:#fff}
#acc button.ancho{grid-column:1/-1}

/* Creación */
#crear{flex:1;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--blanco);border-radius:999px;padding:7px 12px;font-size:13px;max-width:100%;text-align:left}
.chips button.on{background:var(--lila);color:var(--tinta);border-color:var(--lila)}
#nombre{font:inherit;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--blanco);background:rgba(255,255,255,.08);color:var(--blanco)}
.gordo{font-family:var(--f-titular);background:linear-gradient(180deg,#fff3b8,var(--oro));color:var(--tinta);border-radius:12px;padding:12px;font-size:18px;letter-spacing:2px}
.intro{font-size:13.5px;line-height:1.5}

/* Hoja de elección */
#hoja{position:fixed;inset:0;background:rgba(5,4,15,.72);display:none;align-items:flex-end;justify-content:center;padding:8px;z-index:5}
#hoja.on{display:flex}
#hoja>div{width:100%;max-width:624px;max-height:80%;overflow-y:auto;background:var(--noche2);border:2px solid var(--lila);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
#hoja h2{font-family:var(--f-titular);font-weight:400;color:var(--caqui);font-size:16px;margin-bottom:4px}
#hoja button{text-align:left;background:var(--lila);color:var(--tinta);border-radius:10px;padding:10px 12px;font-size:14px}
#hoja button small{display:block;font-size:11px;opacity:.8}
#hoja h2.conF{display:flex;align-items:flex-start;gap:8px}#hoja h2.conF span{flex:1}
#hoja button.fic{flex:none;display:flex;align-items:center;gap:5px;background:var(--caqui);color:var(--tinta);border-radius:999px;padding:6px 11px;font-size:11px;font-family:inherit}
#hoja button.fic svg{width:16px;height:16px;display:block}
.arbol{font-size:13px;line-height:1.35}.arbol .gen{color:var(--oro);font-weight:700;border-bottom:1px solid var(--oro);margin:12px 0 4px;padding-bottom:2px}.arbol .gen:first-child{margin-top:0}
.arbol .sub{opacity:.7;font-size:11px;margin:6px 0 2px;text-transform:uppercase;letter-spacing:1px}
.arbol .nodo{padding:6px 4px;border-bottom:1px solid rgba(128,128,128,.22);cursor:pointer}.arbol .nodo.m{opacity:.55}.arbol .nodo.nc{font-style:italic;cursor:default}.arbol .nodo.yo{color:var(--oro);cursor:default}
#buscaG{display:block;width:100%;margin-bottom:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--blanco);background:transparent;color:inherit;font:inherit;font-size:13px}tr[data-id]{cursor:pointer}
.arbolB{display:block;width:100%;background:var(--caqui);color:var(--tinta);border-radius:10px;padding:9px 8px;font-size:13px;margin-bottom:8px}
#hoja button.sec{background:transparent;color:var(--blanco);border:1px solid var(--blanco);text-align:center}
.copy{font-size:9px;font-weight:700;color:#5d5848;text-align:left;padding:2px 12px 0;flex:none;display:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none}}
</style>
</head>
<body>
<div id="pagina">
  <header class="cab" id="cab">

</div>
<div id="hoja"><div id="hojaIn"></div></div>

<script>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============ Datos ============ */

/* ============ Estado ============ */
let G=null, TAB="diario";
const CLAVE="toda-una-vida-v1";
function guardar(){try{localStorage.setItem(CLAVE,JSON.stringify(G))}catch(e){}}
function cargar(){try{const s=localStorage.getItem(CLAVE);if(s)G=JSON.parse(s);if(G&&G.yo&&G.gente)G.gente.forEach(p=>{
  if(p.vivo&&p.edad>=216&&p.edad<27*12&&(p.inf||0)>=10&&p.rel>=55&&!p.casado&&!p.ex&&!p.pv&&p.virgen===false){if(p.cama){p.pv=1;if(G.amor)G.amor.pv=(G.amor.pv||0)+1}else p.virgen=null}if(p.crianza&&!p.astra&&Math.abs(G.yo.edad-p.edad)<=60)p.crianza=false})}catch(e){G=null}
  if(G&&!G.v2){G.gente.forEach(p=>p.con=true);G.v2=1}
  if(G&&G.yo.aspecto==null)G.yo.aspecto=35;
  if(G&&G.yo.altAdulta==null)genCuerpo();
  if(G&&(G.titulo||G.uni)&&!G.carrera)G.carrera="economia";
  try{cargaHitos()}catch(e){}}
function borrar(){try{localStorage.removeItem(CLAVE);localStorage.removeItem(CLAVE+"-hitos")}catch(e){}SNAPS=[];SNAP_MES=null}

const yo=()=>G.yo, anios=()=>Math.floor(G.yo.edad/12);
const g=(m,f)=>G.yo.sexo=="m"?m:f;
const gp=(p,m,f)=>p.sexo=="m"?m:f;
const P=id=>G.gente.find(p=>p.id==id);
const vivos=f=>G.gente.filter(p=>p.vivo&&(!f||f(p)));
/* ---- Altura y peso ---- */
const CREC=[[0,.29],[1,.43],[2,.5],[4,.585],[6,.66],[8,.73],[10,.79],[12,.86],[14,.93],[16,.98],[18,1]];
function genCuerpo(){
  const y=G.yo,pa=ri(162,190),ma=ri(150,175);
  y.altAdulta=Math.round((pa+ma+(y.sexo=="m"?13:-13))/2+ri(-6,6));y.altMod=0;y.imcD=ri(-10,20)/10;
  if(ch(.06)){y.altAdulta=y.sexo=="m"?ri(198,215):ri(185,200);y.genAlto=1} // genética de gigantes
}
function altura(){ // cm
  const y=G.yo,a=y.edad/12;let f=1;
  for(let i=1;i<CREC.length;i++)if(a<CREC[i][0]){const p=CREC[i-1],q=CREC[i];f=p[1]+(q[1]-p[1])*(a-p[0])/(q[0]-p[0]);break}
  return Math.min(215,y.altAdulta+y.altMod)*f;
}
function imcBase(){const a=G.yo.edad/12;return a<1?14+3*a:a<6?17-.3*(a-1):a<18?15.5+(a-6)*.5:a<50?21.5+(a-18)*.06:23.4}

function pesoTxt(){const p=peso();return (p<10?p.toFixed(1).replace(".",","):Math.round(p))+" kg"}
function complexion(){const d=G.yo.imcD;return d<-3.5?"en los huesos":d<-1.5?g("delgado","delgada"):d<3?"peso normal":d<6?"algo de barriga":d<10?"sobrepeso":d<18?"obesidad":"obesidad mórbida"}
function mover(n){const y=G.yo;if(y.edad<216)y.altMod=Math.min(3,y.altMod+.03);y.imcD=Math.max(-4,y.imcD-(n||.06))}
function etapa(){const a=G.yo.edad/12;return a<2?"bebé":a<6?"infancia":a<12?"niñez":a<18?"adolescencia":a<65?"edad adulta":"vejez"}
function edadTxt(m){const a=Math.floor(m/12);return a<1?m+(m==1?" mes":" meses"):a+(a==1?" año":" años")}
function add(k,v){const y=G.yo;if(v>0)v*=multRasgo(k);y[k]=clamp(y[k]+v)}

  const p=.3+(ps.length?ps.reduce((q,x)=>q+x.rel,0)/ps.length/250:.2)+G.ofm*.12-(G.fe?.15:0);
  if(ch(p)){log(s+(ps.length?" Tus padres discuten toda la noche. Al final te hacen la maleta.":" En el centro firman los papeles sin leerlos."));log(entrarMagia())}
  else{G.ofm++;log(s+(ps.length?` ${tu(ps[0])} cierra la puerta: «En esta casa no hay brujos.»`:" El director del centro rompe la carta sin abrirla.")+" El cochero dice que volverá el año que viene.","mala")}
}
function finCursoMagia(){
  const y=G.yo,m=G.mg,H=CASASM[m.casa];m.en=false;m.h=false;m.anos++;
  const ok=(y.magia||0)>=m.anos*9;
  let s=ok?`Exámenes de fin de curso en Umbraluz: apruebas ${m.anos==1?"tu primer año":"el curso "+m.anos}.`:`Exámenes de fin de curso: suspendes dos materias. Te mandan deberes de verano que muerden.`;
  if(ch(clamp(.12+m.pts/120,0,.7))){logro(H.n+" gana la Llave de Invierno contigo en la casa");add("animo",8);s+=` ${H.n} gana la Llave de Invierno, el trofeo de las casas. Lo celebráis hasta el amanecer.`}
  log(s+" El carruaje te devuelve a casa para el verano.");
}
function eventoMagia(){

  const cs=vivos(q=>q.umb&&q.edad<216&&!q.rival),rv=vivos(q=>q.rival)[0],pf=vivos(q=>q.umb&&q.edad>=216&&q.oficio);
  ev(3,"mexamen",()=>{if((y.magia||0)>=(G.mg.anos+1)*8){magia(1);G.mg.pts+=3;log("Examen sorpresa de conjuros. Tu pluma levita a la primera. Puntos para "+H.n+".")}else{add("animo",-4);G.mg.pts-=1;log("Examen sorpresa. Tu pluma se prende fuego en vez de levitar.","mala")}});
  ev(2,"mcriatura",()=>{add("cuerpo",1);add("animo",3);log("Se escapa algo con demasiadas patas del aula de criaturas. Media escuela lo persigue por los pasillos; la otra media huye de él.")});
  if(rv)ev(3,"mrival",()=>{if(ch(.3+(y.magia||0)/150)){magia(2);rel(rv,6);add("animo",5);G.mg.pts+=2;log(`${rv.nombre} te reta delante de todos. Le desarmas con un conjuro limpio. Desde lejos, casi parece que te respeta.`)}else{add("animo",-5);rel(rv,-4);log(`${rv.nombre} te reta delante de todos y te deja con el pelo de color verde tres días.`,"mala")}});
  if(vivos(q=>q.rol=="prog").length)ev(2,"mcarta",()=>{add("animo",4);log("Llega una lechuza gris con carta de casa y un paquete de comida que huele a tu cocina.".replace("una lechuza gris","un cuervo mensajero"))});
  ev(2,"mbanquete",()=>{add("animo",6);cs.forEach(q=>rel(q,2));log("Banquete de solsticio en el gran comedor. Las velas flotan y la sopa canta, bajito.")});
  ev(2,"mpasillo",()=>{magia(1);add("mente",1);log("Encuentras un pasillo que ayer no estaba. Al final hay una puerta sin pomo. Mañana tampoco estará.")});
  if(pf.length)ev(2,"mayudante",()=>{const q=pick(pf);magia(3);rel(q,6);log(`${q.nombre}, ${q.oficio}, te elige de ayudante por un mes. Aprendes cosas que no vienen en el temario.`)});
  ev(2,"mcastigo",()=>{G.mg.pts-=3;add("animo",-3);log(`Alguien ha encantado las armaduras para que bailen. Castigan a todo ${H.n}: una semana fregando calderos sin magia.`,"mala")});
  if(G.mg.anos==0)ev(3,"mnostalgia",()=>{add("animo",-6);log("Echas de menos tu casa por las noches. El dormitorio es enorme y el viento del lago no se calla.","mala")},1);
  ev(2,"mcarrera",()=>{if(ch(.3+y.cuerpo/200)){G.mg.pts+=5;add("animo",6);log(`Carrera de escobas entre casas. Cruzas el último aro en cabeza. ${H.n} entero corea tu nombre.`)}else{add("salud",-3);log("Carrera de escobas entre casas. Te comes un torreón. Enfermería y dos días viendo doble.","mala")}});
  ev(2,"mhechizo",()=>{add("salud",-3);add("aspecto",-1);log("Un hechizo te sale al revés. Pasas una semana sin cejas.","mala")});
  ev(1,"mnuevo",()=>{const q=per("conoc",sx(),anios()+R(),pick(ORI[G.origen].ap),{con:true,umb:1,rel:ri(15,30),sitio:"de "+pick(CASASM).n,rasgo:ri(0,4)});log(`Llega a mitad de curso ${q.nombre}, ${q.sitio}. Dicen que le expulsaron de otra escuela.`)});
  ev(1,"mlago",()=>{magia(2);add("animo",-2);log("Algo enorme se mueve bajo el hielo del lago. Los mayores dicen que no se habla de eso.")});
  eventosMagiaExtra(ev,cs,rv,pf,H);
  if(!E.length)return;
  let tot=E.reduce((s,e)=>s+e[0],0),r=R()*tot,el=E[E.length-1];
  for(const e of E){if((r-=e[0])<=0){el=e;break}}
  G.rec.push(el[1]);if(G.rec.length>30)G.rec.shift();if(el[3])G.una[el[1]]=1;el[2]();
}
function accionesMagia(){

  A("Clase de pociones",()=>{magia(1.5);add("mente",1);return vario("mpoc",["Tu caldero hierve del color correcto por primera vez.","Picas raíces durante horas. La poción huele a tormenta.","Confundes dos frascos. El resultado te da hipo de colores."])});
  A("Cuidar criaturas",()=>{magia(1);add("animo",2);add("cuerpo",.5);return vario("mcri",["Das de comer a algo con plumas y malas pulgas. Te deja acariciarlo.","Cepillas a una bestia que duerme de pie. Ronca en dos tonos.","Te muerde algo pequeño y agradecido."])});
  A("Carreras de escoba",()=>{mover();magia(1);add("cuerpo",1.5);if(ch(.12)){add("salud",-3);return {txt:"Pierdes el control de la escoba y aterrizas en el invernadero.",mal:1}}return vario("mesc",["Vueltas al torreón hasta marearte. Cada vez giras más cerrado.","Aprendes a frenar. Era la parte importante.","Vuelas tan bajo sobre el lago que te mojas las botas."])});
  A("Explorar el castillo de noche",()=>{if(ch(.4)){magia(4);add("animo",3);return vario("mexp",["Detrás de un tapiz hay una biblioteca que nadie ha ordenado en un siglo. Te llevas un libro.","Encuentras una sala donde llueve hacia arriba. Practicas allí hasta el alba.","Un retrato te cuenta un atajo y un conjuro que ya no se enseña."])}
    if(ch(.5)){G.mg.pts-=3;add("animo",-3);return {txt:`Te pilla la ronda de noche fuera de la cama. Puntos menos para ${H.n} y miradas en el desayuno.`,mal:1}}
    return "Recorres pasillos helados sin encontrar nada. Aun así, mereció la pena."},"riesgo");
  const pe=vivos(q=>q.umb&&q.edad<240);
  if(pe.length)L.push({t:"Duelo de práctica con…",abre:()=>abrirHoja("¿Con quién te bates?",pe.map(p=>({t:p.nombre+" "+p.apellido,s:rolTxt(p),fn:()=>hacer(()=>{
    if(ch(.35+(y.magia||0)/160)){magia(2);rel(p,p.rival?4:2);G.mg.pts+=1;return `Duelo con ${p.nombre}. Su varita sale volando. Os dais la mano, más o menos.`}
    magia(1);return {txt:`Duelo con ${p.nombre}. Acabas colgando boca abajo a un metro del suelo.`,mal:1}})})))});
  const tr=candidatosTrato();
  if(tr.length)L.push({t:"Estar con…",abre:()=>abrirHoja("¿Con quién?",tr.map(p=>({t:p.nombre+" "+p.apellido,s:rolTxt(p)+" · vínculo "+Math.round(p.rel),fn:()=>menuPersona(p)})))});
  if(vivos(q=>q.rol=="prog").length)A("Escribir a casa",()=>{vivos(q=>q.rol=="prog").forEach(q=>rel(q,3));add("animo",2);return "Escribes a casa contando solo la mitad, para que no se preocupen."});
  A("Dejar pasar la quincena",()=>vario("mpasar",["Clases, deberes, sopa. Quince días iguales.","La quincena se va entre pergaminos."]),"sec");
  return L;
}

   {t:"Intentar ganártelo",s:"Lento, pero puede acabar en amistad",fn:()=>resolver(()=>{if(ch(.2+y.carisma/200)){rel(b,15);if(b.rel>=40){b.bully=0;return `Un día ${b.nombre} te cuenta, sin mirarte, cómo están las cosas en su casa. Desde entonces os sentáis juntos.`}return `Le hablas como a una persona. ${b.nombre} no sabe qué hacer con eso y te deja en paz, por hoy.`}add("animo",-4);return {txt:`Intentas ser amable con ${b.nombre}. Lo usa para reírse más.`,mal:1}})},

/* ---- Telenovela familiar ---- */
function ten(n){G.tension=clamp((G.tension||0)+n)}
function ambiente(){const t=G.tension||0;return t<20?"tranquilo":t<45?"tenso":t<70?"se corta con cuchillo":"irrespirable"}
function separar(txt){
  const ps=vivos(q=>q.rol=="prog"&&q.casa);if(ps.length<2)return false;
  const pa=ps.find(q=>q.sexo=="m")||ps[0];pa.casa=false;G.fl.sep=1;add("animo",-12);if(G.riqueza>0)G.riqueza--;
  log(txt+` ${pa.nombre} se lleva dos maletas y un silencio enorme.`,"mala");return true;
}
function malmeter(p,q){
  ten(10);
  if(ch(.3)){rel(p,-10);rel(q,-10);return {txt:`Le cuentas a ${tu(p)} lo que supuestamente dijo ${tu(q)}. Atan cabos en dos días y los dos saben de dónde salió.`,mal:1}}
  rel(p,4);return vario("malm",[`Le cuentas a ${tu(p)} lo que dijo ${tu(q)}, exagerando lo justo. En la siguiente comida no se pasan ni la sal.`,`Dejas caer delante de ${tu(p)} un comentario sobre ${tu(q)}. Prende solo.`,`«Yo no quiero meterme, pero…» ${tu(p)} ya no mira igual a ${tu(q)}.`]);
}

  if(G.muerteDirecta){const c=G.muerteDirecta;delete G.muerteDirecta;G.yo.edad++;muerteYo(c)}
  else if(enMagia()){G.mg.f=((G.mg.f||0)+1)%3;if(!G.mg.f)tick()} // en Umbraluz cada mes da para dos acciones
  else tick();
  TAB="diario";guardar();cerrarHoja();render(true);
}

const TRAZOS={travieso:["travieso","traviesa"],estudioso:["estudioso","estudiosa"],inquieto:["inquieto","inquieta"],sociable:["sociable","sociable"],responsable:["responsable","responsable"],
 sonador:["soñador","soñadora"],solitario:["solitario","solitaria"],rebelde:["rebelde","rebelde"],disciplinado:["disciplinado","disciplinada"],presumido:["presumido","presumida"],
 trabajador:["trabajador","trabajadora"],honrado:["honrado","honrada"],tramposo:["tramposo","tramposa"],leal:["leal","leal"],chivato:["chivato","chivata"],generoso:["generoso","generosa"],
 egoista:["egoísta","egoísta"],valiente:["valiente","valiente"],prudente:["prudente","prudente"]};
const OPUESTO={honrado:"tramposo",tramposo:"honrado",leal:"chivato",chivato:"leal",generoso:"egoista",egoista:"generoso",valiente:"prudente",prudente:"valiente"};
const MULT={mente:["estudioso",1.2],cuerpo:["inquieto",1.15],carisma:["sociable",1.2],aspecto:["presumido",1.2],animo:["sonador",1.1]};
function tiene(k){return !!(G.rasgos&&G.rasgos.includes(k))}
function multRasgo(k){const m=MULT[k];return (m&&tiene(m[0])?m[1]:1)*(k=="cuerpo"&&tiene("disciplinado")?1.1:1)}
function trazoTxt(k){return TRAZOS[k][G.yo.sexo=="m"?0:1]}
function rasgosTxt(){return (G.rasgos||[]).map(trazoTxt).join(", ")}
function cuenta(t){G.cn=G.cn||{};G.cn[t]=(G.cn[t]||0)+1}
function ponRasgo(k){G.rasgos=G.rasgos||[];if(G.rasgos.includes(k))return false;const o=OPUESTO[k];if(o)G.rasgos=G.rasgos.filter(x=>x!=o);G.rasgos.push(k);if(G.rasgos.length>5)G.rasgos.shift();return true}
function moral(k,n){ // las decisiones van dejando fama
  n=n||1;G.mor=G.mor||{};G.mor[k]=(G.mor[k]||0)+n;const o=OPUESTO[k];if(o)G.mor[o]=(G.mor[o]||0)-n;
  if(G.mor[k]>=2&&ponRasgo(k))return ` Se te va quedando fama de ${trazoTxt(k)}.`;return "";
}
function rasgosInfancia(){
  const c=G.cn||{},n=k=>c[k]||0,am=vivos(p=>p.con&&["vec","comp","conoc"].includes(p.rol)&&p.rel>=50).length;
  const s={travieso:n("Hacer una trastada")*1.5,estudioso:n("Estudiar")+n("Leer y curiosear")*.7,inquieto:n("Hacer deporte")+n("Correr y trepar"),sociable:n("Jugar en la calle")+am*3,
    responsable:n("Ayudar en casa")*1.5,sonador:n("Jugar a tu aire")+n("Dibujar")+n("Preguntar por qué")*.5,solitario:am==0?9:0};
  let l=Object.keys(s).filter(k=>s[k]>=6).sort((p,q)=>s[q]-s[p]).slice(0,2);
  if(l.includes("solitario")&&l.includes("sociable"))l=l.filter(k=>k!="solitario");
  if(!l.length)l=[G.yo.mente>=G.yo.cuerpo?"sonador":"inquieto"];
  l.forEach(ponRasgo);G.cn12=Object.assign({},c);
  log(`Con doce años ya se te ve el carácter: eres ${l.map(trazoTxt).join(" y ")}. Eso abre unas puertas y entorna otras.`);
}
function rasgosJuventud(){
  const c=G.cn||{},b=G.cn12||{},n=k=>(c[k]||0)-(b[k]||0);
  const s={rebelde:n("Saltarte clases")*1.5+n("Beber en el parque")*.7+(G.fl.fuma?3:0),disciplinado:n("Estudiar")*.5+n("Hacer deporte")*.5,presumido:n("Cuidar tu aspecto"),trabajador:n("Trabajillo de verano")*3};
  if(s.rebelde>=9)s.disciplinado=0;
  const k=Object.keys(s).filter(x=>s[x]>=(x=="rebelde"?9:5)).sort((p,q)=>s[q]-s[p])[0];
  if(k&&ponRasgo(k))log(`A los dieciocho el carácter termina de cuajar: además, ${trazoTxt(k)}.`);
}

/* ---- Hijos y nietos ---- */
const CARH=[["aplicado","aplicada"],["rebelde","rebelde"],["sensible","sensible"],["independiente","independiente"]];
function hijoIni(h){if(h.rumbo==null){h.rumbo=ri(35,65);h.car=ri(0,3)}return h}
function eventosHijos(ev,a){
  const y=G.yo,hj=vivos(q=>q.rol=="hijo"&&!q.secreto&&q.con);if(!hj.length)return;
  const q=hijoIni(pick(hj)),e=q.edad/12,c=CARH[q.car][q.sexo=="m"?0:1];
  if(e>=3&&e<12&&q.casa)ev(3,"hijocrio",()=>{rel(q,ri(2,5));add("animo",3);log(vario("hijocrio",[`${q.nombre} te pide que mires debajo de la cama por si hay monstruos. Miras. No hay. Por si acaso, miras otra vez.`,`${q.nombre} te regala un dibujo en el que eres más alto que la casa.`,`A ${q.nombre} se le cae el primer diente. Negocias con el ratón una tarifa razonable.`,`${q.nombre} pasa la noche con fiebre. Tú la pasas con la mano en su frente.`,`${q.nombre} aprende a montar en bici. Sueltas el sillín sin avisar y funciona.`,`${q.nombre} pregunta de dónde vienen los niños en mitad del supermercado, a voces.`,`Función del colegio. ${q.nombre} hace de árbol y saluda todo el rato. El mejor árbol.`,`${q.nombre} te dice que eres la persona más fuerte del mundo. No le corriges.`]))});
  if(e>=7&&e<17&&q.casa)ev(2,"hijotutor",()=>{const b=q.rumbo>=55;add("animo",b?4:-4);log(b?vario("tutB",[`Tutoría de ${q.nombre}: «Ojalá tuviera treinta como ${gp(q,"él","ella")}.» Sales flotando.`,`${q.nombre} gana un premio en el colegio. Aplaudes hasta que te duelen las manos.`,`A ${q.nombre} le va bien sin que tengas que estar encima. Es ${c}, y se nota.`]):vario("tutM",[`Tutoría de ${q.nombre}: tres suspensos y «no es mal chaval, pero…».`,`Encuentras las notas de ${q.nombre} escondidas en el fondo de la mochila. Con razón.`,`${q.nombre} va a la deriva este curso. Hablas, hablas y no sabes si te oye.`]),b?"":"mala")});
  if(e>=13&&e<18&&q.casa)ev(2,"hijoadol",()=>{rel(q,ri(-4,3));log(vario("hijoadol",[`${q.nombre} te contesta con monosílabos durante un mes entero. Uno de ellos es «vale».`,`${q.nombre} te dice que no entiendes nada. Lo peor es que te acuerdas de haberlo dicho tú.`,`Descubres que ${q.nombre} tiene una vida entera de la que no sabes nada. Es lo normal. Duele igual.`,`${q.nombre} te pide que le dejes a dos calles del instituto, no en la puerta.`,`Una tarde, sin venir a cuento, ${q.nombre} se sienta a tu lado en el sofá y ve la tele contigo. No dices nada, por no romperlo.`]))});
  if(e>=18&&!q.salida)ev(4,"hijosalida"+q.id,()=>{q.salida=1;const r=q.rumbo;
    if(r>=65){add("animo",8);log(`${q.nombre} entra en la universidad. Le ayudas con la matrícula y con las cajas. Vuelves a casa presumiendo sin disimulo.`)}
    else if(r>=40){add("animo",3);log(`${q.nombre} encuentra su primer trabajo. Te enseña la nómina como si fuera un diploma.`)}
    else if(r>=25){add("animo",-4);log(`${q.nombre} deja los estudios y encadena trabajos de un mes. «Ya veré», dice a todo.`,"mala")}
    else{add("animo",-8);y.dinero-=Math.min(Math.max(0,y.dinero),600);log(`Te llaman de comisaría de madrugada: ${q.nombre}. Pagas lo que hay que pagar y volvéis a casa en un taxi, sin hablar.`,"mala")}},1);
  if(e>=24&&!q.conyuge&&q.rumbo>=30)ev(2,"hijoboda"+q.id,()=>{const sc=ch(.9)?(q.sexo=="m"?"f":"m"):q.sexo,c2=per("conoc",sc,e+ri(-4,5),pick(ORI[G.origen].ap),{con:true,rel:ri(30,50),de:q.id,casado:true,oficio:gp({sexo:sc},"tu yerno","tu nuera")});q.conyuge=c2.id;q.casa=false;
    const n=Math.min(Math.max(0,y.dinero),ri(5,30)*100);y.dinero-=n;add("animo",8);log(`Se casa ${q.nombre}, con ${c2.nombre}. Lloras en el discurso, bailas fatal y pones ${n} para el banquete.`)},1);
  if(e>=25&&q.conyuge&&viv(q.conyuge)&&e<45&&vivos(p=>p.rol=="nieto"&&p.de==q.id).length<3)ev(2,"nieto"+q.id,()=>{const n=per("nieto",sx(),0,q.apellido,{con:true,rel:60,de:q.id});add("animo",10);
    if(!G.fl.abu){G.fl.abu=1;logro("nace tu primer nieto, "+n.nombre)}log(`${q.nombre} te hace ${g("abuelo","abuela")}: nace ${n.nombre}. Cabe en un antebrazo y ya manda en toda la familia.`)});
  if(e>=20&&!q.casa)ev(2,"hijollama",()=>{if(q.rel>=60){add("animo",4);rel(q,2);log(vario("hijoB",[`${q.nombre} te llama cada domingo, puntual. Habláis de nada en concreto durante una hora.`,`${q.nombre} se presenta con comida hecha «porque había sobrado». No había sobrado.`,`${q.nombre} te pide consejo para algo serio. Te lo piensas mucho antes de contestar.`]))}
    else if(q.rel<35){add("animo",-5);log(vario("hijoM",[`Hace meses que no sabes nada de ${q.nombre}. Te enteras de sus cosas por terceros.`,`Llamas a ${q.nombre}. Salta el buzón. Dejas un mensaje demasiado largo.`,`${q.nombre} olvida tu cumpleaños. Dices que no importa.`]),"mala")}
    else log(`${q.nombre} pasa por casa de vez en cuando. Se queda poco, pero viene.`)});
  const nt=vivos(p=>p.rol=="nieto"&&p.edad>=24&&p.edad<14*12);
  if(nt.length)ev(2,"nietos",()=>{const n=pick(nt);rel(n,ri(3,6));add("animo",5);log(vario("nietos",[`Te dejan a ${n.nombre} el fin de semana. Le das todo lo que sus padres le prohíben.`,`${n.nombre} te pide que le cuentes cómo era todo «en la antigüedad», o sea, cuando tú eras joven.`,`Recoges a ${n.nombre} del colegio. Te presenta a sus amigos como si fueras famoso.`,`${n.nombre} te gana a las cartas y sospechas que no le has dejado.`]))});
}

/* ---- Dinero: casa, coche, negocio, ruina ---- */
const PRECIO=[45000,70000,110000,180000,350000];
const NEGOCIOS=[["un bar",15000,"carisma"],["una tienda de barrio",12000,"carisma"],["un taller",20000,"cuerpo"],["una academia",10000,"mente"],["una tienda por internet",6000,"mente"],["un restaurante",40000,"carisma"]];
function patrimonio(){const y=G.yo;return Math.round(y.dinero+(G.prop?G.prop.v-G.prop.deuda:0)+(G.neg?G.neg.inv*G.neg.sal/60:0)+(G.coche?G.coche.v:0))}
function menuDinero(){
  const y=G.yo,a=anios(),ops=[],H=(t,s,fn,ok)=>ops.push(ok===false?{t,s,fn:()=>{}}:{t,s,fn:()=>hacer(fn)});
  if(G.indep&&!G.prop){const v=PRECIO[G.riqueza],en=Math.round(v*.2),cu=Math.round(v*.8*1.35/300);
    H("Comprar una casa",y.dinero>=en?`Entrada de ${en} · hipoteca de ${cu} al mes, 25 años`:`Te falta para la entrada: ${en}`,()=>{y.dinero-=en;G.prop={v,deuda:Math.round(v*.8*1.35),cuota:cu};add("animo",8);logro("compras tu casa");
      return `Firmas la hipoteca con un bolígrafo atado a una cadenita. ${G.casa.tipo.charAt(0).toUpperCase()+G.casa.tipo.slice(1)} es tuya, y del banco, durante veinticinco años.`},y.dinero>=en)}
  if(G.prop)H("Vender la casa",`Vale ${G.prop.v}`+(G.prop.deuda>0?` · debes ${Math.round(G.prop.deuda)}`:" · pagada"),()=>{const n=Math.round(G.prop.v-G.prop.deuda);y.dinero+=n;G.prop=null;return `Vendes la casa. Después de cancelar con el banco te quedan ${n}. Vuelves a pagar alquiler.`});
  if(!G.coche){H("Comprar un coche de segunda mano",y.dinero>=3000?"3000 · 50 al mes de gastos":"Te faltan 3000",()=>{y.dinero-=3000;G.coche={n:"un coche con muchos kilómetros",v:2500};add("animo",4);return "Compras un coche con muchos kilómetros y un ambientador de pino. Arranca a la segunda. Es tuyo."},y.dinero>=3000);
    H("Comprar un coche nuevo",y.dinero>=18000?"18000 · se nota al llegar":"Te faltan 18000",()=>{y.dinero-=18000;G.coche={n:"un coche nuevo",v:15000,bueno:1};add("animo",8);add("aspecto",3);return "Sales del concesionario oliendo a nuevo. Das una vuelta de más por el barrio, despacio, con la ventanilla bajada."},y.dinero>=18000)}
  else H("Vender el coche","Te dan "+Math.round(G.coche.v*.8),()=>{y.dinero+=Math.round(G.coche.v*.8);if(G.coche.bueno)add("aspecto",-3);G.coche=null;return "Vendes el coche. Redescubres el autobús y sus horarios."});

function matizar(t,r){
  if(typeof r!="string"||anios()<3||G.muerto)return r;
  const l=VAR[t];
  if(l&&ch(.5)&&r.length<120&&!/\d|Conoces|Te ascienden/.test(r)&&!RE_CLAVE.test(r)){const ok=l.filter(v=>v.c());if(ok.length){const v=pick(ok);r=vario("var"+t+l.indexOf(v),v.tx)}}
  if(ch(.16)){const ok=COLAS.filter(v=>v.c());if(ok.length)r+=pick(pick(ok).tx)}
  return r+fatiga(t);
}

    op.push(()=>{p.triste=true;p.ult="estuvo en el hospital en "+ano();return via+`${tu(p)} ha estado ingresado. Ya está en casa, más delgado y más callado.`.replace("ingresado",gp(p,"ingresado","ingresada")).replace("delgado",gp(p,"delgado","delgada")).replace("callado",gp(p,"callado","callada"))});
    op.push(()=>{p.ult="lo detuvieron en "+ano();return via+`a ${tu(p)} se lo llevó la policía una mañana. Volvió a los dos días. Nadie sabe por qué y todo el mundo tiene una teoría.`});
    const q=pick(pool.filter(x=>x.id!=p.id));
    if(q)op.push(()=>{const mot=pick(["una plaza de garaje","una herencia","un dinero prestado","algo que se dijo en una boda","un árbol que da sombra donde no debe","el ruido de una tele"]);p.ult=q.ult="dejaron de hablarse en "+ano();
      if(p.rel>=45&&q.rel>=45&&a>=16&&!G.pend){decidir("bando",{a:p.id,b:q.id});return `${N} y ${tu(q)} han dejado de hablarse por ${mot}. Los dos te buscan para contarte su versión, y los dos esperan que elijas.`}
      return via+`${tu(p)} y ${tu(q)} han dejado de hablarse por ${mot}. Cruzan de acera con una coordinación admirable.`});
    log(pick(op)())});
}

/* ---- Dejar pasar un año: un solo párrafo ---- */
function pasarAnio(){
  G.tn=(G.tn||0)+1;
  const y=G.yo,l0=G.lid||0,d0=y.dinero,s0=y.salud,a0=y.edad,n0=vivos(p=>p.con).length;
  for(let i=0;i<12&&!G.muerto&&!G.pend;i++)tick();
  const nuevas=G.log.filter(e=>e.i>l0),clave=e=>e.t=="tit"||/clave|mala|fin/.test(e.cls||"");
  const resto=nuevas.filter(e=>!clave(e));
  if(resto.length>3){
    G.log=G.log.filter(e=>!(e.i>l0)||clave(e));
    const m=y.edad-a0,dd=Math.round(y.dinero-d0),ds=Math.round(y.salud-s0),frases=resto.map(e=>e.txt).sort(()=>R()-.5).slice(0,3);
    let s=`Dejas correr ${m>=12?"un año entero":m+" meses"}. `+frases.join(" ")+" "+(resto.length>3?`Y ${resto.length-3} cosas más que no cambian nada. `:"");
    if(anios()>=16&&Math.abs(dd)>=100)s+=dd>0?`Acabas con ${dd} más en el bolsillo. `:`Se te van ${-dd}. `;
    if(Math.abs(ds)>=4)s+=ds>0?"Te encuentras mejor que hace un año.":"El cuerpo te lo va notando.";
    const k=G.log.findIndex(e=>e.i>l0),ent={t:"caja",txt:s.trim(),cls:"",n:G.tn,i:l0+.5,tag:edadTxt(a0)+" → "+edadTxt(y.edad)};
    if(k<0)G.log.push(ent);else G.log.splice(k,0,ent);
  }else{const m=y.edad-a0,k=G.log.findIndex(e=>e.i>l0),ent={t:"caja",txt:`Dejas correr ${m>=12?"un año entero":m+(m==1?" mes":" meses")}.`,cls:"",n:G.tn,i:l0+.5,tag:edadTxt(a0)+" → "+edadTxt(y.edad)};
    if(k<0)G.log.push(ent);else G.log.splice(k,0,ent)}
  guardar();render(true);
}

const ASIG=[
 {k:"conj",t:"Conjuros",mg:2.5,st:"mente",a:["Repites el gesto de muñeca hasta que sale una chispa. Es amarilla y huele a tostada.","Haces levitar una pluma. Sube, duda y se te posa en la nariz.","Aprendes a encender una vela desde tu pupitre. Enciendes también la manga del de delante.","Hoy toca apagar cosas. Es más difícil que encenderlas."],b:["Tu conjuro de escudo aguanta tres impactos seguidos. El cuarto te sienta en el suelo.","Conjuros sin palabras: una hora mirando fijamente una piedra, hasta que se mueve por lástima.","Encadenas dos conjuros en un solo gesto. El aula se queda en silencio.","Practicáis contrahechizos por parejas. Sales con el pelo de otro color, pero aprendido."]},
 {k:"poc",t:"Pociones",mg:1.5,st:"mente",a:["Tu caldero hierve del color correcto por primera vez. Lo miras como a un hijo.","Picas raíces durante una hora. La poción huele a tormenta y a pies.","Confundes dos frascos. Hipo de colores hasta la cena.","Remueves siete veces a la derecha y una a la izquierda. A la octava ya no sabes por cuál vas."],b:["Destilas una poción de sueño tan limpia que el maestro se guarda un frasco.","Un filtro de memoria. Lo pruebas y recuerdas dónde dejaste un calcetín hace tres años.","Tu antídoto funciona. Menos mal, porque el veneno también era tuyo.","Trabajas con ingredientes que hay que recoger de noche. Te dan un permiso firmado."]},
 {k:"cri",t:"Criaturas",mg:1,st:"animo",a:["Das de comer a algo con plumas y malas pulgas. Al final te deja acariciarlo.","Cepillas a una bestia que duerme de pie. Ronca en dos tonos.","Te muerde algo pequeño y agradecido.","Hoy tocan los huevos de la incubadora. Uno se mueve cuando le hablas."],b:["Te dejan entrar solo al cercado grande. Lo que hay dentro te huele y te da el visto bueno.".replace("solo",()=>"a solas"),"Curas el ala de un animal que no sale en ningún libro de fuera.","Aprendes a no mirar a los ojos a según qué cosas.","Ayudas en un parto en el establo, de madrugada. Nace con tres colas, todas sanas."]},
 {k:"vue",t:"Vuelo",mg:1,st:"cuerpo",a:["Primera clase de escoba: se eleva un palmo y se queda ahí, temblando contigo encima.","Aprendes a frenar, que era la parte importante.","Das la vuelta al patio a dos metros del suelo. Te parece el techo del mundo.","Te caes en la arena blanda. Te subes otra vez antes de pensarlo."],b:["Vueltas al torreón cada vez más cerradas. Rozas la piedra con el hombro.","Vuelas tan bajo sobre el lago que te mojas las botas.","Picado desde la torre del reloj y remontada a un metro del suelo. El profesor finge no haberlo visto.","Vuelo nocturno con farol. Desde arriba, el castillo parece de juguete."]},
 {k:"his",t:"Historia del Pozo",mg:.5,st:"mente",a:["Os cuentan quién encontró el Pozo y por qué construyó un castillo alrededor en vez de taparlo.","Copias una lista de directores. Uno tiene el nombre raspado del pergamino.","Hoy tocan las cuatro casas y por qué nunca se han llevado bien del todo.","La profesora habla del año en que el Pozo se secó tres días. Nadie sabe por qué volvió."],b:["Lees actas antiguas. Hay un curso entero del que faltan páginas, arrancadas de cuajo.","Estudiáis a los magos que quisieron más agua de la que les tocaba. Ninguno acabó bien.","Un debate en clase: ¿de quién es el Pozo? La profesora os deja discutir y no da la respuesta.","Descubres que el castillo es más viejo que el país donde está."],sab:1},
 {k:"her",t:"Invernadero",mg:1,st:"salud",a:["Trasplantas algo que grita bajito cuando lo sacas de la maceta.","Riegas plantas que se giran a mirarte.","Una enredadera te quita el gorro y no hay forma de que te lo devuelva.","Aprendes qué hojas curan y cuáles no hay que oler."],b:["Cultivas tu propia mandrágora mansa. La sacas a pasear en maceta.","Injertas dos plantas que no deberían llevarse bien. Se llevan.","Recoges esporas con guantes hasta el codo y la respiración contenida.","El invernadero número tres solo abre a los mayores. Hoy entras."]},
 {k:"run",t:"Runas",mg:2,st:"mente",min:3,a:["Aprendes las doce runas primeras. Las confundes todas con la séptima.","Grabas una runa de calor en una piedra. La llevas en el bolsillo todo el invierno."],b:["Lees una inscripción del sótano que nadie había traducido. Dice «no bajar».","Runas encadenadas: una frase entera que cierra una puerta sin tocarla.","Te sale una runa nueva por error. El profesor la copia en su cuaderno."]},
 {k:"due",t:"Duelo",mg:2.5,st:"cuerpo",min:4,a:["Saludo, tres pasos, giro. Hoy solo se practica el saludo."],b:["Desarmas a tu pareja de prácticas dos veces seguidas.","Te enseñan a caer. Luego te enseñan por qué hacía falta.","Duelo a ciegas, con los ojos vendados. Aprendes a escuchar las varitas.","Aguantas un asalto entero contra el profesor. Te deja ganar el último intercambio. O no."]},

function agravio(){const l=["todas las veces que agachaste la cabeza","lo poco que te ha regalado nadie"];

  if(G.fl.sinPadre)l.push("un padre del que en casa nadie hablaba");
  if(G.riqueza==0)l.push("todas las neveras vacías");
  if(G.fl.mesesCarcel)l.push("los años que te quitaron ahí dentro");
  if(G.fl.antec)l.push("cada puerta que se cerró al leer tus antecedentes");
  if(G.fl.viudo)l.push("la cama que se quedó a medias");
  if(!G.trabajo)l.push("todos los «ya le llamaremos»");
  if(G.gente.some(p=>p.ex))l.push("quien se fue sin mirar atrás");

 arte:{tx:["Te pasas una tarde entera con un solo color, a ver hasta dónde llega.","Dibujas en el autobús a un señor dormido. Se despierta a media nariz.","Rompes un dibujo que no salía. El siguiente sale.","Alguien te pide que le hagas un retrato. Te pones más nervioso que él.","Copias a un maestro antiguo, línea a línea, para robarle el truco."],
  h:{6:"llenas tu primer cuaderno de dibujo",18:"cuelgan un dibujo tuyo en una pared que no es la de tu casa",40:"encuentras un trazo que ya es solo tuyo",80:"vendes tu primera obra a un desconocido"},
  est:{n:"un año en una residencia de artistas, con exposición al final",sit:"de la residencia de artistas",tx:["Te dan un estudio con luz del norte y una llave. Nadie te dice qué pintar. Eso es lo difícil.","Los demás residentes discuten de arte hasta las tres. Tú escuchas y te lo llevas todo al lienzo.","Una galerista pasa por los estudios sin decir nada. En el tuyo se queda cuatro minutos. Los cuentas.","Semana en blanco. Miras la pared. La pared gana.","Montáis la exposición colectiva. Tus cuadros, vistos colgados, parecen de otra persona con más talento.","Un crítico escribe dos líneas sobre ti. Te las aprendes de memoria."],ok:"La exposición cierra con tres puntos rojos junto a tus cuadros: vendidos. Te vas con una carpeta de contactos y un nombre que alguien, en algún despacho, ya recuerda.",ko:"La exposición pasa sin ruido. Nadie compra. Pero en un año has pintado más que en los diez anteriores, y eso no te lo quita nadie.",logro:"expones tras un año de residencia artística"},
  op:{tit:"Un encargo",txt:"El dueño de un bar quiere un mural en la pared del fondo. Paga, pero quiere «algo alegre, con palmeras».",a:["Pintar las palmeras","Pintas las palmeras más dignas que se han pintado. Cobras y la gente se hace fotos delante."],b:["Pintar lo que tú quieras","Pintas lo tuyo. Al dueño le cuesta una semana acostumbrarse. A los clientes, un día."]}},
 futbol:{tx:["Juegas un partido entero de lateral, que no es lo tuyo. Aprendes a mirar el campo desde otro sitio.","Te quedas solo en el campo ensayando centros hasta que apagan los focos.","Un veterano te enseña a usar el cuerpo sin hacer falta.","Ves partidos antiguos parando la imagen cada diez segundos.","Fallas un penalti en un entrenamiento. Tiras veinte más."],
  h:{6:"marcas tu primer gol en un partido de verdad",18:"te dan el brazalete de capitán",40:"un ojeador apunta tu nombre en una libreta",80:"firmas autógrafos a críos del barrio"},
  est:{n:"una temporada cedido en un club de otro país",sit:"del club extranjero",tx:["No entiendes el idioma del vestuario, pero el del balón es el mismo.","Aquí se entrena el doble y se habla la mitad.","Te sientan en el banquillo cuatro partidos seguidos. Aprendes a tragar.","Sales en el minuto setenta y cambias el partido. El entrenador no dice nada: te pone de titular.","La grada canta tu nombre mal pronunciado. Te suena a gloria.","Echas de menos la comida de casa con una intensidad que no esperabas."],ok:"Acabas la temporada como titular. Vuelves con otro fútbol en las piernas y dos clubes preguntando por ti.",ko:"Una lesión a mitad de temporada te deja viendo los partidos desde la grada. Vuelves más duro, que también cuenta.",logro:"juegas una temporada en el extranjero"},
  op:{tit:"Un partido que no es tuyo",txt:"Un equipo de otro barrio te ofrece dinero por jugar con ellos la final contra el tuyo de siempre.",a:["Aceptar el dinero","Juegas contra los tuyos y marcas. Nadie te saluda al salir. El sobre pesa."],b:["Decir que no","Dices que no. Tu equipo pierde igual, pero te invitan a todo en el bar durante un mes."]}},
 baloncesto:{tx:["Juegas contra uno más alto y aprendes a usar el cuerpo para ganar la posición.","Mil pases contra la pared, con las dos manos.","Estudias vídeos de tus errores. Hay más de los que recordabas.","Un triple sobre la bocina en un amistoso. Lo celebras como una final.","Entrenas la mano débil hasta que deja de avergonzarte."],
  h:{6:"metes tu primer triple en partido",18:"eres el máximo anotador de tu equipo",40:"te seleccionan para un campus de tecnificación",80:"cuelgan tu camiseta en el pabellón de tu colegio"},
  est:{n:"un año en una academia de baloncesto en el extranjero",sit:"de la academia",tx:["Aquí todos son tan altos como tú o más. Se acabó ganar por centímetros.","Seis horas de pista al día y dos de vídeo.","Te ponen a defender al mejor en cada entrenamiento. Acabas odiándole y debiéndole media carrera.","Un partido contra un equipo profesional. Pierdes por treinta y aprendes por cien.","El entrenador te cambia la mecánica de tiro. Durante un mes no metes ni una.","La mecánica nueva empieza a entrar. Mucho."],ok:"Sales de la academia con una oferta encima de la mesa y un tiro que no tenías.",ko:"No destacas entre tantos buenos. Vuelves sabiendo exactamente lo que te falta.",logro:"te formas un año en una academia de baloncesto"},
  op:{tit:"Tres contra tres",txt:"Montan un torneo callejero con premio en metálico. Las reglas son pocas y los codos, muchos.",a:["Apuntarte","Tres partidos, un labio partido y la final. Os lleváis el premio y una fama en las pistas."],b:["Seguir con tu rutina","Te quedas tirando a canasta. Sin público, que es como se mejora."]}},
 deporte:{tx:["Sales a rodar con lluvia. No hay nadie más en el parque. Por eso mejoras.","Te cronometra alguien que no te regala ni una décima.","Trabajas la salida hasta que el disparo ya no te sobresalta.","Un día malo: las piernas no van. Terminas igual.","Bajas de una marca que hace un año te parecía de otros."],
  h:{6:"terminas tu primera carrera con dorsal",18:"subes a un podio",40:"bates el récord de tu club",80:"te clasificas para un campeonato nacional"},
  est:{n:"un año en un centro de alto rendimiento en altitud",sit:"del centro de alto rendimiento",tx:["Arriba falta el aire. Los primeros días subes las escaleras parando.","Entrenas con gente que ha ido a unos Juegos. Desayunan lo mismo que tú y corren otra cosa.","Te miden todo: la sangre, el sueño, la zancada.","Una sobrecarga te deja dos semanas en la piscina. Odias la piscina.","Bajas tu marca en un control interno. El técnico asiente una sola vez.","Corres al amanecer con las montañas rosas. Hay días que esto es un trabajo y días que es un regalo."],ok:"Bajas al nivel del mar y vuelas: marca personal por mucho, y plaza en el equipo.",ko:"El cuerpo no asimila la carga y llegas pasado de forma a la competición. Aprendes dónde está tu límite, que es saber mucho.",logro:"entrenas un año en un centro de alto rendimiento"},
  op:{tit:"Una liebre",txt:"Te ofrecen dinero por hacer de liebre en una carrera: marcar el ritmo para que otro bata el récord, y retirarte.",a:["Hacer de liebre","Tiras durante dos tercios al ritmo exacto y te apartas. El récord cae. Nadie recordará tu nombre, pero te pagan bien."],b:["Correr para ti","Corres tu carrera. Quedas sexto, con tu mejor marca. Sin sobre."]}},
 judo:{tx:["Caes cincuenta veces para aprender a caer una.","Un compañero más ligero te tira con una técnica que no viste venir. Se la pides.","Trabajas el agarre hasta que se te pelan los dedos.","Combates con los ojos cerrados un minuto. Se siente todo.","El maestro te corrige un pie. Cambia todo."],
  h:{6:"cambias de cinturón",18:"ganas un combate por ippon",40:"te ciñes el cinturón marrón",80:"te ciñes el cinturón negro"},
  est:{n:"un año entrenando en un dojo de Japón",sit:"del dojo",tx:["Aquí se barre el tatami antes de pisarlo. Barres mucho.","Nadie te explica nada dos veces. Aprendes mirando.","Te tira un hombre de sesenta años sin despeinarse. Te inclinas y vuelves a por más.","Entrenamiento de invierno, a las cinco de la mañana, con las ventanas abiertas.","El maestro te dice una sola palabra en todo el mes. Era un elogio. Te lo traducen después.","Empiezas a tirar a gente que antes te tiraba."],ok:"Vuelves con un judo limpio, sin un gesto de más. En el primer torneo no te dura nadie un minuto.",ko:"Una lesión de hombro te para a medio año. Aprendes a mirar, que allí también es entrenar.",logro:"entrenas un año en un dojo de Japón"},
  op:{tit:"Portero de discoteca",txt:"Un local busca a alguien que sepa reducir a un borracho sin romperlo. Paga bien las noches de fin de semana.",a:["Aceptar","Un mes de puerta. No pegas a nadie: los sientas. Los dueños nunca habían visto algo así."],b:["Rechazarlo","El judo no es para eso, dices. El maestro se entera y te da clase gratis un mes."]}},
 musica:{tx:["Grabas un ensayo y te escuchas. Duele. Sirve.","Aprendes una canción que odias porque tiene justo lo que no sabes hacer.","Tocas en la calle una tarde. Sacas para merendar y un aplauso sincero.","Un acorde nuevo te cambia tres canciones.","Tocas con alguien mucho mejor que tú. Sales agotado y distinto."],
  h:{6:"tocas una canción entera sin pararte",18:"das tu primer concierto con público que no es de tu familia",40:"grabas una maqueta",80:"suena algo tuyo en la radio"},
  est:{n:"un año de gira como músico de acompañamiento",sit:"de la gira",tx:["Furgoneta, prueba de sonido, bolo, furgoneta. Así se llama esta vida.","Tocas la misma canción por cuadragésima vez y esta noche, sin saber por qué, es la mejor.","Un teatro precioso con doce personas. Tocáis como si fueran mil.","Se rompe una cuerda en mitad del solo. Sigues con cinco.","El cantante pierde la voz y cantas tú dos temas. Nadie pide que le devuelvan la entrada.","Duermes en un hostal donde las paredes oyen. Compones algo allí."],ok:"Acaba la gira y el productor te pregunta si tienes canciones propias. Las tienes.",ko:"La gira se cancela a medias por falta de público. Vuelves con callos nuevos y una libreta llena.",logro:"pasas un año de gira"},
  op:{tit:"Una boda",txt:"Te ofrecen tocar en una boda: cuatro horas de pasodobles y éxitos del verano, bien pagadas.",a:["Tocar en la boda","Tocas lo que piden. A las tres de la mañana un tío del novio llora con una ranchera. Cobras y repites al mes siguiente."],b:["No vender el alma","Te quedas ensayando lo tuyo. Sale una canción nueva. Vale más que el sobre, o eso te dices."]}},
 teatro:{tx:["Te toca un papel de tres frases. Les buscas veinte maneras.","Ensayo general desastroso. Dicen que trae suerte.","Te quedas en blanco en escena. Improvisas. Nadie lo nota, o eso prefieres creer.","Observas a la gente en el mercado y te llevas sus gestos.","Haces llorar al técnico de luces, que lo ha visto todo."],
  h:{6:"sales a escena con texto por primera vez",18:"te dan un papel protagonista",40:"una crítica te menciona por tu nombre",80:"llenas un teatro que no conoces"},
  est:{n:"un año de gira con una compañía de teatro",sit:"de la compañía",tx:["Montáis y desmontáis el decorado vosotros. El teatro también es cargar.","Función en un pueblo de doscientos habitantes. Van los doscientos.","El primer actor te da una nota al oído entre cajas. Te cambia el personaje.","Función cuarenta. Descubres una pausa que no estaba y que ya es tuya.","Se va la luz en mitad de la obra. Seguís con velas. Es la función de la que hablaréis siempre.","Convivir en una furgoneta enseña más de la gente que tres años de escuela."],ok:"El último telón cae con el público en pie. Un director te espera en el camerino con un texto bajo el brazo.",ko:"La compañía se disuelve a mitad de gira, sin dinero. Te quedas con el oficio y tres amigos para siempre.",logro:"giras un año con una compañía de teatro"},
  op:{tit:"Un anuncio",txt:"Te ofrecen el papel principal en un anuncio de detergente. Hay que decir «¡Blancura total!» mirando a cámara.",a:["Hacer el anuncio","Lo dices veintiséis veces. Durante un año te lo gritan por la calle. El cheque lo cura casi todo."],b:["Decir que no","Lo rechazas. En el taller te respetan más. En el banco, menos."]}},
 cocina:{tx:["Limpias veinte kilos de pescado. Al final ya no piensas, cortas.","Haces la misma salsa cinco días hasta que sale igual dos veces.","Comes en un sitio muy bueno y te pasas la cena adivinando cómo.","Una abuela ajena te enseña su truco a cambio de que no lo cuentes.","Cocinas con lo que hay en la nevera. Sale lo mejor de la semana."],
  h:{6:"cocinas un menú entero sin ayuda",18:"te piden la receta",40:"das de comer a cincuenta personas sin que falte un plato",80:"inventas un plato que otros copian"},
  est:{n:"un año de prácticas en la cocina de un restaurante con estrella",sit:"de la cocina del restaurante",tx:["Dieciséis horas de pie. Pelas, cortas, callas.","El jefe tira tu plato a la basura sin probarlo. «Otra vez.»","Te pasan a la partida de pescados. Es un ascenso que parece un castigo.","Servicio de sábado: ciento veinte cubiertos, ni un fallo. Nadie lo celebra. Así se celebra aquí.","El jefe prueba tu salsa, no dice nada y la pone en la carta.","Cenas de pie, a la una, con el equipo. Es la mejor mesa de la ciudad."],ok:"El jefe te da la mano el último día y una carta de recomendación de tres líneas. Con esas tres líneas se abre cualquier cocina.",ko:"Aguantas el año sin pasar del cuarto frío. Sales con las manos rápidas y la piel dura.",logro:"pasas un año en una cocina con estrella"},
  op:{tit:"Un catering",txt:"Una boda se queda sin cocinero a tres días de la fecha. Doscientos invitados. Te lo ofrecen a ti.",a:["Aceptar el marrón","Tres días sin dormir y un menú que sale a su hora. La madre de la novia te besa las manos. Literalmente."],b:["No arriesgar","Dices que es demasiado. Tenías razón: el que lo coge la lía. Te queda la duda de qué habrías hecho tú."]}},
 estudio:{tx:["Rehaces un examen que ya aprobaste, para entenderlo esta vez.","Te atascas, sales a andar, y la solución llega en un semáforo.","Discutes con un profesor y, por una vez, tienes razón tú.","Llenas una pizarra y la borras entera. Mañana más.","Lees a alguien que piensa lo contrario que tú. Te fastidia lo bien que escribe."],
  h:{6:"sacas la mejor nota de la clase",18:"ganas un premio escolar de ciencias",40:"un profesor te pide ayuda con algo suyo",80:"firmas tu primer trabajo de investigación"},
  est:{n:"un año de estancia en un laboratorio extranjero",sit:"del laboratorio",tx:["El laboratorio no cierra nunca. Tú tampoco.","Tres meses de experimento para descubrir que el aparato estaba mal calibrado.","Presentas tus datos al grupo. Te los destrozan con mucha educación. Tenían razón.","Un resultado raro, a las dos de la mañana. Lo repites. Sigue ahí.","Tu directora de estancia dice «interesante». Te explican que aquí eso es una ovación.","Escribes el artículo. Lo reescribes. Lo vuelves a escribir."],ok:"El artículo se acepta. Tu nombre va el primero. Lo miras impreso un rato largo.",ko:"El resultado no se sostiene al repetirlo. Un año de trabajo que acaba en un «no». En ciencia eso también es un resultado, dicen.",logro:"investigas un año en el extranjero"},
  op:{tit:"Clases particulares",txt:"Los padres de medio barrio quieren que le des clase a sus hijos. Pagan por hora y pagan bien.",a:["Dar clases","Seis alumnos, cuatro aprobados y una madre que te manda croquetas. Explicar te obliga a entender."],b:["Guardarte el tiempo","Prefieres tus libros. Avanzas un curso entero por tu cuenta."]}},
 idiomas:{tx:["Sueñas en otro idioma por primera vez. Con faltas, pero sueñas.","Te pasas una tarde con una sola palabra que no tiene traducción.","Aprendes a insultar con elegancia en tres lenguas.","Haces de intérprete entre dos turistas y un taxista. Todos contentos.","Lees poesía en el original y por fin entiendes por qué no se podía traducir."],
  h:{6:"mantienes tu primera conversación entera en otro idioma",18:"te confunden con un nativo durante dos minutos",40:"traduces un libro por encargo",80:"hablas cinco idiomas sin mezclarlos (casi)"},
  est:{n:"un año viviendo y trabajando en el extranjero como traductor",sit:"de tu año en el extranjero",tx:["Los primeros días pides siempre lo mismo en el bar, porque es lo que sabes pronunciar.","Te ríes de un chiste a tiempo. Nadie se da cuenta de lo que eso significa.","Te enfadas en otro idioma y te sale bien. Ya vives aquí.","Traduces un contrato de noche, con tres diccionarios y un café frío.","Alguien te corrige el acento con cariño. Lo arreglas en una semana.","Llamas a casa y te falta una palabra en tu propia lengua."],ok:"Vuelves con el idioma metido en los huesos y un contrato de una agencia internacional.",ko:"Te quedas en un círculo de compatriotas y hablas lo de siempre. Vuelves con buenas fotos y un idioma a medias.",logro:"vives un año en otro idioma"},
  op:{tit:"Un juicio",txt:"El juzgado necesita con urgencia un intérprete para un testigo extranjero. Mañana. Sin tiempo de preparar nada.",a:["Presentarte","Traduces cuatro horas sin parpadear. Una palabra mal y habría cambiado todo. No hubo ninguna."],b:["No atreverte","Dices que no estás listo. Quizá era verdad. Te pones a estudiar vocabulario legal esa misma noche."]}}};
const AFX={pesca:{tx:["Aprendes a hacer un nudo que no se suelta. Te ha costado tres anzuelos.","Madrugas tanto que ves salir el sol desde el agua.","Un viejo te cede su sitio en el río, que es como cederte un secreto."],h:{22:"pescas en alta mar"}},
 cocina:{tx:["Haces pan. La casa huele a domingo.","Te atreves con un arroz delante de gente que opina.","Preparas conservas para todo el invierno."],h:{22:"tu mesa es la más disputada del barrio"}},
 juegos:{tx:["Juegas en línea con alguien de la otra punta del mundo. Os entendéis sin idioma.","Vuelves a un juego de tu infancia. Es más corto y más feo. Es perfecto.","Organizas un torneo en casa. Hay pizza y hay rencores."],h:{25:"ganas un torneo con premio"}},
 huerto:{tx:["Injertas un frutal siguiendo un libro. Agarra.","Haces compost. Te sientes alquimista.","Guardas semillas de tus mejores tomates para el año que viene."],h:{6:"comes un mes entero de tu huerto",15:"ganas el concurso de calabazas de la comarca"}},
 volunt:{tx:["Una noche repartiendo café a quien duerme en la calle. Te aprendes sus nombres.","Enseñas a leer a un hombre de sesenta años. Firma por primera vez delante de ti.","Recaudáis lo justo para arreglar el tejado del local."],h:{6:"coordinas tu propio grupo de voluntarios",18:"te dan la medalla del barrio"}},
 baile:{tx:["Te sale un giro que llevabas un mes persiguiendo.","Bailas con alguien que baila mejor y te lleva sin que se note.","Ensayas la coreografía en el pasillo, con el perro mirando."],h:{14:"ganas un concurso de baile",24:"das tus propias clases de baile"}},
 ajedrez:{tx:["Estudias un final de torres durante una semana.","Juegas a ciegas media partida. Luego te pierdes.","Un niño de nueve años te da una paliza y te explica por qué."],h:{25:"consigues un título federado"}},
 monte:{tx:["Vivac bajo las estrellas. Frío, y ni un ruido.","Te das la vuelta a cien metros de la cumbre porque entra niebla. Eso también es saber de monte.","Enseñas la ruta a alguien que no había subido nunca."],h:{20:"subes un cuatromil"}},
 foto:{tx:["Esperas dos horas a que la luz haga lo que tú quieres.","Revelas un carrete que olvidaste hace años. Hay gente que ya no está.","Una foto movida resulta ser la mejor del día."],h:{22:"ganas un premio de fotografía"}},
 colec:{tx:["Te escribes con un coleccionista de otro país. Os cambiáis piezas por correo.","Catalogas todo en una libreta, con fecha y procedencia.","Descubres una falsificación en tu propia vitrina."],h:{24:"tienes una pieza que solo hay cinco en el mundo"}},
 brico:{tx:["Construyes una mesa. Cojea. La calzas. Es tu mesa.","Cambias una instalación entera sin que salte un plomo.","Tu caja de herramientas ya es un mueble."],h:{14:"te construyes un mueble de los que se heredan",24:"reformas una casa entera con tus manos"}}};
AFIC.forEach(f=>{const x=AFX[f.k];if(x){f.tx=f.tx.concat(x.tx);Object.assign(f.h,x.h)}});
for(const k in AREX)if(AREAS[k])AREAS[k].tx=AREAS[k].tx.concat(AREX[k].tx);
const _practicar0=practicar;
practicar=function(k){let s=_practicar0(k);const v=voc(k),X=AREX[k];v.n=(v.n||0)+1;
  if(X&&X.h[v.n]){logro(X.h[v.n]);add("animo",5);s+=" "+cap(X.h[v.n])+"."}
  return s};
/* aficiones fijadas: hasta 3, con botón propio */
function fijadas(){const a=anios();let l=(G.fij||[]).filter(x=>x[0]=="a"?AREAS[x.slice(2)]&&a>=AREAS[x.slice(2)].min:AFIC.some(f=>f.k==x.slice(2)&&f.c(a)));
  if(!(G.fij||[]).length&&G.voc)l=Object.keys(G.voc).filter(k=>AREAS[k]&&a>=AREAS[k].min&&G.voc[k].p>=4).sort((p,q)=>G.voc[q].p-G.voc[p].p).slice(0,2).map(k=>"a:"+k); // sin fijar nada, salen solas las que más practicas
  return l}
function botonesFijados(L){fijadas().forEach(x=>{const k=x.slice(2);
  if(x[0]=="a")L.push({t:"★ "+AREAS[k].n,fn:()=>practicar(k)});
  else{const f=AFIC.find(q=>q.k==k);L.push({t:"★ "+f.t+(f.cost?" ("+f.cost+")":""),fn:()=>aficion(f)})}})}
function menuFijar(){const a=anios();G.fij=G.fij||[];
  const it=Object.keys(AREAS).filter(k=>a>=AREAS[k].min).map(k=>["a:"+k,AREAS[k].n,"Nivel "+Math.round(nivel(k))]).concat(AFIC.filter(f=>f.c(a)&&!f.cls).map(f=>["f:"+f.k,f.t,NIVAF[nivAf(f.k)]]));
  abrirHoja(`Fijar aficiones (${G.fij.length}/3) · no gasta el mes`,it.map(([id,t,s])=>({t:(G.fij.includes(id)?"★ ":"☆ ")+t,s:s+(G.fij.includes(id)?" · fijada: tiene botón propio":""),fn:()=>{const i=G.fij.indexOf(id);if(i>=0)G.fij.splice(i,1);else if(G.fij.length<3)G.fij.push(id);guardar();menuFijar()}})).concat([{t:"Listo",fn:()=>{cerrarHoja();render(true)}}]));
}
/* encargos y estancias */
DEC.encargoAf={man:1,tit:d=>AREX[d.a].op.tit,txt:d=>"",ops:d=>{const o=AREX[d.a].op,y=G.yo,n=Math.round(nivel(d.a));return [
  {t:o.a[0],s:"Dinero y oficio",fn:()=>{const m=Math.round((150+n*6)*(.7+R()*.8)/10)*10;y.dinero+=m;pr(d.a,3);add("carisma",1);return o.a[1]+` Te llevas ${m}.`}},
  {t:o.b[0],s:"A tu manera",fn:()=>{pr(d.a,4);add("animo",4);return o.b[1]}}]}};
DEC.estancia={man:1,tit:d=>"Una oportunidad de las que pasan una vez",txt:d=>"",ops:d=>{const X=AREX[d.a].est,v=voc(d.a),q=G.pareja&&P(G.pareja);return [
  {t:"Aceptar",s:"Un año entero"+(G.trabajo&&G.trabajo.pro!=d.a?" · dejas tu trabajo":"")+(q?" · "+q.nombre+" se queda esperando":""),fn:()=>{v.est=1;G.estancia={k:d.a,m:12};if(G.trabajo&&G.trabajo.pro!=d.a)G.trabajo=null;if(q)rel(q,-8);add("animo",10);return `Dices que sí antes de pensarlo dos veces. Haces la maleta para ${X.n}. En casa hay orgullo y hay pena, por ese orden.`}},
