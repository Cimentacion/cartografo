<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toda una Vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800&family=Metamorphous&display=swap" rel="stylesheet">
<style>
:root{
  /* Página de revista japonesa de 1998: papel crema, panel nocturno, cajas lila con capitular blanca, titulares caqui */
  --papel:#efe9d8; --noche:#131129; --noche2:#2b2560; --lila:#aaa6e0; --tinta:#1a1740;
  --caqui:#d2d291; --oro:#dbb84c; --blanco:#ffffff; --rojo:#e0605a;
  --f-titular:"Dela Gothic One","Hiragino Kaku Gothic ProN","Arial Black",sans-serif;
  --f-cuerpo:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Trebuchet MS",sans-serif;
  --f-logo:"Metamorphous","Palatino Linotype",Georgia,serif;
  --f-presenta:"Cormorant Garamond",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--papel);font-family:var(--f-cuerpo);font-weight:800;color:var(--blanco);padding:8px;overflow:hidden}
#pagina{height:100%;max-width:640px;margin:0 auto;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;
  background:
   radial-gradient(120% 60% at 85% 0%,rgba(120,105,200,.55),transparent 60%),
   linear-gradient(180deg,#3a3378 0%,var(--noche2) 22%,var(--noche) 70%,#0b0a1a 100%);}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--oro);outline-offset:2px}

/* Cabecera */
.cab{padding:10px 16px 8px;flex:none;position:relative}
.presenta{font-family:var(--f-presenta);font-style:italic;font-size:17px;letter-spacing:.5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.presenta b{font-family:var(--f-titular);font-style:normal;font-weight:400;font-size:11px;background:#5a4fb0;padding:2px 8px;white-space:nowrap}
.logo{font-family:var(--f-logo);font-size:34px;line-height:1.05;letter-spacing:1px;
  background:linear-gradient(180deg,#fff3b8 0%,var(--oro) 45%,#8a6a1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.kanji{font-family:var(--f-titular);color:var(--caqui);font-size:22px;letter-spacing:2px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kanji small{font-family:var(--f-cuerpo);font-size:10px;color:var(--blanco);letter-spacing:0}
.ficha{border-top:2px solid var(--blanco);border-bottom:2px solid var(--blanco);margin-top:6px;padding:3px 0;font-size:13px;display:flex;flex-wrap:wrap;gap:2px 14px}
.ficha span::before{content:"●"}
.compacta .logo,.compacta .kanji,.compacta .presenta{display:none}
.compacta .ficha{margin-top:0}
.logo{margin-top:6px}

/* Tabla de estadísticas, como la encuesta de la revista */
.stats{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--blanco);margin-top:6px;font-variant-numeric:tabular-nums}
.stats div{border-right:1px solid var(--blanco);text-align:center;padding:2px 0 3px;font-size:9.5px;position:relative;overflow:hidden}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--f-titular);font-weight:400;font-size:17px;color:var(--caqui);line-height:1.1}
.stats i{position:absolute;left:0;bottom:0;height:3px;background:var(--lila)}
.stats .mal b{color:var(--rojo)} .stats .mal i{background:var(--rojo)}

.tabs{display:flex;gap:6px;padding:0 16px;flex:none}
.tabs button{flex:1;font-family:var(--f-titular);font-size:12px;padding:6px 0;border:1px solid var(--blanco);border-bottom:0;border-radius:10px 10px 0 0;color:var(--blanco);opacity:.6}

.tabs button.mini{flex:none;width:42px;opacity:1;font-size:15px}
.tabs button.on{background:var(--lila);color:var(--tinta);opacity:1;border-color:var(--lila)}

#vista{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--lila);min-height:0}
.caja{background:var(--lila);color:var(--tinta);border-radius:16px;padding:10px 14px;font-size:14.5px;line-height:1.45;flex:none}
.caja p::first-letter{font-family:var(--f-titular);font-size:2.3em;float:left;line-height:.9;padding:2px 5px 0 0;color:var(--blanco);text-shadow:0 1px 0 rgba(26,23,64,.35)}
.caja em{font-style:normal;white-space:nowrap}
.caja.mala{background:#8f8ab8}
.caja.fin{background:var(--tinta);color:var(--blanco);border:2px solid var(--oro)}
.caja.fin p::first-letter{color:var(--oro)}
.tit{font-family:var(--f-titular);color:var(--caqui);font-size:19px;line-height:1.2;margin-top:6px;text-wrap:balance;flex:none;-webkit-text-stroke:.4px #000}
.tit small{display:block;font-family:var(--f-cuerpo);font-size:11px;color:var(--blanco);-webkit-text-stroke:0}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;flex:none}
th,td{border:1px solid var(--blanco);padding:4px 6px;text-align:left}
th{font-family:var(--f-titular);font-weight:400;color:var(--caqui);font-size:11px}
td.n{text-align:right;white-space:nowrap}
.muerto td{opacity:.5}
.nota{font-size:12px;line-height:1.4;font-weight:700}

/* Acciones */
#acc{flex:none;max-height:38%;overflow-y:auto;padding:8px 16px 12px;border-top:2px solid var(--blanco);background:rgba(8,7,22,.6);display:grid;grid-template-columns:1fr 1fr;gap:6px}
#acc button{background:var(--caqui);color:var(--tinta);border-radius:10px;padding:9px 8px;font-size:13px;line-height:1.15;min-height:40px}
#acc button:active{transform:translateY(1px);filter:brightness(.9)}
#acc button.sec{background:transparent;color:var(--blanco);border:1px solid var(--blanco)}
#acc button.riesgo{background:#b9605c;color:#fff}
#acc button.ancho{grid-column:1/-1}

/* Creación */
#crear{flex:1;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--blanco);border-radius:999px;padding:7px 12px;font-size:13px}
.chips button.on{background:var(--lila);color:var(--tinta);border-color:var(--lila)}
#nombre{font:inherit;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--blanco);background:rgba(255,255,255,.08);color:var(--blanco)}
.gordo{font-family:var(--f-titular);background:linear-gradient(180deg,#fff3b8,var(--oro));color:var(--tinta);border-radius:12px;padding:12px;font-size:18px;letter-spacing:2px}
.intro{font-size:13.5px;line-height:1.5}

/* Hoja de elección */
#hoja{position:fixed;inset:0;background:rgba(5,4,15,.72);display:none;align-items:flex-end;justify-content:center;padding:8px;z-index:5}
#hoja.on{display:flex}
#hoja>div{width:100%;max-width:624px;max-height:80%;overflow-y:auto;background:var(--noche2);border:2px solid var(--lila);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
#hoja h2{font-family:var(--f-titular);font-weight:400;color:var(--caqui);font-size:16px;margin-bottom:4px}
#hoja button{text-align:left;background:var(--lila);color:var(--tinta);border-radius:10px;padding:10px 12px;font-size:14px}
#hoja button small{display:block;font-size:11px;opacity:.8}
#hoja button.sec{background:transparent;color:var(--blanco);border:1px solid var(--blanco);text-align:center}
.copy{font-size:9px;font-weight:700;color:#5d5848;text-align:left;padding:2px 12px 0;flex:none;display:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none}}
</style>
</head>
<body>
<div id="pagina">
  <header class="cab" id="cab">
    <div class="presenta"><span>MES A MES SOFT Presents.</span><b>A todos los que nacen…</b></div>
    <div class="logo">Toda una Vida</div>
    <div class="kanji">人生手記 <small>『トダ・ウナ・ビダ』じんせいしゅき</small></div>
    <div class="ficha" id="ficha"><span>Simulador de vida</span><span>Solo texto</span><span>1 acción = 1 mes</span></div>
    <div class="stats" id="stats" hidden></div>
  </header>
  <nav class="tabs" id="tabs" hidden>
    <button data-t="diario" class="on">DIARIO</button><button data-t="familia">GENTE</button><button data-t="hogar">HOGAR</button><button id="bFull" class="mini" aria-label="Pantalla completa">⛶</button>
  </nav>
  <main id="crear"></main>
  <main id="vista" hidden></main>
  <section id="acc" hidden></section>
</div>
<div id="hoja"><div id="hojaIn"></div></div>

<script>
"use strict";
/* ============ Utilidades ============ */
const R=Math.random, ri=(a,b)=>Math.floor(R()*(b-a+1))+a, pick=a=>a[Math.floor(R()*a.length)], ch=p=>R()<p;
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============ Datos ============ */
const ORI={
 es:{n:"Española",pais:"España",
  m:["Antonio","Manuel","José","Javier","Sergio","Pablo","Raúl","Andrés","Luis","Álvaro","Rubén","Iván","Diego","Ángel","Paco","Vicente"],
  f:["María","Carmen","Lucía","Ana","Laura","Marta","Elena","Pilar","Rocío","Sara","Nuria","Irene","Alba","Paula","Amparo","Rosa"],
  ap:["García","Martínez","López","Sánchez","Navarro","Romero","Torres","Gil","Serrano","Molina","Ortega","Castillo","Rubio","Iglesias"],
  lug:{aldea:["Valdecabras","Villar del Humo","Navalosa"],pueblo:["Cazorla","Alcañiz","Tordesillas"],ciudad:["Alicante","Gijón","Zaragoza"],capital:["Madrid"]}},
 ro:{n:"Rumana",pais:"Rumanía",
  m:["Andrei","Mihai","Ion","Alexandru","Cristian","Florin","Bogdan","Vlad","Radu","Sorin","Dan","Marius","Ciprian","Gheorghe"],
  f:["Maria","Elena","Ioana","Andreea","Ana","Mihaela","Cristina","Alina","Daniela","Roxana","Simona","Gabriela","Oana","Larisa"],
  ap:["Popescu","Ionescu","Popa","Stan","Dumitru","Stoica","Gheorghe","Rusu","Munteanu","Matei","Constantin","Moldovan"],
  lug:{aldea:["Viscri","Breb","Rimetea"],pueblo:["Sighișoara","Horezu","Bușteni"],ciudad:["Cluj-Napoca","Iași","Timișoara"],capital:["Bucarest"]}},
 uk:{n:"Británica",pais:"Reino Unido",
  m:["James","Oliver","Harry","George","Thomas","William","Jack","Daniel","Liam","Ben","Edward","Callum","Stuart","Alfie"],
  f:["Emily","Olivia","Sophie","Charlotte","Grace","Amelia","Lucy","Hannah","Chloe","Alice","Megan","Holly","Ruth","Daisy"],
  ap:["Smith","Jones","Taylor","Brown","Wilson","Evans","Walker","Wright","Hughes","Clarke","Baker","Turner"],
  lug:{aldea:["Castle Combe","Grasmere","Staithes"],pueblo:["Whitby","Ludlow","Skipton"],ciudad:["Leeds","Bristol","Sheffield"],capital:["Londres"]}},
 ma:{n:"Marroquí",pais:"Marruecos",
  m:["Youssef","Mohamed","Karim","Omar","Hamza","Rachid","Said","Amine","Bilal","Sohaib","Anas","Mehdi","Tarik","Hicham"],
  f:["Fatima","Khadija","Salma","Amina","Nadia","Samira","Imane","Hajar","Meryem","Zineb","Latifa","Sanae","Rania","Houda"],
  ap:["El Amrani","Benali","Alaoui","Idrissi","Tahiri","Bennani","Chraibi","El Fassi","Ouazzani","Berrada","Lahlou","Ziani"],
  lug:{aldea:["Imlil","Tafraoute","Aït Bouguemez"],pueblo:["Chefchaouen","Asilah","Azrou"],ciudad:["Fez","Tánger","Marrakech"],capital:["Rabat"]}},
 jp:{n:"Japonesa",pais:"Japón",
  m:["Haruto","Kenji","Takeshi","Daiki","Shun","Ryo","Kazuki","Hiroshi","Yuta","Sora","Makoto","Naoki","Tetsuya","Ren"],
  f:["Yui","Sakura","Aoi","Haruka","Misaki","Nanami","Rin","Akane","Emi","Keiko","Mio","Chihiro","Kaori","Yuna"],
  ap:["Sato","Suzuki","Takahashi","Tanaka","Watanabe","Ito","Yamamoto","Nakamura","Kobayashi","Kato","Yoshida","Mori"],
  lug:{aldea:["Shirakawa","Ine","Ouchi-juku"],pueblo:["Takayama","Onomichi","Karuizawa"],ciudad:["Osaka","Fukuoka","Sendai"],capital:["Tokio"]}},
 mx:{n:"Mexicana",pais:"México",
  m:["Juan","Luis","Carlos","Miguel","Jesús","Fernando","Emiliano","Santiago","Rodrigo","Héctor","Óscar","Ramón","Gael","Mateo"],
  f:["Guadalupe","Ximena","Valeria","Fernanda","Daniela","Sofía","Mariana","Camila","Renata","Leticia","Paola","Itzel","Rosario","Yolanda"],
  ap:["Hernández","González","Ramírez","Flores","Cruz","Morales","Reyes","Jiménez","Mendoza","Vargas","Castro","Aguilar"],
  lug:{aldea:["Real de Catorce","Cuetzalan","Mineral de Pozos"],pueblo:["Pátzcuaro","Taxco","Valladolid"],ciudad:["Guadalajara","Puebla","Monterrey"],capital:["Ciudad de México"]}}
};
const FAM=["Humilde","Obrera","Clase media","Acomodada","Rica"];
const LUGTXT={aldea:"una aldea",pueblo:"un pueblo",ciudad:"una ciudad",capital:"la capital"};
const CASAS=[
 ["una habitación realquilada","un piso diminuto de alquiler","una casa vieja con goteras"],
 ["un piso de alquiler","una casa baja","un piso antiguo sin ascensor"],
 ["un piso en propiedad","una casa adosada","un piso amplio"],
 ["un chalet","un piso grande en el centro","una casa con jardín"],
 ["una mansión","un ático de lujo","una finca con servicio"]];
const BARRIOS={
 aldea:["la parte alta","junto a la iglesia","el camino del río","las últimas casas antes del monte"],
 pueblo:["el casco viejo","el barrio de la estación","la plaza mayor","las afueras"],
 ciudad:["un barrio obrero","el ensanche","el centro","el barrio del puerto","una urbanización nueva"],
 capital:["un barrio del extrarradio","el centro histórico","un barrio de bloques","una zona residencial"]};
const CURROS=[
 ["a jornales","limpiando casas","en lo que va saliendo"],
 ["en una fábrica","en un bar","en la obra","en un supermercado"],
 ["en una oficina","dando clase","en un banco","en un taller propio"],
 ["en un bufete","en una clínica privada","dirigiendo una empresa"],
 ["al frente de los negocios de la familia","administrando su fortuna"]];
const JOBS=[
 {n:"repartiendo paquetes",s:900},
 {n:"en un bar",s:1050,carisma:25},
 {n:"en una fábrica",s:1200,cuerpo:40},
 {n:"en una cocina",s:1250,cuerpo:30,mente:25},
 {n:"en una oficina",s:1500,mente:50},
 {n:"de comercial",s:1750,carisma:60},
 {n:"dando clase en un instituto",s:2000,titulo:1},
 {n:"en una ingeniería",s:2800,titulo:1,mente:70},
 {n:"en un hospital, de médico",s:3500,titulo:1,mente:85}];
const ROL={prog:["Padre","Madre"],herm:["Hermano","Hermana"],abu:["Abuelo","Abuela"],tio:["Tío","Tía"],primo:["Primo","Prima"],
 vec:["Vecino","Vecina"],comp:["Compañero","Compañera"],conoc:["Conocido","Conocida"],hijo:["Hijo","Hija"]};

/* ============ Estado ============ */
let G=null, TAB="diario";
const CLAVE="toda-una-vida-v1";
function guardar(){try{localStorage.setItem(CLAVE,JSON.stringify(G))}catch(e){}}
function cargar(){try{const s=localStorage.getItem(CLAVE);if(s)G=JSON.parse(s)}catch(e){G=null}
  if(G&&!G.v2){G.gente.forEach(p=>p.con=true);G.v2=1}
  if(G&&G.yo.aspecto==null)G.yo.aspecto=35}
function borrar(){try{localStorage.removeItem(CLAVE)}catch(e){}}

const yo=()=>G.yo, anios=()=>Math.floor(G.yo.edad/12);
const g=(m,f)=>G.yo.sexo=="m"?m:f;
const gp=(p,m,f)=>p.sexo=="m"?m:f;
const P=id=>G.gente.find(p=>p.id==id);
const vivos=f=>G.gente.filter(p=>p.vivo&&(!f||f(p)));
function etapa(){const a=G.yo.edad/12;return a<2?"bebé":a<6?"infancia":a<12?"niñez":a<18?"adolescencia":a<65?"edad adulta":"vejez"}
function edadTxt(m){const a=Math.floor(m/12);return a<1?m+(m==1?" mes":" meses"):a+(a==1?" año":" años")}
function add(k,v){const y=G.yo;y[k]=clamp(y[k]+v)}
function rel(p,v){if(p)p.rel=clamp(p.rel+v)}
function log(txt,cls){txt=txt.charAt(0).toUpperCase()+txt.slice(1);G.log.push({t:"caja",txt,cls:cls||"",tag:edadTxt(G.yo.edad)+" · "+etapa()});if(G.log.length>160)G.log.splice(0,G.log.length-160)}
function titular(txt,sub){G.log.push({t:"tit",txt,sub:sub||""})}
function rolTxt(p){
  if(p.id==G.pareja)return G.casado?gp(p,"Marido","Mujer"):gp(p,"Novio","Novia");
  let r=ROL[p.rol][p.sexo=="m"?0:1];
  if(p.rol=="abu"&&p.lado)r+=" "+(p.lado=="p"?gp(p,"paterno","paterna"):gp(p,"materno","materna"));
  if(p.rol=="vec"&&p.edad>=18*12&&p.fam)r+=" ("+p.fam+")";
  return r;
}
function tu(p){ // "tu abuela Carmen"
  const base={prog:["tu padre","tu madre"],herm:["tu hermano","tu hermana"],abu:["tu abuelo","tu abuela"],tio:["tu tío","tu tía"],primo:["tu primo","tu prima"],hijo:["tu hijo","tu hija"]}[p.rol];
  if(p.id==G.pareja)return p.nombre;
  return base?base[p.sexo=="m"?0:1]+" "+p.nombre:p.nombre;
}
function nombreNuevo(sexo){const o=ORI[G.origen],l=sexo=="m"?o.m:o.f;let n;for(let i=0;i<10;i++){n=pick(l);if(!G.gente.some(p=>p.nombre==n)&&n!=(G.yo&&G.yo.nombre))break}return n}
function per(rol,sexo,aniosE,ap,x){
  const p={id:G.nid++,nombre:nombreNuevo(sexo),apellido:ap,sexo,edad:Math.max(0,Math.round(aniosE*12)),rol,rel:ri(25,55),vivo:true,casa:false,lejos:false,con:false};
  Object.assign(p,x||{});G.gente.push(p);return p;
}
const sx=()=>ch(.5)?"m":"f";

/* ============ Generación de una vida ============ */
function genCasa(){
  const t=G.lugar.tipo;
  G.casa.tipo=pick(CASAS[G.riqueza]);G.casa.barrio=pick(BARRIOS[t]);
}
function genVecinos(){
  G.gente.forEach(p=>{if(p.rol=="vec"&&!p.lejos){p.lejos=true}});
  const o=ORI[G.origen],a=G.yo.edad/12,n=ri(2,3),out=[];
  for(let i=0;i<n;i++){
    const ap=pick(o.ap),ea=ri(24,68),ad=[per("vec",sx(),ea,ap,{fam:ap,rel:ri(10,35)})];
    if(ch(.7)){ad[0].casado=true;ad.push(per("vec",ad[0].sexo=="m"?"f":"m",ea+ri(-4,4),ap,{fam:ap,casado:true,rel:ri(10,35)}))}
    const hijos=[];
    if(ea<55){const k=ri(0,3);for(let j=0;j<k;j++){
      const eh=a<18?Math.max(0,a+ri(-3,4)+R()):ri(0,Math.max(1,ea-22));
      hijos.push(per("vec",sx(),Math.min(eh,ea-17),ap,{fam:ap,rel:ri(15,40)}));}}
    out.push({ap,ad,hijos});
  }
  return out;
}
function vecinosTxt(fs){
  return fs.map(f=>{
    let s="los "+f.ap;
    if(f.hijos.length)s+=", con "+f.hijos.map(h=>h.nombre+" ("+edadTxt(h.edad)+")").join(", ");
    else s+=f.ad.length==1?" (vive "+gp(f.ad[0],"solo","sola")+")":", sin hijos";
    return s}).join("; ");
}
function nacer(op){
  const origen=op.origen||pick(Object.keys(ORI)), o=ORI[origen];
  G={v:1,v2:1,nid:1,origen,riqueza:op.riqueza==null?pick([0,1,1,2,2,2,3,3,4]):op.riqueza,gente:[],log:[],hitos:{},nac:[],fl:{},
     uni:0,titulo:false,trabajo:null,crush:null,pareja:null,casado:false,indep:false,emb:0,muerto:false,casa:{deQuien:null},lugar:{}};
  const ap=pick(o.ap), apM=pick(o.ap.filter(x=>x!=ap)), sexo=op.sexo||sx();
  G.yo={nombre:"",apellido:ap,sexo,edad:0,salud:ri(60,92),animo:70,mente:ri(0,4),cuerpo:ri(0,4),carisma:ri(2,8),aspecto:ri(20,50),dinero:0};
  G.yo.nombre=(op.nombre||"").trim()||pick(sexo=="m"?o.m:o.f);
  const tipo=pick(["aldea","pueblo","pueblo","ciudad","ciudad","ciudad","capital"]);
  G.lugar={tipo,nombre:pick(o.lug[tipo])};
  // Padres
  const tp=pick(["joven","normal","normal","mayor"]);
  const eM=tp=="joven"?ri(17,21):tp=="normal"?ri(24,33):ri(37,43);
  const eP=Math.max(17,eM+(tp=="joven"?ri(0,5):ri(-2,9)));

function mort(m){const a=m/12;return a<1?.004:a<40?.001:a<60?.005:a<70?.015:a<80?.045:a<90?.12:.3}

  if(!p.con){if(["abu","tio","primo"].includes(p.rol))log(`Muere ${tu(p)}, a quien no llegaste a conocer.`,"mala")}

    const m=vivos(q=>q.rol=="prog")[0]||vivos(q=>q.casa&&q.edad>=216)[0]||vivos(q=>q.con&&!q.lejos&&q.edad>=216&&(q.rol=="vec"||q.rol=="conoc"))[0];

    log(`Muere ${tu(p)}, a los ${Math.floor(a)} años, por ${causa}.`+(y.edad<36?" No entiendes por qué todo el mundo llora.":p.rel>=60?" Algo se te rompe por dentro.":""),"mala");
    add("animo",-Math.round(p.rel/5));
  }else if(!p.lejos)log(`Dicen en el barrio que ha muerto ${p.nombre} ${p.apellido}.`,"mala");
  if(p.id==G.pareja){G.pareja=null;G.casado=false;G.fl.viudo=true}

    else{G.casa.deQuien=null;log(`La casa de ${p.nombre} pasa a tus padres.`)}
  }
  if(p.rol=="prog"){

    if(G.riqueza>0){G.riqueza--;if(quedan.length&&(G.riqueza==0||ch(.6)))mudanza("Con un sueldo menos en casa, las cuentas no salen.")}
    if(!quedan.length&&y.edad<18*12){

      log(`Te quedas sin padres. Los servicios sociales te llevan a un centro de acogida`+(hs.length?`, junto a ${hs.map(q=>q.nombre).join(" y ")}`:"")+`. De tu vida de antes solo queda un número de teléfono apuntado en un papel.`,"mala");
    }

    if(atr()<45)return {txt:"Lo intentas toda la noche y nadie te sigue el juego. Toca cuidarse un poco más y soltarse.",mal:1};
    if(!ch(.35+atr()/200))return {txt:"Hablas con varias personas. Ninguna se queda hasta el final.",mal:1};
    add("animo",6);let s=prot?"Un par de noches con alguien cuyo nombre casi recuerdas. Sin consecuencias.":"Acabas en casa de alguien que conociste esa misma noche. Ni preguntas ni precauciones.";
    s+=primeraVez(null);
    if(G.pareja&&ch(.3)){const q=P(G.pareja);G.pareja=null;G.casado=false;G.crush=null;q.casa=false;rel(q,-40);add("animo",-12);s+=` ${q.nombre} se entera y se va.`}
    if(!prot){
      if(ch(.14)){G.fl.ets=1;s+=" Semanas después notas que algo no va bien ahí abajo."}
      if(G.emb==0&&ch(.12)){G.emb=9;s+=y.sexo=="f"?" El test da positivo.":" Dos meses después te llaman: hay un bebé en camino y es tuyo."}
    }
    return {txt:s,mal:!prot}});
}
function hacer(fn){
  if(G.muerto)return;
  const r=fn();
  if(typeof r=="string")log(r);else if(r&&r.txt)log(r.txt,r.mal?"mala":"");
  if(G.muerteDirecta){const c=G.muerteDirecta;delete G.muerteDirecta;G.yo.edad++;muerteYo(c)}
  else tick();
  TAB="diario";guardar();cerrarHoja();render(true);
}
function pasarAnio(){
  log("Dejas correr un año entero.");
  for(let i=0;i<12&&!G.muerto;i++)tick();
  guardar();render(true);
}

/* ============ Interfaz ============ */
function abrirHoja(titulo,ops){
  const h=$("hojaIn");h.innerHTML="<h2>"+esc(titulo)+"</h2>";
  ops.forEach(o=>{const b=document.createElement("button");b.innerHTML=esc(o.t)+(o.s?"<small>"+esc(o.s)+"</small>":"");b.onclick=o.fn;h.appendChild(b)});
  const c=document.createElement("button");c.className="sec";c.textContent="Cancelar";c.onclick=cerrarHoja;h.appendChild(c);
  $("hoja").classList.add("on");
}
function cerrarHoja(){$("hoja").classList.remove("on")}
$("hoja").addEventListener("click",e=>{if(e.target.id=="hoja")cerrarHoja()});

const SEL={origen:null,riqueza:null,sexo:null};
function pantallaCrear(){
  $("cab").classList.remove("compacta");$("stats").hidden=true;$("tabs").hidden=true;$("vista").hidden=true;$("acc").hidden=true;$("crear").hidden=false;
  $("ficha").innerHTML="<span>Simulador de vida</span><span>Solo texto</span><span>1 acción = 1 mes</span>";
  const grupo=(titulo,sub,clave,ops)=>`<div class="tit">${titulo}<small>${sub}</small></div><div class="chips" data-k="${clave}">`+
    ops.map(([v,t])=>`<button data-v="${v}" class="${String(SEL[clave])==String(v)?"on":""}">${t}</button>`).join("")+`</div>`;
  $("crear").innerHTML=
   `<p class="intro">Eliges de dónde vienes y poco más. El resto te toca: el sitio, la casa, los padres, los vecinos. Cada acción es un mes de tu vida, y todos mueren, tú también.</p>`+
   grupo("Informe ① Origen","Decide el país y los nombres de tu gente","origen",[[null,"Al azar"]].concat(Object.keys(ORI).map(k=>[k,ORI[k].n])))+
   grupo("Informe ② Familia","Cuánto hay en la nevera cuando llegas","riqueza",[[null,"Al azar"]].concat(FAM.map((f,i)=>[i,f])))+
   grupo("Informe ③ Sexo","","sexo",[[null,"Al azar"],["m","Niño"],["f","Niña"]])+
   `<div class="tit">Informe ④ Nombre<small>Déjalo vacío y lo eligen tus padres</small></div><input id="nombre" maxlength="18" placeholder="Nombre" autocomplete="off">`+
   `<button class="gordo" id="bNacer">NACER</button>`;
  $("crear").querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{
    const k=b.parentNode.dataset.k,v=b.dataset.v;SEL[k]=v=="null"?null:(k=="riqueza"?+v:v);
    b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x==b))});
  $("bNacer").onclick=()=>{nacer({origen:SEL.origen,riqueza:SEL.riqueza,sexo:SEL.sexo,nombre:$("nombre").value});TAB="diario";render(true)};
}
function barra(k,et){const v=Math.round(G.yo[k]);return `<div class="${v<25?"mal":""}">${et}<b>${v}</b><i style="width:${v}%"></i></div>`}
function filaGente(p){return `<tr class="${p.vivo?"":"muerto"}"><td>${esc(p.nombre)} ${esc(p.apellido)}${p.id==G.crush&&p.id!=G.pareja?" ♥":""}</td><td>${rolTxt(p)}</td><td class="n">${p.vivo?edadTxt(p.edad):"†"}</td><td class="n">${Math.round(p.rel)}</td></tr>`}
function tablaGente(titulo,l){return l.length?`<div class="tit">${titulo}</div><table><tr><th>Nombre</th><th>Quién es</th><th>Edad</th><th>Vínculo</th></tr>${l.map(filaGente).join("")}</table>`:""}
function render(abajo){
  if(!G){pantallaCrear();return}
  const y=G.yo;
  $("crear").hidden=true;$("vista").hidden=false;$("acc").hidden=false;$("tabs").hidden=false;$("stats").hidden=false;$("cab").classList.add("compacta");
  $("ficha").innerHTML=`<span>${esc(y.nombre)} ${esc(y.apellido)}</span><span>${edadTxt(y.edad)}</span><span>${esc(G.lugar.nombre)}</span>`+(anios()>=16?`<span>${Math.round(y.dinero)} en el bolsillo</span>`:"");
  $("stats").innerHTML=barra("salud","Salud")+barra("animo","Ánimo")+barra("mente","Mente")+barra("cuerpo","Cuerpo")+barra("carisma","Carisma")+barra("aspecto","Aspecto");
  document.querySelectorAll("#tabs button[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t==TAB));
  const v=$("vista");
  if(TAB=="diario"){
    v.innerHTML=G.log.slice(-70).map(e=>e.t=="tit"?`<div class="tit">${esc(e.txt)}${e.sub?"<small>"+esc(e.sub)+"</small>":""}</div>`:
      `<div class="caja ${e.cls}"><p>${esc(e.txt)}${e.tag?" <em>("+esc(e.tag)+")</em>":""}</p></div>`).join("");
    if(abajo)v.scrollTop=v.scrollHeight;
  }else if(TAB=="familia"){
    const viv=G.gente.filter(p=>p.vivo&&p.con),fam=["prog","herm","abu","tio","primo","hijo"];
    v.innerHTML=tablaGente("En casa contigo",viv.filter(p=>p.casa))+
      tablaGente("Familia",viv.filter(p=>!p.casa&&(fam.includes(p.rol)||p.id==G.pareja)))+
      tablaGente("Barrio y conocidos",viv.filter(p=>!p.casa&&!fam.includes(p.rol)&&p.id!=G.pareja&&!p.lejos))+
      tablaGente("Los que quedaron lejos",viv.filter(p=>p.lejos&&p.rel>=20))+
      tablaGente("En el recuerdo",G.gente.filter(p=>!p.vivo&&p.con&&(fam.includes(p.rol)||p.rel>=50)));
    v.scrollTop=0;
  }else{
    const d=G.casa.deQuien&&P(G.casa.deQuien);
    v.innerHTML=`<div class="tit">Informe ① ¿Dónde vives?</div>
     <table><tr><th>Lugar</th><td>${esc(G.lugar.nombre)}, ${LUGTXT[G.lugar.tipo]} de ${ORI[G.origen].pais}</td></tr>
     <tr><th>Casa</th><td>${esc(G.casa.tipo)}, en ${esc(G.casa.barrio)}${d?" (de "+esc(d.nombre)+")":""}</td></tr>
     <tr><th>${G.indep?"Nivel de vida":"Familia"}</th><td>${FAM[G.riqueza]}</td></tr>
     <tr><th>Origen</th><td>${ORI[G.origen].n}</td></tr></table>
     <div class="tit">Informe ② ¿Cómo te va?</div>
     <table><tr><th>Etapa</th><td>${etapa()}</td></tr>
     <tr><th>Trabajo</th><td>${G.trabajo?"Trabajas "+esc(G.trabajo.n)+" · "+G.trabajo.s+" al mes":G.pension?"Jubilación · "+G.pension+" al mes":anios()<16?"Aún no te toca":"Sin trabajo"}</td></tr>
     <tr><th>Estudios</th><td>${G.titulo?"Carrera terminada":G.uni?"En la universidad ("+G.uni+"/36)":anios()<6?"Ninguno":anios()<16?"En la escuela":"Enseñanza obligatoria"}</td></tr>
     <tr><th>Pareja</th><td>${G.pareja&&P(G.pareja)?esc(P(G.pareja).nombre)+(G.casado?" (matrimonio)":""):G.crush&&P(G.crush)?"Te gusta "+esc(P(G.crush).nombre):"Nadie"}</td></tr>
     <tr><th>Costumbres</th><td>${[G.fl.fuma&&"fumas",G.fl.adicto&&"enganche a las drogas",G.fl.ets&&"algo sin tratar"].filter(Boolean).join(", ")||"Nada que señalar"}</td></tr></table>
     <p class="nota">La partida se guarda sola en este navegador. Si empiezas otra vida, esta se pierde.</p>`;
    const b=document.createElement("button");b.className="gordo";b.style.fontSize="13px";b.textContent="ABANDONAR ESTA VIDA";
    b.onclick=()=>abrirHoja("¿Abandonar esta vida?",[{t:"Sí, empezar de cero",fn:()=>{G=null;borrar();cerrarHoja();render()}}]);
    v.appendChild(b);v.scrollTop=0;
  }
  const acc=$("acc");acc.innerHTML="";
  if(G.muerto){const b=document.createElement("button");b.className="ancho";b.textContent="Nacer otra vez";b.onclick=()=>{G=null;borrar();render()};acc.appendChild(b);return}
  acciones().forEach(o=>{const b=document.createElement("button");b.textContent=o.t;if(o.cls)b.className=o.cls;
    b.onclick=o.anio?pasarAnio:o.abre?o.abre:()=>{TAB="diario";hacer(o.fn)};acc.appendChild(b)});
}
document.querySelectorAll("#tabs button[data-t]").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render(TAB=="diario")});
// Pantalla completa (en el APK ya va a pantalla completa y el botón sobra)
if(window.AndroidApp)$("bFull").hidden=true;
$("bFull").onclick=()=>{
  const d=document,el=d.documentElement;
  try{
    if(d.fullscreenElement){d.exitFullscreen();return}
    const p=el.requestFullscreen?el.requestFullscreen():Promise.reject();
    p.catch(()=>abrirHoja("Aquí no se puede poner a pantalla completa. Instala el APK: ahí va siempre completa.",[]));
  }catch(e){abrirHoja("Aquí no se puede poner a pantalla completa. Instala el APK: ahí va siempre completa.",[])}
};
window.__atras=()=>{if($("hoja").classList.contains("on")){cerrarHoja();return 1}return 0};
cargar();render(true);
</script>
</body>
