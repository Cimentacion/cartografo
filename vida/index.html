DEC.toxBolsa={man:1,tit:d=>"La bolsa de deporte",txt:d=>"",ops:d=>{const q=toxQ(d),y=G.yo;return [
  {t:"Guardarla sin abrir",fn:()=>{if(ch(.25)){rel(q,-20);return encarcelar(ri(10,30))}rel(q,10);y.dinero+=ri(300,900);return `Tres semanas con la bolsa en el altillo, sin dormir bien. ${q.nombre} se la lleva una noche y te deja un fajo «por las molestias».`+moral("leal")}},
  {t:"Abrirla",fn:()=>{add("mente",1);rel(q,-8);return {txt:`La abres. ${pick(["Billetes en fajos y un arma envuelta en una toalla","Paquetes precintados que no son harina","Pasaportes con seis nombres distintos y la misma foto"])}. La cierras con las manos frías. Ya sabes con quién duermes.`,mal:1}}},
  {t:"Negarte",fn:()=>{rel(q,-15);return {txt:`«En mi casa no.» ${q.nombre} te mira como si le hubieras cerrado la puerta en un incendio. Se va con la bolsa. Vuelve a los dos días, sin ella y sin explicaciones.`,mal:1}}}]}};
DEC.toxDrama={man:1,tit:d=>"Otro incendio de "+toxQ(d).nombre,txt:d=>"",ops:d=>{const q=toxQ(d),y=G.yo;return [
  {t:"Calmarle como siempre",fn:()=>{rel(q,4);add("animo",-5);q.pas=clamp((q.pas||0)+6);if(d.j&&G.trabajo&&ch(.2)){G.trabajo=null;return {txt:`Le calmas delante de todos, durante una hora. A final de mes tu jefe te llama al despacho: «No es por lo de recepción. Bueno, sí es por lo de recepción.»`,mal:1}}return `Le abrazas, le prometes, le juras. Se calma. La reconciliación es tan intensa como la bronca, y ese es exactamente el problema.`}},
  {t:"No entrar al trapo",fn:()=>{rel(q,-10);return {txt:`Esta vez no corres detrás. ${q.nombre} sube la apuesta: un portazo, un plato, un «no me vas a volver a ver». Vuelve a las dos horas.`,mal:1}}},
  {t:"Proponer que vaya a hablar con alguien",s:"Depende de lo vuestro",fn:()=>{if(ch(.15+q.rel/200)){q.tox=null;rel(q,8);logro("ayudas a "+q.nombre+" a pedir ayuda");return `Se lo dices sin reproche, en un día bueno. Tarda semanas en decir que sí. Va. Poco a poco los incendios se espacian, y un día te das cuenta de que lleváis un mes en paz.`}rel(q,-12);return {txt:`«¿Me estás llamando ${gp(q,"loco","loca")}?» Elegiste mal el día, o no hay día bueno.`,mal:1}}}]}};
DEC.toxFin={man:1,tit:d=>toxQ(d).nombre+" en tu escalera",txt:d=>"",ops:d=>{const q=toxQ(d),y=G.yo;return [
  {t:"Denunciar y pedir una orden de alejamiento",fn:()=>{G.acoso=null;q.lejos=true;rel(q,-30);add("animo",6);return `Vas a comisaría con las capturas, las fechas y el coche rayado. Tardan, pero llega el papel: doscientos metros. ${q.nombre} lo incumple una vez. La segunda ya no.`}},
  {t:"Escucharle esos cinco minutos",fn:()=>{if(ch(.5)){G.acoso=null;q.ex=0;if(!G.pareja)G.pareja=q.id;else q.amante=true;rel(q,25);q.pas=clamp((q.pas||0)+20);return {txt:`Cinco minutos son cuarenta. Llora, promete, te recuerda lo bueno, que lo hubo. Sube contigo. Por la mañana estáis otra vez donde estabais, y los dos sabéis cómo sigue.`,mal:1}}G.acoso.m=ri(3,6);return {txt:`Le escuchas. Cuando dices que no ha cambiado nada, le cambia la cara. «Te vas a arrepentir.» Baja las escaleras de dos en dos.`,mal:1}}},
  {t:"Pasar de largo y cerrar la puerta",fn:()=>{if(ch(.4)){G.acoso=null;q.lejos=true;return `Pasas por encima de sus rodillas sin mirar y echas la llave. Se queda una hora más. Luego oyes pasos que bajan. No vuelve.`}G.acoso.m=ri(3,8);return {txt:"Cierras la puerta. Esa noche llama al telefonillo hasta las cuatro.",mal:1}}}]}};

/* ---------- Más trabajos fuera de lo normal ---------- */
const RAROS={
 faro:{n:"de farero en una isla sin árboles",s:1700,req:y=>y.mente>=35,t:"Farero en un islote",d:"1700 · solo, con una radio y un barco cada quince días",ini:"Te dejan en el islote con tres meses de víveres, un cuaderno de guardias y la llave de una torre de sesenta metros. La luz gira sola. Tú estás para cuando no gire.",
  ev:["Niebla de tres días. Haces sonar la sirena cada dos minutos y hablas con ella.","Un velero entra de arribada con el palo roto. Les das sopa. Son la primera gente en un mes.","Miles de aves migratorias se posan en la isla una sola noche. Por la mañana no queda ninguna.","Subes los doscientos escalones para limpiar la lente. Desde arriba, la curva de la Tierra.","La radio capta una emisora que habla en un idioma que no reconoces, siempre a las tres.","Tormenta eléctrica: la torre recibe cuatro rayos. Tú estás dentro, contando.","Encuentras el cuaderno del farero anterior. La última entrada dice: «Hoy han vuelto a llamar desde abajo.»","El barco de suministros se retrasa una semana. Aprendes a pescar por necesidad."],
  dec:["faroNaufragio","faroLuz"]},
 museo:{n:"de vigilante nocturno en un museo",s:1500,req:y=>true,t:"Vigilante nocturno del museo",d:"1500 · de diez a seis, a solas con tres mil años",ini:"Te dan una linterna, un walkie y un plano con las alarmas. A las diez se va el último conservador. Hasta las seis, el museo entero es tuyo, y tú de él.",
  ev:["Haces la ronda por la sala egipcia. Juras que el sarcófago estaba un palmo más a la izquierda.","Te sientas media hora delante del mismo cuadro. A las cuatro de la mañana se entiende todo mejor.","Salta la alarma del ala este. No hay nadie. Hay una ventana abierta que tú cerraste.","Aprendes las cartelas de memoria. Podrías hacer de guía con los ojos cerrados.","Un conservador se queda hasta tarde restaurando. Te deja mirar por la lupa.","Los pasos resuenan de otra manera en la sala de armaduras. Como si fueran más de dos.","Encuentras a un niño dormido detrás de un tapiz: se perdió en la visita. Lo llevas con sus padres, que llevan horas buscándolo.","La estatua del patio tiene los ojos mirando a la cámara de seguridad. Ayer miraba a la fuente."],
  dec:["museoRobo","museoPieza"]},
 funeraria:{n:"en una funeraria",s:1900,req:y=>y.edad>=216,t:"Empleado de funeraria",d:"1900 · alguien tiene que hacerlo, y que lo haga bien",ini:"El primer día te enseñan a hacer el nudo de la corbata a otro, a hablar bajo sin susurrar y a no decir nunca «le acompaño en el sentimiento» si no es verdad.",
  ev:["Preparas a un hombre de noventa años con el traje de su boda. Le queda grande. Lo arreglas con alfileres por detrás.","Un velatorio sin nadie. Te sientas tú en primera fila, para que no esté solo.","La familia discute por la música delante del féretro. Pones la que él dejó escrita.","Maquillas a una mujer con una foto delante. Su hija entra y dice: «Parece dormida.» Es lo mejor que te pueden decir.","Entierro bajo la lluvia. Sujetas el paraguas de una viuda dos horas sin moverte.","Aprendes que el dolor de la gente no se parece, y que todos preguntan lo mismo.","Un cliente viene a pagar su propio entierro por adelantado y a elegir la caja. Se prueba el forro con la mano.","Te toca recoger a alguien que llevaba semanas solo en su piso. Esa noche llamas a tu madre."],
  dec:["funeJoya","funeFalso"]},
 circo:{n:"en un circo ambulante",s:1300,req:y=>y.cuerpo>=40||y.carisma>=50,t:"Mozo de pista en un circo ambulante",d:"1300 · un pueblo cada semana y una familia rara",ini:"Te contratan para montar la carpa, y a la semana ya das de comer a los caballos, vendes palomitas y sujetas la escalera de la trapecista. Duermes en una caravana que huele a serrín.",
  ev:["Montáis la carpa bajo un vendaval. Cuarenta personas tirando del mismo cabo, gritando en seis idiomas.","El payaso viejo te enseña a caerte sin hacerte daño. Es lo más útil que has aprendido nunca.","Función con ocho espectadores. Se hace entera, como si fueran ochocientos.","La trapecista falla el agarre en el ensayo. La red aguanta. Nadie cena esa noche.","Un pueblo os recibe a pedradas y otro con banda de música. Nunca se sabe.","El domador se jubila y los animales se van a un santuario. La pista se queda enorme.","Aprendes a hacer malabares con tres mazas. Con cuatro, a recogerlas.","Noche de hoguera entre caravanas. Alguien toca el acordeón y todos saben la letra menos tú."],
  dec:["circoNumero","circoHuida"]},
 bosque:{n:"de guarda forestal en una torre de vigilancia",s:1600,req:y=>y.cuerpo>=40,t:"Guarda forestal en una torre",d:"1600 · un verano entero mirando humo",ini:"La torre es una caseta de cristal sobre cuatro patas de hierro, a dos horas a pie del último camino. Te dan unos prismáticos, una radio y un mapa con un transportador de ángulos.",
  ev:["Cuentas rayos en una tormenta seca: catorce. Marcas cada uno en el mapa y no duermes.","Un oso se rasca la espalda contra una pata de la torre. Tiembla todo. Tú más.","Hablas por radio cada noche con la guarda de la torre de enfrente. No os habéis visto nunca.","Humo al noroeste. Das el aviso con rumbo y distancia. Era una barbacoa. Mejor así.","Encuentras excursionistas perdidos, deshidratados, a un día de marcha. Los bajas tú.","Amanece con el valle lleno de niebla y la torre por encima, como un barco.","Alguien ha dejado un ramo de flores al pie de la torre. No hay huellas en el barro.","Un mes sin ver a nadie. Empiezas a ponerles nombre a los árboles."],
  dec:["bosqueFuego","bosqueFurtivo"]}};
function rarosTxt(k){return RAROS[k]}
function eventosRaros(ev,a){const T=G.trabajo,R_=T&&RAROS[T.raro];if(!R_||G.carcel)return;G.raroH=G.raroH||{};
  ev(6,"raroA"+T.raro,()=>log(vario("raro"+T.raro,R_.ev)));
  R_.dec.forEach((k,i)=>{if(!G.raroH[k]&&T.m>=4+i*6&&!G.pend)ev(4,k,()=>{G.raroH[k]=1;decidir(k,{});log(DECINTRO[k],"mala")})})}
const DECINTRO={faroNaufragio:"Noche cerrada y mar gruesa. Un pesquero se ha ido contra las rocas del norte: ves las bengalas. La lancha de salvamento tardará dos horas. Tú tienes un bote de remos.",
 faroLuz:"A las tres de la madrugada la lámpara del faro se apaga sola. En la radio, un mercante pide confirmación de posición: viene derecho a los bajos.",
 museoRobo:"Tres sombras con mochilas en el patio interior. Han cortado la alarma del ala oeste. Tú tienes una linterna y un walkie sin cobertura en esa sala.",
 museoPieza:"Limpiando una vitrina se te cae una figurilla de tres mil años. Se parte en dos. Nadie lo ha visto y la cámara de esa sala lleva meses rota.",
 funeJoya:"Preparando a una anciana encuentras, cosido en el forro de su vestido, un saquito con monedas de oro. La familia no sabe que existe.",
 funeFalso:"Un hombre te ofrece un sobre grueso por firmar que el cuerpo de la sala dos es de quien dice la documentación. No lo es: lo conocías.",
 circoNumero:"El lanzador de cuchillos se ha roto la muñeca y la función es en dos horas. El director te mira a ti. «Tú tienes pulso. O te pones en la diana.»",
 circoHuida:"La trapecista te despierta de madrugada con una mochila. Debe dinero al director, que no es de perdonar. Quiere que la ayudes a irse antes de que amanezca.",
 bosqueFuego:"Humo de verdad, a seis kilómetros, con viento hacia el campamento de verano del lago. La radio no da señal. Bajar a avisar son dos horas corriendo.",
 bosqueFurtivo:"Disparos al anochecer. Encuentras a dos furtivos con un ciervo recién muerto y una furgoneta. Uno de ellos es el alcalde del pueblo de abajo."};
const D2=(k,tit,ops)=>DEC[k]={man:1,tit:d=>tit,txt:d=>"",ops:d=>ops(G.yo)};
D2("faroNaufragio","Las bengalas",y=>[{t:"Salir con el bote de remos",s:"Depende de tu cuerpo",fn:()=>{if(ch(.2+y.cuerpo/130)){logro("sacas del mar a la tripulación de un pesquero");add("carisma",3);y.dinero+=1200;return "Remas una hora contra un mar que no quiere. Sacas a cuatro hombres de las rocas, uno a uno. El quinto no aparece. En el pueblo de la costa ponen tu nombre a un bar."+moral("valiente",3)}if(ch(.3)){G.muerteDirecta="el mar, una noche, remando hacia unas bengalas";return {txt:"El bote vuelca en la segunda rompiente.",mal:1}}add("salud",-18);return {txt:"El mar te devuelve a la playa, medio ahogado. Desde allí ves apagarse la última bengala.".replace("ahogado",g("ahogado","ahogada")),mal:1}}},
  {t:"Guiarlos con la luz y la radio",s:"Depende de tu cabeza",fn:()=>ch(.35+y.mente/150)?"Les cantas por radio la posición de cada roca y enfocas el canal bueno con el reflector de mano. Tres llegan nadando a la cala. Cuando aparece la lancha, ya tienes mantas calientes.":{txt:"Lo intentas por radio. Solo contesta el ruido. La lancha llega tarde.",mal:1}}]);
D2("faroLuz","El faro a oscuras",y=>[{t:"Subir y encenderla a mano",fn:()=>ch(.4+y.cuerpo/250+y.mente/250)?(logro("evitas que un mercante se estrelle contra los bajos"),"Subes los doscientos escalones a oscuras y giras la lámpara de emergencia con una manivela durante cuatro horas. El mercante vira a media milla. Por la mañana no sientes los brazos."):{txt:"Llegas arriba tarde. Oyes el casco rozar los bajos, un ruido que no se olvida. No se hunde, pero no gracias a ti.",mal:1}},
  {t:"Avisar por radio y lanzar bengalas",fn:()=>ch(.6)?"Gritas la posición por el canal de socorro y tiras las seis bengalas del armario. El mercante da atrás toda. Te tiemblan las manos hasta el amanecer.":{txt:"La radio falla también. Las bengalas las ven demasiado tarde.",mal:1}}]);
D2("museoRobo","Tres sombras en el patio",y=>[{t:"Encerrarlos dentro",s:"Depende de tu cabeza",fn:()=>ch(.3+y.mente/150)?(y.dinero+=2000,logro("frustras un robo en el museo"),"Bajas las rejas del ala oeste desde el cuadro manual y los dejas dentro de la sala de monedas, como en una pecera. Cuando llega la policía están sentados en un banco. Gratificación: 2000."):{txt:"Te equivocas de reja y cierras la que no es. Salen por donde entraron, con dos vitrinas menos.",mal:1}},
  {t:"Enfrentarte con la linterna",fn:()=>{if(ch(.15+y.cuerpo/160))return "Les das el alto con la voz más grave que tienes. Son tres críos de veinte años. Sueltan las mochilas y corren."+moral("valiente");add("salud",-ri(10,22));return {txt:"No eran críos. Te atan con tus propias bridas y se toman su tiempo.",mal:1}}},
  {t:"Aceptar lo que te ofrecen por no ver",fn:()=>{if(ch(.3))return encarcelar(ri(12,36));y.dinero+=5000;G.trabajo=null;return {txt:"Cinco mil por media hora mirando a la pared. A la semana te despiden, sin pruebas. Las piezas no aparecen nunca."+moral("tramposo",3),mal:1}}}]);
D2("museoPieza","La figurilla rota",y=>[{t:"Dar parte",fn:()=>ch(.6)?"Lo cuentas tal cual. La conservadora suspira, se pone los guantes y dice que se ha roto por una fractura antigua: llevaba tres mil años esperando. Te invita a ver cómo la pega."+moral("leal"):(G.trabajo=null,{txt:"Lo cuentas. Te despiden esa misma semana. La figurilla, pegada, vuelve a su vitrina.",mal:1})},
  {t:"Pegarla y callar",fn:()=>ch(.6)?"Pegamento, pulso y la luz justa. Nadie lo nota. Tú la miras cada noche al pasar."+moral("tramposo"):(G.trabajo=null,{txt:"La pegas torcida. A los tres días lo ve hasta el de la limpieza.",mal:1})}]);
D2("funeJoya","Las monedas del forro",y=>[{t:"Dárselas a la familia",fn:()=>{add("animo",5);return "Se lo entregas a la hija con el vestido. Se queda mirando el saquito. «Así que era verdad lo del oro de la abuela.» Te manda una caja de dulces cada Navidad, para siempre."+moral("leal",2)}},
  {t:"Quedártelas",fn:()=>{y.dinero+=ri(2000,6000);add("animo",-4);return {txt:"Nadie las echará de menos, te dices. Las vendes en otra ciudad. Cada vez que cierras una caja, piensas en ese forro."+moral("egoista",3),mal:1}}},
  {t:"Dejarlas donde ella las puso",fn:()=>"Vuelves a coser el forro, puntada a puntada. Si quiso llevárselas, que se las lleve."}]);
D2("funeFalso","El sobre grueso",y=>[{t:"Firmar",fn:()=>{y.dinero+=4000;if(ch(.35))return encarcelar(ri(12,30));return {txt:"Firmas. Cuatro mil. Alguien queda oficialmente muerto y alguien oficialmente vivo, y los dos al revés."+moral("tramposo",3),mal:1}}},
  {t:"Negarte y avisar",fn:()=>ch(.7)?(logro("destapas una suplantación en la funeraria"),"Te niegas y llamas a quien hay que llamar. Sale en los periódicos: un seguro de vida, una identidad robada. Te cambian los turnos una temporada, por si acaso."+moral("valiente",2)):(add("salud",-15),{txt:"Te niegas. Esa noche te esperan en el garaje para explicarte lo que cuesta un no.",mal:1})},
  {t:"Negarte y callar",fn:()=>"Le devuelves el sobre. Se encoge de hombros y va a la funeraria de enfrente. Allí sí firman."}]);
D2("circoNumero","Cuchillos",y=>[{t:"Lanzar tú",s:"Depende de tu pulso",fn:()=>ch(.3+y.cuerpo/250+y.mente/300)?(add("carisma",4),logro("debutas en la pista lanzando cuchillos"),"Doce cuchillos, doce golpes secos alrededor de una mujer que no pestañea. El último le roza el pelo. La carpa se viene abajo. Te suben el sueldo y te dan un chaleco con lentejuelas."):{txt:"El séptimo se te va un palmo. Le da en el hombro, de plano. Sangre, gritos, telón. Vuelves a las palomitas, y gracias.",mal:1}},
  {t:"Ponerte en la diana",fn:()=>ch(.85)?(add("carisma",2),"Te atan a la rueda y la hacen girar. No ves venir ninguno; los oyes. Cuando paran, tienes el contorno dibujado en acero y las piernas de trapo."):(add("salud",-25),{txt:"El quinto cuchillo no va a la madera.",mal:1})},
  {t:"Decir que ni loco",fn:()=>"Dices que tú has venido a clavar estacas. Suspenden el número y el director no te habla en un mes."}]);
D2("circoHuida","La trapecista y la mochila",y=>[{t:"Sacarla en la furgoneta",fn:()=>{if(ch(.6)){const p=per("conoc","f",ri(22,34),pick(ORI[G.origen].ap),{con:true,rel:55,sitio:"del circo",oficio:"trapecista"});G.trabajo=null;return `La llevas a la estación del pueblo de al lado con las luces apagadas. Te despiden al amanecer, claro. ${p.nombre} te escribe meses después desde otro circo, otro país: una postal con una red dibujada.`+moral("leal",2)}add("salud",-ri(8,18));G.trabajo=null;return {txt:"Os alcanzan en la gasolinera. A ella se la llevan de vuelta. A ti te dejan en el arcén, con lo puesto.",mal:1}}},
  {t:"Pagar tú la deuda",s:y.dinero>=1500?"1500":"Te faltan 1500",fn:()=>{if(y.dinero<1500)return {txt:"No lo tienes. Ella asiente y se va sola, por los maizales.",mal:1};y.dinero-=1500;add("carisma",1);return "Vas a la caravana del director con el dinero en la mano. Lo cuenta dos veces. «No sabía que hubiera gente así.» Ella se queda, y desde entonces el mejor asiento de la cena es el tuyo."+moral("generoso",2)}},
  {t:"No meterte",fn:()=>"Le dices que no puedes. Se va sola, de noche. Por la mañana el trapecio está recogido y nadie pregunta."}]);
D2("bosqueFuego","Humo de verdad",y=>[{t:"Bajar corriendo a avisar",s:"Depende de tu cuerpo",fn:()=>ch(.25+y.cuerpo/130)?(logro("evacuas un campamento antes del incendio"),add("carisma",3),"Dos horas de monte en una hora y diez. Llegas sin voz. Sesenta críos y seis monitores salen andando por la pista con el humo ya en la nuca. Arde todo, menos ellos."+moral("valiente",3)):{txt:"Te tuerces el tobillo a mitad de bajada. Llegas cuando ya han visto el humo ellos solos, por los pelos.",mal:1}},
  {t:"Hacer un cortafuegos de señales",s:"Depende de tu cabeza",fn:()=>ch(.3+y.mente/160)?"Subes a la cresta donde sí hay cobertura con el espejo de señales y la radio. Tres destellos al helicóptero de la base, rumbo y distancia. Llegan los hidroaviones antes que el viento.":{txt:"Pierdes cuarenta minutos buscando señal. Cuando la encuentras, el fuego ya ha saltado la pista.",mal:1}}]);
D2("bosqueFurtivo","El alcalde y el ciervo",y=>[{t:"Denunciar",fn:()=>ch(.5)?(logro("denuncias al alcalde por furtivo"),"Fotos, matrícula, parte. Sale en la prensa comarcal. El alcalde dimite y medio pueblo deja de saludarte; el otro medio te invita a todo."+moral("valiente",2)):(G.trabajo=null,{txt:"Denuncias. El parte se pierde en un cajón y a ti no te renuevan el contrato.",mal:1})},
  {t:"Aceptar medio ciervo y callar",fn:()=>{add("animo",-2);return {txt:"Te dejan un cuarto trasero envuelto en plástico y la promesa de un contrato fijo. Lo cumple."+moral("tramposo",2),mal:1}}},
  {t:"Decomisar y dejarlo en aviso",fn:()=>"Te quedas las escopetas y les dices que la próxima va con parte. El alcalde te mira como se mira a alguien que acaba de comprar algo caro."}]);
function menuRaros2(ops){const y=G.yo;if(G.rig)return;Object.keys(RAROS).forEach(k=>{const R_=RAROS[k];if(G.trabajo&&G.trabajo.raro==k)return;const ok=R_.req(y);ops.push({t:R_.t,s:ok?R_.d:"No das el perfil",fn:ok?()=>hacer(()=>{G.trabajo={n:R_.n,s:R_.s,raro:k,m:0};add("animo",4);logro("empiezas a trabajar "+R_.n);return R_.ini}):()=>{}})})}

/* ---------- Sitios extraños ---------- */

 recre:[["el del récord imbatible","el que arregla las máquinas con un clip","el veterano del futbolín","el que juega con guantes"],["la reina del pinball","la que cambia las fichas","la que gana siempre al air hockey","la del baile de la máquina de pasos"]],

TR.cartasKg={ok:a=>a>=14,pasos:{ini:{b:d=>"Las cartas por kilos",intro:d=>"En un puesto venden cartas ajenas a peso. Compras medio kilo por curiosidad. Entre ellas hay veinte de la misma mano, a la misma mujer, sin abrir: devueltas al remitente una tras otra.",
  ops:d=>[{t:"Abrirlas y leerlas en orden",fn:()=>{add("mente",2);return {txt:"Las lees una noche, en orden. Un hombre pide perdón durante dos años, cada vez con menos esperanza y mejor letra. La última solo dice una dirección y una fecha: «Estaré allí cada año, ese día.» La fecha es el mes que viene.",sig:"cita",tras:1}}},{t:"Venderlas a un coleccionista",fn:()=>{G.yo.dinero+=ri(60,200);return "Un coleccionista de sellos te las paga bien. Solo quiere los sobres. Las cartas las tira."}}]},
 cita:{b:d=>"El día de la última carta",intro:d=>"Es el día que decía la carta. La dirección es un banco frente a una estación que ya no tiene trenes.",

TR.maquina={ok:a=>a>=9,pasos:{ini:{b:d=>"La máquina del fondo",intro:d=>"Al fondo de los recreativos hay una máquina sin nombre, con la pantalla quemada por los bordes. El dueño dice que nadie ha pasado de la pantalla nueve desde que abrió, y que quien lo haga se la lleva.",

 nueve:{b:d=>"La pantalla nueve",intro:d=>"Hoy llegas a la nueve con tres vidas. Hay gente detrás. El dueño ha salido de la cabina de las fichas.",

TR.amano={ok:a=>a>=20,pasos:{ini:{b:d=>"El soplo",intro:d=>"Un mozo de cuadra te lleva aparte. La cuarta carrera del domingo está arreglada: el favorito va a perder y sabe quién gana. Quiere el diez por ciento de lo que saques.",

TR.heredera={ok:a=>a>=16,pasos:{ini:{b:d=>"La mujer de la verja",intro:d=>"Hay una mujer joven parada frente a la casa abandonada, con una llave antigua en la mano que no se atreve a usar. Dice que es la nieta de los últimos dueños y que nadie de su familia ha vuelto a entrar desde 1975.",
  ops:d=>[{t:"Entrar con ella",fn:()=>{add("mente",1);return {txt:"La llave gira a la tercera. Recorréis la casa habitación por habitación. Ella va diciendo de quién era cada cuarto, por lo que le contaron. En la cocina hay tres platos puestos.",sig:"sotano",tras:1}}},{t:"Decirle que ahí dentro no hay nada",fn:()=>({txt:"Asiente, guarda la llave y se va. No vuelves a verla. La casa la derriban en dos años."})}]},
 sotano:{b:d=>"La puerta del sótano",intro:d=>"Queda una puerta sin abrir, la del sótano, tapiada por dentro con tablones. Su abuela decía que «lo de abajo» fue la razón por la que se marcharon una noche, con lo puesto.",
  ops:d=>{const y=G.yo;return [{t:"Arrancar los tablones",fn:()=>{const r=ri(0,2);if(r==0){const n=ri(2,9)*1000;y.dinero+=Math.round(n/2);logro("abres el sótano de la casa abandonada");return `Debajo hay una bodega y, tras una pared falsa, lo que escondieron al irse: plata, papeles, un cuadro enrollado. Lo reparte contigo a medias: ${Math.round(n/2)}. «Mi abuela diría que es dinero con mala sombra.»`}
     if(r==1){logro("abres el sótano de la casa abandonada");const p=per("conoc","f",ri(24,34),pick(ORI[G.origen].ap),{con:true,rel:45,sitio:"de la casa abandonada",oficio:"heredera de la casona"});return `Abajo solo hay un cuarto de niño, intacto, con el nombre de un hermano de su abuela del que nadie le habló jamás. Se sienta en la camita. ${p.nombre} —así se llama— te escribe después: ha encontrado la partida de defunción. Quiere que la acompañes a poner una lápida.`}
     add("animo",-8);return {txt:"Los tablones no estaban para que no se entrara. Lo entiendes cuando ya has bajado tres peldaños y la linterna se apaga. Subís los dos sin daros la vuelta y volvéis a clavar la puerta, con vuestras manos, sin hablar. No sabrías decir qué viste.",mal:1}}},
   {t:"Dejar la puerta como está",fn:()=>({txt:"«Si mi abuela la tapió, sabría por qué.» Cerráis la casa con la llave antigua. Ella la tira al río desde el puente."})}]}}}};

SITX.llave=(S,niv,a)=>[{t:"Sentarte en la mesa de la anfitriona",s:"Desde ahí se ve todo",min:1,fn:()=>{add("carisma",2);add("mente",1);return vario("llaM",["Desde la mesa del fondo aprendes a leer la sala: quién viene a mirar, quién a que le miren, quién a olvidarse de algo.","Te cuentan, sin nombres, historias del club de hace veinte años. Algunas siguen pasando ahí mismo, detrás de ti."])}},
  {t:"Un reservado",s:"60 · con quien tú quieras de los tuyos",min:1,enc:false,fn:()=>{const y=G.yo,l=vivos(p=>(p.id==G.pareja||p.amante)&&p.edad>=216&&!p.lejos);y.dinero-=60;if(!l.length)return "Pides un reservado para ti. Te quedas un rato a solas con una copa, oyendo el club al otro lado de la cortina. No es triste. Es raro.";const p=pick(l);return encuentro(p,"probar",true)}}];
function lugaresRaros(U,a){const y=G.yo;

  if(a>=12)U("El rastro de madrugada","Mantas en el suelo y cosas con historia",()=>{add("mente",1);add("animo",2);return vario("rastro",["Paseas entre mantas con media vida de otros en venta: dentaduras, medallas, cartas, un ojo de cristal.","A las seis de la mañana lo bueno ya está vendido. Lo raro, no.","Un puesto solo vende llaves. Ninguna abre nada que el dueño sepa.","Encuentras un juguete exacto al que perdiste de crío. Podría ser el mismo."])},"rastro");
  if(a>=8)U("Los recreativos viejos",a>=14?"10 · máquinas que ya no se fabrican":"Con la paga",()=>{if(a>=14)y.dinero-=10;add("animo",4);add("mente",.5);return vario("recre",["Cambias un billete por fichas y la tarde se te va en luces.","El futbolín cojea de una pata y todo el mundo sabe compensarlo.","Hay una máquina que da calambre. Se juega igual.","Huele a moqueta vieja y a electricidad. Es un olor que no se olvida."])},"recre");
  if(a>=18&&G.lugar.tipo!="aldea")U("El hipódromo","Domingos de programa, prismáticos y sombreros",()=>{add("animo",3);add("carisma",.5);return vario("hipo",["Tarde de carreras. Aprendes a leer el programa como una partitura.","Te apoyas en la valla del paddock a ver pasar a los caballos, que es lo mejor y es gratis.","La grada entera se levanta en la recta. Tú también, sin saber a cuál vas."])},"hipo");
  if(a>=10)U("La casa abandonada","Nadie entra, dicen. Hay un hueco en la verja",()=>{add("mente",1);add("animo",1);return vario("casona",["Te cuelas por el hueco de la verja. El jardín se ha comido los escalones.","Recorres la planta baja con la linterna. En la pared del salón hay marcas de cuadros que ya no están.","Hay un calendario en la cocina, parado en un mes de hace cincuenta años, con un día rodeado.","Alguien ha estado aquí hace poco: hay cera fresca en el suelo, en círculo."])},"casona")}
function tickNuevo14(){const y=G.yo;if(G.muerto)return;tickTox();if(G.trabajo&&G.trabajo.raro)G.trabajo.m=(G.trabajo.m||0)+1;if(G.fl.amano&&!G.carcel){y.dinero+=400;if(ch(.012)){G.fl.amano=0;const x=encarcelar(ri(8,24));log("Redada en el hipódromo. Tu nombre sale en la libreta de alguien. "+x.txt,"mala")}}}

/* ================= AMPLIACIÓN 15: historias largas en paralelo, que se tuercen si alguien muere · cabos sueltos · segundas partes · matiz según tu situación ================= */
const estado=()=>{const y=G.yo;if(y.edad<216)return "crio";if(G.pareja&&viv(G.pareja))return "pareja";if(vivos(p=>p.amante).length)return "amante";return G.fl.virgen!==false?"virgen":"solo"};
/* ---------- Cabos sueltos ---------- */
function hilo(k,txt,fin){G.hilos=G.hilos||[];if(G.hilos.some(h=>h.k==k))return;G.hilos.push({k,txt,fin,en:G.yo.edad});log("Queda un cabo suelto: "+txt,"mala")}
function menuHilos(){const y=G.yo;abrirHoja("Cabos sueltos",(G.hilos||[]).map((h,i)=>({t:cap1(h.txt),s:"Desde hace "+(y.edad-h.en>=24?Math.floor((y.edad-h.en)/12)+" años":Math.max(1,y.edad-h.en)+" meses")+" · tirar del hilo gasta el mes",fn:()=>hacer(()=>{if(!ch(.18+y.mente/320+(y.edad-h.en)/1200))return {txt:vario("hiloNo",["Preguntas, escribes, llamas. Quien podía saberlo ya no está o no quiere acordarse.","Un mes revolviendo papeles y memorias ajenas. Nada todavía.","Das con alguien que lo sabía. Murió en primavera.","Casi. Te dan un nombre y una ciudad; la ciudad es grande."]),mal:1};G.hilos=G.hilos.filter(x=>x!==h);add("mente",2);add("animo",5);logro("atas un cabo suelto: "+h.txt);return h.fin})})))}
function tickHilos(){const y=G.yo;if(G.muerto||G.carcel)return;
  // tramas de sitios: si muere su figura, alguien la retoma o queda en el aire
  for(const k in (G.sit||{})){const S=G.sit[k],t=S.tr;if(!t||!t.d||t.d.f==null)continue;const f=P(t.d.f);if(!f||f.vivo)continue;
    if(TR[t.k]&&!["afecto"].includes(t.k)&&ch(.55)){S.fig=null;const nf=figDe(k);if(nf){t.d.f=nf.id;t.d.suc=1;t.dicho=0;log(`Muere ${f.nombre} ${f.apellido} con lo vuestro a medias. Lo retoma ${nf.nombre}, que llega de ${nf.oficio} y ha encontrado sus notas con tu nombre subrayado. «No sé qué era esto», dice, «pero parecía importante.»`);continue}}
    S.hechas.push(t.k);S.tr=null;S.trSig=S.v+ri(5,9);const H=HILOT[t.k]||[`lo que ${f.nombre} y tú dejasteis a medias`,`Años después, alguien que ordenaba las cosas de ${f.nombre} te trae un sobre con tu nombre. Dentro está lo que faltaba por saber, escrito con su letra. Era más sencillo de lo que pensabas, y más triste.`];hilo(t.k,H[0].replace("{f}",f.nombre),H[1].replace(/\{f\}/g,f.nombre))}
  if(G.arc&&G.arc.k=="vamp"&&!G.carcel){const d=G.arc.d,h=P(d.h);if(h&&!h.vivo){G.arc=null;hilo("vamp",`quién era de verdad ${h.nombre}, y qué quería su Casa de ti`,`Una noche de invierno llega un carruaje sin cochero. Dentro no hay nadie: solo un retrato pequeño de ${h.nombre}, pintado hace ocho siglos, y una nota con letra antigua: «Te eligió. Eso no caduca.» El carruaje se va solo.`)}}
  if((G.hilos||[]).length&&ch(.006)){const h=pick(G.hilos);G.hilos=G.hilos.filter(x=>x!==h);add("animo",4);log("Sin buscarlo, la respuesta llega sola. "+h.fin)}}
const HILOT={cepillo:["adónde iba el dinero de la colecta que se llevaba {f}","Una mujer llama a tu puerta con dos hijos ya crecidos. Durante años, {f} les pagó el alquiler con dinero que no era suyo y nunca dijo de dónde salía. Te lo cuenta porque encontró tu nombre en una libreta, junto a la palabra «sabe»."],
 secta:["qué fue de los Hijos de la Luz cuando murió {f}","Te escribe una chica que no conoces. Estuvo dentro. Cuando murió {f} encontraron las cuentas, y tres nombres más arriba que nadie sospechaba. Uno es de tu barrio. Lo saluda todo el mundo."],
 traspaso:["qué iba a ser del bar","El hijo de {f} reabre el bar un domingo, con el mismo letrero y otra cafetera. Te pone delante lo de siempre sin preguntar: su padre dejó apuntado lo que tomaba cada uno."],
 combate:["la velada que {f} quería que pelearas","En el gimnasio cuelgan una foto de {f} junto al ring. Debajo, la hoja pegada con celo donde apuntó tu nombre. Nadie la ha quitado. El nuevo entrenador te pregunta si todavía quieres."],
 cartas:["a quién iban las cartas del libro","Dan con ella en la biblioteca, sin ti: vino a devolver un carné de 1961. Le enseñan las cartas. Deja una nota para «quien las encontró»: dos palabras, y gracias."],
 cierre:["si la biblioteca llegó a cerrarse","La biblioteca reabre con el nombre de {f} en una placa junto a la puerta. En la primera estantería han dejado un hueco con una tarjeta: «Reservado para quien recogió firmas.»"],
 vip:["qué quería de ti el dueño del local","El local cierra por orden judicial. En los papeles sale tu nombre en una lista de «posibles». No llegaste a serlo por una noche que te quedaste en casa."],
 muestra:["qué habría pasado en el encuentro comarcal","Una alumna de {f} te para por la calle. Guardó tu ficha de inscripción todos estos años. «Decía que eras lo mejor que había tenido, y que nunca te lo dijo porque se te subía.»"]};

/* ---------- Motor de historias largas (varias a la vez; si muere alguien, la historia se desvía) ---------- */
const HIS={};
function hisIni(k,d,p,tras){G.his=G.his||{};G.hisH=G.hisH||{};if(G.his[k]||!HIS[k])return false;G.hisH[k]=(G.hisH[k]||0)+1;G.his[k]={p:p||"ini",en:G.yo.edad+(tras||0),d:d||{},mu:{}};return true}
function hisFin(k){if(G.his)delete G.his[k]}
function tickHis(){const y=G.yo;if(!G.his||G.muerto||G.carcel||enMagia())return;
  for(const k of Object.keys(G.his)){const c=G.his[k],H=HIS[k];if(!H){delete G.his[k];continue}
    const ids=H.gente?H.gente(c.d).filter(i=>i!=null):[];let cortada=false;
    for(const id of ids){const p=P(id);if(p&&!p.vivo&&!c.mu[id]){c.mu[id]=1;const r=H.siMuere?H.siMuere(c.d,p,c):null;
        if(r&&r.sig){log(r.txt,"mala");c.p=r.sig;c.dicho=0;c.en=y.edad+(r.tras==null?2:r.tras)}else{if(r&&r.txt)log(r.txt,"mala");if(H.hilo){const h=H.hilo(c.d,p);hilo(k,h[0],h[1])}delete G.his[k];cortada=true}break}}
    if(cortada||!G.his[k])continue;
    if(H.sigue&&!H.sigue(c.d)){if(H.hilo&&c.p!="ini"){const h=H.hilo(c.d,null);hilo(k,h[0],h[1])}delete G.his[k];continue}
    if(G.pend||y.edad<c.en)continue;const S=H.pasos[c.p];if(!S){delete G.his[k];continue}
    if(!c.dicho){const t=S.txt(c.d);if(t)log(t,S.mala?"mala":"")}
    if(S.ops){c.dicho=1;G.pend={k:"his",h:k}}else delete G.his[k]}}
function abrirHis(k){const c=G.his&&G.his[k],H=HIS[k],S=c&&H&&H.pasos[c.p];if(!S||!S.ops){G.pend=null;render();return}
  abrirHoja(S.tit(c.d),S.ops(c.d).map(o=>({t:o.t,s:o.s,fn:()=>resolver(()=>{let r=o.fn();if(typeof r=="string")r={txt:r};r=r||{};const cc=G.his&&G.his[k];
    if(cc&&cc===c){if(r.sig){c.p=r.sig;c.dicho=0;c.en=G.yo.edad+(r.tras==null?ri(1,3):r.tras)}else delete G.his[k]}return r.mal?{txt:r.txt,mal:1}:r.txt||null})})),true)}

/* ---------- 1. Alguien, despacio (para quien lleva años sin nadie) ---------- */
const sX=d=>P(d.x);
HIS.despacio={gente:d=>[d.x],sigue:d=>!G.pareja||G.pareja==d.x,
 hilo:(d,p)=>[`la última carta de ${p&&p.con?p.nombre:"quien te escribía"}, que no llegó a darte`,`Su ${p&&p.sexo=="m"?"hermana":"hermano"} te busca con una caja de zapatos. Dentro, la carta que tenía escrita y no echó: tres folios. Dice todo lo que tú también pensabas y tampoco dijiste. La lees en un banco, despacio, dos veces.`],
 siMuere:(d,p,c)=>c.p=="ini"||c.p=="ritual"?null:{sig:"caja",tras:2,txt:`Te lo dice una vecina en la escalera, sin saber lo que te dice: ${p.nombre} ha muerto. Un accidente, cosa de un segundo. Te quedas con la bolsa de la compra en la mano hasta que se te duermen los dedos.`},
 pasos:{
  ini:{tit:d=>d.via=="buzon"?"Una nota bajo la puerta":d.via=="parada"?"La parada de las 7:40":"Número equivocado",
   txt:d=>d.via=="buzon"?"Alguien desliza una nota bajo tu puerta: «Perdona el ruido de anoche. Se me cayó una estantería entera. Soy quien vive encima, por cierto. Llevamos años sin presentarnos.» Lleva pegada una chocolatina.":d.via=="parada"?"Cada mañana, a las 7:40, la misma persona espera el mismo autobús que tú, con un libro distinto cada semana. Hoy el libro es el que tú llevas en la mochila.":"Suena el teléfono a las once de la noche. Alguien pregunta por una tal Remedios. No es aquí. «Perdone. Es que tiene usted la voz de alguien con quien se puede hablar.» No cuelga del todo.",
   ops:d=>[{t:"Contestar",fn:()=>{add("animo",4);return {txt:d.via=="buzon"?"Subes otra nota: «Disculpas aceptadas. La chocolatina, también.» Al día siguiente hay respuesta. Y al otro.":d.via=="parada"?"Levantas tu libro. Sonríe, levanta el suyo. No decís nada. Al día siguiente te guarda sitio en el banco.":"Habláis diez minutos de nada. Al colgar no os habéis dicho los nombres. Vuelve a llamar el jueves, a la misma hora, «por si acaso Remedios».",sig:"ritual",tras:ri(2,4)}}},
    {t:"Dejarlo estar",fn:()=>({txt:"No contestas. Tienes tu vida hecha a tu medida, y en esa medida no cabía nadie. La chocolatina se queda en un cajón.".replace("La chocolatina se queda en un cajón.",d.via=="buzon"?"La chocolatina se queda en un cajón.":"")})}]},
  ritual:{tit:d=>"Una costumbre",txt:d=>d.via=="buzon"?"Ya son meses de notas bajo la puerta. Sabes cómo toma el café, qué música pone los domingos y que se ríe sola leyendo. No os habéis visto la cara.".replace("sola",gp(sX(d),"solo","sola")):d.via=="parada"?"Ya son meses de autobús compartido. Os prestáis libros con notas en los márgenes. Sabes su parada, su turno, la marca de su paraguas. No sabes su nombre.":"Ya son meses de jueves a las once. Sabes cómo fue su infancia y qué le da miedo. No sabes de qué color tiene los ojos.",
   ops:d=>{const x=sX(d),v=estado()=="virgen";return [{t:"Proponer veros de verdad",fn:()=>{x.con=true;x.rel=Math.max(x.rel,40);fis(x);return {txt:`Te tiemblan un poco las manos al proponerlo${v?"; no tienes costumbre de esto, ni de nada parecido":""}. Dice que sí antes de que acabes la frase. Se llama ${x.nombre}. Es ${fisCorto(x)}. No se parece a como te lo habías imaginado, y es mejor.`,sig:"cita",tras:1}}},
    {t:"Seguir así un tiempo",s:"Sin prisa",fn:()=>{d.lento=(d.lento||0)+1;add("animo",3);return {txt:"No cambias nada. Hay algo que funciona precisamente porque no se ha tocado.",sig:d.lento>=2?"empuja":"ritual",tras:ri(3,5)}}}]}},
  empuja:{tit:d=>"El paso lo da "+gp(sX(d),"él","ella"),txt:d=>{const x=sX(d);x.con=true;x.rel=Math.max(x.rel,40);return d.via=="buzon"?`Llaman a tu puerta. Es quien vive encima, con dos tazas. «Me he cansado de escribirte. Soy ${x.nombre}.»`:d.via=="parada"?`Hoy el autobús pasa y no se sube. «He pensado que si lo perdemos los dos, habrá que desayunar. Soy ${x.nombre}.»`:`Un jueves no llama. Llaman al timbre. «He buscado tu dirección en la guía. Espero que no sea delito. Soy ${x.nombre}.»`},
   ops:d=>[{t:"Abrirle la puerta del todo",fn:()=>({txt:"Te apartas para que pase. Lleváis un año hablando; resulta que también sabéis estar callados.",sig:"cita",tras:1})},{t:"Decirle que no estás hecho a esto".replace("hecho",g("hecho","hecha")),fn:()=>({txt:`Se lo dices en el umbral. ${sX(d).nombre} asiente. «Yo tampoco. Por eso he tardado un año.» Se va, pero deja la taza.`,sig:"cita",tras:3})}]},
  cita:{tit:d=>"Lo que no sabías de "+sX(d).nombre,txt:d=>{const x=sX(d);d.giro=d.giro||pick(["seva","viud","antes","herm"]);return `Empezáis a veros. Con ${x.nombre} todo va lento y nada sobra. `+({seva:`Hasta que una tarde te lo dice, mirando el plato: le han dado un traslado. Se va dentro de tres meses, a mil kilómetros. Lo sabía desde antes de la primera nota.`,viud:`Hasta que le ves quitarse un anillo para fregar y dejarlo en el alféizar, con un cuidado que no es de joya. Enviudó hace cuatro años. No se lo había dicho a nadie nuevo.`,antes:`Hasta que te enseña una foto de un patio de colegio: tú, con nueve años, y detrás, medio tapado, ${gp(x,"un niño","una niña")} que te mira. «Te reconocí el primer día. No sabía cómo decírtelo sin que sonara raro.»`,herm:`Hasta que ves una foto en su estantería y se te para todo: es ${gp(x,"hermano","hermana")} de alguien que tú conociste y que ya no está. Lo sabía. Por eso se acercó: quería conocer a quien ${gp(x,"su hermano","su hermana")} nombraba tanto.`})[d.giro]},
   ops:d=>{const x=sX(d),g_=d.giro;return [
    {t:g_=="seva"?"Pedirle que se quede":g_=="viud"?"Decirle que no tienes prisa":g_=="antes"?"Reírte: «Suena raro, y me gusta»":"Hablarle de quien perdisteis los dos",fn:()=>{rel(x,15);sube(x,10);return {txt:g_=="seva"?`«Quédate.» No lo adornas. ${x.nombre} cierra los ojos. «Dame una semana.»`:g_=="viud"?`«El anillo puede seguir en el alféizar el tiempo que haga falta.» ${x.nombre} llora por primera vez delante de ti, y es un regalo.`:g_=="antes"?`Te ríes hasta que se ríe. Os pasáis la noche reconstruyendo aquel colegio, cada uno con sus trozos.`:`Habláis de quien falta hasta la madrugada. Os faltaba a los dos alguien con quien poder nombrarle sin que se hiciera un silencio.`,sig:"final",tras:ri(1,2)}}},
    {t:g_=="seva"?"Decirle que irás a verle":"Pedir tiempo para pensarlo",fn:()=>{rel(x,4);return {txt:g_=="seva"?"Prometes trenes, puentes, veranos. Los dos sabéis lo que suelen durar esas promesas, y aun así.":"Te vas a casa andando, dando un rodeo largo. No es lo que esperabas. Tampoco esperabas nada, así que.",sig:"final",tras:ri(2,3)}}},
    {t:"Apartarte",fn:()=>{x.lejos=g_=="seva";rel(x,-15);return {txt:`Te cierras. Es lo que sabes hacer. ${x.nombre} no insiste: te deja una última nota, sin reproches, con su dirección por si algún día.`,mal:1}}}]}},
  final:{tit:d=>sX(d).nombre+" y tú",txt:d=>{const x=sX(d);return d.giro=="seva"?`Pasa la semana. ${x.nombre} aparece con una carta de la empresa en la mano.`:`Llega una noche en que ninguno de los dos mira el reloj.`},
   ops:d=>{const x=sX(d),v=G.fl.virgen!==false;return [{t:"Dar el paso",fn:()=>{G.pareja=x.id;x.beso=true;x.besoE=anios();gustos(x);virgenIni(x);x.pas=18;rel(x,20);add("animo",18);G.soloDesde=null;logro("dejas de estar "+g("solo","sola")+": "+x.nombre);
      return (d.giro=="seva"?`Ha renunciado al traslado. «No me lo pidas dos veces, que me arrepiento.» `:"")+`Os besáis en el rellano, con torpeza de gente que había perdido la costumbre${v?" o que no la tuvo nunca":""}. Esa noche se queda. ${v?`Se lo dices antes, con la luz apagada: que nunca has estado con nadie. «Mejor», contesta. «Así no tienes con quién compararme.» Va despacio. Te pregunta. Se ríe contigo, no de ti.`:"Va despacio, como todo lo vuestro, y por eso sale bien."}`+primeraVez(x)}},
    {t:"Quedaros en lo que sois",fn:()=>{rel(x,10);add("animo",6);return `No hace falta ponerle nombre. ${x.nombre} y tú seguís con vuestras notas, vuestros jueves, vuestro banco. Hay gente casada que tiene menos.`}}]}},
  caja:{mala:1,tit:d=>"La caja de zapatos",txt:d=>`Llaman a tu puerta. Es ${gp(sX(d),"su hermana","su hermano")}, con una caja de zapatos atada con una goma. «Estaba en su mesilla. Tiene tu nombre. No la he abierto.»`,
   ops:d=>{const x=sX(d);return [{t:"Abrirla",fn:()=>{add("animo",-6);G.renc=Math.max(0,(G.renc||0)-4);return `Están todas tus notas, ordenadas por fecha. Y una suya, sin terminar: «Llevo días queriendo decirte que…» Ahí se acaba. Sabes cómo seguía. Lo sabías desde hace meses. ${gp(x,"Su hermana","Su hermano")} se queda a cenar: quiere que le cuentes cómo era ${x.nombre} cuando no estaba en familia.`}},
    {t:"Guardarla cerrada",fn:()=>{hilo("despacio","la caja de zapatos de "+x.nombre+", que no has abierto","Una tarde de lluvia, años después, cortas la goma. Dentro están todas tus notas, por fecha, y una suya sin acabar: «Llevo días queriendo decirte que…» Lloras lo que no lloraste entonces, y luego pones la cafetera para dos, por costumbre.");return {txt:"La pones en lo alto del armario. Todavía no. Hay cosas que se abren cuando se puede.",mal:1}}}]}}}};
/* ---------- 2. Los golpes del faro (misterio largo, trabajando de farero) ---------- */
const fPat=d=>P(d.pat);
HIS.faro={gente:d=>[d.pat,d.hija],sigue:d=>G.trabajo&&G.trabajo.raro=="faro",
 hilo:(d,p)=>["quién golpeaba bajo el faro a las tres de la madrugada","Sale en un periódico de la costa, en una esquina: bajo el faro del islote había una cueva habitada. Encontraron mantas, latas, un cuaderno con una página arrancada pegada de nuevo. El último farero nunca se marchó: estuvo nueve años ahí abajo, golpeando el hierro cada noche a la hora en que una vez dejó apagar la luz."],
 siMuere:(d,p,c)=>p.id==d.pat?{sig:c.p=="ini"?"cuaderno":"aljibe",tras:2,txt:`El barco de suministros llega con otro patrón: ${p.nombre} murió en tierra, de repente. Su hijo te entrega una lata de galletas. «Mi padre dijo que si le pasaba algo te la diera a ti, que tú ya habías empezado a oírlo.» Dentro hay cartas del farero anterior, fechadas después de su supuesta marcha.`}:null,
 pasos:{
  ini:{tit:d=>"Tres golpes, pausa, tres golpes",txt:d=>"A las tres en punto, cada noche, alguien golpea hierro contra hierro debajo de la torre: tres golpes, pausa, tres golpes. Dura un minuto. En la isla no hay nadie más que tú.",
   ops:d=>{const p=fPat(d);return [{t:"Bajar con la linterna",fn:()=>({txt:"Bajas los doscientos escalones. En la base, el suelo es roca viva y una chapa de hierro oxidado con un candado nuevo. Los golpes paran cuando pisas la chapa.",sig:"cuaderno",tras:1})},
    {t:"Preguntarle al patrón del barco",fn:()=>{if(p)rel(p,4);return {txt:`${p?p.nombre:"El patrón"} deja de descargar cajas. «¿Golpes? Será la marea en el aljibe.» Lo dice sin mirarte. Antes de zarpar, añade: «El de antes de ti también preguntó.»`,sig:"cuaderno",tras:1}}},
    {t:"Apuntarlo en el parte y no bajar",fn:()=>({txt:"Escribes: «03:00, ruido de origen no determinado». Lo escribes sesenta noches seguidas. La sexagésima primera, los golpes dicen otra cosa: dos, pausa, dos.",sig:"cuaderno",tras:2})}]}},
  cuaderno:{tit:d=>"El cuaderno de Elías",txt:d=>"Detrás del depósito de petróleo encuentras el cuaderno de guardias del farero anterior, un tal Elías. Nueve años de letra apretada. Falta una página, arrancada con cuidado: la de una noche de febrero. La entrada siguiente dice solo: «No volverá a pasar.» La última: «Hoy han vuelto a llamar desde abajo.»",
   ops:d=>{const p=fPat(d);return [{t:"Reventar el candado de la chapa",fn:()=>({txt:"Media hora de palanca. Debajo hay una escalera de hierro que baja a un aljibe, y del aljibe sale una galería hacia el mar. Huele a salitre y a humo reciente.",sig:"aljibe",tras:1})},
    {t:"Pedir el expediente de Elías a la autoridad portuaria",fn:()=>({txt:"Contestan a las seis semanas, en un sobre con membrete: Elías presentó su renuncia por carta. No recogió su último sueldo ni sus cosas. Nadie le vio embarcar. El caso «no consta».",sig:"aljibe",tras:2})},
    {t:"No remover",fn:()=>({txt:"Devuelves el cuaderno a su sitio. Los golpes siguen. Aprendes a dormirte antes de las tres o después."})}]}},
  aljibe:{tit:d=>"La galería bajo el faro",txt:d=>"La galería acaba en una cueva marina que solo queda en seco con marea baja. Hay una manta doblada, latas de este mismo año, una lámpara de carburo todavía tibia y, en la pared, rayas contadas de cinco en cinco. Muchos años de rayas.",
   ops:d=>[{t:"Esperar escondido a la marea baja",fn:()=>({txt:"Te sientas en lo oscuro con la linterna apagada. A las tres menos diez oyes pasos sobre los guijarros.",sig:"quien",tras:0})},
    {t:"Dejar comida y una nota",fn:()=>({txt:"Dejas pan, café y un papel: «Soy el del faro. No quiero nada. Solo saber.» Al día siguiente la comida no está. La nota sí, con una palabra añadida: «Mañana.»",sig:"quien",tras:1})},
    {t:"Soldar la chapa y olvidarlo",fn:()=>{hilo("faro","quién vivía en la cueva de debajo del faro","Un pescador viejo te lo cuenta en una taberna de la costa, sin que preguntes: todos sabían que debajo del faro vivía alguien. Le dejaban pan en una boya. «Uno no deja apagar una luz y luego se va a su casa tan tranquilo», dice. No dice más.");return {txt:"Sueldas la chapa con tres cordones. Esa noche no hay golpes. La siguiente, tampoco. Echas de menos el minuto de las tres como se echa de menos un dolor.",mal:1}}}]},
  quien:{tit:d=>"Quien golpea",txt:d=>{d.giro=d.giro||pick(["elias","hija","bote"]);return d.giro=="elias"?"Es un hombre viejísimo, con barba hasta el pecho y el uniforme de farero hecho jirones. Elías. No se fue nunca. Una noche de febrero se quedó dormido, la luz se apagó veinte minutos y un pesquero con seis hombres se fue contra los bajos. Desde entonces vive debajo de la torre y golpea el hierro a la hora exacta, cada noche, para no volver a dormirse.":d.giro=="hija"?(()=>{const h=per("conoc","f",ri(26,38),"de Elías",{con:true,rel:20,sitio:"del islote",oficio:"hija del farero"});h.apellido=pick(ORI[G.origen].ap);d.hija=h.id;return `No es Elías. Es una mujer de treinta y tantos, ${fisCorto(h)}, con un martillo en la mano. ${h.nombre}, su hija. Lleva dos inviernos viniendo en una barca desde la costa, de noche, a golpear donde él golpeaba. «Decía que si el hierro suena a las tres, él sabe volver. El mar se lo llevó. Yo solo le marco el camino.»`})():"No viene nadie. Lo que golpea es un bote amarrado a una argolla, que la marea levanta a esa hora contra el hierro de la escalera. Dentro del bote, envuelta en hule, está la página arrancada del cuaderno: la confesión de la noche en que se apagó la luz, firmada, con seis nombres escritos debajo, uno por línea. Y las latas, la manta, la lámpara tibia: alguien sigue viniendo a leerla."},
   ops:d=>{const y=G.yo,h=d.hija&&viv(d.hija);return d.giro=="elias"?[
     {t:"Subirle a la torre",fn:()=>{logro("devuelves al viejo farero a su luz");add("animo",8);return "Le subes escalón a escalón, parando en cada rellano. Arriba, pone la mano en el cristal de la lente como quien toca una cara. Esa noche hacéis la guardia los dos. A las tres no golpea nadie. Muere a las pocas semanas, en una cama, con la luz girando encima."}},
     {t:"Guardarle el secreto y seguir dejándole comida",fn:()=>{add("animo",3);return "No dices nada a nadie. Cada semana bajas pan, tabaco y pilas. A veces subís a medias la escalera y habláis del tiempo. A las tres sigue golpeando. Ahora, cuando lo oyes, te das la vuelta y sigues durmiendo."+moral("leal",2)}},
     {t:"Dar parte",fn:()=>{add("animo",-4);return {txt:"Vienen a por él en una lancha, con una manta y dos formularios. No se resiste. Te mira desde la popa hasta que la isla es un punto. La primera noche sin golpes, la luz te parece más débil."+moral("prudente"),mal:1}}}]
    :d.giro=="hija"?[
     {t:"Ofrecerle la torre: que golpee desde arriba, con luz",fn:()=>{rel(h,25);sube(h,10);logro("descubres quién golpeaba bajo el faro");return `Le dices que suba. Que desde arriba el hierro suena más lejos. ${h.nombre} sube con su martillo. Esa noche golpeáis los dos la barandilla, a las tres, mirando el agua. No vuelve nadie. Vuelve ella, cada vez que hay barca, y ya no solo a golpear.`}},
     {t:"Decirle la verdad: el mar no devuelve",fn:()=>{rel(h,-5);return {txt:`Se lo dices con cuidado. ${h.nombre} deja el martillo en la roca. «Ya lo sé. Pero mientras golpeo, no se ha muerto del todo.» No vuelve. El martillo sigue ahí.`,mal:1}}}]
    :[{t:"Entregar la página a las familias de los seis",fn:()=>{logro("llevas la confesión del farero a quienes la esperaban");add("carisma",2);return "Buscas los seis apellidos por los pueblos de la costa. Una viuda de ochenta años lee la página en la puerta de su casa, de pie. «Cuarenta años pensando que fue culpa del patrón.» Te da las gracias y cierra despacio."+moral("valiente",2)}},
     {t:"Dejarla en el bote y esperar a quien viene a leerla",fn:()=>({txt:"Vuelves a envolverla y esperas tres noches. Es una mujer mayor, con pañuelo, que rema sola. Lee la página con una linterna, la besa y la guarda otra vez. No la interrumpes. Hay duelos que tienen su liturgia."})},
     {t:"Quemarla",fn:()=>{add("animo",-3);return {txt:"Arde mal, por el hule. Seis nombres menos en el mundo. El bote sigue golpeando cada noche, ya sin nada dentro."+moral("egoista"),mal:1}}}]}}}};
/* ---------- 3. La relación tóxica llega a su final ---------- */
const tQ=d=>P(d.id),aliado=()=>vivos(p=>p.con&&!p.lejos&&p.edad>=216&&p.rel>=55&&p.id!=G.pareja&&!p.amante)[0];
HIS.toxico={gente:d=>[d.id,d.al],sigue:d=>G.pareja==d.id,
 hilo:(d,p)=>[`cuánto había de verdad en ${p&&p.id==d.id?p.nombre:tQ(d)?tQ(d).nombre:"aquello"}`,`Ordenando un cajón aparece una libreta suya. Hay páginas enteras sobre ti: lo que hacías mal, lo que le dabas miedo perder, planes para retenerte, y entre medias, sin venir a cuento, tres líneas donde dice que nunca había querido así a nadie. No sabes cuál de las dos cosas pesa más. Las dos eran verdad.`],
 siMuere:(d,p,c)=>p.id==d.al?{sig:c.p,tras:1,txt:`Muere ${tu(p)}, la única persona que sabía lo que pasaba en tu casa. Te quedas ${g("solo","sola")} con ello.`}:{txt:`${p.nombre} muere en mitad de todo. En el entierro te dan el pésame personas que no saben nada, y tú no sabes qué cara poner: la del alivio te da vergüenza, y la de la pena también es de verdad.`},
 pasos:{
  ini:{mala:1,tit:d=>"Ya no es una racha",txt:d=>{const q=tQ(d);return ({exhib:`Te llega un enlace de un número desconocido. Es un vídeo. Sois ${q.nombre} y tú. No sabías que grababa. Lo ha visto ya media ciudad.`,control:`${q.nombre} te enseña unas llaves: ha alquilado un piso en otra ciudad, ha dado la señal con el dinero de los dos y ha llamado a tu trabajo para decir que te vas. «Allí estaremos solos. Sin tanta gente metiéndose.»`,liante:`En casa de tu familia encuentras un fajo de cartas anónimas que han ido recibiendo durante dos años: cosas tuyas, medio verdades, veneno. Reconoces la letra a la primera línea. Es la de ${q.nombre}.`,peligro:`Un inspector de paisano te espera a la salida. Sabe lo de ${q.nombre}: las deudas, la bolsa, los nombres. «Usted vive ahí. O nos ayuda, o es parte.»`,drama:`${q.nombre} te sienta en el sofá y te dice que está muy ${gp(q,"enfermo","enferma")}, que es grave, que por eso todo. Durante semanas te desvives. Luego, por una llamada equivocada del centro de salud, descubres que no ha ido nunca.`})[q.tox]||`${q.nombre} cruza una línea que no tiene vuelta.`},
   ops:d=>{const q=tQ(d),al=aliado();d.al=al?al.id:null;return [{t:"Ponérselo delante",fn:()=>({txt:`Se lo dices con la prueba en la mano. ${q.nombre} no lo niega. Hace algo peor: te explica por qué era necesario.`,sig:"punto",tras:1})},
    {t:al?"Contárselo a "+tu(al):"Contárselo a alguien",s:al?"Alguien de fuera que te diga que no estás loco".replace("loco",g("loco","loca")):"No te queda nadie cerca a quien llamar",fn:()=>{if(!al)return {txt:"Repasas la agenda. Hace tiempo que dejaste de contestar a casi todos, uno por uno, sin darte cuenta. No hay a quién llamar.",sig:"punto",tras:1,mal:1};rel(al,8);d.sabe=1;return {txt:`Se lo cuentas todo a ${tu(al)}, de un tirón. Te escucha sin interrumpir. «Llevo dos años esperando esta llamada. Tengo un cuarto libre. No te voy a decir qué hacer.»`,sig:"punto",tras:1}}},
    {t:"Hacer como si nada",fn:()=>{add("animo",-8);G.fl.aislado=(G.fl.aislado||0)+1;return {txt:"Te lo tragas. Es más fácil que lo otro. Cada vez es un poco más fácil.",sig:"punto",tras:3,mal:1}}}]}},
  punto:{mala:1,tit:d=>"El punto de no retorno",txt:d=>{const q=tQ(d);return `${q.nombre} nota que algo ha cambiado. Una noche te lo dice todo junto: que sin ti no es nadie, que va a cambiar, que ha pedido ayuda, que te quiere como no te va a querer nadie. Y a la mañana siguiente, con otra voz, que si te vas te vas a acordar.`},
   ops:d=>{const q=tQ(d),al=d.al&&viv(d.al),y=G.yo;return [
    {t:"Irte esta noche"+(al&&d.sabe?", a casa de "+al.nombre:""),s:al&&d.sabe?"Con alguien esperándote":"Con lo puesto y sin sitio",fn:()=>{const x=romper(q,true);if(al&&d.sabe){if(G.acoso)G.acoso.m=ri(2,4);rel(al,15);add("animo",8);logro("sales de una relación que te estaba deshaciendo");return `Metes cuatro cosas en una bolsa mientras duerme. ${al.nombre} te espera con el coche en la esquina y el motor en marcha. No pregunta nada en todo el trayecto. En su casa hay una cama hecha y una luz encendida.`}
      add("animo",-6);logro("sales de una relación que te estaba deshaciendo");return {txt:"Sales de madrugada con una bolsa. No tienes adónde ir: una pensión, luego otra. Tardas meses en dormir de un tirón. Pero duermes.",mal:1}}},
    {t:"Creerle una vez más",fn:()=>{rel(q,10);q.toxN=0;G.fl.atrapado=(G.fl.atrapado||0)+1;add("animo",-5);return {txt:`Le crees. Hay tres semanas buenas, de las de antes. La cuarta, vuelve todo, un poco peor, como vuelve siempre lo que no se ha ido.`,sig:"ini",tras:ri(14,30),mal:1}}},
    {t:"Poner tú las condiciones",s:"Depende de tu carisma, y de lo que quede de ti",fn:()=>{if(q.tox=="drama"&&ch(.2+y.carisma/200)){q.tox=null;rel(q,10);logro(q.nombre+" cambia de verdad");return `Se lo dices sin temblar: terapia, de verdad, con fechas, o la puerta. Va. No es rápido ni es bonito. Pero un año después te das cuenta de que lleváis meses sin miedo.`}
      rel(q,-10);return {txt:`Pones condiciones. Las acepta todas, llorando. Cumple dos. La tercera era la que importaba.`,sig:"ini",tras:ri(10,20),mal:1}}}]}}}};
/* ---------- 4. La Llave: juegos entre adultos ---------- */
const lQ=d=>d.id!=null?P(d.id):null;
HIS.llave={gente:d=>[d.id,d.anf],sigue:d=>true,
 hilo:(d,p)=>["la servilleta con tres cosas apuntadas y solo una tachada","Aparece doblada en un libro, años después: la servilleta de aquel bar, con su letra. Las dos cosas sin tachar siguen ahí. La tercera no es lo que tú creías: no era ningún juego. Decía, simplemente, «envejecer contigo»."],
 siMuere:(d,p,c)=>p.id==d.anf?{sig:"cierre",tras:1,txt:`Corre la voz entre quienes saben: ha muerto ${p.nombre}, la anfitriona de La Llave. El club no abre ese mes.`}:null,
 pasos:{
  ini:{tit:d=>d.id!=null?"Tres cosas en una servilleta":"Una tarjeta sin nombre",txt:d=>{const q=lQ(d);return q?`${q.nombre} te quita el bolígrafo y escribe tres cosas en una servilleta, tapándola con la mano. «Tres cosas que nunca hemos hecho y que me apetecen. Elige una sin mirar.»`:"En el buzón hay un sobre negro con una tarjeta: una llave dibujada, una dirección y una frase: «Solo adultos. Nadie obliga a nada. Se viene a mirar, a jugar o a irse.» Alguien ha escrito tu nombre a mano en el dorso."},
   ops:d=>{const q=lQ(d);return q?[
     {t:"La primera",s:"Desconocidos en un bar",fn:()=>{gustos(q);if(!q.desc.includes(5)&&!q.no.includes(5))q.desc.push(5);q.pas=clamp((q.pas||0)+15);rel(q,6);add("animo",6);return {txt:`Quedáis en un bar donde no os conoce nadie, a deshoras, cada uno por su lado. ${q.nombre} entra con otro nombre y otra forma de andar. Tú le invitas a una copa como a ${gp(q,"un extraño","una extraña")}. Os lleváis a casa a alguien nuevo, que resulta ser quien ya teníais.`,sig:"sobre",tras:ri(2,4)}}},
     {t:"La segunda",s:"Una llave de hotel en un sobre",fn:()=>{gustos(q);if(!q.desc.includes(10)&&!q.no.includes(10))q.desc.push(10);G.yo.dinero-=120;q.pas=clamp((q.pas||0)+15);rel(q,6);add("animo",6);return {txt:`Una tarde encuentras en el bolsillo un sobre con una llave de hotel y una hora. Subes. ${q.nombre} está de espaldas, mirando por la ventana, con las cortinas echadas y un pañuelo de seda sobre la cama. No habláis hasta mucho después.`,sig:"sobre",tras:ri(2,4)}}},
     {t:"La tercera",s:"Un sitio del que le han hablado",fn:()=>({txt:`«Hay un club», dice, bajando la voz. «Antifaces. No hay que hacer nada. Solo ir.» Te enseña una tarjeta con una llave dibujada.`,sig:"club",tras:1})},
     {t:"Romper la servilleta",fn:()=>{rel(q,-5);return {txt:`«No necesitamos listas.» ${q.nombre} se encoge de hombros y guarda el bolígrafo. Algo se queda sin decir.`}}}]
    :[{t:"Ir a ver",fn:()=>({txt:"Te pones lo mejor que tienes y vas, pensando que te darás la vuelta en la puerta. No te la das.",sig:"club",tras:0})},{t:"Tirar la tarjeta",fn:()=>({txt:"La rompes en cuatro. Durante semanas te preguntas quién escribió tu nombre."})}]}},
  sobre:{tit:d=>"La tarjeta de la llave",txt:d=>`A ${lQ(d).nombre} le ha gustado demasiado para dejarlo ahí. Una noche deja sobre la almohada una tarjeta negra con una llave dibujada. «Me han hablado de un sitio. Solo para mirar. O no solo.»`,
   ops:d=>[{t:"Ir",fn:()=>({txt:"Os arregláis como para una boda ajena. En el taxi no habláis. Os cogéis la mano fuerte.",sig:"club",tras:0})},{t:"Decirle que con lo vuestro basta",fn:()=>({txt:`«Aquí estamos bien.» ${lQ(d).nombre} guarda la tarjeta en un libro. No vuelve a sacarla. Tú sabes en qué página está.`})}]},
  club:{tit:d=>"La Llave",txt:d=>{if(!d.anf){const a=per("conoc","f",ri(38,52),pick(ORI[G.origen].ap),{con:true,rel:15,sitio:"de La Llave",oficio:"anfitriona de La Llave",casado:false});fis(a);a.fis.cuid=2;d.anf=a.id}const a=P(d.anf),v=G.fl.virgen!==false;G.fl.llave=1;
     return `Un portal sin letrero, una escalera, una puerta acolchada. ${a.nombre}, la anfitriona, ${fisCorto(a)}, te pone un antifaz y te dice las tres reglas: nadie toca sin preguntar, cualquiera puede decir «basta» y se acaba, y lo que pasa aquí no tiene apellidos. Dentro hay terciopelo, luz baja y treinta adultos enmascarados que hablan en voz baja.${v&&!lQ(d)?" Te nota en la cara que es tu primera vez en todo. «Entonces hoy solo miras, o solo hablas», te dice. «Aquí lo primero es lo que tú quieras que sea.»":""}`},
   ops:d=>{const q=lQ(d),a=P(d.anf),y=G.yo,sig=()=>({sig:"giro",tras:ri(1,3)});return [
    {t:"Mirar desde un sofá",fn:()=>{add("mente",1);add("animo",3);return Object.assign({txt:"Te sientas con una copa. Nadie te mete prisa. Ves cómo se pide permiso con una mirada y cómo se dice que no con otra, y que aquí el no se respeta más que en la calle."},sig())}},
    q?{t:"Quedaros solo vosotros dos, en un reservado",fn:()=>{q.pas=clamp((q.pas||0)+18);rel(q,8);gustos(q);[8,6].forEach(i=>{if(!q.desc.includes(i)&&!q.no.includes(i)&&ch(.5))q.desc.push(i)});return Object.assign({txt:`Cerráis una cortina. Con antifaz, ${q.nombre} es otra persona y la misma. Hay espejos por todas partes. Salís de madrugada, despeinados, riéndoos de vuestra propia cara de susto en el ascensor.`},sig())}}
     :{t:"Hablar con quien se te acerca",fn:()=>{add("carisma",2);add("animo",5);return Object.assign({txt:"Alguien con antifaz verde se sienta a tu lado y pregunta si puede. Habláis dos horas. No pasa nada más y es mucho. Al irte, te roza la mano y dice: «El mes que viene, si quieres.»"},sig())}},
    {t:"Entrar en el juego",s:q?"Con más gente. A "+q.nombre+" hay que preguntarle":"Lo que surja, pidiendo permiso",fn:()=>{G.fl.virgen===undefined&&(G.fl.virgen=false);G.fl.virgen=false;add("animo",7);if(q){const m=infidelidad(q);if(m>=1){rel(q,5);q.pas=clamp((q.pas||0)+12);return Object.assign({txt:`${q.nombre} dice que sí antes de que acabes la pregunta. Lo que pasa después es entre varios, con antifaces, con cuidado, pidiendo y dando permiso. Os buscáis con la mano todo el rato. Volvéis a casa callados, sin soltaros.`},sig())}rel(q,-14);return Object.assign({txt:`${q.nombre} dice que sí con la boca. A mitad de la noche le ves la cara debajo del antifaz y paras: «basta». Os vais. En el taxi mira por la ventanilla. «No era esto lo que yo quería», dice. No había manera de saberlo antes.`,mal:1},sig())}
      return Object.assign({txt:"Preguntas, te preguntan. Dices que sí a unas cosas y que no a otras, y todo se respeta. Es una noche larga, entre gente sin nombre que te trata mejor que mucha gente con él. Sales al amanecer, con el antifaz en el bolsillo."},sig())}},
    {t:"Devolver el antifaz e irte",fn:()=>({txt:`Le devuelves el antifaz a ${a.nombre}. «No pasa nada», dice. «La mitad se va la primera vez. La mitad de esa mitad vuelve.»`})}]}},
  giro:{tit:d=>"Debajo de un antifaz",txt:d=>{const q=lQ(d),a=P(d.anf);d.giro=d.giro||pick(q?["conocido","gusta","anf"]:["conocido","anf","verde"]);const co=vivos(p=>p.con&&!p.lejos&&p.edad>=30*12&&p.id!=(q||{}).id&&["vec","conoc","comp"].includes(p.rol));d.co=d.giro=="conocido"&&co.length?pick(co).id:null;if(d.giro=="conocido"&&!d.co)d.giro="anf";
     return d.giro=="conocido"?`En tu segunda noche en La Llave reconoces unas manos, luego un reloj, luego una risa. Debajo de ese antifaz está ${P(d.co).nombre} ${P(d.co).apellido}, a quien saludas cada semana con toda formalidad. Te ha reconocido también: lo sabes porque ha dejado de reírse.`:d.giro=="gusta"?`Volvéis a La Llave, y volvéis otra vez. A ${q.nombre} se le ilumina la cara de una forma que en casa ya no. Empieza a ir a noches a las que tú no vas. «Es solo un sitio», dice.`:d.giro=="anf"?`${a.nombre}, la anfitriona, te espera al final de la noche con dos copas y sin antifaz. «Yo no juego con los socios. Es mi única norma.» Te mira. «Las normas son para cuando no pasa nada.»`:`La persona del antifaz verde te espera cada mes. No os habéis visto la cara ni dicho el nombre. Hoy te pone un papel en la mano: una dirección, fuera del club, a la luz del día.`},
   ops:d=>{const q=lQ(d),a=P(d.anf),y=G.yo,co=d.co&&P(d.co);return d.giro=="conocido"?[
     {t:"Levantar la copa y guardar el secreto",fn:()=>{rel(co,25);add("carisma",1);return `Levantas la copa un centímetro. ${co.nombre} te devuelve el gesto. Desde ese día, cuando os cruzáis en la calle, os saludáis igual de formales que siempre, y un poco más despacio.`}},
     {t:"Acercarte",s:"Sin antifaz ya, entre vosotros",fn:()=>{pers(co);sube(co,14);rel(co,12);if((co.quim||0)>=30){co.amante=true;co.beso=true;co.besoE=anios();co.pas=20;gustos(co);virgenIni(co);return `Te sientas a su lado y te quitas el antifaz. ${co.nombre} se quita el suyo. «De todas las personas del mundo.» Esa noche el reservado es para vosotros.`+primeraVez(co)+(q?` ${q.nombre} no está: hoy viniste por tu cuenta.`:"")}return `Te sientas a su lado. Habláis como no habéis hablado nunca en diez años de vecindad. Queda algo empezado.`}},
     {t:"Usarlo",s:"Saber esto de alguien vale dinero",fn:()=>{y.dinero+=ri(800,3000);rel(co,-70);G.fl.llave=0;return {txt:`No hace falta decirlo en voz alta: basta con un comentario en el portal. ${co.nombre} entiende y paga. En La Llave se enteran. No vuelves a tener tarjeta, y alguien te raya el coche con una llave, por coherencia.`+moral("chivato",3),mal:1}}}]
    :d.giro=="gusta"?[
     {t:"Ir con "+gp(q,"él","ella")+" siempre",fn:()=>{rel(q,6);q.pas=clamp((q.pas||0)+8);return `Decides que si va, vais. Aprendéis a hablar de lo que queréis antes y de lo que sentisteis después. Es raro, y os va mejor que a casi todos los que conocéis.`}},
     {t:"Pedirle que lo deje",fn:()=>{if(infidelidad(q)<1){rel(q,4);return `Se lo pides. Lo piensa un día entero. Rompe la tarjeta delante de ti. «Me gustaba. Me gustas más tú.»`}rel(q,-12);q.deriva=(q.deriva||0)+40;return {txt:`Se lo pides. Dice que sí. Sigue yendo, los martes que «tiene cena de trabajo». Lo sabes por el olor a terciopelo.`,mal:1}}},
     {t:"Dejar que vaya por su cuenta",fn:()=>{rel(q,-4);if(ch(.5))lioEmpieza(q,null);return {txt:`Le dices que vaya. Vuelve cada vez más tarde y cada vez con menos que contar.`,mal:1}}}]
    :d.giro=="anf"?[
     {t:"Brindar con ella",fn:()=>{pers(a);a.amante=true;a.beso=true;a.besoE=anios();a.pas=25;gustos(a);virgenIni(a);rel(a,30);return `Brindáis. ${a.nombre} cierra el club con llave por dentro. Conoce cada habitación y lo que se puede hacer en cada una; esta noche solo usa una. «Que no se entere nadie», dice. «Tengo una reputación de mujer sensata.»`+primeraVez(a)+(q?` A ${q.nombre} le dices que te quedaste ayudando a recoger.`:"")}},
     {t:"Respetar su norma",fn:()=>{rel(a,15);return `«Entonces que no pase nada.» ${a.nombre} se ríe. «Qué raro eres. Me caes bien.» Desde esa noche tienes sitio en su mesa, que es desde donde se ve todo.`.replace("raro",g("raro","rara"))}}]
    :[{t:"Ir a esa dirección",fn:()=>{const x=per("conoc",opuesto(),ri(26,44),pick(ORI[G.origen].ap),{con:true,rel:45,sitio:"de La Llave",rasgo:ri(0,4)});fis(x);pers(x);x.quim=45;return `Es una cafetería normal, a mediodía. Hay alguien sentado junto a la ventana, sin antifaz, con una bufanda verde. ${x.nombre}: ${fisCorto(x)}. Os reís de veros con luz. «Quería saber si me gustabas también así.» Parece que sí.`}},
     {t:"Dejarlo en lo que era",fn:()=>({txt:"Rompes el papel. Hay cosas que solo funcionan a oscuras y con otro nombre. El mes siguiente, el antifaz verde no viene."})}]}},
  cierre:{tit:d=>"La Llave, sin su dueña",txt:d=>"El club reabre con otra persona en la puerta. No es lo mismo: ahora hay carta de precios y música. Los de siempre se miran por encima de los antifaces.",
   ops:d=>[{t:"Seguir yendo",fn:()=>"Vas un par de veces más. Luego dejas de ir. Guardas el antifaz."},{t:"Proponer a los de siempre montar algo aparte",fn:()=>{add("carisma",2);return "Lo dices en voz baja y en una semana tenéis otro portal sin letrero. Te toca a ti decir las tres reglas en la puerta."}}]}}};

/* ---------- Segundas partes de las tramas de sitios (con giro) ---------- */
TR.cartas2={ok:(a,k)=>a>=14&&sit(k).hechas.includes("cartas"),pasos:{ini:{b:d=>"Una visita en la biblioteca",intro:d=>"Pregunta por ti en el mostrador un hombre de más de ochenta años, con bastón y una carpeta. Dice que él escribió aquellas cartas del libro. No murió: le dijeron a ella que había muerto, para separarlos.",
  ops:d=>[{t:"Llevarle a verla",fn:()=>({txt:"Le llevas en tu coche. No habla en todo el camino. Lleva la corbata torcida y se la enderezas en el aparcamiento de la residencia.",sig:"fin",tras:0})},{t:"Darle la dirección y no meterte",fn:()=>({txt:"Le apuntas la dirección. Se va despacio. No sabrás nunca cómo fue, y está bien que no lo sepas."})}]},
 fin:{b:d=>"Sesenta años después",intro:d=>"Ella está en el jardín, de espaldas. Él se queda parado a diez metros. No se atreve.",
  ops:d=>[{t:"Decirle a ella que tiene visita",fn:()=>{add("animo",10);logro("reúnes a dos personas sesenta años después");return "Se vuelve. Le mira un rato muy largo, entornando los ojos. «Llegas tarde», dice. «Tenías que venir el jueves.» Él se echa a reír y a llorar a la vez. Te vas sin despedirte: ya no pintas nada allí."}},{t:"Empujarle un poco y quedarte atrás",fn:()=>{add("animo",8);return "Le pones una mano en la espalda. Camina los diez metros como quien cruza un país. Desde la verja los ves sentarse en el mismo banco, sin tocarse todavía."}}]}}};
TR.bitacora={ok:(a,k)=>a>=16&&sit(k).hechas.includes("capitan"),pasos:{ini:{b:d=>"El cuaderno del Capitán",intro:d=>"Hojeas por fin el cuaderno de bitácora que te dejó el Capitán. Entre dos páginas pegadas hay un mapa dibujado a mano de una cala, con una cruz y una frase: «Lo que no pude llevarme.»",
  ops:d=>[{t:"Ir a la cala",fn:()=>({txt:"Son cuatro horas de carretera y una de sendero. La cala existe, tal cual.",sig:"cala",tras:1})},{t:"Dárselo a su hija",fn:()=>({txt:"Se lo llevas. Lo mira y sonríe: «La cala donde me enseñó a nadar.» No hay tesoro. O sí."})}]},
 cala:{b:d=>"La cruz del mapa",intro:d=>"Donde marca la cruz hay una roca con una argolla, y bajo la argolla, en un hueco, una caja de munición sellada con brea.",
  ops:d=>{const y=G.yo;return [{t:"Abrirla",fn:()=>{const r=ri(0,1);if(r){y.dinero+=ri(1500,6000);logro("encuentras lo que el Capitán dejó en la cala");return "Dentro hay monedas extranjeras, de seis países, y un pasaporte con otro nombre y su misma cara, de joven. Al Capitán le creían un cuentista. Se quedaba corto."}logro("encuentras lo que el Capitán dejó en la cala");return "Dentro hay cartas de una mujer de otro puerto, en otro idioma, y la foto de un niño con sus mismas orejas. No fue una hija lo único que dejó atrás. Hay una dirección. Decides si escribes."}},{t:"Dejarla donde está",fn:()=>({txt:"Hay cosas que un hombre entierra para que sigan enterradas. Vuelves a tapar el hueco."})}]}}}};
TR.creditos={ok:(a,k)=>a>=12&&G.fl.maquina,pasos:{ini:{b:d=>"Los seis nombres de los créditos",intro:d=>"La máquina que te llevaste zumba en tu cuarto. Una noche dejas correr los créditos enteros. Seis nombres. El cuarto tiene tu apellido.",
  ops:d=>[{t:"Preguntar en casa",fn:()=>{const f=vivos(p=>p.rol=="prog"||p.rol=="abu"||p.rol=="tio")[0];return {txt:f?`${cap1(tu(f))} se queda mirando la pantalla. «No sabía que la había terminado.» Alguien de tu familia programó esa máquina, de joven, en un garaje, con cinco amigos. Nunca cobraron. Nunca lo contó.`:"No queda nadie a quien preguntar. Buscas el apellido en registros de patentes hasta dar con un garaje y seis firmas.",sig:"garaje",tras:1}}},{t:"Dejarlo en coincidencia",fn:()=>({txt:"Hay mucha gente con tu apellido. Apagas la máquina."})}]},
 garaje:{b:d=>"El garaje",intro:d=>"Das con uno de los otros cinco. Vive, es viejo, y guarda en un trastero la placa original y un cuaderno de diseño. En la última página hay una pantalla diez dibujada a lápiz que nunca llegó a programarse.",

function teclear(els,v){ // los mensajes nuevos se escriben solos; un toque los completa
  if(!els.length)return;
  let lento=true;try{lento=!matchMedia("(prefers-reduced-motion:reduce)").matches}catch(e){}
  if(!lento)return;
  const cola=els.map(el=>{const ns=[];const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())ns.push([n,n.nodeValue]);return {el,ns}});
  const total=cola.reduce((s,c)=>s+c.ns.reduce((q,x)=>q+x[1].length,0),0),paso=Math.max(2,Math.ceil(total/140));
  cola.forEach(c=>{c.el.style.display="none";c.ns.forEach(x=>x[0].nodeValue="")});
  let ci=0,ni=0,ch_=0;
  const abre=()=>{if(ci<cola.length){cola[ci].el.style.display="";if(cola[ci].el.classList.contains("tit")){cola[ci].ns.forEach(x=>x[0].nodeValue=x[1]);ci++;ni=0;ch_=0;abre()}}};
  const fin=()=>{cola.forEach(c=>{c.el.style.display="";c.ns.forEach(x=>x[0].nodeValue=x[1])});v.scrollTop=v.scrollHeight};
  abre();
  tecleo={fin,t:setInterval(()=>{
    if(ci>=cola.length){pararTecleo();return}
    const c=cola[ci];let q=paso;
    while(q>0&&ni<c.ns.length){const x=c.ns[ni],k=Math.min(q,x[1].length-ch_);ch_+=k;q-=k;x[0].nodeValue=x[1].slice(0,ch_);if(ch_>=x[1].length){ni++;ch_=0}}

    v.scrollTop=v.scrollHeight;
  },16)};
}

     <tr><th>${G.indep?"Nivel de vida":"Familia"}</th><td>${FAM[G.riqueza]}</td></tr>
     <tr><th>Origen</th><td>${ORI[G.origen].n}</td></tr></table>
     <div class="tit">Informe ② ¿Cómo te va?</div>
     <table><tr><th>Etapa</th><td>${etapa()}</td></tr>
     <tr><th>Cuerpo</th><td>${altTxt()}, ${pesoTxt()}${anios()>=14?" · "+complexion():""}</td></tr>
     <tr><th>Trabajo</th><td>${G.trabajo?"Trabajas "+esc(G.trabajo.n)+" · "+G.trabajo.s+" al mes":G.pension?"Jubilación · "+G.pension+" al mes":anios()<16?"Aún no te toca":"Sin trabajo"}</td></tr>
     <tr><th>Estudios</th><td>${G.titulo?"Carrera: "+(CARRERAS[G.carrera]||"terminada"):G.uni?"En la universidad ("+G.uni+"/36)":anios()<6?"Ninguno":anios()<16?"En la escuela":"Enseñanza obligatoria"}</td></tr>
     <tr><th>Pareja</th><td>${G.pareja&&P(G.pareja)?esc(P(G.pareja).nombre)+(G.casado?" (matrimonio)":""):G.crush&&P(G.crush)?"Te gusta "+esc(P(G.crush).nombre):"Nadie"}</td></tr>
     <tr><th>Cursos</th><td>${Object.keys(G.cursos||{}).map(k=>secDe(k).n).join(", ")||"Ninguno"}</td></tr>
     ${!G.indep?`<tr><th>Ambiente en casa</th><td>${ambiente()}</td></tr>`:""}
     ${G.mg?`<tr><th>Magia</th><td>${G.mago?g("Mago graduado","Maga graduada"):"Umbraluz"} · casa ${CASASM[G.mg.casa].n} · ${G.mg.anos} ${G.mg.anos==1?"curso":"cursos"}</td></tr>`:""}
     <tr><th>Costumbres</th><td>${[G.dieta=="basura"&&"comida basura",G.dieta=="dieta"&&"a dieta",G.fl.ropa>0&&"ropa cara",G.fe&&!G.indep&&"familia practicante",G.fl.fuma&&"fumas",G.fl.adicto&&"enganche a las drogas",G.fl.adsex&&"compulsión sexual",G.fl.ludo&&"apuestas",G.fl.ets&&"algo sin tratar"].filter(Boolean).join(", ")||"Nada que señalar"}</td></tr>${filasExtra()}${filasAmor()}</table>
     ${G.logros&&G.logros.length?`<div class="tit">Informe ③ Logros</div><table>${G.logros.map(l=>"<tr><td>"+esc(l.charAt(0).toUpperCase()+l.slice(1))+"</td></tr>").join("")}</table>`:""}
     <p class="nota">La partida se guarda sola en este navegador. Si empiezas otra vida, esta se pierde.</p>`;
    const b=document.createElement("button");b.className="gordo";b.style.fontSize="13px";b.textContent="ABANDONAR ESTA VIDA";
    b.onclick=()=>abrirHoja("¿Abandonar esta vida?",[{t:"Sí, empezar de cero",fn:()=>{G=null;borrar();cerrarHoja();render()}}]);
    v.appendChild(b);v.scrollTop=0;
  }
  const acc=$("acc");acc.innerHTML="";
  if(G.muerto){herederos().forEach(h=>{const b=document.createElement("button");b.className="ancho";b.textContent=`Seguir como ${h.nombre} (${gp(h,"hijo","hija")}, ${edadTxt(h.edad)})`;b.onclick=()=>continuarComo(h.id);acc.appendChild(b)});
    const b=document.createElement("button");b.className="ancho";b.textContent="Nacer otra vez";b.onclick=()=>{G=null;borrar();render()};acc.appendChild(b);return}
  if(G.pend)abrirPend();
  acciones().forEach(o=>{const b=document.createElement("button");b.textContent=o.t;if(o.cls)b.className=o.cls;
    b.onclick=o.anio?pasarAnio:o.abre?o.abre:()=>{TAB="diario";hacer(o.fn)};acc.appendChild(b)});
}
document.querySelectorAll("#tabs button[data-t]").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render(TAB=="diario")});
// Pantalla completa (en el APK ya va a pantalla completa y el botón sobra)
if(window.AndroidApp)$("bFull").hidden=true;
$("bFull").onclick=()=>{
  const d=document,el=d.documentElement;
  try{
    if(d.fullscreenElement){d.exitFullscreen();return}
    const p=el.requestFullscreen?el.requestFullscreen():Promise.reject();
    p.catch(()=>abrirHoja("Aquí no se puede poner a pantalla completa. Instala el APK: ahí va siempre completa.",[]));
  }catch(e){abrirHoja("Aquí no se puede poner a pantalla completa. Instala el APK: ahí va siempre completa.",[])}
};
window.__atras=()=>{if($("hoja").classList.contains("on")){if(!(G&&G.pend))cerrarHoja();return 1}return 0};
$("vista").addEventListener("click",pararTecleo);
cargar();visto=G?(G.lid||0):0;render(true);
</script>
</body>
