plugins { id "com.android.application" }
// EDITOR DE MAPAS de Riviera Cop (app aparte para crear mapas desde el móvil)
android {
    namespace "com.cimentacion.rivieramapas"
    compileSdk 36
    defaultConfig {
        applicationId "com.cimentacion.rivieramapas"
        minSdk 24
        targetSdk 36
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }
    signingConfigs {
        release {
            storeFile file("../../android-rivieracop/cartografo.jks")
            storePassword "cartografo"
            keyAlias "cartografo"
            keyPassword "cartografo"
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
