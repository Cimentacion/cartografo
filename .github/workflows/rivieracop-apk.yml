name: Compilar APK Riviera Cop
on:
  push:
    branches: [riviera-cop, main]
    paths: ['rivieracop/**', 'android-rivieracop/**', '.github/workflows/rivieracop-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Copiar el juego dentro de la app
        run: |
          mkdir -p android-rivieracop/app/src/main/assets/game
          cp -r rivieracop/index.html rivieracop/js rivieracop/lib android-rivieracop/app/src/main/assets/game/
      - name: Compilar
        working-directory: android-rivieracop
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Renombrar
        run: cp android-rivieracop/app/build/outputs/apk/release/app-release.apk rivieracop.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rivieracop
          name: "Riviera Cop (APK)"
          body: "APK de Riviera Cop compilado automáticamente. Build #${{ github.run_number }}."
          files: rivieracop.apk
          make_latest: false
