name: Compilar APK Riviera Cop
on:
  push:
    branches: [riviera-cop]
    paths: ['rivieracop/**', 'android-rivieracop/**', '.github/workflows/rivieracop-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rivieracop-apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Copiar el juego dentro de la app
        run: |
          mkdir -p android-rivieracop/app/src/main/assets/game
          cp -r rivieracop/index.html rivieracop/js rivieracop/lib rivieracop/tex android-rivieracop/app/src/main/assets/game/
          echo "${{ github.run_number }}" > android-rivieracop/app/src/main/assets/game/pack.txt
          cp android-rivieracop/native.txt android-rivieracop/app/src/main/assets/native.txt
          # pack del juego: se descarga e instala solo dentro de la app (sin reinstalar el APK)
          (cd android-rivieracop/app/src/main/assets/game && zip -qr "$GITHUB_WORKSPACE/game.zip" .)
          echo "${{ github.run_number }}" > pack.txt
          cp android-rivieracop/native.txt native.txt
      - name: Compilar
        working-directory: android-rivieracop
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Renombrar
        run: |
          cp android-rivieracop/app/build/outputs/apk/release/app-release.apk rivieracop.apk
          echo "${{ github.run_number }}" > version.txt
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rivieracop
          name: "Riviera Cop (APK)"
          body: "APK de Riviera Cop compilado automáticamente. Build #${{ github.run_number }}."
          files: |
            rivieracop.apk
            version.txt
            game.zip
            native.txt
            pack.txt
          make_latest: false
