name: fetch-benidorm
on:
  push:
    branches: [kebab-data]  # para volver a descargar: subir un cambio de tools/fetch a la rama kebab-data
    paths: ['tools/fetch/**', '.github/workflows/fetch-benidorm.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: cd tools/fetch && python fetch.py
      - name: Guardar los datos en la rama
        run: |
          rm -rf data && mkdir -p data && cp -r tools/fetch/out/* data/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add data && git commit -m "Datos de OSM y texturas descargados" && git push
