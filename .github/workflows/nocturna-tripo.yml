name: nocturna-tripo
on:
  push:
    branches: [nocturna-tripo]
    paths: ['tools/nocturna/girls.json', 'tools/nocturna/gen.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: tripo, cancel-in-progress: false }
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/nocturna/gen.py
        env: { TRIPO_API_KEY: '${{ secrets.TRIPO_API_KEY }}' }
      - name: Guardar los modelos en la rama
        if: always()
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add data/nocturna && (git diff --cached --quiet || (git commit -m "Nocturna: modelos de Tripo" && git push))
