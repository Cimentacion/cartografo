name: Compilar APK Kebab Poniente
on:
  push:
    branches: [kebab-poniente]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kebab-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Copiar el juego dentro de la app
        run: |
          mkdir -p android/app/src/main/assets/game
          cp -r index.html js lib android/app/src/main/assets/game/
      - name: Compilar
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Preparar archivos
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kebab-poniente.apk
          cp dist/kebab-poniente.html kebab-poniente.html
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kebab
          target_commitish: ${{ github.sha }}
          name: "Kebab Poniente (APK y HTML)"
          body: "Compilado automáticamente desde la rama kebab-poniente. Build #${{ github.run_number }}."
          files: |
            kebab-poniente.apk
            kebab-poniente.html
          make_latest: false
