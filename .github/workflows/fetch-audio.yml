name: fetch-audio
on:
  push:
    branches: [kebab-data]
    paths: ['tools/audio/**', '.github/workflows/fetch-audio.yml']
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: python tools/audio/fetch_audio.py
      - name: Guardar
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add data/audio && (git diff --cached --quiet || (git commit -m "Audio libre: música árabe (Commons) y sonidos de terror (OpenGameArt)" && git pull --rebase && git push))
