name: Compilar APK Cápsula Azul
on:
  push:
    branches: [capsula-azul]
    paths: ['capsula/**', 'android-capsula/**', '.github/workflows/capsula-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: capsula-apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Copiar el juego dentro de la app
        run: |
          mkdir -p android-capsula/app/src/main/assets
          cp capsula/index.html capsula/three.min.js capsula/*.woff2 capsula/OFL-Silkscreen.txt android-capsula/app/src/main/assets/
      - name: Compilar
        working-directory: android-capsula
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Renombrar
        run: cp android-capsula/app/build/outputs/apk/release/app-release.apk capsula-azul.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: capsulaazul
          target_commitish: capsula-azul
          name: "Cápsula Azul (APK)"
          body: "APK de Cápsula Azul compilado automáticamente. Build #${{ github.run_number }}. Se instala encima de la versión anterior sin perder las partidas."
          files: capsula-azul.apk
          make_latest: false
