name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Copiar la web dentro de la app
        run: |
          mkdir -p android/app/src/main/assets/icons
          cp index.html android/app/src/main/assets/index.html
          cp icons/*.png android/app/src/main/assets/icons/
      - name: Compilar
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk cartografo.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Cartógrafo (última versión)"
          body: "APK compilado automáticamente desde main. Build #${{ github.run_number }}."
          files: cartografo.apk
          make_latest: true
