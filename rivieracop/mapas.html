<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Riviera Mapas</title>
<style>
@font-face{font-family:'Bangers';src:url(fonts/bangers-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-weight:600;src:url(fonts/chakra-petch-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-weight:700;src:url(fonts/chakra-petch-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Press Start 2P';src:url(fonts/press-start-2p-latin-400-normal.woff2) format('woff2')}
:root{--bg:#0c0a18;--panel:#151226;--line:rgba(255,255,255,.12);--ink:#fff;--dim:#a9a3c4;--gold:#ffe14a;--red:#ff4a5a;--green:#7dff8a;--blue:#5ad0ff;
  --f-title:'Bangers',Impact,sans-serif;--f-ui:'Chakra Petch',system-ui,sans-serif;--f-px:'Press Start 2P',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 14px var(--f-ui);overflow:hidden;user-select:none}
button,select,input{font:inherit;color:inherit}
button{background:#2a2450;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:7px 11px;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(1px);filter:brightness(1.2)}
button.go{background:#1f6b35;border-color:#7dff8a}button.warn{background:#6b1f2a;border-color:#ff7a8a}button.gold{background:#6b5a14;border-color:var(--gold)}
button:disabled{opacity:.45}
select,input[type=text],input[type=number],input[type=password]{background:#0d0b1a;border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
input[type=range]{accent-color:var(--gold);width:100%}
.scr{position:fixed;inset:0;display:flex;flex-direction:column}
.scr[hidden]{display:none}
.top{display:flex;align-items:center;gap:8px;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:#100d20;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font:26px var(--f-title);letter-spacing:.04em;margin:0 6px 0 0;color:var(--gold);text-shadow:0 3px 0 #000}
.top .sp{flex:1}
.lbl{font:9px var(--f-px);color:var(--dim);letter-spacing:.05em}
/* lista de mapas */
#listBody{flex:1;overflow:auto;padding:12px max(12px,env(safe-area-inset-right)) 20px max(12px,env(safe-area-inset-left));display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){#listBody{grid-template-columns:1fr}}
.col h2{font:20px var(--f-title);margin:0 0 8px;color:var(--blue);letter-spacing:.04em}
.cards{display:flex;flex-direction:column;gap:8px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.mcard b{font:18px var(--f-title);color:var(--gold);letter-spacing:.03em}.mcard small{color:var(--dim)}
.mcard .row{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:8px var(--f-px);padding:3px 5px;border-radius:4px;background:#1f6b35;color:#cfffd6}
.empty{color:var(--dim);padding:10px;border:1px dashed var(--line);border-radius:10px}
/* editor */
#edBody{flex:1;display:flex;min-height:0}
#mapSide{flex:1.05;position:relative;min-width:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
#mapCv{flex:1;width:100%;min-height:0;touch-action:none;display:block}
#profCv{height:64px;width:100%;display:block;border-top:1px solid var(--line);touch-action:none}
#v3d{position:absolute;inset:0;z-index:3;background:#000}#v3d[hidden]{display:none}
#mapBtns{position:absolute;right:8px;top:6px;z-index:4;display:flex;gap:6px}#mapBtns button.on{background:#2b5fa0}
#crumb{padding:6px 10px;border-bottom:1px solid var(--line);font:600 12px var(--f-ui);display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:#120f22}#crumb button{padding:3px 7px;font-size:12px}
#mapInfo{position:absolute;left:8px;right:72px;top:6px;font:9px var(--f-px);color:var(--dim);pointer-events:none;text-shadow:1px 1px 0 #000;line-height:1.6}
#panel{flex:1;display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:9px 2px;font:15px var(--f-title);letter-spacing:.05em;color:var(--dim)}
.tabs button.on{color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
.pane{flex:1;overflow:auto;padding:10px 12px 30px}
.pane[hidden]{display:none}
.seg,.ev{background:var(--panel);border:1px solid var(--line);border-left:6px solid #888;border-radius:9px;padding:8px 10px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.seg.sel{outline:2px solid var(--gold)}
.seg .h,.ev .h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg .h b{font:16px var(--f-title);letter-spacing:.04em;min-width:64px}
.seg .h select{flex:1}
.seg .h .sp{flex:1}
.mini{padding:5px 8px;font-size:13px}
.rowk{display:grid;grid-template-columns:62px 1fr 54px;align-items:center;gap:8px}
.rowk span{font:9px var(--f-px);color:var(--dim)}
.rowk output{text-align:right;font:700 13px var(--f-ui);color:var(--gold)}
.steps{display:flex;gap:3px}
.steps button{flex:1;padding:6px 0;font-size:12px;border-radius:6px;background:#1c1838}
.steps button.on{background:var(--gold);color:#000;border-color:var(--gold)}
.tog{display:flex;gap:6px}
.tog button.on{background:#2b5fa0;border-color:var(--blue)}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.ev{border-left-color:var(--red)}
.ev .h input[type=number]{width:84px}
.ev .h select{flex:1;min-width:150px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.note{color:var(--dim);font-weight:600;font-size:13px;line-height:1.35;margin:6px 0}
#toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,30px);opacity:0;transition:.25s;z-index:99;max-width:92vw;padding:10px 14px;background:#141024ee;border:2px solid var(--gold);font:600 13px var(--f-ui);pointer-events:none;text-align:center;border-radius:8px}
#toast.on{transform:translate(-50%,0);opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:80;padding:12px}
#modal[hidden]{display:none}
#modal .box{background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:14px;width:min(560px,100%);max-height:94vh;overflow:auto}
#modal h3{font:22px var(--f-title);margin:0 0 8px;color:var(--gold);letter-spacing:.04em}
#modal textarea{width:100%;height:110px;background:#0d0b1a;color:#fff;border:1px solid var(--line);border-radius:7px;font:12px monospace;padding:6px}
</style>
</head>
<body>
<!-- LISTA DE MAPAS -->
<div id="listScr" class="scr">
  <div class="top"><h1>RIVIERA MAPAS</h1><span class="lbl" id="who"></span><span class="sp"></span>
    <button id="bNew" class="go">＋ MAPA NUEVO</button><button id="bImport">PEGAR CÓDIGO</button><button id="bSettings">⚙ AJUSTES</button><button id="bGame" class="gold">🎮 JUEGO</button></div>
  <div id="listBody">
    <div class="col"><h2>EN ESTE MÓVIL</h2><div id="localList" class="cards"></div></div>
    <div class="col"><h2>EN EL SERVIDOR <button id="bSrvReload" class="mini">↻</button></h2><div id="srvList" class="cards"><div class="empty">Cargando…</div></div></div>
  </div>
</div>

<!-- EDITOR -->
<div id="edScr" class="scr" hidden>
  <div class="top"><button id="bBack">◀ MAPAS</button><input id="fName" type="text" maxlength="40" placeholder="Nombre del mapa" style="flex:1;min-width:120px"><span class="lbl" id="saveSt"></span>
    <button id="bTest" class="go">▶ PROBAR</button><button id="bSave" class="gold">💾 GUARDAR</button></div>
  <div id="edBody">
    <div id="mapSide"><canvas id="mapCv"></canvas><canvas id="profCv"></canvas><div id="mapInfo"></div><div id="v3d" hidden></div>
      <div id="mapBtns"><button id="bRev" class="mini" hidden>◀ ATRÁS</button><button id="bFwd" class="mini" hidden>ADELANTE ▶</button><button id="bCar" class="mini" hidden>🚗</button><button id="b3d" class="mini gold">🧊 3D</button></div></div>
    <div id="panel">
      <div id="crumb"></div>
      <div class="tabs"><button data-t="segs" class="on">TRAMOS</button><button data-t="evs">ENEMIGOS</button><button data-t="props">OBJETOS</button><button data-t="end">FINAL</button><button data-t="opts">MAPA</button></div>
      <div id="p_segs" class="pane"></div>
      <div id="p_evs" class="pane" hidden></div>
      <div id="p_props" class="pane" hidden></div>
      <div id="p_end" class="pane" hidden></div>
      <div id="p_opts" class="pane" hidden></div>
    </div>
  </div>
</div>

<div id="modal" hidden><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<script type="module" src="js/mapeditor.js"></script>
</body>
</html>
