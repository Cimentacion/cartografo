<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Witchstep: Castle of Night</title>
<style>@font-face{font-family:"Silkscreen";src:url(silkscreen-latin-400-normal.woff2) format("woff2");font-weight:400}@font-face{font-family:"Silkscreen";src:url(silkscreen-latin-700-normal.woff2) format("woff2");font-weight:700}</style>
<style>
/* Una pantalla: canvas 3D a sangre. HUD arriba-izq, minimapa arriba-dcha, joystick abajo-izq */
:root{
  --bg:#000; --fg:#e9ecf2; --dim:#7a8090; --hp:#3b74ff; --hp-empty:#141826; --xp:#d8b24a; --map:#2236b8;
  --font:"Silkscreen", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(14px,env(safe-area-inset-left,0px));
  font-family:var(--font);display:grid;gap:5px;pointer-events:none}
.row{display:flex;align-items:center;gap:8px}
#hpNum{width:36px;height:36px;border:2px solid var(--fg);border-radius:50%;display:grid;place-items:center;
  font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
#bar{height:14px;border:2px solid var(--fg);background:var(--hp-empty);position:relative;transition:width .35s}
#fill{position:absolute;inset:0 auto 0 0;background:var(--hp);transition:width .25s}
#stats{font-size:12px;letter-spacing:.06em;display:flex;gap:12px}
#xpbar{width:120px;height:4px;background:#1c1a12;position:relative}
#xpfill{position:absolute;inset:0 auto 0 0;background:var(--xp);transition:width .25s}
#pw{display:flex;gap:4px}
.pwi{width:16px;height:16px;border:1px solid currentColor;font-size:10px;display:grid;place-items:center}
#sunBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 126px);right:max(14px,env(safe-area-inset-right,0px));z-index:3;
  font-family:var(--font);font-size:12px;background:rgba(0,0,0,.7);color:#ffe9a0;border:2px solid #e8c35a;padding:5px 9px;cursor:pointer}
#mini{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(14px,env(safe-area-inset-right,0px));
  width:104px;height:104px;border:2px solid #fff;background:#000;image-rendering:pixelated;cursor:pointer}
#zone{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  font-family:var(--font);font-size:11px;color:var(--dim);letter-spacing:.08em;pointer-events:none;text-align:right;text-transform:uppercase}
#banner{position:fixed;left:0;right:0;top:28%;text-align:center;font-family:var(--font);font-size:22px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity .6s;text-shadow:0 0 8px #000}
#banner.on{opacity:1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22%);transform:translateX(-50%);
  font-family:var(--font);font-size:12px;text-align:center;background:rgba(0,0,0,.8);border:1px solid #fff;
  padding:8px 12px;max-width:80vw;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#hpLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#mini,#hud,#zone,#bag{z-index:2}
.ov{z-index:10}
.hpl{position:absolute;left:0;top:0;font-family:var(--font);font-weight:700;font-size:15px;color:#fff;line-height:1;
  text-shadow:-2px 0 #000,2px 0 #000,0 -2px #000,0 2px #000,-1px -1px #000,1px 1px #000,-1px 1px #000,1px -1px #000;will-change:transform}
#bag{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 40px);display:grid;gap:8px;z-index:3}
#bag button{font-family:var(--font);font-size:12px;background:rgba(0,0,0,.7);color:var(--fg);border:2px solid #ff4a5a;padding:9px 12px;cursor:pointer}
#bag #useElix{border-color:#e8c35a;color:#ffe9a0}
#bag #useWild{border-color:#b98aff;color:#e2d0ff}
#bag #useBomb{border-color:#ff9a3c;color:#ffd0a0}
.xprow{display:flex;align-items:flex-end;gap:6px}
#oil{position:relative;width:5px;height:22px;border:1px solid #fff;background:rgba(0,0,0,.6);flex:none}
#oilf{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffd070,#ff8a20)}
#shopList button{display:flex;justify-content:space-between;gap:12px;width:100%;min-width:0;text-align:left}
#shopList button small{display:block;color:var(--dim);font-size:10px;margin-top:3px}
#shopList button:disabled{opacity:.35}
#slotList button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-width:0;text-align:left;font-size:12px;padding:10px 12px}
#slotList button small{display:block;color:var(--dim);font-size:10px;margin-top:3px;line-height:1.4}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
#fade.on{opacity:1}
#stoneOv{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);z-index:40;pointer-events:none;text-align:center;color:#eee;text-shadow:0 2px 6px #000;font-family:inherit}
#stoneOv b{display:block;font-size:30px;letter-spacing:2px;color:#e8e6dc;animation:stoneP .25s infinite alternate}
#stoneOv span{display:block;font-size:14px;margin:6px 0 10px}
#stoneOv .sbar{width:200px;height:12px;border:2px solid #ddd;margin:0 auto;background:#222}
#stoneFill{height:100%;width:0;background:#e8e6dc}
@keyframes stoneP{from{transform:scale(1)}to{transform:scale(1.08)}}
#curseB{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);z-index:30;pointer-events:none;color:#e0a0ff;background:rgba(40,0,60,.72);border:1px solid #b060e0;padding:3px 10px;font-size:13px;letter-spacing:1px;animation:stoneP .6s infinite alternate}
#toast b{display:block;font-size:14px;margin-bottom:3px}
#joy{position:fixed;left:0;right:0;bottom:0;height:58%}
#base{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border:2px solid rgba(233,236,242,.25);border-radius:50%;display:none}
#knob{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(233,236,242,.3);
  border:2px solid rgba(233,236,242,.6);display:none}
.dmg{position:fixed;font-family:var(--font);font-weight:700;font-size:19px;pointer-events:none;
  transform:translate(-50%,-50%);animation:up .9s ease-out forwards;text-shadow:0 0 4px #000,0 0 2px #000}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-50px}}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.82);font-family:var(--font);text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov h1{font-size:30px;margin:0 0 8px;font-weight:700;letter-spacing:.06em}
.ov h2{font-size:22px;margin:0 0 6px}
.ov p{color:var(--dim);margin:0 0 18px;font-size:12px;line-height:1.6}
.ov .btns{display:grid;gap:10px;justify-items:center}
.ov button{font-family:var(--font);font-size:15px;background:#000;color:var(--fg);border:2px solid var(--fg);
  padding:12px 20px;min-width:220px;cursor:pointer}
.ov button:focus-visible{outline:2px solid var(--hp);outline-offset:3px}
.ov button.hp{border-color:var(--hp);color:#9bb8ff}
.ov button.atk{border-color:#e04848;color:#ff9b9b}
#mapov{background:#000;place-items:stretch;padding:0}
#mapov .wrap{display:grid;grid-template-rows:auto 1fr auto;height:100%;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;gap:10px}
#bigmap{width:100%;height:100%;border:2px solid #fff;box-sizing:border-box;image-rendering:pixelated;min-height:0}
#mapinfo{font-size:11px;text-align:left;display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--fg)}
#mapinfo .pw-off{color:#333}
.mbtns{display:flex;gap:8px;flex-wrap:wrap}
.ov .mbtns button{min-width:0;padding:10px 14px;font-size:14px}
.ov .mbtns #mzIn,.ov .mbtns #mzOut{width:48px;font-size:18px;padding:8px 0}
.ov .mbtns #mzX{margin-left:auto}
#bigmap{touch-action:none;cursor:grab}
</style>
</head>
<body>


<canvas id="c"></canvas>
<div id="hud">
  <div class="row"><div id="hpNum">5</div><div id="bar"><div id="fill"></div></div></div>
  <div id="stats"><span id="atk">ATK 1</span><span id="lvl">NV 1</span><span id="gold" style="color:#e8c35a">◆ 0</span><span id="keys"></span></div>
  <div class="xprow"><div id="oil" hidden title="Aceite del candil"><div id="oilf"></div></div><div id="xpbar"><div id="xpfill"></div></div></div>
  <div id="pw"></div>
</div>
<canvas id="mini" aria-label="Minimapa, toca para abrir el mapa completo"></canvas>
<button id="sunBtn" aria-label="Brillo y saturación">LUZ 1</button>
<div id="zone"></div>
<div id="banner"></div>
<div id="toast"></div>
<div id="stoneOv" hidden><b>¡PETRIFICADA!</b><span>Toca la pantalla muy rápido</span><div class="sbar"><div id="stoneFill"></div></div></div>
<div id="curseB" hidden>✠ MALDITA · busca agua bendita</div>
<div id="fade"></div>
<div id="joy"><div id="base"></div><div id="knob"></div></div>
<div id="bag"><button id="useBomb" hidden>BOMBA ×0</button><button id="useWild" hidden>COMODÍN ×0</button><button id="useElix" hidden>ELIXIR ×0</button><button id="usePot" hidden>POCIÓN ×0</button></div>

<div id="warp" class="ov" hidden><div style="width:min(340px,100%)">
  <h2>TELETRANSPORTE</h2><p>¿A qué sala quieres viajar?</p>
  <div id="warpList" class="btns"></div>
  <div class="btns" style="margin-top:14px"><button id="warpX">Quedarme</button></div>
</div></div>
<div id="shop" class="ov" hidden><div style="width:min(340px,100%)">
  <h2>MERCADER</h2><p id="shopSub">“¿Algo para el camino?”</p>
  <div id="shopList" class="btns"></div>
  <div class="btns" style="margin-top:14px"><button id="shopX">Salir</button></div>
</div></div>

<div id="lvlup" class="ov" hidden><div>
  <h2 id="lvTitle">NIVEL 2</h2><p id="lvSub">Elige una mejora</p>
  <div class="btns"><button id="upHp" class="hp">+3 VIDA MÁX</button><button id="upAtk" class="atk">+1 ATAQUE</button></div>
</div></div>

<div id="mapov" class="ov" hidden><div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">MAPA DEL CASTILLO</b><span id="mapPct" style="font-size:11px;color:var(--dim)"></span></div>
  <canvas id="bigmap"></canvas>
  <div style="display:grid;gap:10px"><div id="mapinfo"></div>
    <div class="mbtns"><button id="mzOut" aria-label="Alejar">−</button><button id="mzIn" aria-label="Acercar">+</button><button id="mzC">CENTRAR</button><button id="mzX">CERRAR</button></div></div>
</div></div>

<div id="over" class="ov" hidden><div>
  <h1 id="ovT">HAS CAÍDO</h1><p id="ovP"></p>
  <div class="btns"><button id="ovBtn">Volver a la capilla</button><button id="ovSlots" hidden>Elegir otra copia</button></div>
</div></div>

<div id="slots" class="ov" hidden><div style="width:min(380px,100%);max-height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding-block:20px;box-sizing:border-box">
  <h2>COPIAS GUARDADAS</h2>
  <div id="slotList" class="btns" style="overflow-y:auto;min-height:0;align-content:start"></div>
  <div class="btns"><button id="slotsX">Volver</button></div>
</div></div>
<div id="title" class="ov"><div>
  <h1>WITCHSTEP</h1><p>Castle of Night</p>
  <div class="btns"><button id="tCont" hidden>Continuar</button><button id="tSlots" hidden>Cargar copia</button><button id="tNew">Nueva partida</button></div>
</div></div>

<script src="three.min.js"></script>

function addInst(geo,mat,list){ if(!list.length)return; const groups=new Map();
  for(const it of list){ const e=it.m.elements; const k=Math.floor(e[12]/CHUNK)+','+Math.floor(e[14]/CHUNK); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(it); }
  for(const [k,arr] of groups){ const m=new THREE.InstancedMesh(geo,mat,arr.length); arr.forEach((it,i)=>{ m.setMatrixAt(i,it.m); m.setColorAt(i,it.c); });
    const [cx,cz]=k.split(',').map(Number); m.userData.cx=(cx+0.5)*CHUNK; m.userData.cz=(cz+0.5)*CHUNK; m.frustumCulled=false; scene.add(m); chunkMeshes.push(m); } }

function grad(m,low,top){
  m.onBeforeCompile=sh=>{
    sh.uniforms.gLow={value:low}; sh.uniforms.gTop={value:top};
    sh.vertexShader='varying float vGradY;\n'+sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n vec4 gW=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\n gW=instanceMatrix*gW;\n#endif\n vGradY=(modelMatrix*gW).y;');
    sh.fragmentShader='varying float vGradY;\nuniform float gLow;\nuniform float gTop;\n'+sh.fragmentShader.replace('#include <fog_fragment>',
      'float gK=smoothstep(-0.1,gTop,vGradY); gl_FragColor.rgb*=mix(gLow,1.0,gK*gK*(3.0-2.0*gK));\n#include <fog_fragment>');
  };
  m.customProgramCacheKey=()=>'grad'; return m;
}

    for(let y=0;y<len;y++){ const [r,g,b]=get(x,y0+y); const f=s+(1-s)*(y/len); put(x,y0+y,r*f,g*f,b*f); } }
  for(let k=0;k<stains;k++){ const cx=R()*n, cy=R()*n, rad=1.5+R()*3.5;
    for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++){ const d=Math.hypot(x,y)/rad; if(d>1||R()<d*0.5)continue; const [r,g,b]=get(cx+x|0,cy+y|0);

function psxMat(tex,scale,low,top,cut){
  const m=new THREE.MeshLambertMaterial({color:0xffffff,map:tex});
  m.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,{gLow:{value:low},gTop:{value:top},uScale:{value:scale},uSnap:SNAP,uPl,uCamK});
    sh.vertexShader='uniform vec2 uSnap;\nvarying float vGradY;\nvarying vec3 vWP;\nvarying vec3 vWN;\n'+sh.vertexShader.replace('#include <project_vertex>',
      `#include <project_vertex>
       vec4 gW=vec4(transformed,1.0); mat3 nm=mat3(modelMatrix);
       #ifdef USE_INSTANCING
         gW=instanceMatrix*gW; nm=nm*mat3(instanceMatrix);
       #endif
       vWP=(modelMatrix*gW).xyz; vGradY=vWP.y; vWN=normalize(nm*objectNormal);
`);
    sh.fragmentShader='uniform float gLow;\nuniform float gTop;\nuniform float uScale;\nvarying float vGradY;\nvarying vec3 vWP;\nvarying vec3 vWN;\n'+
      sh.fragmentShader.replace('#include <map_fragment>',
      `vec3 an=abs(vWN); vec2 wuv = an.x>an.z ? vec2(vWP.z,-vWP.y) : vec2(vWP.x,-vWP.y);
       if(an.y>max(an.x,an.z)) wuv=vWP.xz;
       vec4 texelColor=texture2D(map,wuv*uScale); texelColor=mapTexelToLinear(texelColor); diffuseColor*=texelColor;`)
      .replace('#include <fog_fragment>',
      `float gK=smoothstep(-0.1,gTop,vGradY); gl_FragColor.rgb*=mix(gLow,1.0,gK*gK*(3.0-2.0*gK));
       gl_FragColor.rgb=floor(gl_FragColor.rgb*40.0+0.5)/40.0;
       #include <fog_fragment>`);
    if(cut){ sh.fragmentShader='uniform vec3 uPl;\nuniform float uCamK;\n'+sh.fragmentShader.replace('void main() {',`void main() {

function silTexture(type,col,f=0){ const key=type+col+'_'+f; if(silCache.has(key)) return silCache.get(key);

  for(const [dx,dy] of [[-2,0],[2,0],[0,-2],[0,2],[-1,-1],[1,1],[-1,1],[1,-1],[-2,-1],[2,1],[-1,2],[1,-2]]) oc.drawImage(mask,dx,dy);

  if(def.detail){ cc.save(); cc.globalCompositeOperation='source-atop'; cc.translate(P,P+2); def.detail(cc,f); cc.restore(); }
  oc.drawImage(colr,0,0);
  oc.fillStyle=def.eyeCol||'#ffe060'; (def.eyes||[]).forEach(([x,y])=>oc.fillRect(Math.round(x+P),Math.round(y+P+2),2,2));

const SIL_VS=`uniform vec2 uScale; uniform float uFlip; uniform float uLift; varying vec2 vUv;
void main(){ vUv=uv; float sx=length(modelMatrix[0].xyz), sy=length(modelMatrix[1].xyz);
  vec4 vc=modelViewMatrix*vec4(0.0,uLift/max(sy,0.001),0.0,1.0);
  vec2 corner=vec2((uv.x-0.5)*uScale.x*uFlip*sx,(uv.y-0.04)*uScale.y*sy);
  gl_Position=projectionMatrix*(vc+vec4(corner,0.0,0.0));
  vec4 fz=projectionMatrix*(vc+vec4(0.0,0.0,1.3,0.0));
  gl_Position.z=fz.z/fz.w*gl_Position.w; }`;
const SIL_FS=`uniform sampler2D map; uniform vec3 uTint; uniform float uGray; uniform float uCut; varying vec2 vUv; void main(){ if(vUv.y<uCut) discard; vec4 c=texture2D(map,vUv); if(c.a<0.5) discard; float l=dot(c.rgb,vec3(0.3,0.59,0.11)); gl_FragColor=vec4(mix(c.rgb,vec3(l*0.8+0.12)*vec3(0.95,0.95,0.9),uGray)*uTint,1.0); }`;

joy.addEventListener('pointermove',ev=>{ if(ev.pointerId!==jId)return;
  let dx=ev.clientX-jo.x, dy=ev.clientY-jo.y; const l=Math.hypot(dx,dy); if(l>JR){dx*=JR/l;dy*=JR/l;}
  jk.style.left=(jo.x+dx)+'px'; jk.style.top=(jo.y+dy)+'px';
  let nd=null; if(l>JR*0.4) nd=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];
  const changed=(nd?nd.join():'')!==(jDir?jDir.join():''); jDir=nd; if(changed&&nd) tryMove(nd[0],nd[1]); });
const jEnd=ev=>{ if(ev.pointerId!==jId)return; jId=null; jDir=null; jb.style.display=jk.style.display='none'; };
joy.addEventListener('pointerup',jEnd); joy.addEventListener('pointercancel',jEnd);

// título
if(saved) $('tCont').hidden=false; if(slots.length>1) $('tSlots').hidden=false;
$('tSlots').addEventListener('click',openSlots);
$('tCont').addEventListener('click',()=>applyState(saved,false));
let newArmed=false;
$('tNew').addEventListener('click',()=>{ if(saved&&!newArmed){ newArmed=true; $('tNew').textContent='¿Borrar partida? Toca otra vez'; return; }
  try{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(SLOTS_KEY);}catch(e){} saved=null; slots=[]; newGame(); });

// ======================= BUCLE =======================
const camOff=new THREE.Vector3(0,10,4.4), camPos=new THREE.Vector3();
let prev=performance.now(), time=0;
function frame(now){
  const dt=Math.min(0.05,(now-prev)/1000); prev=now; time+=dt;
  if(!S.dead && $('title').hidden && $('slots').hidden) S.playTime+=dt;
  const held=jDir||keyDir();
  if(held && now-lastMove>(base[idx(S.x,S.z)]==='±'?380:170)) tryMove(held[0],held[1]);

  const pm=player.mesh.position, k=1-Math.pow(0.0001,dt);
  const here=tileAt(S.x,S.z), onE=enemyAt(S.x,S.z);
  // vagoneta
  if(S.ride){ S.ride.t-=dt; while(S.ride && S.ride.t<=0){ S.ride.t+=0.13; S.ride.k++; const st=S.ride.path[S.ride.k];
      S.x=st[0]; S.z=st[1]; reveal(); checkArea(); if(S.ride.k>=S.ride.path.length-1){ S.ride=null; rideCart.visible=false; } } }
  // pinchos
  if(base[idx(S.x,S.z)]==='J' && !S.dead && spikeUp(S.x,S.z)){ const cyc=idx(S.x,S.z)+'_'+Math.floor((time+spikeOff(S.x,S.z))/SPIKE_T);
    if(S.spikeHit!==cyc){ S.spikeHit=cyc; hurt(2,'¡Pinchos!'); } }
  // suelo frágil
  for(const [ci,cs] of crumble){ const cb=crumbles.find(o=>o.id===ci);
    if(cs.ph==='crack'){ cb.g.position.x=cb.x+Math.sin(time*60)*0.02;
      if(time-cs.t>0.55){ cs.ph='gone'; cs.t=time; cb.g.position.x=cb.x;
        if(S.x===cb.x&&S.z===cb.z&&!S.powers.has('Y')&&!S.dead){ S.x=S.prevX; S.z=S.prevZ; hurt(3,'El suelo se ha hundido.'); } } }
    else if(cs.ph==='gone'){ const k=Math.min(1,(time-cs.t)*2); cb.g.position.y=-k*2.5; cb.g.visible=k<1;
      if(time-cs.t>4 && !(S.x===cb.x&&S.z===cb.z)){ crumble.delete(ci); cb.g.position.y=0; cb.g.visible=true; } } }
  levers.forEach(l=>{ const tz=leverOn(l)?-0.7:0.7; l.piv.rotation.x+=(tz-l.piv.rotation.x)*Math.min(1,dt*10); });
  gates.forEach(g=>{ const ty2=gateOpen(g.id)?-1.55:0; g.inner.position.y+=(ty2-g.inner.position.y)*Math.min(1,dt*5); });
  spikes.forEach(sp=>{ if(!sp.tips.parent.visible)return; const ty2=spikeUp(sp.x,sp.z)?0:-0.36; sp.tips.position.y+=(ty2-sp.tips.position.y)*Math.min(1,dt*(ty2===0?30:6)); });
  portals.forEach(pt=>{ if(!pt.g.visible)return; pt.g.children[0].rotation.y=time*1.5; pt.g.children[1].rotation.y=time*1.5; });
  portalMat.opacity=0.4+Math.sin(time*3)*0.15; warpMat.opacity=0.3+Math.sin(time*4)*0.15;
  secretWalls.forEach(sw=>{ if(sw.fade>0){ sw.fade=Math.max(0,sw.fade-dt*1.3); setSecretVis(sw,sw.fade); } });
  const here0=tileAt(S.x,S.z);
  const ty = S.ride?0.22 : onE?0.95 : here==='~'?-0.42 : here==='='?0.06 : here0==='0'?0.3 : 0;
  player.mesh.userData.sp.material.uniforms.uFlip.value=player.face;
  { const moving=Math.hypot(S.x-pm.x,S.z-pm.z)>0.06 || (!!jDir&&!blocked()) || !!keyDir() || !!S.ride;
    player.anim=(player.anim||0)+dt*(moving?9:0); const fr=moving?Math.floor(player.anim)%4:0;
    const fs=player.mesh.userData.frames; player.mesh.userData.sp.material.uniforms.map.value=fs[fr];
    if(!moving && !S.dead) player.mesh.scale.y=1+Math.sin(time*2.2)*0.025; else if(!S.dead) player.mesh.scale.y=1; }
  const kk=S.ride?1-Math.pow(0.000001,dt):k; pm.x+=(S.x-pm.x)*kk; pm.z+=(S.z-pm.z)*kk; pm.y+=(ty-pm.y)*k;
  if(S.ride){ rideCart.position.set(pm.x,0.04,pm.z); }
  if(bump.t>0){ bump.t=Math.max(0,bump.t-dt*7); const b=Math.sin(bump.t*Math.PI)*0.15; pm.x+=bump.x*b*0.2; pm.z+=bump.z*b*0.2; }
  if(S.dead && S.hp<=0) player.mesh.scale.setScalar(Math.max(0.01,player.mesh.scale.x-dt*2));

  updateBosses(dt); updateProjectiles(dt); updateTemps(); updateSpecials(dt); updateArrows(dt); updateChains(); updateOil(dt); updateTraps(dt);
  if((chunkT-=dt)<=0){ chunkT=0.2; for(const m of chunkMeshes){ const dz=m.userData.cz-pm.z; m.visible=Math.abs(m.userData.cx-pm.x)<CHUNK/2+13&&dz>-(CHUNK/2+19)&&dz<CHUNK/2+9; } }
  for(const e of enemies){ if(!e.mesh.visible) continue; const kk2=1-Math.pow(0.0005,dt); const ox=e.big?0.5:0; e.mesh.position.x+=(e.x+ox-e.mesh.position.x)*kk2; e.mesh.position.z+=(e.z+ox-e.mesh.position.z)*kk2;
    e.mesh.position.y = e.jump? Math.sin(Math.min(1,e.jump.t/0.5)*Math.PI)*1.6 : 0; }
  enemies.forEach(e=>{ if(e.dying>0){ e.dying-=dt*3; const s=Math.max(0.001,e.dying); e.mesh.scale.set(1+(1-s)*0.4,s,1); }
    else if(e.mesh.visible){ const k=Math.sin(time*2.6+e.id*0.7); e.mesh.scale.set(1-k*0.02,1+k*0.04,1); } });
  // visibilidad por distancia
  for(const d of dyn){ const ox=d.e?d.e.x:d.x, oz=d.e?d.e.z:d.z; const near=Math.abs(ox-pm.x)<14 && Math.abs(oz-pm.z)<14; d.obj.visible=near && d.alive();
    if(d.obj.visible && d.item){ d.obj.rotation.y+=dt*1.6; d.obj.position.y=0.55+Math.sin(time*2.4+d.x)*0.08; }
    if(d.obj.visible && d.chapel){ d.obj.userData.spin.forEach(m=>m.position.x=0); d.obj.children[0].material.opacity=0.4+Math.sin(time*2)*0.15; } }
  for(const b of cracks){ if(!b.g.visible)continue; const near=Math.abs(b.x-S.x)+Math.abs(b.z-S.z)===1;
    const a=near?0.025:0; b.g.position.x=b.x+(a?Math.sin(time*31+b.x)*a:0); b.g.rotation.z=a?Math.sin(time*23)*0.01:0; }
  for(let i=sparks.length-1;i>=0;i--){ const m=sparks[i]; m.userData.l-=dt; m.userData.v.y-=9*dt; m.position.addScaledVector(m.userData.v,dt);
    if(m.userData.l<=0){ scene.remove(m); sparks.splice(i,1); } }

  const pulse=0.5+Math.sin(time*2)*0.5;
  updateBombs(dt); updateLiquids(time,pm.x,pm.z); updateMist(time,dt,pm.x,pm.z);

  camPos.set(pm.x,0,pm.z).add(camOff);
  if(shake>0){ shake=Math.max(0,shake-dt); camPos.x+=(Math.random()-.5)*shake*0.6; camPos.z+=(Math.random()-.5)*shake*0.6; }
  camera.position.lerp(camPos,1-Math.pow(0.001,dt)); camera.lookAt(camera.position.x-camOff.x,0,camera.position.z-camOff.z);
  pLight.position.set(pm.x,2.2,pm.z); uPl.value.set(pm.x,0,pm.z); uCamK.value=camOff.z/camOff.y;
  if(candilOn()){ cLight.position.set(pm.x+0.25,1.1,pm.z+0.2); cLight.intensity=3+Math.sin(time*11)*0.15+Math.sin(time*23.7)*0.1; }
  const blink=Math.floor(time*3)%2===0;
  if((mapT-=dt)<=0){ mapT=1/15; drawMap(mctx,mini.width,mini.height,mini.width/11,S.x+0.5,S.z+0.5,blink);
    if(!$('mapov').hidden) drawMap(bctx,bigmap.width,bigmap.height,MV.ts,MV.cx,MV.cz,blink); }
  qualityTick(dt);
  const fl=0.75+Math.sin(time*17)*0.12+Math.sin(time*29)*0.08; flameMat.color.setRGB(1,fl,fl*0.55);

  const lv=new THREE.Vector3();
  for(const e of enemies){ const show=e.mesh.visible && !S.killed.has(e.id) && $('title').hidden;
    if(!show||e.noLabel){ if(e.L.el.style.display!=='none') e.L.el.style.display='none'; continue; }
    lv.set(e.mesh.position.x,e.lh,e.mesh.position.z).project(camera);
    if(lv.z>1||Math.abs(lv.x)>1.1||Math.abs(lv.y)>1.1){ e.L.el.style.display='none'; continue; }
    e.L.el.style.display=''; e.L.el.style.transform=`translate(${((lv.x+1)/2*innerWidth).toFixed(1)}px,${((1-lv.y)/2*innerHeight).toFixed(1)}px) translate(-50%,-100%)`; }
  renderer.setRenderTarget(rt); renderer.render(scene,camera); renderer.setRenderTarget(null); renderer.render(postScene,postCam);
  requestAnimationFrame(frame);
}
resize(); sizePost();
S.x=START.x; S.z=START.z; player.mesh.position.set(S.x,0,S.z); camera.position.set(S.x,10,S.z+4.4); reveal(); checkArea(); updHud();
requestAnimationFrame(frame);
</script>
